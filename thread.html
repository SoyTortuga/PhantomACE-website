<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem("pham-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A PhantomACE community forum topic.">
  <link rel="icon" href="/assets/images/favicon.ico">
  <title>Topic | PhantomACE</title>


  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/roles.css">
  <link rel="stylesheet" href="/css/pages/about.css">
  <link rel="stylesheet" href="/css/pages/community.css">
</head>
<!-- data-page stays "community" so the nav keeps Community lit: a topic is
     part of the forum, not a page of its own. The script tells the two
     apart by which view element is present. -->
<body data-page="community">

  <div id="site-header"></div>

  <!-- Served at /thread/<id> by a rewrite in server/static.js, the same way
       /user/<login> serves profile.html. The page ships empty: everything
       below is drawn from /api/forum/thread once the id is known. -->
  <section class="page-container forum-page">
    <div id="forumBreadcrumb" class="forum-breadcrumb"></div>
    <div id="threadView"><div class="forum-empty card"><p>Loading topic…</p></div></div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/auth.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/member-search.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/notifications.js" defer></script>
  <script src="/js/twitch.js" defer></script>
  <script src="/js/pages/community-forums.js" defer></script>
</body>
</html>
