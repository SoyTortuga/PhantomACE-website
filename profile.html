<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem("pham-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A PhantomACE community profile - badges, loyalty, and standings.">
  <link rel="icon" href="/assets/images/favicon.ico">
  <title>Profile | PhantomACE</title>


  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/roles.css">
  <link rel="stylesheet" href="/css/pages/profile.css">
  <!-- The comment wall is drawn with the forum's post markup. -->
  <link rel="stylesheet" href="/css/pages/community.css">
  <!-- The Room section: one renderer shared with the editor. -->
  <link rel="stylesheet" href="/css/pages/room.css">
</head>
<body data-page="profile">

  <div id="site-header"></div>

  <!-- Everything below is drawn from /api/profile. The page ships empty on
       purpose: a profile is somebody else's, so there is nothing sensible to
       render before we know whose it is. -->
  <section class="page-container prof-wrap">
    <div class="prof-state" id="profState">Loading profile…</div>
    <div id="profBody" hidden></div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/auth.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/member-search.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <!-- The header is shared, so it needs the scripts that drive it: twitch.js
       fills the LIVE indicator and notifications.js the bell. Without them
       the header still renders, just permanently offline and silent — which
       is how this page shipped. -->
  <script src="/js/notifications.js" defer></script>
  <script src="/js/twitch.js" defer></script>
  <script src="/js/pages/profile.js" defer></script>
  <script src="/js/pages/profile-comments.js" defer></script>
  <script src="/js/room-render.js" defer></script>
  <script src="/js/pages/profile-room.js" defer></script>
</body>
</html>
