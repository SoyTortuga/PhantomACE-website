<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem("pham-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PhantomACE Inventory - View and equip the badges, titles, banners, and name effects you've earned.">
  <link rel="icon" href="/assets/images/favicon.ico">
  <title>Inventory | PhantomACE</title>


  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/roles.css">
  <link rel="stylesheet" href="/css/pages/about.css">
  <link rel="stylesheet" href="/css/pages/inventory.css">
</head>
<body data-page="inventory">

  <div id="site-header"></div>

  <section class="page-hero">
    <h1 class="page-hero-title">Inventory</h1>
    <p class="page-hero-subtitle">Cosmetics you've earned. Pick one per slot — it shows up wherever you play, for everyone watching.</p>
  </section>

  <section class="page-container inv-section">
    <div class="card" id="inventoryCollection">
      <div class="collection-login">
        <p>Loading...</p>
      </div>
    </div>

    <!-- What you can still earn. Filled from /api/achievements, which had no
         reader at all: badges arrived in the grid above with no way to see
         what you were part-way toward. Hidden until it has something to say,
         so a logged-out visitor sees nothing new. -->
    <div class="card inv-ach" id="achievementProgress" hidden></div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/cosmetic-variants.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/member-search.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/notifications.js" defer></script>
  <script src="/js/twitch.js" defer></script>
  <script src="/js/pages/inventory.js" defer></script>
</body>
</html>
