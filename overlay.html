<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Overlay | PhantomACE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/pages/overlay.css">
</head>
<body class="overlay-body">

  <!-- One alert at a time. Everything else waits in a queue rather than
       stacking, so twenty gift subs do not bury the screen. -->
  <div class="ov-stage" id="ovStage" aria-live="polite"></div>

  <!-- Shown only when the overlay cannot reach the server, and only after
       several consecutive failures. A stream must never carry a debug
       banner because one poll blipped. -->
  <div class="ov-fault" id="ovFault" hidden>overlay disconnected</div>

  <!-- The chat scramble. Hidden entirely while no game is running, so this
       overlay stays a transparent alert layer the rest of the time and can
       live in every scene rather than only the BRB one. -->
  <div class="ov-scramble" id="ovScramble" hidden>
    <div class="ov-sc-head">
      <span class="ov-sc-label">Unscramble</span>
      <span class="ov-sc-round" id="ovScRound"></span>
      <span class="ov-sc-clock" id="ovScClock"></span>
    </div>
    <div class="ov-sc-word" id="ovScWord"></div>
    <div class="ov-sc-category" id="ovScCategory"></div>
    <div class="ov-sc-foot">
      <span class="ov-sc-answered" id="ovScAnswered"></span>
      <ol class="ov-sc-scores" id="ovScScores"></ol>
    </div>
  </div>

  <!-- MTGBBB standings. Like the scramble panel, hidden entirely unless a
       game is actually running, so this overlay can live in every scene. -->
  <div class="ov-maze" id="ovMaze" hidden>
    <div class="ov-maze-head">
      <span class="ov-maze-title" id="ovMazeTitle">🧭 MAZE</span>
      <span class="ov-maze-stats" id="ovMazeStats"></span>
    </div>
    <div class="ov-maze-stage">
      <div class="ov-maze-board" id="ovMazeBoard"></div>
      <div class="ov-maze-done" id="ovMazeDone"><div id="ovMazeDoneText"></div></div>
    </div>
    <div class="ov-maze-pad" id="ovMazePad">
      <span data-dir="up">Up</span><span data-dir="down">Down</span><span data-dir="left">Left</span><span data-dir="right">Right</span>
    </div>
    <ol class="ov-maze-recent" id="ovMazeRecent"></ol>
  </div>

  <div class="ov-mtg" id="ovMtg" hidden>
    <div class="ov-mtg-head">
      <span class="ov-mtg-label">MTGBBB</span>
      <span class="ov-mtg-set" id="ovMtgSet"></span>
    </div>
    <div class="ov-mtg-pack">
      <span id="ovMtgPack"></span>
      <span class="ov-mtg-players" id="ovMtgPlayers"></span>
    </div>
    <div class="ov-mtg-track"><i id="ovMtgBar"></i></div>
    <ol class="ov-mtg-top" id="ovMtgTop"></ol>
  </div>

  <!-- Mana Clash: centred, and yields to an alert rather than sitting
       under one. Rounds are simultaneous, so every row carries its own
       dice. -->
  <div class="ov-mc" id="ovMc" hidden>
    <div class="ov-mc-head">
      <span class="ov-mc-title">MANA CLASH</span>
      <span class="ov-mc-round" id="ovMcRound"></span>
      <span class="ov-mc-note" id="ovMcNote"></span>
      <span class="ov-mc-goal">to <b id="ovMcGoal"></b></span>
    </div>
    <div class="ov-mc-track"><i id="ovMcBar"></i></div>
    <ol class="ov-mc-list" id="ovMcList"></ol>
  </div>

  <script src="/js/pages/overlay.js" defer></script>
  <script src="/js/pages/overlay-scramble.js" defer></script>
  <script src="/js/pages/overlay-mtgbbb.js" defer></script>
  <script src="/js/pages/overlay-mana-clash.js" defer></script>
  <script src="/js/pages/overlay-maze.js" defer></script>
  <script src="/js/pages/overlay-layout.js" defer></script>
</body>
</html>
