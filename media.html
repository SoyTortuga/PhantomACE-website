<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem("pham-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PhantomACE Media Gallery - Clips, screenshots, fan art, and highlights.">
  <link rel="icon" href="/assets/images/favicon.ico">
  <title>Media | PhantomACE</title>


  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/roles.css">
  <link rel="stylesheet" href="/css/pages/about.css">
  <link rel="stylesheet" href="/css/pages/media.css">
</head>
<body data-page="media">

  <div id="site-header"></div>

  <!-- Page Hero -->
  <section class="page-hero">
    <h1 class="page-hero-title">Media</h1>
    <p class="page-hero-subtitle">Clips, screenshots, and highlights</p>
  </section>

  <!-- Gallery -->
  <section class="page-container">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="clip">Clips</button>
      <button class="filter-btn" data-filter="screenshot">Screenshots</button>
      <button class="filter-btn" data-filter="art">Art</button>
      <button class="filter-btn" data-filter="highlight">Highlights</button>
      <button class="filter-btn" data-filter="audio">Audio</button>
      <button class="btn-primary upload-btn role-moderator" id="uploadBtn" onclick="openUploadModal()">+ Add Media</button>
    </div>

    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- Upload Modal (moderator+ only) -->
  <div class="upload-modal" id="uploadModal">
    <div class="upload-modal-content card">
      <div class="upload-modal-header">
        <h3 id="uploadModalTitle">Add Media</h3>
        <button class="lightbox-close upload-modal-close" onclick="closeUploadModal()" aria-label="Close">&times;</button>
      </div>

      <!-- Two ways in. A Twitch clip is a reference, not an upload: nothing
           is stored here and the views stay on the real clip, so it is a
           different form rather than a file picker that accepts a URL. -->
      <div class="upload-modes" role="tablist">
        <button type="button" class="upload-mode active" id="modeFileBtn" role="tab"
                aria-selected="true" onclick="setUploadMode('file')">Upload a file</button>
        <button type="button" class="upload-mode" id="modeClipBtn" role="tab"
                aria-selected="false" onclick="setUploadMode('clip')">Paste a link</button>
      </div>

      <form id="uploadForm" onsubmit="handleUpload(event)">
        <div class="upload-field">
          <label for="uploadTitle">Title</label>
          <input type="text" id="uploadTitle" required placeholder="Enter a title">
        </div>
        <div class="upload-field">
          <label for="uploadCategory">Category</label>
          <select id="uploadCategory" required>
            <option value="clip">Clip</option>
            <option value="screenshot">Screenshot</option>
            <option value="art">Art</option>
            <option value="highlight">Highlight</option>
            <option value="audio">Audio</option>
          </select>
        </div>
        <div class="upload-field">
          <label for="uploadRole">Visibility</label>
          <select id="uploadRole">
            <option value="">Everyone</option>
            <option value="follower">Followers+</option>
            <option value="sub_tier1">Tier 1 Subs+</option>
            <option value="sub_tier2">Tier 2 Subs+</option>
            <option value="sub_tier3">Tier 3 Subs+</option>
            <option value="moderator">Moderators+</option>
            <option value="broadcaster">Broadcaster Only</option>
          </select>
        </div>
        <div class="upload-field">
          <label for="uploadFile">File</label>
          <div class="upload-dropzone" id="uploadDropzone">
            <input type="file" id="uploadFile" accept="image/*,video/*,audio/*" required>
            <p>Drop a file or click to browse</p>
            <span>Images, video clips and audio accepted</span>
          </div>
        </div>
        <div class="upload-preview" id="uploadPreview"></div>
        <div class="upload-actions">
          <button type="button" class="btn-secondary" onclick="closeUploadModal()">Cancel</button>
          <button type="submit" class="btn-primary" id="uploadSubmitBtn">Upload</button>
        </div>
        <div class="upload-status" id="uploadStatus"></div>
      </form>

      <!-- Clip mode. Paste a link, or pick one off the channel's recent
           list — the point of the feature is not having to go and find the
           URL. -->
      <form id="clipForm" onsubmit="handleAddClip(event)" hidden>
        <div class="upload-field">
          <label for="clipUrl">Twitch clip or YouTube link</label>
          <input type="text" id="clipUrl" required
                 placeholder="twitch.tv/phantomace/clip/… or youtube.com/shorts/…">
          <small class="upload-hint">A Twitch clip (link or slug), or a YouTube video or
            Short. The title and thumbnail come from them; nothing is uploaded here.</small>
        </div>
        <div class="upload-field">
          <label for="clipTitle">Title <span class="upload-optional">(optional)</span></label>
          <input type="text" id="clipTitle" placeholder="Leave blank to use the clip's own title">
        </div>
        <div class="upload-field">
          <label for="clipCategory">Category</label>
          <select id="clipCategory" required>
            <option value="clip">Clip</option>
            <option value="highlight">Highlight</option>
          </select>
        </div>
        <div class="upload-field">
          <label for="clipRole">Visibility</label>
          <select id="clipRole">
            <option value="">Everyone</option>
            <option value="follower">Followers+</option>
            <option value="sub_tier1">Tier 1 Subs+</option>
            <option value="sub_tier2">Tier 2 Subs+</option>
            <option value="sub_tier3">Tier 3 Subs+</option>
            <option value="moderator">Moderators+</option>
            <option value="broadcaster">Broadcaster Only</option>
          </select>
        </div>

        <div class="upload-field">
          <div class="clip-recent-head">
            <label>Recent Twitch clips</label>
            <button type="button" class="btn-secondary clip-refresh" id="clipRefreshBtn"
                    onclick="loadRecentClips()">Load</button>
          </div>
          <div class="clip-recent" id="clipRecent"></div>
        </div>

        <div class="upload-actions">
          <button type="button" class="btn-secondary" onclick="closeUploadModal()">Cancel</button>
          <button type="submit" class="btn-primary" id="clipSubmitBtn">Add Clip</button>
        </div>
        <div class="upload-status" id="clipStatus"></div>
      </form>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox-nav lightbox-prev" aria-label="Previous">&lsaquo;</button>
    <button class="lightbox-nav lightbox-next" aria-label="Next">&rsaquo;</button>
    <div class="lightbox-content"></div>
    <div class="lightbox-info">
      <div class="lightbox-title"></div>
      <div class="lightbox-meta"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="/js/cosmetic-variants.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/member-search.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/notifications.js" defer></script>
  <script src="/js/twitch.js" defer></script>
  <script src="/js/pages/media.js" defer></script>
</body>
</html>
