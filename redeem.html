<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem("pham-theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Redeem an item drop code from the PhantomACE stream.">
  <link rel="icon" href="/assets/images/favicon.ico">
  <title>Redeem Code | PhantomACE</title>


  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/roles.css">
  <link rel="stylesheet" href="/css/pages/redeem.css">
</head>
<body data-page="redeem">

  <div id="site-header"></div>

  <section class="page-hero">
    <h1 class="page-hero-title">Redeem Code</h1>
    <p class="page-hero-subtitle">Claim your drop before time runs out</p>
  </section>

  <section class="page-container">
    <div class="card redeem-card" id="redeemCard">

      <div class="redeem-login" id="redeemLogin">
        <p>Log in with Twitch to redeem a code.</p>
        <button class="btn-primary" onclick="loginWithTwitch()">Log In with Twitch</button>
      </div>

      <div class="redeem-form" id="redeemForm" style="display:none;">
        <label class="redeem-label" for="codeInput">Enter your item code</label>
        <div class="redeem-input-row">
          <input type="text" id="codeInput" class="redeem-input" placeholder="XXXXXXXX" maxlength="8" autocomplete="off" spellcheck="false">
          <button class="btn-primary redeem-submit" id="redeemBtn" onclick="submitCode()">Redeem</button>
        </div>
      </div>

      <div class="redeem-result" id="redeemResult" style="display:none;"></div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="/js/auth.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/member-search.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/notifications.js" defer></script>
  <script src="/js/twitch.js" defer></script>
  <script src="/js/pages/redeem.js" defer></script>
</body>
</html>
