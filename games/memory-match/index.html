<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      color: #ff0000;
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #fff;
    }

    .stats span { color: #fff; }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 480px;
      width: 100%;
    }

    .card {
      aspect-ratio: 1;
      border-radius: 6px;
      cursor: pointer;
      perspective: 600px;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-front {
      background: #111;
      border: 1px solid #333;
    }

    .card-front::after {
      content: '?';
      font-size: 28px;
      color: #ff0000;
      opacity: 0.4;
    }

    .card:hover .card-front {
      border: 2px solid #ff0000;
    }

    .card-back {
      background: #1a1a1a;
      border: 1px solid #444;
      transform: rotateY(180deg);
    }

    .card-back img {
      width: 65%;
      height: auto;
      border-radius: 4px;
    }

    .card.matched .card-front { display: none; }
    .card.matched .card-back {
      border: 2px solid #00cc66;
    }

    .win-message {
      display: none;
      text-align: center;
      margin-top: 24px;
    }

    .win-message.show { display: block; }

    .win-message h2 {
      font-size: 20px;
      color: #ff0000;
      margin-bottom: 8px;
    }

    .win-message p {
      font-size: 13px;
      color: #fff;
      margin-bottom: 16px;
    }

    .restart-btn {
      padding: 8px 24px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .restart-btn:hover { background: #cc0000; }

    [hidden] { display: none !important; }

    .cosmetics-bar {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center;
    }
    .cosmetic-select {
      background: #111; border: 1px solid #333; color: #fff; padding: 4px 10px;
      border-radius: 3px; font-size: 11px; cursor: pointer; font-family: inherit;
    }
    .cosmetic-select option { background: #111; color: #fff; }
    .cosmetic-label { font-size: 10px; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; }

    .card-front.cb-basic { background: #161616; border-color: #888; }
    .card-front.cb-basic::after { content: '♦'; color: #fff; opacity: 0.5; }
    .card-front.cb-phamily { background: linear-gradient(135deg, #1a0000, #111); border-color: #cc0000; }
    .card-front.cb-phamily::after { content: '💀'; color: #ff0000; opacity: 0.6; }
    .card-front.cb-rare { background: linear-gradient(135deg, #0a0a1e, #111); border-color: #3344aa; }
    .card-front.cb-rare::after { content: '🃏'; color: #4466ee; opacity: 0.6; }
    .card-front.cb-legendary { background: linear-gradient(135deg, #1a0a1a, #111); border-color: #8833cc; }
    .card-front.cb-legendary::after { content: '✨'; color: #aa44ff; opacity: 0.6; }
  </style>
</head>
<body>
  <h1>Memory Match</h1>
  <div class="stats">
    Moves: <span id="moveCount">0</span>
    &nbsp;&middot;&nbsp;
    Pairs: <span id="pairCount">0</span> / <span id="totalPairs">20</span>
  </div>
  <div class="cosmetics-bar" id="cosmeticsBar" hidden>
    <div>
      <div class="cosmetic-label">Card Back</div>
      <select class="cosmetic-select" id="cardBackSelect" onchange="applyCardBack()">
        <option value="default">Default</option>
      </select>
    </div>
    <div>
      <div class="cosmetic-label">Card Set</div>
      <select class="cosmetic-select" id="emoteSelect" onchange="applyEmoteSet()">
        <option value="default">Default</option>
      </select>
    </div>
  </div>
  <div class="board" id="board"></div>
  <div class="win-message" id="winMessage">
    <h2>You Win!</h2>
    <p>Completed in <span id="finalMoves">0</span> moves</p>
    <button class="restart-btn" onclick="startGame()">Play Again</button>
  </div>

  <script>
    const CHANNEL_EMOTES = [
      { name: 'phamLove', src: 'https://static-cdn.jtvnw.net/emoticons/v2/120322/default/light/3.0' },
      { name: 'phamPham', src: 'https://static-cdn.jtvnw.net/emoticons/v2/121671/default/light/3.0' },
      { name: 'phamHype', src: 'https://static-cdn.jtvnw.net/emoticons/v2/152733/default/light/3.0' },
      { name: 'phamW', src: 'https://static-cdn.jtvnw.net/emoticons/v2/137132/default/light/3.0' },
      { name: 'phamL', src: 'https://static-cdn.jtvnw.net/emoticons/v2/415421/default/light/3.0' },
      { name: 'phamGG', src: 'https://static-cdn.jtvnw.net/emoticons/v2/121668/default/light/3.0' },
      { name: 'phamLit', src: 'https://static-cdn.jtvnw.net/emoticons/v2/120782/default/light/3.0' },
      { name: 'phamIly', src: 'https://static-cdn.jtvnw.net/emoticons/v2/121672/default/light/3.0' },
      { name: 'phamCoin', src: 'https://static-cdn.jtvnw.net/emoticons/v2/153656/default/light/3.0' },
      { name: 'phamMonkaS', src: 'https://static-cdn.jtvnw.net/emoticons/v2/303615499/default/light/3.0' },
      { name: 'phamLaugh', src: 'https://static-cdn.jtvnw.net/emoticons/v2/303615519/default/light/3.0' },
      { name: 'phamG', src: 'https://static-cdn.jtvnw.net/emoticons/v2/415419/default/light/3.0' },
      { name: 'phamPoggers', src: 'https://static-cdn.jtvnw.net/emoticons/v2/emotesv2_92dfe6ff82464cdda9d0261e1ca4e7ed/default/light/3.0' },
      { name: 'phamV', src: 'https://static-cdn.jtvnw.net/emoticons/v2/413668/default/light/3.0' },
      { name: 'phamHi', src: 'https://static-cdn.jtvnw.net/emoticons/v2/121673/default/light/3.0' },
      { name: 'phamPog', src: 'https://static-cdn.jtvnw.net/emoticons/v2/303615529/default/light/3.0' },
      { name: 'phamNice', src: 'https://static-cdn.jtvnw.net/emoticons/v2/303615522/default/light/3.0' },
      { name: 'phamClown', src: 'https://static-cdn.jtvnw.net/emoticons/v2/303615503/default/light/3.0' },
      { name: 'phamYEP', src: 'https://static-cdn.jtvnw.net/emoticons/v2/303615534/default/light/3.0' },
      { name: 'phamUsure', src: 'https://static-cdn.jtvnw.net/emoticons/v2/472088/default/light/3.0' },
    ];

    const DEFAULT_IMAGES = CHANNEL_EMOTES.map(e => e.src);
    const DEFAULT_NAMES = CHANNEL_EMOTES.map(e => e.name);

    function emoteUrl(id) { return `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/light/3.0`; }

    const BONUS_EMOTES = [
      { name: 'phamDrum', src: emoteUrl('emotesv2_454abcf6e3104137b1eeeac026d5f62d') },
      { name: 'phamBass', src: emoteUrl('emotesv2_11714d9a022d4fd7b4cb872b0d5bba1d') },
      { name: 'phamJam', src: emoteUrl('emotesv2_62be33ae947d41eeb96785317e0ff198') },
      { name: 'phamHUH', src: emoteUrl('emotesv2_6700d9409cfc499ab30d1235e680b25b') },
      { name: 'phamHeal', src: emoteUrl('emotesv2_1f60e4c71d9e4af19fa7b3812f40d71f') },
      { name: 'phamEcho', src: emoteUrl('emotesv2_325e83dde662429c82020e6d2af7f08f') },
      { name: 'phamPoint', src: emoteUrl('303615525') },
      { name: 'phamTime', src: emoteUrl('emotesv2_66462619face41b1abec201b92022a0b') },
      { name: 'phamPepelaugh', src: emoteUrl('emotesv2_92f127f639ff4ff2a3b8ed07faa86d49') },
      { name: 'phamDrink', src: emoteUrl('emotesv2_8c96393fd63f46a6bb0f15d5ba9051d0') },
    ];

    const PREMIUM_EMOTES = [
      { name: 'phamHYPERS', src: emoteUrl('1142146') },
      { name: 'phamLove2', src: emoteUrl('168361') },
      { name: 'phamLove3', src: emoteUrl('168352') },
      { name: 'phamLovespin', src: emoteUrl('emotesv2_8243b0b6a8534d43b216c89e64404320') },
      { name: 'phamMaid', src: emoteUrl('emotesv2_d8b593cb945b49b89b2bfdacd32bf276') },
      { name: 'phamGear', src: emoteUrl('emotesv2_9fad6fab6f35430390613ab56d7a008f') },
      { name: 'phamButton', src: emoteUrl('emotesv2_a1f04eab77664362881740e2756f60b4') },
      { name: 'phamCoinroll', src: emoteUrl('emotesv2_26bf7acbf75644e69473adf3952110b7') },
      { name: 'phamRee', src: emoteUrl('303615532') },
      { name: 'phamFroze', src: emoteUrl('emotesv2_1d3742cd0c33464f9fdc9d5e2495a4cb') },
      { name: 'phamFeelsBad', src: emoteUrl('303615479') },
      { name: 'phamToxic', src: emoteUrl('300609000') },
      { name: 'phamHyperss', src: emoteUrl('emotesv2_2b7c7263e8234fbd963c87bc085969fb') },
      { name: 'phamChair', src: emoteUrl('emotesv2_e4a4f5d9bc764548ba26a61d54140bfe') },
      { name: 'phamPepeHands', src: emoteUrl('303615508') },
    ];

    const EMOTE_SETS = {
      default: { name: 'PhantomACE Emotes', images: DEFAULT_IMAGES, alts: DEFAULT_NAMES },
      bonus: { name: 'Emote Pack', images: BONUS_EMOTES.map(e => e.src), alts: BONUS_EMOTES.map(e => e.name) },
      premium: { name: 'Premium Emote Pack', images: PREMIUM_EMOTES.map(e => e.src), alts: PREMIUM_EMOTES.map(e => e.name) },
    };

    const CARD_BACKS = {
      default: { name: 'Default', cssClass: '' },
      basic: { name: 'Basic Card Back', cssClass: 'cb-basic' },
      phamily: { name: 'Phamily Card Back', cssClass: 'cb-phamily' },
      rare: { name: 'Rare Card Back', cssClass: 'cb-rare' },
      legendary: { name: 'Legendary Card Back', cssClass: 'cb-legendary' },
    };

    let activeCardBack = 'default';
    let activeEmoteSet = 'default';
    let ownedCardBacks = [];
    let ownedEmoteSets = [];

    let cards = [];
    let flipped = [];
    let matched = 0;
    let moves = 0;
    let locked = false;
    let totalPairs = 4;

    function getActiveImages() {
      const set = EMOTE_SETS[activeEmoteSet] || EMOTE_SETS.default;
      const alts = set.alts || set.images.map(() => 'card');
      return {
        images: [...set.images, ...set.images],
        alts: [...alts, ...alts],
        pairTotal: set.images.length,
      };
    }

    async function loadMMCosmetics() {
      try {
        const res = await fetch('/api/inventory?game=memory-match');
        if (!res.ok) return;
        const data = await res.json();
        const items = data.items || [];
        ownedCardBacks = items.filter(i => i.type === 'cardback');
        ownedEmoteSets = items.filter(i => i.type === 'emote-pack');
        if (data.equips) {
          if (data.equips['card-back'] && CARD_BACKS[data.equips['card-back']]) activeCardBack = data.equips['card-back'];
          if (data.equips['emote-set'] && EMOTE_SETS[data.equips['emote-set']]) activeEmoteSet = data.equips['emote-set'];
        }
        populateCosmeticSelects();
        if (ownedCardBacks.length > 0 || ownedEmoteSets.length > 0) {
          document.getElementById('cosmeticsBar').hidden = false;
        }
      } catch {}
    }

    function populateCosmeticSelects() {
      const cbSel = document.getElementById('cardBackSelect');
      for (const item of ownedCardBacks) {
        const id = getCosmeticId(item, 'cb');
        if (!CARD_BACKS[id]) {
          CARD_BACKS[id] = { name: item.name, cssClass: 'cb-' + id };
        }
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = item.name || id;
        if (id === activeCardBack) opt.selected = true;
        cbSel.appendChild(opt);
      }

      const eSel = document.getElementById('emoteSelect');
      for (const item of ownedEmoteSets) {
        const id = getCosmeticId(item, 'emote');
        if (!EMOTE_SETS[id]) {
          EMOTE_SETS[id] = { name: item.name, images: DEFAULT_IMAGES };
        }
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = item.name || id;
        if (id === activeEmoteSet) opt.selected = true;
        eSel.appendChild(opt);
      }
    }

    function getCosmeticId(item, prefix) {
      const n = (item.name || '').toLowerCase();
      if (n.includes('legendary')) return 'legendary';
      if (n.includes('phamily')) return 'phamily';
      if (n.includes('rare')) return 'rare';
      if (n.includes('premium')) return 'premium';
      // Unrecognized reward name — fall back to the lowest tier for this slot
      // rather than silently duplicating the default set.
      return prefix === 'cb' ? 'basic' : 'bonus';
    }

    function applyCardBack() {
      activeCardBack = document.getElementById('cardBackSelect').value;
      startGame();
      fetch('/api/inventory', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'equip', game: 'memory-match', slot: 'card-back', itemId: activeCardBack === 'default' ? 'none' : activeCardBack }),
      }).catch(() => {});
    }

    function applyEmoteSet() {
      activeEmoteSet = document.getElementById('emoteSelect').value;
      startGame();
      fetch('/api/inventory', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'equip', game: 'memory-match', slot: 'emote-set', itemId: activeEmoteSet === 'default' ? 'none' : activeEmoteSet }),
      }).catch(() => {});
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGame() {
      const board = document.getElementById('board');
      matched = 0;
      moves = 0;
      flipped = [];
      locked = false;

      document.getElementById('moveCount').textContent = '0';
      document.getElementById('pairCount').textContent = '0';
      document.getElementById('winMessage').classList.remove('show');

      const { images, alts, pairTotal } = getActiveImages();
      totalPairs = pairTotal;
      document.getElementById('totalPairs').textContent = totalPairs;

      const pairs = [];
      images.forEach((src, i) => {
        pairs.push({ id: i, pairId: i % pairTotal, src, alt: alts[i] });
      });

      cards = shuffle(pairs);

      const cbClass = CARD_BACKS[activeCardBack]?.cssClass || '';

      board.innerHTML = cards.map((card, index) => `
        <div class="card" data-index="${index}" data-pair="${card.pairId}" onclick="flipCard(this)">
          <div class="card-inner">
            <div class="card-front ${cbClass}"></div>
            <div class="card-back">
              <img src="${card.src}" alt="${card.alt}">
            </div>
          </div>
        </div>
      `).join('');
    }

    function flipCard(el) {
      if (locked) return;
      if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
      if (flipped.length >= 2) return;

      el.classList.add('flipped');
      flipped.push(el);

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moveCount').textContent = moves;
        locked = true;

        const a = flipped[0].dataset.pair;
        const b = flipped[1].dataset.pair;

        if (a === b) {
          flipped[0].classList.add('matched');
          flipped[1].classList.add('matched');
          matched++;
          document.getElementById('pairCount').textContent = matched;
          flipped = [];
          locked = false;

          if (matched === totalPairs) {
            setTimeout(() => {
              document.getElementById('finalMoves').textContent = moves;
              document.getElementById('winMessage').classList.add('show');
              submitMMScore(moves);
            }, 500);
          }
        } else {
          setTimeout(() => {
            flipped[0].classList.remove('flipped');
            flipped[1].classList.remove('flipped');
            flipped = [];
            locked = false;
          }, 800);
        }
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });

    function submitMMScore(moveCount) {
      fetch('/api/leaderboards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ game: 'memory-match', score: moveCount }),
      }).catch(function () {});
    }

    loadMMCosmetics();
    startGame();
  </script>
</body>
</html>
