<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match</title>
  <script>try{var _pt=function(t){var e=document.documentElement;if(t==="light")e.setAttribute("data-theme","light");else e.removeAttribute("data-theme");};_pt(localStorage.getItem("pham-theme"));addEventListener("storage",function(v){if(v.key==="pham-theme")_pt(v.newValue);});}catch(e){}</script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--text-pri);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-family: var(--font-display);
      letter-spacing: normal;
      font-size: 24px;
      color: var(--red);
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
      font-size: 18px;
      text-shadow: none;
      color: var(--text-pri);
    }

    .stats span { color: var(--text-pri); }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 480px;
      width: 100%;
    }

    .card {
      aspect-ratio: 1;
      border-radius: 6px;
      cursor: pointer;
      perspective: 600px;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-front {
      background: var(--gray-mid);
      border: 1px solid var(--border-mid);
    }

    .card-front::after {
      content: '?';
      font-size: 39px;
      color: var(--red);
      opacity: 0.4;
    }

    .card:hover .card-front {
      border: 2px solid var(--red);
    }

    .card-back {
      background: var(--gray-mid);
      border: 1px solid var(--border-mid);
      transform: rotateY(180deg);
    }

    .card-back img {
      width: 65%;
      height: auto;
      border-radius: 4px;
    }

    .card.matched .card-front { display: none; }
    .card.matched .card-back {
      border: 2px solid var(--red);
    }

    .mm-status {
      font-size: 14px;
      color: var(--text-sec);
      margin: -12px 0 16px;
      min-height: 1.4em;
      text-align: center;
    }
    .mm-status a { color: var(--red); }

    .win-message p.win-note { font-size: 15px; color: var(--text-sec); }

    .win-message {
      display: none;
      text-align: center;
      margin-top: 24px;
    }

    .win-message.show { display: block; }

    .win-message h2 {
      font-size: 20px;
      color: var(--red);
      margin-bottom: 8px;
    }

    .win-message p {
      font-size: 18px;
      text-shadow: none;
      color: var(--text-pri);
      margin-bottom: 16px;
    }

    .restart-btn {
      padding: 8px 24px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 18px;
      text-shadow: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .restart-btn:hover { background: #cc0000; }

    [hidden] { display: none !important; }

    .cosmetics-bar {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center;
    }
    .cosmetic-select {
      background: var(--gray-mid); border: 1px solid var(--border-mid); color: var(--text-pri); padding: 4px 10px;
      border-radius: 3px; font-size: 15px;
 text-shadow: none; cursor: pointer; font-family: inherit;
    }
    .cosmetic-select option { background: var(--gray-mid); color: var(--text-pri); }
    .cosmetic-label { font-size: 14px;
 text-shadow: none; color: var(--text-pri); text-transform: uppercase; letter-spacing: 0.05em; }

    .card-front.cb-basic { background: var(--gray-mid); border-color: var(--text-dim); }
    .card-front.cb-basic::after { content: '♦'; color: var(--text-pri); opacity: 0.5; }
    .card-front.cb-phamily { background: linear-gradient(135deg, #1a0000, #111); border-color: #cc0000; }
    .card-front.cb-phamily::after { content: '💀'; color: var(--red); opacity: 0.6; }
    .card-front.cb-rare { background: linear-gradient(135deg, var(--gray-hi), var(--gray-lo)); border-color: var(--text-pri); }
    .card-front.cb-rare::after { content: '🃏'; color: var(--text-pri); opacity: 0.6; }
    .card-front.cb-legendary { background: radial-gradient(circle, var(--red-dim), var(--gray-lo)); border: 2px solid var(--red); }
    .card-front.cb-legendary::after { content: '✨'; color: var(--red); opacity: 0.6; }
    .card-front.cb-cobweb { background: linear-gradient(135deg, #1c1c1c, #0a0a0a); border-color: #666; }
    .card-front.cb-cobweb::after { content: '🕸️'; color: #ddd; opacity: 0.55; }
    .card-front.cb-crypt { background: linear-gradient(135deg, #160606, #0a0a0a); border-color: #660000; }
    .card-front.cb-crypt::after { content: '🪦'; color: var(--red); opacity: 0.6; }
    .card-front.cb-bat { background: radial-gradient(circle, #330000, #0a0a0a); border-color: #990000; }
    .card-front.cb-bat::after { content: '🦇'; color: var(--red); opacity: 0.65; }
    .card-front.cb-ghost { background: linear-gradient(135deg, #2b2b2b, #111); border-color: #ccc; }
    .card-front.cb-ghost::after { content: '👻'; color: #fff; opacity: 0.55; }
    .card-front.cb-wheat {
      background:
        repeating-linear-gradient(100deg, rgba(214, 210, 196, 0.06) 0 2px, transparent 2px 9px),
        linear-gradient(180deg, #1d1d1b, #080808);
      border: 1px solid #8a8780;
    }
    .card-front.cb-wheat::after { content: '🌾'; filter: grayscale(1) brightness(1.3); opacity: 0.6; }
    .card-front.cb-crow { background: linear-gradient(160deg, #000 0%, #121212 55%, #3a0000 100%); border: 1px solid #4a4a4a; }
    .card-front.cb-crow::after { content: '🐦‍⬛'; filter: grayscale(1); opacity: 0.75; }
    .card-front.cb-sickle { background: linear-gradient(135deg, #e4e0d4, #9c988d); border: 2px solid #7a0000; }
    .card-front.cb-sickle::after { content: '🦴'; filter: grayscale(1) brightness(0.3); opacity: 0.7; }
    .card-front.cb-moon { background: linear-gradient(180deg, #1c1c1c 0%, #0a0a0a 64%, #2a0000 64%, #050505 100%); border: 1px solid #d6d2c4; }
    .card-front.cb-moon::after { content: '🌕'; filter: grayscale(1) brightness(1.15); opacity: 0.6; }
  </style>

    function later(fn, ms) {
      const g = gen;
      const id = setTimeout(() => {
        timers.delete(id);
        if (g === gen) fn();
      }, ms);
      timers.add(id);
    }

    function clearTimers() {
      for (const id of timers) clearTimeout(id);
      timers.clear();
    }

    function getActiveSet() {
      const set = EMOTE_SETS[activeEmoteSet] || EMOTE_SETS.default;
      return { images: set.images, alts: set.alts || set.images.map(() => 'card') };
    }

    function gameInProgress() {
      return flipCount > 0 && matched < totalPairs;
    }

    async function loadMMCosmetics() {
      try {
        const res = await fetch('/api/inventory?game=memory-match');
        if (!res.ok) return;
        const data = await res.json();
        const items = data.items || [];
        ownedCardBacks = items.filter(i => i.type === 'cardback');
        ownedEmoteSets = items.filter(i => i.type === 'emote-pack');
        const equips = data.equips || {};
        const cb = resolveEquipped(ownedCardBacks, equips['card-back'], 'cb');
        if (cb && CARD_BACKS[cb.key]) { activeCardBack = cb.key; equippedCardBackId = cb.itemId; }
        const es = resolveEquipped(ownedEmoteSets, equips['emote-set'], 'emote');
        if (es && EMOTE_SETS[es.key]) { activeEmoteSet = es.key; equippedEmoteSetId = es.itemId; }
        populateCosmeticSelects();
        if (ownedCardBacks.length > 0 || ownedEmoteSets.length > 0) {
          document.getElementById('cosmeticsBar').hidden = false;
        }
      } catch {}
    }

    /* The server stores the owned item's real id. Older saves held the
       game's own key ('cobweb'), so that is still honoured. */
    function resolveEquipped(owned, stored, prefix) {
      if (!stored) return null;
      const byId = owned.find(i => i.id === stored);
      if (byId) return { itemId: byId.id, key: getCosmeticId(byId, prefix) };
      const byKey = owned.find(i => getCosmeticId(i, prefix) === stored);
      if (byKey) return { itemId: byKey.id, key: stored };
      return null;
    }

    function populateCosmeticSelects() {
      const cbSel = document.getElementById('cardBackSelect');
      for (const item of ownedCardBacks) {
        const key = getCosmeticId(item, 'cb');
        if (!CARD_BACKS[key]) {
          CARD_BACKS[key] = { name: item.name, cssClass: 'cb-' + key };
        }
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name || key;
        if (item.id === equippedCardBackId) opt.selected = true;
        cbSel.appendChild(opt);
      }

      const eSel = document.getElementById('emoteSelect');
      for (const item of ownedEmoteSets) {
        const key = getCosmeticId(item, 'emote');
        if (!EMOTE_SETS[key]) {
          EMOTE_SETS[key] = { name: item.name, images: DEFAULT_IMAGES };
        }
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name || key;
        if (item.id === equippedEmoteSetId) opt.selected = true;
        eSel.appendChild(opt);
      }
    }

    function getCosmeticId(item, prefix) {
      const n = (item.name || '').toLowerCase();
      if (n.includes('legendary')) return 'legendary';
      if (n.includes('phamily')) return 'phamily';
      if (n.includes('rare')) return 'rare';
      if (n.includes('premium')) return 'premium';
      if (n.includes('cobweb')) return 'cobweb';
      if (n.includes('crypt')) return 'crypt';
      if (n.includes('bat')) return 'bat';
      if (n.includes('ghost')) return 'ghost';
      if (n.includes('spooky')) return 'spooky';
      if (n.includes('haunt')) return 'haunted';
      if (n.includes('wheat')) return 'wheat';
      if (n.includes('crow')) return 'crow';
      if (n.includes('sickle')) return 'sickle';
      if (n.includes('moon')) return 'moon';
      if (n.includes('barrow')) return 'barrow';
      if (n.includes('harvest')) return 'harvest';
      // Unrecognized reward name — fall back to the lowest tier for this slot
      // rather than silently duplicating the default set.
      return prefix === 'cb' ? 'basic' : 'bonus';
    }

    async function saveEquip(slot, itemId) {
      try {
        const res = await fetch('/api/inventory', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'equip', game: 'memory-match', slot, itemId }),
        });
        const data = await res.json().catch(() => null);
        if (res.ok && data && data.success) return { ok: true };
        return { ok: false, error: (data && data.error) || ('Server returned ' + res.status) };
      } catch {
        return { ok: false, error: 'Network error' };
      }
    }

    function showCosmeticError(msg) {
      const el = document.getElementById('cosmeticError');
      if (!el) return;
      el.textContent = msg || '';
      el.hidden = !msg;
    }

    async function applyCardBack() {
      const sel = document.getElementById('cardBackSelect');
      const prev = { key: activeCardBack, id: equippedCardBackId };
      const id = sel.value;
      const item = ownedCardBacks.find(i => i.id === id);
      activeCardBack = item ? getCosmeticId(item, 'cb') : 'default';
      equippedCardBackId = item ? item.id : 'default';
      showCosmeticError('');
      paintCardBacks();
      const r = await saveEquip('card-back', item ? item.id : 'none');
      if (r.ok) return;
      activeCardBack = prev.key;
      equippedCardBackId = prev.id;
      sel.value = prev.id;
      paintCardBacks();
      showCosmeticError("Couldn't save card back: " + r.error);
    }

    function cardBackClass() {
      const cls = (CARD_BACKS[activeCardBack] || {}).cssClass || '';
      return cls ? 'card-front ' + cls : 'card-front';
    }

    function paintCardBacks() {
      const cls = cardBackClass();
      document.querySelectorAll('#board .card-front').forEach(el => { el.className = cls; });
    }

    async function applyEmoteSet() {
      const sel = document.getElementById('emoteSelect');
      const prev = { key: activeEmoteSet, id: equippedEmoteSetId };
      const id = sel.value;
      const item = ownedEmoteSets.find(i => i.id === id);
      activeEmoteSet = item ? getCosmeticId(item, 'emote') : 'default';
      equippedEmoteSetId = item ? item.id : 'default';
      const midGame = gameInProgress();
      if (midGame) {
        showCosmeticError('New card set deals with your next game.');
      } else {
        showCosmeticError('');
        startGame();
      }
      const r = await saveEquip('emote-set', item ? item.id : 'none');
      if (r.ok) return;
      activeEmoteSet = prev.key;
      equippedEmoteSetId = prev.id;
      sel.value = prev.id;
      if (!midGame && !gameInProgress()) startGame();
      showCosmeticError("Couldn't save card set: " + r.error);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function mmApi(body) {
      try {
        const res = await fetch('/api/memory-match', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => null);
        return { ok: res.ok, status: res.status, data, error: (data && data.error) || ('Server returned ' + res.status) };
      } catch {
        return { ok: false, status: 0, data: null, error: 'Network error' };
      }
    }

    function setStatus(text, withLogin) {
      const el = document.getElementById('mmStatus');
      el.textContent = text;
      if (withLogin) {
        const a = document.createElement('a');
        a.href = '/api/auth/twitch';
        a.target = '_top';
        a.textContent = 'Log in with Twitch to rank';
        el.appendChild(document.createTextNode(' '));
        el.appendChild(a);
      }
    }

    function setCounters() {
      document.getElementById('moveCount').textContent = moves;
      document.getElementById('pairCount').textContent = matched;
      document.getElementById('totalPairs').textContent = totalPairs;
    }

    function renderBoard(pairs) {
      totalPairs = pairs;
      setCounters();
      const board = document.getElementById('board');
      const cls = cardBackClass();
      board.textContent = '';
      for (let i = 0; i < pairs * 2; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = i;
        card.onclick = () => flipCard(card);
        const inner = document.createElement('div');
        inner.className = 'card-inner';
        const front = document.createElement('div');
        front.className = cls;
        const back = document.createElement('div');
        back.className = 'card-back';
        inner.append(front, back);
        card.appendChild(inner);
        board.appendChild(card);
      }
    }

    function setFace(el, face) {
      el.dataset.pair = face;
      const back = el.querySelector('.card-back');
      back.textContent = '';
      const img = document.createElement('img');
      img.src = deal.images[face] || '';
      img.alt = deal.alts[face] || 'card';
      back.appendChild(img);
    }

    function clearFace(el) {
      delete el.dataset.pair;
      el.querySelector('.card-back').textContent = '';
    }

    function dealLocal() {
      const deck = shuffle([...deal.images.keys(), ...deal.images.keys()]);
      totalPairs = deal.images.length;
      renderBoard(totalPairs);
      document.querySelectorAll('#board .card').forEach((el, i) => setFace(el, deck[i]));
    }

    function startGame() {
      gen++;
      clearTimers();
      const g = gen;
      flipped = [];
      matched = 0;
      moves = 0;
      flipCount = 0;
      locked = true;
      ranked = null;
      flipChain = Promise.resolve();
      document.getElementById('winMessage').classList.remove('show');

      deal = getActiveSet();
      renderBoard(deal.images.length);
      setStatus('Dealing…');

      mmApi({ action: 'start', set: activeEmoteSet }).then(r => {
        if (g !== gen) return;
        if (r.ok && r.data && r.data.gameId) {
          ranked = { gameId: r.data.gameId, seq: 0, broken: false, onBoard: !!r.data.ranked };
          if (r.data.pairs !== totalPairs) renderBoard(r.data.pairs);
          setStatus(ranked.onBoard ? 'Ranked · ' + totalPairs + '-pair board' : 'Unranked deck size');
        } else {
          dealLocal();
          if (r.status === 401) setStatus('Unranked practice.', true);
          else if (r.status === 0) setStatus('Offline · unranked practice.');
          else setStatus('Unranked: ' + r.error);
        }
        locked = false;
      });
    }

    function flipCard(el) {
      if (locked || flipped.length >= 2) return;
      if (el.classList.contains('flipped') || el.classList.contains('matched')) return;

      el.classList.add('flipped');
      flipped.push(el);
      flipCount++;

      if (ranked) {
        serverFlip(el);
        return;
      }
      if (flipped.length === 2) {
        const [a, b] = flipped;
        settlePair(a, b, a.dataset.pair === b.dataset.pair, moves + 1, null);
      }
    }

    function serverFlip(el) {
      const g = gen;
      const game = ranked;
      const index = Number(el.dataset.index);
      const seq = game.seq++;
      flipChain = flipChain.then(async () => {
        if (g !== gen || game.broken) return;
        const r = await mmApi({ action: 'flip', gameId: game.gameId, index, seq });
        if (g !== gen || game.broken) return;
        if (!r.ok || !r.data || typeof r.data.face !== 'number') {
          game.broken = true;
          rankedLost(r.error);
          return;
        }
        const d = r.data;
        setFace(el, d.face);
        if (typeof d.first !== 'number') return;
        const first = document.querySelector('#board .card[data-index="' + d.first + '"]');
        settlePair(first, el, !!d.match, d.moves, d.done ? d : null);
      });
    }

    function settlePair(a, b, isMatch, newMoves, result) {
      moves = newMoves;
      if (isMatch) {
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        flipped = [];
        setCounters();
        if (matched === totalPairs) {
          locked = true;
          later(() => showWin(result), 500);
        }
        return;
      }
      setCounters();
      locked = true;
      later(() => {
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        flipped = [];
        locked = false;
        if (ranked) {
          later(() => {
            if (!a.classList.contains('flipped')) clearFace(a);
            if (!b.classList.contains('flipped')) clearFace(b);
          }, 400);
        }
      }, 800);
    }

    function rankedLost(error) {
      locked = true;
      setStatus('Lost the ranked game (' + error + '). Dealing a new one…');
      later(startGame, 1800);
    }

    function showWin(result) {
      document.getElementById('finalMoves').textContent = moves;
      let note;
      if (!ranked) note = 'Unranked run. Log in to put it on the board.';
      else if (!result || !result.recorded) note = "That run couldn't be recorded on the board.";
      else if (result.improved) note = 'New personal best on the ' + totalPairs + '-pair board.';
      else note = 'Your best on the ' + totalPairs + '-pair board is ' + result.best + ' moves.';
      document.getElementById('winNote').textContent = note;
      document.getElementById('winMessage').classList.add('show');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });

    loadMMCosmetics().then(startGame, startGame);
  </script>
</body>
</html>
