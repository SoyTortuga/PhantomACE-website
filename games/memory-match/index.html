<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match</title>
  <script>try{var _pt=function(t){var e=document.documentElement;if(t==="light")e.setAttribute("data-theme","light");else e.removeAttribute("data-theme");};_pt(localStorage.getItem("pham-theme"));addEventListener("storage",function(v){if(v.key==="pham-theme")_pt(v.newValue);});}catch(e){}</script>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/game-identity.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--text-pri);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-family: var(--font-display);
      letter-spacing: normal;
      font-size: 24px;
      color: var(--red);
      margin-bottom: 8px;
    }

    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 20px;
      font-size: 18px;
      text-shadow: none;
      color: var(--text-pri);
    }

    .stats span { color: var(--text-pri); }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 480px;
      width: 100%;
    }

    .card {
      aspect-ratio: 1;
      border-radius: 6px;
      cursor: pointer;
      perspective: 600px;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
    }

    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-front {
      background: var(--gray-mid);
      border: 1px solid var(--border-mid);
    }

    .card-front::after {
      content: '?';
      font-size: 39px;
      color: var(--red);
      opacity: 0.4;
    }

    .card:hover .card-front {
      border: 2px solid var(--red);
    }

    .card-back {
      background: var(--gray-mid);
      border: 1px solid #444;
      transform: rotateY(180deg);
    }

    .card-back img {
      width: 65%;
      height: auto;
      border-radius: 4px;
    }

    .card.matched .card-front { display: none; }
    .card.matched .card-back {
      border: 2px solid #00cc66;
    }

    .win-message {
      display: none;
      text-align: center;
      margin-top: 24px;
    }

    .win-message.show { display: block; }

    .win-message h2 {
      font-size: 20px;
      color: var(--red);
      margin-bottom: 8px;
    }

    .win-message p {
      font-size: 18px;
      text-shadow: none;
      color: var(--text-pri);
      margin-bottom: 16px;
    }

    .restart-btn {
      padding: 8px 24px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 18px;
      text-shadow: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .restart-btn:hover { background: #cc0000; }

    [hidden] { display: none !important; }

    .cosmetics-bar {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center;
    }
    .cosmetic-select {
      background: var(--gray-mid); border: 1px solid var(--border-mid); color: var(--text-pri); padding: 4px 10px;
      border-radius: 3px; font-size: 15px;
 text-shadow: none; cursor: pointer; font-family: inherit;
    }
    .cosmetic-select option { background: var(--gray-mid); color: var(--text-pri); }
    .cosmetic-label { font-size: 14px;
 text-shadow: none; color: var(--text-pri); text-transform: uppercase; letter-spacing: 0.05em; }

    .card-front.cb-basic { background: var(--gray-mid); border-color: var(--text-dim); }
    .card-front.cb-basic::after { content: '♦'; color: var(--text-pri); opacity: 0.5; }
    .card-front.cb-phamily { background: linear-gradient(135deg, #1a0000, #111); border-color: #cc0000; }
    .card-front.cb-phamily::after { content: '💀'; color: var(--red); opacity: 0.6; }
    .card-front.cb-rare { background: linear-gradient(135deg, #0a0a1e, #111); border-color: #3344aa; }
    .card-front.cb-rare::after { content: '🃏'; color: #4466ee; opacity: 0.6; }
    .card-front.cb-legendary { background: linear-gradient(135deg, #1a0a1a, #111); border-color: #8833cc; }
    .card-front.cb-legendary::after { content: '✨'; color: #aa44ff; opacity: 0.6; }
    .card-front.cb-cobweb { background: linear-gradient(135deg, #1c1c1c, #0a0a0a); border-color: #666; }
    .card-front.cb-cobweb::after { content: '🕸️'; color: #ddd; opacity: 0.55; }
    .card-front.cb-crypt { background: linear-gradient(135deg, #160606, #0a0a0a); border-color: #660000; }
    .card-front.cb-crypt::after { content: '🪦'; color: var(--red); opacity: 0.6; }
    .card-front.cb-bat { background: radial-gradient(circle, #330000, #0a0a0a); border-color: #990000; }
    .card-front.cb-bat::after { content: '🦇'; color: var(--red); opacity: 0.65; }
    .card-front.cb-ghost { background: linear-gradient(135deg, #2b2b2b, #111); border-color: #ccc; }
    .card-front.cb-ghost::after { content: '👻'; color: #fff; opacity: 0.55; }
  </style>
</head>
<body>
  <h1>Memory Match</h1>
  <div class="stats">
    Moves: <span id="moveCount">0</span>
    &nbsp;&middot;&nbsp;
    Pairs: <span id="pairCount">0</span> / <span id="totalPairs">20</span>
  </div>
  <div class="cosmetics-bar" id="cosmeticsBar" hidden>
    <div>
      <div class="cosmetic-label">Card Back</div>
      <select class="cosmetic-select" id="cardBackSelect" onchange="applyCardBack()">
        <option value="default">Default</option>
      </select>
    </div>
    <div>
      <div class="cosmetic-label">Card Set</div>
      <select class="cosmetic-select" id="emoteSelect" onchange="applyEmoteSet()">
        <option value="default">Default</option>
      </select>
    </div>
    <div class="cosmetic-label" id="cosmeticError" role="alert" hidden></div>
  </div>
  <div class="board" id="board"></div>
  <div class="win-message" id="winMessage">
    <h2>You Win!</h2>
    <p>Completed in <span id="finalMoves">0</span> moves</p>
    <button class="restart-btn" onclick="startGame()">Play Again</button>
  </div>

      { name: 'phamHi', src: 'https://static-cdn.jtvnw.net/emoticons/v2/121673/default/light/3.0' },

    const DEFAULT_IMAGES = CHANNEL_EMOTES.map(e => e.src);

    function emoteUrl(id) { return `https://static-cdn.jtvnw.net/emoticons/v2/${id}/default/light/3.0`; }

    const BONUS_EMOTES = [
      { name: 'phamDrum', src: emoteUrl('emotesv2_454abcf6e3104137b1eeeac026d5f62d') },
      { name: 'phamBass', src: emoteUrl('emotesv2_11714d9a022d4fd7b4cb872b0d5bba1d') },
      { name: 'phamJam', src: emoteUrl('emotesv2_62be33ae947d41eeb96785317e0ff198') },
      { name: 'phamHUH', src: emoteUrl('emotesv2_6700d9409cfc499ab30d1235e680b25b') },
      { name: 'phamHeal', src: emoteUrl('emotesv2_1f60e4c71d9e4af19fa7b3812f40d71f') },
      { name: 'phamEcho', src: emoteUrl('emotesv2_325e83dde662429c82020e6d2af7f08f') },
      { name: 'phamPoint', src: emoteUrl('303615525') },
      { name: 'phamTime', src: emoteUrl('emotesv2_66462619face41b1abec201b92022a0b') },
      { name: 'phamPepelaugh', src: emoteUrl('emotesv2_92f127f639ff4ff2a3b8ed07faa86d49') },
      { name: 'phamDrink', src: emoteUrl('emotesv2_8c96393fd63f46a6bb0f15d5ba9051d0') },
    ];

    const PREMIUM_EMOTES = [
      { name: 'phamHYPERS', src: emoteUrl('1142146') },
      { name: 'phamLove2', src: emoteUrl('168361') },
      { name: 'phamLove3', src: emoteUrl('168352') },
      { name: 'phamLovespin', src: emoteUrl('emotesv2_8243b0b6a8534d43b216c89e64404320') },
      { name: 'phamMaid', src: emoteUrl('emotesv2_d8b593cb945b49b89b2bfdacd32bf276') },
      { name: 'phamGear', src: emoteUrl('emotesv2_9fad6fab6f35430390613ab56d7a008f') },
      { name: 'phamButton', src: emoteUrl('emotesv2_a1f04eab77664362881740e2756f60b4') },
      { name: 'phamCoinroll', src: emoteUrl('emotesv2_26bf7acbf75644e69473adf3952110b7') },
      { name: 'phamRee', src: emoteUrl('303615532') },
      { name: 'phamFroze', src: emoteUrl('emotesv2_1d3742cd0c33464f9fdc9d5e2495a4cb') },
      { name: 'phamFeelsBad', src: emoteUrl('303615479') },
      { name: 'phamToxic', src: emoteUrl('300609000') },
      { name: 'phamHyperss', src: emoteUrl('emotesv2_2b7c7263e8234fbd963c87bc085969fb') },
      { name: 'phamChair', src: emoteUrl('emotesv2_e4a4f5d9bc764548ba26a61d54140bfe') },
      { name: 'phamPepeHands', src: emoteUrl('303615508') },
    ];

    const SPOOKY_EMOTES = [
      { name: 'phamMonkaS', src: emoteUrl('303615499') },
      { name: 'phamFroze', src: emoteUrl('emotesv2_1d3742cd0c33464f9fdc9d5e2495a4cb') },
      { name: 'phamPepeHands', src: emoteUrl('303615508') },
      { name: 'phamFeelsBad', src: emoteUrl('303615479') },
      { name: 'phamToxic', src: emoteUrl('300609000') },
      { name: 'phamUsure', src: emoteUrl('472088') },
      { name: 'phamRee', src: emoteUrl('303615532') },
      { name: 'phamHUH', src: emoteUrl('emotesv2_6700d9409cfc499ab30d1235e680b25b') },
      { name: 'phamClown', src: emoteUrl('303615503') },
      { name: 'phamYEP', src: emoteUrl('303615534') },
    ];

    const HAUNTED_EMOTES = [
      { name: 'phamL', src: emoteUrl('415421') },
      { name: 'phamPepelaugh', src: emoteUrl('emotesv2_92f127f639ff4ff2a3b8ed07faa86d49') },
      { name: 'phamMonkaS', src: emoteUrl('303615499') },
      { name: 'phamFroze', src: emoteUrl('emotesv2_1d3742cd0c33464f9fdc9d5e2495a4cb') },
      { name: 'phamClown', src: emoteUrl('303615503') },
      { name: 'phamToxic', src: emoteUrl('300609000') },
      { name: 'phamUsure', src: emoteUrl('472088') },
      { name: 'phamNice', src: emoteUrl('303615522') },
      { name: 'phamPepeHands', src: emoteUrl('303615508') },
      { name: 'phamHUH', src: emoteUrl('emotesv2_6700d9409cfc499ab30d1235e680b25b') },
    ];

    const EMOTE_SETS = {
      default: { name: 'PhantomACE Emotes', images: DEFAULT_IMAGES, alts: DEFAULT_NAMES },
      bonus: { name: 'Emote Pack', images: BONUS_EMOTES.map(e => e.src), alts: BONUS_EMOTES.map(e => e.name) },
      premium: { name: 'Premium Emote Pack', images: PREMIUM_EMOTES.map(e => e.src), alts: PREMIUM_EMOTES.map(e => e.name) },
      spooky: { name: 'Spooky Emote Pack', images: SPOOKY_EMOTES.map(e => e.src), alts: SPOOKY_EMOTES.map(e => e.name) },
      haunted: { name: 'Haunted Emote Pack', images: HAUNTED_EMOTES.map(e => e.src), alts: HAUNTED_EMOTES.map(e => e.name) },
    };

    const CARD_BACKS = {
      default: { name: 'Default', cssClass: '' },
      basic: { name: 'Basic Card Back', cssClass: 'cb-basic' },
      phamily: { name: 'Phamily Card Back', cssClass: 'cb-phamily' },
      rare: { name: 'Rare Card Back', cssClass: 'cb-rare' },
      legendary: { name: 'Legendary Card Back', cssClass: 'cb-legendary' },
      cobweb: { name: 'Cobweb Card Back', cssClass: 'cb-cobweb' },
      crypt: { name: 'Crypt Card Back', cssClass: 'cb-crypt' },
      bat: { name: 'Bat Card Back', cssClass: 'cb-bat' },
      ghost: { name: 'Ghost Card Back', cssClass: 'cb-ghost' },
    };

    let activeCardBack = 'default';
    let activeEmoteSet = 'default';
    let equippedCardBackId = 'default';
    let equippedEmoteSetId = 'default';
    let ownedCardBacks = [];
    let ownedEmoteSets = [];

    let cards = [];
    let flipped = [];
    let matched = 0;
    let moves = 0;
    let locked = false;
    let totalPairs = 4;

    function getActiveImages() {
      const set = EMOTE_SETS[activeEmoteSet] || EMOTE_SETS.default;
      const alts = set.alts || set.images.map(() => 'card');
      return {
        images: [...set.images, ...set.images],
        alts: [...alts, ...alts],
        pairTotal: set.images.length,
      };
    }

    async function loadMMCosmetics() {
      try {
        const res = await fetch('/api/inventory?game=memory-match');
        if (!res.ok) return;
        const data = await res.json();
        const items = data.items || [];
        ownedCardBacks = items.filter(i => i.type === 'cardback');
        ownedEmoteSets = items.filter(i => i.type === 'emote-pack');
        const equips = data.equips || {};
        const cb = resolveEquipped(ownedCardBacks, equips['card-back'], 'cb');
        if (cb && CARD_BACKS[cb.key]) { activeCardBack = cb.key; equippedCardBackId = cb.itemId; }
        const es = resolveEquipped(ownedEmoteSets, equips['emote-set'], 'emote');
        if (es && EMOTE_SETS[es.key]) { activeEmoteSet = es.key; equippedEmoteSetId = es.itemId; }
        populateCosmeticSelects();
        if (ownedCardBacks.length > 0 || ownedEmoteSets.length > 0) {
          document.getElementById('cosmeticsBar').hidden = false;
        }
        /* The board was dealt before the inventory answered; redeal with the
           equipped look if nobody has started playing it yet. */
        if (moves === 0 && matched === 0) startGame();
      } catch {}
    }

    /* The server stores the owned item's real id. Older saves held the
       game's own key ('cobweb'), so that is still honoured. */
    function resolveEquipped(owned, stored, prefix) {
      if (!stored) return null;
      const byId = owned.find(i => i.id === stored);
      if (byId) return { itemId: byId.id, key: getCosmeticId(byId, prefix) };
      const byKey = owned.find(i => getCosmeticId(i, prefix) === stored);
      if (byKey) return { itemId: byKey.id, key: stored };
      return null;
    }

    function populateCosmeticSelects() {
      const cbSel = document.getElementById('cardBackSelect');
      for (const item of ownedCardBacks) {
        const key = getCosmeticId(item, 'cb');
        if (!CARD_BACKS[key]) {
          CARD_BACKS[key] = { name: item.name, cssClass: 'cb-' + key };
        }
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name || key;
        if (item.id === equippedCardBackId) opt.selected = true;
        cbSel.appendChild(opt);
      }

      const eSel = document.getElementById('emoteSelect');
      for (const item of ownedEmoteSets) {
        const key = getCosmeticId(item, 'emote');
        if (!EMOTE_SETS[key]) {
          EMOTE_SETS[key] = { name: item.name, images: DEFAULT_IMAGES };
        }
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name || key;
        if (item.id === equippedEmoteSetId) opt.selected = true;
        eSel.appendChild(opt);
      }
    }

    function getCosmeticId(item, prefix) {
      const n = (item.name || '').toLowerCase();
      if (n.includes('legendary')) return 'legendary';
      if (n.includes('phamily')) return 'phamily';
      if (n.includes('rare')) return 'rare';
      if (n.includes('premium')) return 'premium';
      if (n.includes('cobweb')) return 'cobweb';
      if (n.includes('crypt')) return 'crypt';
      if (n.includes('bat')) return 'bat';
      if (n.includes('ghost')) return 'ghost';
      if (n.includes('spooky')) return 'spooky';
      if (n.includes('haunt')) return 'haunted';
      // Unrecognized reward name — fall back to the lowest tier for this slot
      // rather than silently duplicating the default set.
      return prefix === 'cb' ? 'basic' : 'bonus';
    }

    async function saveEquip(slot, itemId) {
      try {
        const res = await fetch('/api/inventory', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'equip', game: 'memory-match', slot, itemId }),
        });
        const data = await res.json().catch(() => null);
        if (res.ok && data && data.success) return { ok: true };
        return { ok: false, error: (data && data.error) || ('Server returned ' + res.status) };
      } catch {
        return { ok: false, error: 'Network error' };
      }
    }

    function showCosmeticError(msg) {
      const el = document.getElementById('cosmeticError');
      if (!el) return;
      el.textContent = msg || '';
      el.hidden = !msg;
    }

    async function applyCardBack() {
      const sel = document.getElementById('cardBackSelect');
      const prev = { key: activeCardBack, id: equippedCardBackId };
      const id = sel.value;
      const item = ownedCardBacks.find(i => i.id === id);
      activeCardBack = item ? getCosmeticId(item, 'cb') : 'default';
      equippedCardBackId = item ? item.id : 'default';
      showCosmeticError('');
      startGame();
      const r = await saveEquip('card-back', item ? item.id : 'none');
      if (r.ok) return;
      activeCardBack = prev.key;
      equippedCardBackId = prev.id;
      sel.value = prev.id;
      startGame();
      showCosmeticError("Couldn't save card back: " + r.error);
    }

    async function applyEmoteSet() {
      const sel = document.getElementById('emoteSelect');
      const prev = { key: activeEmoteSet, id: equippedEmoteSetId };
      const id = sel.value;
      const item = ownedEmoteSets.find(i => i.id === id);
      activeEmoteSet = item ? getCosmeticId(item, 'emote') : 'default';
      equippedEmoteSetId = item ? item.id : 'default';
      showCosmeticError('');
      startGame();
      const r = await saveEquip('emote-set', item ? item.id : 'none');
      if (r.ok) return;
      activeEmoteSet = prev.key;
      equippedEmoteSetId = prev.id;
      sel.value = prev.id;
      startGame();
      showCosmeticError("Couldn't save card set: " + r.error);
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGame() {
      const board = document.getElementById('board');
      matched = 0;
      moves = 0;
      flipped = [];
      locked = false;

      document.getElementById('moveCount').textContent = '0';
      document.getElementById('pairCount').textContent = '0';
      document.getElementById('winMessage').classList.remove('show');

      const { images, alts, pairTotal } = getActiveImages();
      totalPairs = pairTotal;
      document.getElementById('totalPairs').textContent = totalPairs;

      const pairs = [];
      images.forEach((src, i) => {
        pairs.push({ id: i, pairId: i % pairTotal, src, alt: alts[i] });
      });

      cards = shuffle(pairs);

      const cbClass = CARD_BACKS[activeCardBack]?.cssClass || '';

      board.innerHTML = cards.map((card, index) => `
        <div class="card" data-index="${index}" data-pair="${card.pairId}" onclick="flipCard(this)">
          <div class="card-inner">
            <div class="card-front ${cbClass}"></div>
            <div class="card-back">
              <img src="${card.src}" alt="${card.alt}">
            </div>
          </div>
        </div>
      `).join('');
    }

    function flipCard(el) {
      if (locked) return;
      if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
      if (flipped.length >= 2) return;

      el.classList.add('flipped');
      flipped.push(el);

      if (flipped.length === 2) {
        moves++;
        document.getElementById('moveCount').textContent = moves;
        locked = true;

        const a = flipped[0].dataset.pair;
        const b = flipped[1].dataset.pair;

        if (a === b) {
          flipped[0].classList.add('matched');
          flipped[1].classList.add('matched');
          matched++;
          document.getElementById('pairCount').textContent = matched;
          flipped = [];
          locked = false;

          if (matched === totalPairs) {
            setTimeout(() => {
              document.getElementById('finalMoves').textContent = moves;
              document.getElementById('winMessage').classList.add('show');
              submitMMScore(moves);
            }, 500);
          }
        } else {
          setTimeout(() => {
            flipped[0].classList.remove('flipped');
            flipped[1].classList.remove('flipped');
            flipped = [];
            locked = false;
          }, 800);
        }
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });

    function submitMMScore(moveCount) {
      fetch('/api/leaderboards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ game: 'memory-match', score: moveCount }),
      }).catch(function () {});
    }

    loadMMCosmetics();
    startGame();
  </script>
</body>
</html>
