<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commander Bingo - Host</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* ── SCREENS ─────────────────────────── */
    .screen { display: none; width: 100%; max-width: 600px; }
    .screen.active { display: flex; flex-direction: column; }
    #hostScreen { max-width: 1200px; }

    /* ── CREATE SCREEN ───────────────────── */
    .create-screen {
      align-items: center;
      padding-top: 40px;
    }

    .host-title {
      font-size: 28px;
      color: #ff0000;
      text-align: center;
      margin-bottom: 4px;
    }

    .host-subtitle {
      font-size: 11px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
      text-align: center;
    }

    .dev-banner {
      display: inline-block;
      margin: 0 auto 20px;
      padding: 5px 14px;
      background: rgba(255, 170, 0, 0.08);
      border: 1px solid rgba(255, 170, 0, 0.4);
      border-radius: 3px;
      color: #ffaa00;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .create-btn {
      padding: 14px 40px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .create-btn:hover { background: #cc0000; }

    .create-note {
      margin-top: 16px;
      font-size: 11px;
      color: #333;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }

    /* ── HOST PANEL ──────────────────────── */
    .host-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 16px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .code-section {}

    .code-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-bottom: 4px;
    }

    .code-display {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 0.25em;
      color: #ff0000;
      line-height: 1;
    }

    .code-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .code-copy-btn {
      padding: 4px 12px;
      background: transparent;
      border: 1px solid #222;
      border-radius: 3px;
      color: #555;
      font-size: 10px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      font-family: inherit;
    }

    .code-copy-btn:hover { border-color: #ff0000; color: #fff; }
    .code-copy-btn.copied { border-color: #00cc66; color: #00cc66; }

    /* Show-on-overlay toggle. Reads as a switch: a red dot and ON when the
       game is live on the stream, a grey dot and OFF when it is not. */
    .overlay-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 12px;
      background: transparent;
      border: 1px solid #222;
      border-radius: 3px;
      color: #666;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      font-family: inherit;
    }
    .overlay-toggle:hover { border-color: #444; color: #999; }
    .overlay-toggle .ov-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #333; border: 1px solid #444;
      transition: background 0.2s, border-color 0.2s;
    }
    .overlay-toggle.on { border-color: rgba(255, 0, 0, 0.4); color: #ff5555; }
    .overlay-toggle.on .ov-dot { background: #ff0000; border-color: #ff0000; }
    .overlay-toggle:disabled { opacity: 0.5; cursor: default; }

    .host-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .stat-row {
      font-size: 11px;
      color: #555;
    }

    .stat-row span { color: #fff; font-weight: bold; }
    .stat-row .count-red { color: #ff0000; }

    /* ── MAIN CONTENT AREA ────────────────── */
    .host-body {
      display: flex;
      gap: 0;
      flex: 1;
      min-height: 0;
    }

    /* ── VERTICAL SIDEBAR ────────────────── */
    .cat-sidebar {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 8px;
      flex-shrink: 0;
    }

    .cat-tab {
      padding: 10px 14px;
      background: transparent;
      border: 1px solid #1a1a1a;
      border-radius: 3px;
      color: #444;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      font-family: inherit;
      white-space: nowrap;
      text-align: left;
    }

    .cat-tab:hover { border-color: #333; color: #888; }
    .cat-tab.active { border-color: #ff0000; color: #ff0000; background: rgba(255, 0, 0, 0.05); }

    /* ── RIGHT PANEL (search + list) ─────── */
    .events-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 8px;
    }

    .search-input:focus { border-color: #ff0000; }
    .search-input::placeholder { color: #333; }

    /* ── EVENT CARD GRID ─────────────────── */
    .events-list {
      flex: 1;
      overflow-y: auto;
      max-height: calc(100vh - 260px);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      align-content: start;
      gap: 8px;
      padding: 8px;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      background: #050505;
    }

    .event-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      background: #0a0a0a;
      transition: border-color 0.15s, background 0.15s;
    }

    .event-card:hover { border-color: #333; }

    .event-card.called {
      border-color: rgba(255, 0, 0, 0.4);
      background: rgba(152, 9, 10, 0.12);
    }

    .event-card-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .event-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 1px solid #333;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .event-card.called .event-dot {
      background: #ff0000;
      border-color: #ff0000;
      box-shadow: 0 0 6px rgba(255, 0, 0, 0.3);
    }

    .event-cat {
      margin-left: auto;
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 1px 6px;
      border-radius: 2px;
      border: 1px solid transparent;
      flex-shrink: 0;
    }

    .event-cat.gameplay { color: #cc88ff; border-color: rgba(204, 136, 255, 0.2); }
    .event-cat.social { color: #ffaa00; border-color: rgba(255, 170, 0, 0.2); }

    .event-text {
      font-size: 12px;
      color: #fff;
      line-height: 1.35;
      flex: 1;
    }

    .event-call-btn {
      padding: 5px 0;
      width: 100%;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: auto;
    }

    .btn-call {
      background: transparent;
      border: 1px solid #222;
      color: #555;
    }

    .btn-call:hover { border-color: #ff0000; color: #ff0000; background: rgba(255, 0, 0, 0.05); }

    .btn-undo {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff0000;
    }

    .btn-undo:hover { background: rgba(255, 0, 0, 0.2); }

    /* ── END GAME ────────────────────────── */
    .host-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #1a1a1a;
    }

    .called-summary {
      font-size: 11px;
      color: #444;
    }

    .called-summary span { color: #ff0000; }

    .end-game-btn {
      padding: 8px 24px;
      background: transparent;
      border: 1px solid #ff0000;
      border-radius: 3px;
      color: #ff0000;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .end-game-btn:hover { background: rgba(255, 0, 0, 0.1); }

    /* ── RESULTS SCREEN ──────────────────── */
    .results-panel {
      align-items: center;
    }

    .results-title {
      font-size: 24px;
      color: #ff0000;
      margin-bottom: 4px;
      text-align: center;
    }

    .results-sub {
      font-size: 12px;
      color: #555;
      margin-bottom: 20px;
      text-align: center;
    }

    .leaderboard {
      width: 100%;
      /* Wider than it was: the prize column needs a tier select and a
         button beside the existing four. */
      max-width: 660px;
    }

    .lb-header {
      display: grid;
      grid-template-columns: 34px 1fr 58px 62px 172px;
      padding: 8px 12px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #444;
      border-bottom: 1px solid #1a1a1a;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 34px 1fr 58px 62px 172px;
      padding: 10px 12px;
      border-bottom: 1px solid #0f0f0f;
      align-items: center;
      font-size: 12px;
    }

    .lb-row:first-of-type { background: rgba(255, 0, 0, 0.05); }

    /* ── Prize column ── */
    .lb-award { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }

    .lb-award-tier {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 3px;
      color: #fff;
      font-family: inherit;
      font-size: 10px;
      padding: 4px 5px;
      max-width: 104px;
    }

    .lb-award-btn {
      background: #ff0000;
      border: none;
      border-radius: 3px;
      color: #fff;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 9px;
      cursor: pointer;
    }

    .lb-award-btn:hover:not(:disabled) { background: #d40000; }
    .lb-award-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .lb-award-done {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #6ac46a;
    }

    .lb-award-na { font-size: 10px; color: #444; }

    .lb-rank {
      font-weight: bold;
      color: #555;
    }

    .lb-row:first-of-type .lb-rank { color: #ff0000; }

    .lb-name { color: #ccc; overflow: hidden; text-overflow: ellipsis; }
    .lb-bingos { color: #ff0000; text-align: center; font-weight: bold; }
    .lb-marked { color: #555; text-align: center; }

    .results-actions {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }

    .new-game-btn {
      padding: 10px 28px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      font-family: inherit;
    }

    .new-game-btn:hover { background: #cc0000; }

    .back-btn {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid #222;
      border-radius: 4px;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      font-family: inherit;
    }

    .back-btn:hover { border-color: #ff0000; color: #fff; }

    .no-players {
      text-align: center;
      padding: 24px;
      color: #333;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- ════ CREATE SCREEN ════ -->
  <div class="screen active create-screen" id="createScreen">
    <h1 class="host-title">Commander Bingo</h1>
    <p class="host-subtitle">Host Control Panel</p>
    <div class="dev-banner">🚧 Still in Development</div>
    <button class="create-btn" onclick="createGame()">Create Game</button>
    <p class="create-note">
      Creates a game session with a 4-letter code. Share the code with your audience so they can join and get their bingo cards.
    </p>
  </div>

  <!-- ════ HOST PANEL ════ -->
  <div class="screen" id="hostScreen">
    <div class="host-header">
      <div class="code-section">
        <div class="code-label">Game Code</div>
        <div class="code-display" id="codeDisplay"></div>
        <div class="code-actions">
          <button class="code-copy-btn" id="copyCodeBtn" onclick="copyCode()">Copy Code</button>
          <button class="code-copy-btn" id="copyLinkBtn" onclick="copyLink()">Copy Join Link</button>
          <button class="overlay-toggle" id="overlayToggleBtn" onclick="toggleOverlay()">
            <span class="ov-dot"></span><span id="overlayToggleText">Overlay: On</span>
          </button>
        </div>
      </div>
      <div class="host-stats">
        <div class="stat-row">Players: <span id="playerCount">0</span></div>
        <div class="stat-row">Called: <span class="count-red" id="calledCount">0</span> / <span id="totalCount">68</span></div>
      </div>
    </div>

    <div class="host-body">
      <div class="cat-sidebar">
        <button class="cat-tab active" data-cat="all" onclick="setCat('all')">All</button>
        <button class="cat-tab" data-cat="gameplay" onclick="setCat('gameplay')">Gameplay</button>
        <button class="cat-tab" data-cat="social" onclick="setCat('social')">Social</button>
      </div>
      <div class="events-panel">
        <input class="search-input" id="searchInput" type="text"
               placeholder="Search events..." oninput="filterEvents()">
        <div class="events-list" id="eventsList"></div>
      </div>
    </div>

    <div class="host-footer">
      <div class="called-summary">
        <span id="calledCountFooter">0</span> events called
      </div>
      <button class="end-game-btn" onclick="endGame()">End Game</button>
    </div>
  </div>

  <!-- ════ RESULTS SCREEN ════ -->
  <div class="screen results-panel" id="resultsScreen">
    <h2 class="results-title">Game Over</h2>
    <p class="results-sub" id="resultsSub"></p>

    <div class="leaderboard" id="leaderboard">
      <div class="lb-header">
        <div>#</div>
        <div>Player</div>
        <div style="text-align:center">Bingos</div>
        <div style="text-align:center">Marked</div>
        <div style="text-align:right">Prize</div>
      </div>
      <div id="lbBody"></div>
    </div>

    <div class="results-actions">
      <button class="new-game-btn" onclick="createGame()">New Game</button>
      <button class="back-btn" onclick="backToCreate()">Back</button>
    </div>
  </div>

  <script src="events.js"></script>
  <script>
    /* ── Prize tiers ───────────────────────────────────────────────────────
       Declared up here, not beside the code that uses it. A `const` in the
       middle of the file is in its temporal dead zone until execution
       reaches it, and awardControl() is reachable from showResults(), which
       appears earlier — so a call that arrived before the declaration
       evaluated threw "cannot access RARITIES before initialization" rather
       than simply working.

       Values match TIER_INFO in functions/api/bot/send-chat.js, so a mythic
       bingo prize is worth exactly a mythic chat drop. The server is the
       authority on the number; this list only labels the dropdown. */
    const RARITIES = [
      { id: 'common',   label: 'Common',   entries: 2 },
      { id: 'uncommon', label: 'Uncommon', entries: 5 },
      { id: 'rare',     label: 'Rare',     entries: 15 },
      { id: 'mythic',   label: 'Mythic',   entries: 50 },
    ];

    let gameCode = null;
    let calledEvents = new Set();
    let currentCat = 'all';
    let useApi = false;
    let showOnOverlay = true;

    /* The room this browser is hosting, remembered so a refresh or a dropped
       connection can walk straight back into the live game instead of the
       create screen. Cleared only when the host ends the game or leaves. */
    const HOST_CODE_KEY = 'bingo_host_code';

    const TOTAL = BINGO_EVENTS.length;
    document.getElementById('totalCount').textContent = TOTAL;

    /* ── Show on overlay ─────────────────── */
    function renderOverlayToggle() {
      const btn = document.getElementById('overlayToggleBtn');
      const txt = document.getElementById('overlayToggleText');
      btn.classList.toggle('on', showOnOverlay);
      txt.textContent = 'Overlay: ' + (showOnOverlay ? 'On' : 'Off');
    }

    async function toggleOverlay() {
      const next = !showOnOverlay;
      const btn = document.getElementById('overlayToggleBtn');

      if (useApi) {
        btn.disabled = true;
        try {
          const res = await fetch('/api/bingo/overlay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ code: gameCode, show: next })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Could not change the overlay.');
          showOnOverlay = !!data.showOnOverlay;
        } catch (err) {
          window.alert(err.message);
        } finally {
          btn.disabled = false;
        }
      } else {
        showOnOverlay = next;
        const raw = localStorage.getItem('bingo_game_' + gameCode);
        if (raw) {
          const game = JSON.parse(raw);
          game.showOnOverlay = showOnOverlay;
          localStorage.setItem('bingo_game_' + gameCode, JSON.stringify(game));
        }
      }
      renderOverlayToggle();
    }

    function generateCode() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
      return code;
    }

    /* ── Create game ─────────────────────── */
    async function createGame() {
      calledEvents = new Set();
      gameCode = generateCode();
      showOnOverlay = true;

      try {
        const res = await fetch('/api/bingo/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: gameCode })
        });
        if (res.ok) {
          useApi = true;
        } else {
          throw new Error('api fail');
        }
      } catch {
        useApi = false;
        localStorage.setItem('bingo_game_' + gameCode, JSON.stringify({
          code: gameCode,
          status: 'active',
          calledEvents: [],
          players: [],
          showOnOverlay: true,
          createdAt: Date.now()
        }));
      }

      /* Remember the room so a reload comes straight back to it. */
      try { localStorage.setItem(HOST_CODE_KEY, gameCode); } catch {}

      document.getElementById('codeDisplay').textContent = gameCode;
      updateCalledCount();
      renderOverlayToggle();
      renderEvents();
      showScreen('hostScreen');

      if (!useApi) startPlayerPoll();
    }

    /* ── Reconnect ───────────────────────────
       On load, if this browser was hosting a game, walk back into it rather
       than the create screen — the game lived on the server the whole time,
       the host just lost the page. Verified by isHost so only the real host
       resumes, and only while the game is still active. */
    async function resumeGame() {
      let code;
      try { code = localStorage.getItem(HOST_CODE_KEY); } catch {}
      if (!code) return;

      try {
        const res = await fetch('/api/bingo/state?code=' + encodeURIComponent(code), {
          cache: 'no-store', credentials: 'same-origin'
        });
        if (res.ok) {
          const g = await res.json();
          if (g && g.status === 'active' && g.isHost) {
            gameCode = code;
            useApi = true;
            calledEvents = new Set(Array.isArray(g.calledEvents) ? g.calledEvents : []);
            showOnOverlay = g.showOnOverlay !== false;
            document.getElementById('codeDisplay').textContent = gameCode;
            document.getElementById('playerCount').textContent = g.playerCount || 0;
            updateCalledCount();
            renderOverlayToggle();
            renderEvents();
            showScreen('hostScreen');
            return;
          }
          /* Game ended or this account is not its host — the pointer is stale. */
          if (!g || g.status !== 'active' || !g.isHost) { clearHostCode(); return; }
        }
        /* A 404 means the room is gone; anything else (offline) we leave the
           pointer in place so a later reload can still try. */
        if (res.status === 404) clearHostCode();
      } catch {
        /* Offline: keep the pointer, stay on the create screen for now. */
      }
    }

    function clearHostCode() {
      try { localStorage.removeItem(HOST_CODE_KEY); } catch {}
    }

    let playerPollTimer = null;
    function startPlayerPoll() {
      if (playerPollTimer) clearInterval(playerPollTimer);
      playerPollTimer = setInterval(() => {
        const raw = localStorage.getItem('bingo_game_' + gameCode);
        if (!raw) return;
        const game = JSON.parse(raw);
        document.getElementById('playerCount').textContent = game.players.length;
      }, 2000);
    }

    /* ── Render event list ───────────────── */
    function renderEvents() {
      const list = document.getElementById('eventsList');
      list.innerHTML = BINGO_EVENTS.map(evt => {
        const isCalled = calledEvents.has(evt.id);
        return '<div class="event-card' + (isCalled ? ' called' : '') +
               '" data-id="' + evt.id + '" data-cat="' + evt.cat +
               '" data-text="' + evt.text.toLowerCase() + '">' +
               '<div class="event-card-top">' +
               '<div class="event-dot"></div>' +
               '<span class="event-cat ' + evt.cat + '">' + evt.cat + '</span>' +
               '</div>' +
               '<span class="event-text">' + evt.text + '</span>' +
               '<button class="event-call-btn ' + (isCalled ? 'btn-undo' : 'btn-call') +
               '" onclick="toggleEvent(' + evt.id + ')">' +
               (isCalled ? 'Undo' : 'Call') + '</button>' +
               '</div>';
      }).join('');
      filterEvents();
    }

    /* ── Call / uncall event ──────────────── */
    async function toggleEvent(id) {
      const wasCalled = calledEvents.has(id);

      if (wasCalled) {
        calledEvents.delete(id);
      } else {
        calledEvents.add(id);
      }

      if (useApi) {
        try {
          await fetch('/api/bingo/call', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              code: gameCode,
              eventId: id,
              action: wasCalled ? 'uncall' : 'call',
              /* The square's text, so the overlay can name the call. Cosmetic
                 and host-only; ignored on an uncall. */
              text: (BINGO_EVENTS.find(e => e.id === id) || {}).text || ''
            })
          });
        } catch { /* silent */ }
      } else {
        const raw = localStorage.getItem('bingo_game_' + gameCode);
        if (raw) {
          const game = JSON.parse(raw);
          game.calledEvents = [...calledEvents];
          localStorage.setItem('bingo_game_' + gameCode, JSON.stringify(game));
        }
      }

      const item = document.querySelector('.event-card[data-id="' + id + '"]');
      if (item) {
        const btn = item.querySelector('.event-call-btn');
        if (wasCalled) {
          item.classList.remove('called');
          btn.className = 'event-call-btn btn-call';
          btn.textContent = 'Call';
        } else {
          item.classList.add('called');
          btn.className = 'event-call-btn btn-undo';
          btn.textContent = 'Undo';
        }
      }

      updateCalledCount();
    }

    /* ── Filter events ───────────────────── */
    function setCat(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.cat === cat);
      });
      filterEvents();
    }

    function filterEvents() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('.event-card').forEach(item => {
        const text = item.dataset.text;
        const cat = item.dataset.cat;
        const matchSearch = !search || text.includes(search);
        const matchCat = currentCat === 'all' || cat === currentCat;
        item.style.display = (matchSearch && matchCat) ? '' : 'none';
      });
    }

    function updateCalledCount() {
      const count = calledEvents.size;
      document.getElementById('calledCount').textContent = count;
      document.getElementById('calledCountFooter').textContent = count;
    }

    /* ── Copy helpers ────────────────────── */
    function copyCode() {
      navigator.clipboard.writeText(gameCode).then(() => {
        flashBtn('copyCodeBtn', 'Copied!');
      }).catch(() => {});
    }

    function copyLink() {
      const base = window.location.href.replace(/host\.html.*/, 'index.html');
      const link = base + '?code=' + gameCode;
      navigator.clipboard.writeText(link).then(() => {
        flashBtn('copyLinkBtn', 'Copied!');
      }).catch(() => {});
    }

    function flashBtn(id, text) {
      const btn = document.getElementById(id);
      const orig = btn.textContent;
      btn.textContent = text;
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    }

    /* ── End game ────────────────────────── */
    async function endGame() {
      if (calledEvents.size === 0) {
        if (!confirm('No events have been called. End the game anyway?')) return;
      } else {
        if (!confirm('End the game and calculate results?')) return;
      }

      if (playerPollTimer) clearInterval(playerPollTimer);
      clearHostCode();

      let players = [];

      if (useApi) {
        try {
          const res = await fetch('/api/bingo/end', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: gameCode })
          });
          if (res.ok) {
            const data = await res.json();
            players = data.players || [];
          }
        } catch { /* fall through to local */ }
      }

      if (!useApi || players.length === 0) {
        const raw = localStorage.getItem('bingo_game_' + gameCode);
        if (raw) {
          const game = JSON.parse(raw);
          game.status = 'ended';
          localStorage.setItem('bingo_game_' + gameCode, JSON.stringify(game));
          players = game.players || [];
        }
      }

      const results = players.map(p => {
        /* A player may hold several cards now, and wildcard stamps count
           as marks — the host's verification must see exactly what the
           player's page scores, or every close call becomes a dispute.
           The player is worth their BEST card; the badge column says how
           they got there so "3 bingos (2 cards, 1 stamp)" reads honestly. */
        const cards = (Array.isArray(p.cards) && p.cards.length) ? p.cards : [p.cardIds];
        const wilds = Array.isArray(p.wildcards) ? p.wildcards : [];
        let best = { bingos: -1, marked: 0 };
        cards.forEach((ids, ci) => {
          const wildIds = new Set(wilds.filter(w => w.cardIndex === ci).map(w => w.eventId));
          const cardEvents = ids.map(id => id === 0 ? 'free' : id);
          const m = cardEvents.filter(id => id === 'free' || calledEvents.has(id) || wildIds.has(id));
          const bingos = countBingos(cardEvents, wildIds);
          if (bingos > best.bingos || (bingos === best.bingos && m.length > best.marked)) {
            best = { bingos, marked: m.length };
          }
        });
        /* The id comes through so a prize can be awarded to a player rather
           than to a display name, which two people can share. */
        return { id: p.id, name: p.name, bingos: best.bingos, marked: best.marked,
                 cardCount: cards.length, wildcardsUsed: wilds.length };
      });

      results.sort((a, b) => b.bingos - a.bingos || b.marked - a.marked);
      showResults(results);
    }

    function countBingos(cardEvents, wildIds) {
      const w = wildIds || new Set();
      const m = cardEvents.map(id => id === 'free' || calledEvents.has(id) || w.has(id));
      let count = 0;

      for (let r = 0; r < 5; r++) {
        if ([0,1,2,3,4].every(c => m[r*5+c])) count++;
      }
      for (let c = 0; c < 5; c++) {
        if ([0,1,2,3,4].every(r => m[r*5+c])) count++;
      }
      if ([0,6,12,18,24].every(i => m[i])) count++;
      if ([4,8,12,16,20].every(i => m[i])) count++;
      if ([0,4,20,24].every(i => m[i])) count++;
      if (m.every(Boolean)) count++;

      return count;
    }

    function showResults(results) {
      document.getElementById('resultsSub').textContent =
        calledEvents.size + ' events called · ' + results.length + ' players';

      const body = document.getElementById('lbBody');

      if (results.length === 0) {
        body.innerHTML = '<div class="no-players">No players joined this game.</div>';
      } else {
        body.innerHTML = results.map((r, i) =>
          '<div class="lb-row">' +
          '<div class="lb-rank">' + (i + 1) + '</div>' +
          '<div class="lb-name">' + escHtml(r.name) +
            ((r.cardCount > 1 || r.wildcardsUsed > 0)
              ? ' <span style="font-size:9px;color:#ffffff88">(' +
                (r.cardCount > 1 ? r.cardCount + ' cards' : '') +
                (r.cardCount > 1 && r.wildcardsUsed > 0 ? ' · ' : '') +
                (r.wildcardsUsed > 0 ? r.wildcardsUsed + ' stamp' + (r.wildcardsUsed > 1 ? 's' : '') : '') +
                ')</span>'
              : '') + '</div>' +
          '<div class="lb-bingos">' + r.bingos + '</div>' +
          '<div class="lb-marked">' + r.marked + '/25</div>' +
          awardControl(r) +
          '</div>'
        ).join('');
        wireAwards();
      }

      showScreen('resultsScreen');
    }

    function awardControl(r) {
      /* Only players with an account can be credited. A guest record from
         before login was required has nothing to pay into. */
      if (!r.id || !String(r.id).startsWith('u_')) {
        return '<div class="lb-award"><span class="lb-award-na">no account</span></div>';
      }
      const opts = RARITIES.map(t =>
        '<option value="' + t.id + '">' + t.label + ' · ' + t.entries + '</option>').join('');
      return '<div class="lb-award">' +
        '<select class="lb-award-tier" data-id="' + escAttr(r.id) + '">' + opts + '</select>' +
        '<button class="lb-award-btn" data-id="' + escAttr(r.id) + '" data-name="' + escAttr(r.name) + '">Award</button>' +
        '</div>';
    }

    function wireAwards() {
      document.querySelectorAll('.lb-award-btn').forEach(btn => {
        btn.addEventListener('click', () => awardPrize(btn));
      });
    }

    async function awardPrize(btn) {
      const id = btn.dataset.id;
      const row = btn.closest('.lb-award');
      const rarity = row.querySelector('.lb-award-tier').value;
      const tier = RARITIES.find(t => t.id === rarity);

      if (!window.confirm('Award ' + btn.dataset.name + ' a ' + tier.label +
                          ' prize (' + tier.entries + ' giveaway entries)?')) return;

      btn.disabled = true;
      btn.textContent = 'Awarding...';
      try {
        const res = await fetch('/api/bingo/award', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ code: gameCode, playerId: id, rarity }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not award it.');
        /* Replaced rather than re-enabled: one prize per player per game,
           and a button that comes back inviting a second click is the thing
           the server then has to refuse. */
        row.innerHTML = '<span class="lb-award-done">' + escHtml(tier.label) +
                        ' · +' + data.entries + '</span>';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Award';
        window.alert(err.message);
      }
    }

    function escAttr(str) {
      return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    /* ── Navigation ──────────────────────── */
    function backToCreate() {
      if (playerPollTimer) clearInterval(playerPollTimer);
      clearHostCode();
      showScreen('createScreen');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });

    /* Walk back into a game this browser was hosting, if there is one. */
    resumeGame();
  </script>
</body>
</html>
