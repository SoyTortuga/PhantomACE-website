<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTGBBB</title>
  <script>try{var _pt=function(t){var e=document.documentElement;if(t==="light")e.setAttribute("data-theme","light");else e.removeAttribute("data-theme");};_pt(localStorage.getItem("pham-theme"));addEventListener("storage",function(v){if(v.key==="pham-theme")_pt(v.newValue);});}catch(e){}</script>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/game-identity.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--text-pri);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      user-select: none;
    }

    .screen { display: none; width: 100%; max-width: 560px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    /* ── JOIN SCREEN ─────────────────────── */
    .game-title { font-family: var(--font-display); font-size: 28px; color: var(--red); text-align: center; margin-bottom: 4px; letter-spacing: 0.02em; }
    .game-subtitle {
      font-size: 15px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em;
      margin-bottom: 32px; text-align: center;
    }

    .join-form { width: 100%; max-width: 300px; display: flex; flex-direction: column; gap: 12px; }

    .join-input {
      width: 100%; padding: 12px 16px; background: var(--gray-mid); border: 1px solid var(--border-mid); border-radius: 4px;
      color: var(--text-pri); font-size: 20px; font-family: inherit; text-align: center; outline: none;
      transition: border-color 0.2s;
    }
    .join-input:focus { border-color: var(--red); }
    .join-input::placeholder { color: #8a8a8a; }
    .join-input.code-input { font-size: 34px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: bold; }

    .join-btn {
      padding: 12px 24px; background: var(--red); color: #fff; border: none; border-radius: 4px;
      font-size: 20px; font-weight: bold; cursor: pointer; transition: background 0.2s; font-family: inherit;
    }
    .join-btn:hover { background: #cc0000; }
    .join-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .join-gate { font-size: 15px; color: var(--text-pri); line-height: 1.6; text-align: center; max-width: 300px; }
    .join-error { font-size: 15px; color: var(--red); text-align: center; min-height: 16px; margin-top: 4px; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    /* ── CARD SCREEN ─────────────────────── */
    .card-header {
      width: 100%; display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 10px; padding: 0 2px; gap: 8px;
    }
    .card-info { font-size: 15px; color: var(--text-pri); line-height: 1.5; }
    .card-info b { color: var(--text-pri); }
    .card-info .set-name { color: var(--red); }

    .rank-badge { text-align: right; font-size: 15px; color: var(--text-pri); }
    .rank-badge .rank-num { color: var(--red); font-size: 28px; font-weight: bold; display: block; line-height: 1; }

    .pack-bar-wrap { width: 100%; margin-bottom: 10px; }
    .pack-bar-label { font-size: 14px;
 text-shadow: none; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 4px; }
    .pack-bar-label span { color: var(--red); }
    .pack-bar { width: 100%; height: 4px; background: var(--gray-mid); border-radius: 2px; overflow: hidden; }
    .pack-bar-fill { height: 100%; background: var(--red); transition: width 0.4s ease; }

    .mtg-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%;
    }

    .mtg-cell {
      aspect-ratio: 5 / 7; background: var(--gray-lo); border: 1px solid var(--border); border-radius: 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      text-align: center; overflow: hidden; position: relative;
      transition: border-color 0.3s, background 0.3s;
    }

    .mtg-cell img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.55;
      transition: opacity 0.3s;
    }

    .mtg-cell .mtg-name {
      position: relative; z-index: 1; font-size: clamp(14px, 1.9vw, 14px); line-height: 1.2;
      color: #fff; padding: 3px; background: rgba(0, 0, 0, 0.55); width: 100%;
      word-break: break-word; hyphens: auto;
    }

    .mtg-cell .mtg-rarity {
      position: absolute; top: 2px; right: 3px; z-index: 1; font-size: 14px;
 text-shadow: none; font-weight: bold;
      color: var(--text-pri); text-transform: uppercase;
    }
    .mtg-cell.mythic .mtg-rarity { color: #ff8800; }

    .mtg-cell.marked { border-color: rgba(255, 0, 0, 0.5); background: rgba(152, 9, 10, 0.15); }
    .mtg-cell.marked img { opacity: 0.85; }

    .mtg-cell.one-away:not(.marked) {
      border-color: rgba(255, 170, 0, 0.5);
      /* filter, not box-shadow — a permanent rule for this project's CSS. */
      filter: drop-shadow(0 0 4px rgba(255, 170, 0, 0.35));
    }

    .mtg-cell.just-marked { animation: cell-flash 0.6s ease-out; }
    .mtg-cell.wild::after {
      content: '°5'; position: absolute; top: 2px; right: 4px;
      font-size: 15px; color: #ffcc44;
    }
    .mtg-cell.wildcard-target { cursor: pointer; border-color: #ffcc4477; }
    .mtg-cell.wildcard-target:hover { border-color: #ffcc44; }
    .card-tabs { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
    .card-tab {
      padding: 5px 14px; background: var(--gray-mid); color: var(--text-pri); cursor: pointer;
      border: 1px solid var(--border-mid); border-radius: 4px; font-size: 15px; font-weight: 700;
    }
    .card-tab.active { border-color: var(--red); color: #ffaaaa; }
    .inv-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0; }
    .inv-btn {
      padding: 6px 12px; background: var(--gray-mid); color: var(--text-pri); cursor: pointer;
      border: 1px solid var(--border-mid); border-radius: 4px; font-size: 15px; font-weight: 700;
    }
    .inv-btn:disabled { opacity: 0.4; cursor: default; }
    .inv-btn.wildcard-active { border-color: #ffcc44; color: #ffcc44; }
    .inv-count { color: #ffaa00; margin-left: 4px; }
    @keyframes cell-flash {
      0% { background: rgba(255, 0, 0, 0.55); }
      100% { background: rgba(152, 9, 10, 0.15); }
    }

    /* ── SCORE BAR ───────────────────────── */
    .score-bar {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding: 10px 14px; background: var(--gray-lo); border: 1px solid var(--border);
      border-radius: 4px; flex-wrap: wrap; gap: 6px;
    }
    .score-item { font-size: 15px; color: var(--text-pri); }
    .score-item span { color: var(--text-pri); font-weight: bold; }
    .score-item.total span { color: var(--red); font-size: 25px; }

    .bingo-alert {
      display: none; width: 100%; text-align: center; padding: 10px; margin-top: 8px;
      font-size: 22px; font-weight: bold; color: var(--red); text-transform: uppercase;
      letter-spacing: 0.12em; animation: bingo-pulse 0.8s ease-in-out infinite;
    }
    .bingo-alert.show { display: block; }
    @keyframes bingo-pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.5; }
    }

    .last-pull { width: 100%; margin-top: 8px; font-size: 15px; color: var(--text-pri); text-align: center; min-height: 14px; }
    .last-pull b { color: var(--text-pri); }

    /* ── CALL YOUR SHOT ──────────────────── */
    .shot-panel {
      width: 100%; margin-top: 10px; padding: 12px; background: var(--gray-lo); border: 1px solid var(--border);
      border-radius: 4px;
    }
    .shot-title { font-size: 14px;
 text-shadow: none; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 8px; }
    .shot-form { display: flex; flex-direction: column; gap: 8px; }
    .shot-form select, .shot-form .form-input {
      width: 100%; padding: 8px 10px; background: var(--gray-mid); border: 1px solid var(--border-mid); border-radius: 3px;
      color: var(--text-pri); font-size: 17px; font-family: inherit; outline: none;
    }
    .shot-check { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--text-pri); cursor: pointer; }
    .shot-submit {
      padding: 8px 16px; background: var(--red); color: #fff; border: none; border-radius: 3px;
      font-size: 15px; font-weight: bold; cursor: pointer; font-family: inherit;
    }
    .shot-submit:hover:not(:disabled) { background: #cc0000; }
    .shot-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .shot-status { font-size: 17px; color: var(--text-pri); }
    .shot-status .tier { color: var(--text-pri); font-weight: bold; text-transform: capitalize; }
    .shot-status.won { color: #6ac46a; }
    .shot-status .code { color: var(--red); font-weight: bold; letter-spacing: 0.05em; }
    .shot-error { font-size: 15px; color: var(--red); min-height: 14px; }

    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    .back-btn {
      padding: 8px 18px; background: transparent; border: 1px solid var(--border-mid); border-radius: 3px;
      color: var(--text-pri); font-size: 15px; cursor: pointer; transition: border-color 0.2s, color 0.2s;
      font-family: inherit;
    }
    .back-btn:hover { border-color: var(--red); color: var(--text-pri); }

    /* ── RESULTS ─────────────────────────── */
    .results-title { font-size: 34px; color: var(--red); margin-bottom: 4px; }
    .results-subtitle { font-size: 17px; color: var(--text-pri); margin-bottom: 24px; }
    .results-card {
      width: 100%; max-width: 400px; padding: 24px; background: var(--gray-lo); border: 1px solid var(--border);
      border-radius: 6px; text-align: center;
    }
    .results-big { font-size: 67px; font-weight: bold; color: var(--red); line-height: 1; }
    .results-label { font-size: 14px;
 text-shadow: none; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 4px; margin-bottom: 20px; }
    .results-breakdown { list-style: none; text-align: left; }
    .results-breakdown li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 17px; color: var(--text-pri); display: flex; justify-content: space-between; }
    .results-breakdown li span:last-child { color: var(--text-pri); font-weight: bold; }
    .results-actions { margin-top: 20px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- ════ JOIN SCREEN ════ -->
  <div class="screen active" id="joinScreen">
    <h1 class="game-title">MTGBBB</h1>
    <p class="game-subtitle">Booster Box Bingo</p>

    <div class="join-form">
      <input class="join-input code-input" id="codeInput" placeholder="CODE" maxlength="6" autocomplete="off">
      <input class="join-input" id="nameInput" placeholder="Display Name" maxlength="30" autocomplete="off">
      <button class="join-btn" id="joinBtn" onclick="joinGame()">Join Game</button>
      <a class="join-btn" id="loginBtn" hidden target="_top" href="/api/auth/twitch">Log In with Twitch</a>
      <p class="join-gate" id="loginGate" hidden>
        MTGBBB needs a Twitch login — the moderator can award giveaway entries
        to a winner, and there is no account to credit a guest.
      </p>
      <div class="join-error" id="joinError"></div>
    </div>
  </div>

  <!-- ════ CARD SCREEN ════ -->
  <div class="screen" id="cardScreen">
    <div class="card-header">
      <div class="card-info">
        <span class="set-name" id="setNameInfo"></span><br>
        Code: <b id="codeInfo"></b>
      </div>
      <div class="rank-badge">
        <span class="rank-num" id="rankNum">—</span>
        of <span id="rankTotal">0</span>
      </div>
    </div>

    <div class="pack-bar-wrap">
      <div class="pack-bar-label">Packs opened: <span id="packLabel">0 / 0</span></div>
      <div class="pack-bar"><div class="pack-bar-fill" id="packBarFill" style="width:0%"></div></div>
    </div>

    <div class="card-tabs" id="cardTabs" hidden></div>
    <div class="mtg-grid" id="mtgGrid"></div>

    <div class="bingo-alert" id="bingoAlert">Bingo!</div>
    <div class="last-pull" id="lastPull"></div>

    <div class="shot-panel" id="shotPanel" hidden></div>

    <div class="score-bar">
      <div class="score-item">Marks: <span id="marksCount">0</span>/25</div>
      <div class="score-item">Treatments: <span id="treatCount">0</span></div>
      <div class="score-item">Lines: <span id="linesCount">0</span></div>
      <div class="score-item total">Points: <span id="pointsCount">0</span></div>
    </div>

    <div class="inv-bar" id="mtgInvBar" hidden>
      <button class="inv-btn" id="mtgWildcardBtn" onclick="toggleWildcard()" disabled>
        Wildcard Stamp <span class="inv-count" id="mtgWildcardCount">0</span>
      </button>
      <button class="inv-btn" id="mtgBonusBtn" onclick="useExtraCard()" disabled>
        Extra Card <span class="inv-count" id="mtgBonusCount">0</span>
      </button>
      <div id="mtgInvError" style="font-size:10px;color:#ff9999;width:100%;text-align:center;"></div>
    </div>

    <div class="card-actions">
      <button class="back-btn" onclick="leaveGame()">Leave</button>
    </div>
  </div>

  <!-- ════ RESULTS SCREEN ════ -->
  <div class="screen" id="resultsScreen">
    <h2 class="results-title">Game Over</h2>
    <p class="results-subtitle" id="resultsSubtitle"></p>

    <div class="results-card">
      <div class="results-big" id="resultsPoints">0</div>
      <div class="results-label">Points</div>
      <ul class="results-breakdown" id="resultsBreakdown"></ul>
    </div>

    <div class="results-actions">
      <button class="back-btn" onclick="backToJoin()">Back</button>
    </div>
  </div>

  <script src="/js/session-read.js"></script>
  <script>
    const phamSession = typeof readPhamSession === 'function' ? readPhamSession() : null;
    let gameCode = null;
    let pollTimer = null;
    let previousLines = 0;
    let previousPulls = 0;

    /* ── Cards & powers ────────────────────────────────────────────────
       The server scores every card the player holds and says which is
       best; this page shows one at a time behind tabs. Wildcard stamps
       and extra cards go through /api/mtgbbb/powers, which takes the item
       and records the effect in the same breath — the pattern Commander
       Bingo had to learn after stamps that evaporated on the next poll. */
    let activeCardIdx = 0;
    let wildcardMode = false;
    let invWild = 0, invBonus = 0, invLoaded = false;

    async function loadItemCounts() {
      try {
        /* The commander-bingo pool on purpose: it is the namespace every
           already-granted pass reward carries, shared by both bingos. */
        const res = await fetch('/api/inventory?game=commander-bingo');
        if (!res.ok) return;
        const items = (await res.json()).items || [];
        invWild = items.filter(i => i.type === 'wildcard').reduce((s, i) => s + (i.quantity || 1), 0);
        invBonus = items.filter(i => i.type === 'bonus-card').reduce((s, i) => s + (i.quantity || 1), 0);
        invLoaded = true;
        renderInvBar();
      } catch {}
    }

    function renderInvBar() {
      const bar = document.getElementById('mtgInvBar');
      if (!invLoaded || (invWild === 0 && invBonus === 0)) { bar.hidden = true; return; }
      bar.hidden = false;
      document.getElementById('mtgWildcardCount').textContent = invWild;
      document.getElementById('mtgBonusCount').textContent = invBonus;
      document.getElementById('mtgWildcardBtn').disabled = invWild === 0;
      document.getElementById('mtgBonusBtn').disabled = invBonus === 0;
    }

    function invError(msg) {
      const el = document.getElementById('mtgInvError');
      el.textContent = msg;
      setTimeout(() => { el.textContent = ''; }, 4000);
    }

    function toggleWildcard() {
      if (invWild === 0 && !wildcardMode) return;
      wildcardMode = !wildcardMode;
      document.getElementById('mtgWildcardBtn').classList.toggle('wildcard-active', wildcardMode);
      document.querySelectorAll('.mtg-cell').forEach(c => {
        c.classList.toggle('wildcard-target', wildcardMode && !c.classList.contains('marked'));
      });
    }

    async function useWildcardOnSquare(i) {
      wildcardMode = false;
      document.getElementById('mtgWildcardBtn').classList.remove('wildcard-active');
      document.querySelectorAll('.mtg-cell.wildcard-target').forEach(c => c.classList.remove('wildcard-target'));
      try {
        const res = await fetch('/api/mtgbbb/powers', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'wildcard', code: gameCode,
                                 cardIndex: activeCardIdx, squareIndex: i }),
        });
        const data = await res.json();
        if (!res.ok) { invError(data.error || 'Could not stamp that square.'); return; }
        invWild = Math.max(0, invWild - 1);
        renderInvBar();
        pollState();      /* the server re-scores; the stamp comes back marked */
      } catch { invError('Could not reach the game.'); }
    }

    async function useExtraCard() {
      try {
        const res = await fetch('/api/mtgbbb/powers', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'extra-card', code: gameCode }),
        });
        const data = await res.json();
        if (!res.ok) { invError(data.error || 'Could not add a card.'); return; }
        invBonus = Math.max(0, invBonus - 1);
        renderInvBar();
        await pollState();
        const you = lastYou;
        if (you && you.cards) setActiveCard(you.cards.length - 1);
      } catch { invError('Could not reach the game.'); }
    }

    let lastYou = null;
    function setActiveCard(i) {
      activeCardIdx = i;
      gridBuilt = false;      /* force a rebuild for the new card's art */
      if (lastYou) { renderCardTabs(lastYou); renderGrid(lastYou); renderCardStats(lastYou); }
    }

    function renderCardTabs(you) {
      const el = document.getElementById('cardTabs');
      const many = you.cards && you.cards.length > 1;
      el.hidden = !many;
      if (!many) return;
      el.innerHTML = you.cards.map((c, i) =>
        '<button class="card-tab' + (i === activeCardIdx ? ' active' : '') + '"' +
        ' onclick="setActiveCard(' + i + ')">Card ' + (i + 1) +
        (c.best ? ' ⭐' : '') + '</button>').join('');
    }

    /* The visible numbers describe the visible card; the rank is always
       the player's best, because that is what the standings pay. */
    function renderCardStats(you) {
      const v = (you.cards && you.cards[activeCardIdx]) || you;
      document.getElementById('marksCount').textContent = v.marks;
      document.getElementById('linesCount').textContent = (v.lines || []).length;
      document.getElementById('pointsCount').textContent = v.points;
      document.getElementById('treatCount').textContent = you.treatments;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const gate = document.getElementById('loginGate');
      const loginBtn = document.getElementById('loginBtn');
      const joinBtn = document.getElementById('joinBtn');
      const nameInput = document.getElementById('nameInput');

      if (phamSession) {
        if (nameInput && !nameInput.value) nameInput.value = phamSession.display_name || '';
        return;
      }
      gate.hidden = false;
      joinBtn.hidden = true;
      nameInput.hidden = true;
      loginBtn.hidden = false;
      loginBtn.href = '/api/auth/twitch?return_to=' +
        encodeURIComponent(window.location.pathname + window.location.search);
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('code')) document.getElementById('codeInput').value = params.get('code').toUpperCase();

    document.getElementById('codeInput').addEventListener('input', function () {
      this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    async function joinGame() {
      const code = document.getElementById('codeInput').value.trim().toUpperCase();
      const name = document.getElementById('nameInput').value.trim();
      const errorEl = document.getElementById('joinError');

      if (!code || code.length < 3) { errorEl.textContent = 'Enter the room code'; shakeEl('codeInput'); return; }
      if (!phamSession) { errorEl.textContent = 'Log in with Twitch to join.'; return; }

      errorEl.textContent = '';
      const btn = document.getElementById('joinBtn');
      btn.disabled = true;
      btn.textContent = 'Joining…';

      try {
        const res = await fetch('/api/mtgbbb/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ code, name }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { errorEl.textContent = data.error || 'Could not join that game.'; return; }

        gameCode = code;
        previousLines = 0;
        previousPulls = 0;
        document.getElementById('codeInfo').textContent = code;
        showScreen('cardScreen');
        await pollState();
        pollTimer = setInterval(pollState, 2000);
        loadItemCounts();
      } catch {
        errorEl.textContent = 'Network error — try again.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Join Game';
      }
    }

    async function pollState() {
      try {
        const res = await fetch('/api/mtgbbb/state?code=' + gameCode, { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        render(data);
        if (data.status === 'ended') {
          clearInterval(pollTimer);
          pollTimer = null;
          showResults(data);
        }
      } catch { /* silent — try again next tick */ }
    }

    function render(data) {
      document.getElementById('setNameInfo').textContent = data.setName || '';
      const pct = data.packCount ? Math.min(100, (data.packsOpened / data.packCount) * 100) : 0;
      document.getElementById('packLabel').textContent = `${data.packsOpened || 0} / ${data.packCount || 0}`;
      document.getElementById('packBarFill').style.width = pct + '%';

      const you = data.you;
      if (!you) return;

      const rank = data.standings.findIndex(p => p.id === you.id) + 1;
      document.getElementById('rankNum').textContent = rank || '—';
      document.getElementById('rankTotal').textContent = data.standings.length;

      lastYou = you;
      if (you.cards && activeCardIdx >= you.cards.length) activeCardIdx = 0;
      renderCardTabs(you);
      renderGrid(you);
      renderCardStats(you);

      if (you.lines.length > previousLines && you.lines.length > 0) {
        const alert = document.getElementById('bingoAlert');
        alert.textContent = you.blackout ? 'Blackout!' : 'Bingo!';
        alert.classList.add('show');
        setTimeout(() => alert.classList.remove('show'), 3000);
      }
      previousLines = you.lines.length;

      if (data.recentPulls && data.recentPulls.length && data.pullCount !== previousPulls) {
        const p = data.recentPulls[0];
        const onCard = you.card.some(c => c.name === p.card);
        document.getElementById('lastPull').innerHTML = onCard
          ? `Just pulled: <b>${escHtml(p.card)}</b> — on your card!`
          : `Just pulled: <b>${escHtml(p.card)}</b>`;
      }
      previousPulls = data.pullCount;

      renderShotPanel(data);
    }

    let shotFormBuilt = false;
    function renderShotPanel(data) {
      const panel = document.getElementById('shotPanel');
      const you = data.you;

      if (!you || data.status !== 'active' || !data.callYourShot || !data.callYourShot.enabled) {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;

      if (you.shot) {
        shotFormBuilt = false; // rebuild the form if the game somehow resets
        const cls = you.shot.resolved ? (you.shot.won ? 'won' : '') : '';
        const line = !you.shot.resolved
          ? `Your shot: <span class="tier">${escHtml(you.shot.tier)}</span> on <b>${escHtml(you.shot.card)}</b> — still in the box.`
          : you.shot.won
            ? `You called it! <span class="tier">${escHtml(you.shot.tier)}</span> on <b>${escHtml(you.shot.card)}</b> — ` +
              (you.shot.code ? `code <span class="code">${escHtml(you.shot.code)}</span>` : 'code coming shortly.')
            : `Your shot on <b>${escHtml(you.shot.card)}</b> did not land this time.`;
        panel.innerHTML = `<div class="shot-title">Call Your Shot</div><div class="shot-status ${cls}">${line}</div>`;
        return;
      }

      if (shotFormBuilt) return; // don't fight the moderator typing into a live form on every poll
      shotFormBuilt = true;

      const mythics = (data.pool || [])
        .filter(c => c.rarity === 'mythic' && !(data.pulledCards || []).includes(c.name))
        .sort((a, b) => a.name < b.name ? -1 : 1);
      const namedTreatments = (data.treatments || []).filter(t => t.id !== 'foil');

      panel.innerHTML = `
        <div class="shot-title">Call Your Shot — press your luck on a mythic</div>
        <div class="shot-form">
          <select id="shotCard">${mythics.map(c => `<option value="${escAttr(c.name)}">${escHtml(c.name)}</option>`).join('')}</select>
          <label class="shot-check"><input type="checkbox" id="shotFoil" onchange="onShotFoilChange()"> + Foil</label>
          <select id="shotTreatment" disabled>
            <option value="">+ a named treatment (rare tier)</option>
            ${namedTreatments.map(t => `<option value="${escAttr(t.id)}">${escHtml(t.label)}</option>`).join('')}
          </select>
          <div class="shot-error" id="shotError"></div>
          <button class="shot-submit" id="shotSubmitBtn" onclick="submitShot()">Call It</button>
        </div>`;
    }

    function onShotFoilChange() {
      const foil = document.getElementById('shotFoil').checked;
      const treatSel = document.getElementById('shotTreatment');
      treatSel.disabled = !foil;
      if (!foil) treatSel.value = '';
    }

    async function submitShot() {
      const card = document.getElementById('shotCard').value;
      const wantsFoil = document.getElementById('shotFoil').checked;
      const treatmentId = wantsFoil ? document.getElementById('shotTreatment').value || null : null;
      const errorEl = document.getElementById('shotError');
      const btn = document.getElementById('shotSubmitBtn');

      if (!card) { errorEl.textContent = 'No mythics left to call — the pool may be fully pulled.'; return; }

      btn.disabled = true;
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/mtgbbb/shot', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
          body: JSON.stringify({ code: gameCode, card, wantsFoil, treatmentId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { errorEl.textContent = data.error || 'Could not call that shot.'; btn.disabled = false; return; }
        shotFormBuilt = false;
        await pollState();
      } catch {
        errorEl.textContent = 'Network error — try again.';
        btn.disabled = false;
      }
    }

    let gridBuilt = false;
    function renderGrid(you) {
      const grid = document.getElementById('mtgGrid');
      /* The ACTIVE card's view. you.card mirrors the best card for older
         readers; the tabs read you.cards, where each entry carries its own
         oneAway and its own wildcard flags. */
      const view = (you.cards && you.cards[activeCardIdx]) ? you.cards[activeCardIdx].card : you.card;
      const oneAway = new Set((you.cards && you.cards[activeCardIdx])
        ? you.cards[activeCardIdx].oneAway : (you.oneAway || []));

      if (!gridBuilt || grid.children.length !== view.length) {
        grid.innerHTML = view.map((c, i) => `
          <div class="mtg-cell" data-index="${i}" onclick="if (wildcardMode) useWildcardOnSquare(${i})">
            ${c.image ? `<img src="${escAttr(c.image)}" alt="" loading="lazy">` : ''}
            <span class="mtg-rarity"></span>
            <span class="mtg-name">${escHtml(c.name)}</span>
          </div>`).join('');
        gridBuilt = true;
      }

      view.forEach((c, i) => {
        const cell = grid.children[i];
        if (!cell) return;
        const wasMarked = cell.classList.contains('marked');
        cell.classList.toggle('mythic', c.rarity === 'mythic');
        const rarityEl = cell.querySelector('.mtg-rarity');
        if (rarityEl) rarityEl.textContent = c.rarity === 'mythic' ? 'M' : c.rarity === 'rare' ? 'R' : '';
        cell.classList.toggle('one-away', oneAway.has(i) && !c.marked);
        cell.classList.toggle('wild', !!c.wild);
        if (c.marked && !wasMarked) {
          cell.classList.add('marked', 'just-marked');
          setTimeout(() => cell.classList.remove('just-marked'), 600);
        } else {
          cell.classList.toggle('marked', c.marked);
        }
      });
    }

    function showResults(data) {
      const you = data.you;
      if (!you) { showScreen('resultsScreen'); return; }

      document.getElementById('resultsPoints').textContent = you.points;
      const rank = data.standings.findIndex(p => p.id === you.id) + 1;
      document.getElementById('resultsSubtitle').textContent =
        `Finished #${rank} of ${data.standings.length}`;

      const b = you.breakdown;
      document.getElementById('resultsBreakdown').innerHTML = [
        ['Marks', b.marks], ['Treatments', b.treatments],
        ['Bingo lines', b.bingo], ['Blackout', b.blackout],
      ].map(([label, val]) => `<li><span>${label}</span><span>${val}</span></li>`).join('');

      showScreen('resultsScreen');
    }

    function leaveGame() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      backToJoin();
    }

    function backToJoin() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = null;
      gridBuilt = false;
      shotFormBuilt = false;
      showScreen('joinScreen');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function shakeEl(id) {
      const el = document.getElementById(id);
      el.style.borderColor = '#ff0000';
      el.style.animation = 'shake 0.3s';
      setTimeout(() => { el.style.animation = ''; el.style.borderColor = ''; }, 300);
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
    function escAttr(str) { return String(str).replace(/"/g, '&quot;'); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });
  </script>
</body>
</html>
