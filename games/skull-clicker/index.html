       touch the main cursed-skull timer, and cannot chain another storm. */
    function spawnCursed(opts) {
      opts = opts || {};
      const storm = !!opts.storm;
      const el = document.createElement('div');
      el.className = 'cursed-skull';
      el.innerHTML = '<img src="/assets/images/skull.png" alt="Cursed skull">';
      el.style.top = (10 + Math.random() * 60) + 'vh';
      /* Drift across the game column, not the whole viewport, so the skull
         stays over the play area instead of the empty margins beside it. */
      const wrap = document.querySelector('.game-wrap');
      const wr = wrap ? wrap.getBoundingClientRect() : { left: 0, right: window.innerWidth };
      el.style.left = (wr.left - 90) + 'px';
      document.body.appendChild(el);
      /* Kick off the drift on the next frame so the transition runs. */
      requestAnimationFrame(() => { el.style.left = (wr.right + 90) + 'px'; });

      /* Storm skulls must not reset the main spawn timer. */
      const reschedule = () => { if (!storm) scheduleCursed(); };

      let done = false;
      const life = setTimeout(() => {
        if (done) return;
        done = true;
        el.classList.add('fade');
        setTimeout(() => el.remove(), 400);
        reschedule();
      }, storm ? 7000 : 13000);

      el.addEventListener('click', () => {
        if (done) return;
        done = true;
        clearTimeout(life);
        popCursed(el, { storm });
        reschedule();
      });

      /* Ever-Watchful (meta): catch the skull automatically a beat after it
         appears, so it is never missed. */
      if (metaHas('auto_cursed')) {
        setTimeout(() => {
          if (done) return;
          done = true;
          clearTimeout(life);
          popCursed(el, { storm });
          reschedule();
        }, 1500);
      }
    }

    function popCursed(el, opts) {
      opts = opts || {};
      cursedPopped++;
      const res = rollCursedOutcome(!opts.storm);
      /* Deathflight aura: a chance the skull also grants a short Blood Rush. */
      if (auraActive('deathflight') && Math.random() < 0.25) {
        addTimedBuff({ id:'rush', name:'Blood Rush ×100', kind:'buff', clickMult:100, durationMs:8000, icon:'🩸', chipClass:'rush' });
        res.msg += ' · Deathflight!';
      }
      /* Fated: a chance the skull also drops a Bone Shard. */
      if (pHas('luckyskull') && Math.random() < 0.12) {
        boneShards += 1;
        res.msg += ' · +1 🦴';
      }
      burstParticles(el);
      showBuffToast(res.msg, res.kind);
      playStinger(res.rarity);
      el.classList.add('popped');
      setTimeout(() => el.remove(), 300);
      checkAchievements();
      render();
      renderBuffs();
    }

    /* ═══════ CURSED-SKULL OUTCOMES ═══════
       A Cookie-Clicker-style spread of golden-cookie effects. Timed effects go
       through the buff framework; the rest pay out instantly. allowStorm is
       false for storm-spawned skulls so a storm cannot chain into another. */
    function rollCursedOutcome(allowStorm) {
      const roll = Math.random();
      if (roll < 0.34) return outFrenzy();
      if (roll < 0.54) return outBloodRush();
      if (roll < 0.74) return outLucky();
      if (roll < 0.86) return outReap();
      if (roll < 0.96) return outBuildingSpecial();
      return allowStorm ? outSkullStorm() : outLucky();
    }

    function outFrenzy() {
      const mult = frenzyMultValue(), dur = 20000 * buffScale();
      addTimedBuff({ id:'frenzy', name:'Frenzy ×' + mult, kind:'buff', cpsMult:mult, durationMs:dur, icon:'🔥', chipClass:'frenzy' });
      return { msg:'FRENZY — ×' + mult + ' production for ' + Math.round(dur / 1000) + 's', kind:'frenzy', rarity:'rare' };
    }
    function outBloodRush() {
      const dur = 13000 * buffScale();
      addTimedBuff({ id:'rush', name:'Blood Rush ×100', kind:'buff', clickMult:100, durationMs:dur, icon:'🩸', chipClass:'rush' });
      return { msg:'BLOOD RUSH — ×100 clicks for ' + Math.round(dur / 1000) + 's', kind:'rush', rarity:'epic' };
    }
    /* Lucky — a capped windfall: 15% of the bank (cap) plus a minute of CpS. */
    function outLucky() {
      const reward = (Math.min(Math.max(skulls * 0.15, getClickPower() * 20), getCPS() * 900) + getCPS() * 60) * windfallMult();
      earn(reward);
      return { msg:'LUCKY — +' + formatNum(reward) + ' skulls', kind:'reap', rarity:'uncommon' };
    }
    /* Reap — the big windfall (scales with the Plunder perk). */
    function outReap() {
      const reap = Math.max(getCPS() * 600, skulls * 0.10, getClickPower() * 100) * reapMult() * windfallMult();
      earn(reap);
      return { msg:'REAP — +' + formatNum(reap) + ' skulls', kind:'reap', rarity:'epic' };
    }
    /* Building Special — an instant payout scaled off one random building you own. */
    function outBuildingSpecial() {
      const ownedB = BUILDINGS.filter(b => owned[b.id] > 0);
      if (!ownedB.length) return outLucky();
      const b = ownedB[Math.floor(Math.random() * ownedB.length)];
      const perSec = b.baseCps * owned[b.id] * getBuildingMult(b) * globalCpsMult *
        getPrestigeMult() * achMult() * perkCpsMult() * metaProdMult() * ghoulMult();
      const reward = Math.max(perSec * (60 + Math.random() * 180), getClickPower() * 50) * windfallMult();
      earn(reward);
      return { msg:b.name + ' SPECIAL — +' + formatNum(reward) + ' skulls', kind:'reap', rarity:'uncommon' };
    }
    /* Skull Storm — a short flurry of extra cursed skulls (CC's Cookie Storm). */
    function outSkullStorm() {
      skullStorm();
      return { msg:'SKULL STORM — catch them all!', kind:'frenzy', rarity:'legendary' };
    }
    function skullStorm() {
      const n = 8 + Math.floor(Math.random() * 7);   // 8–14 skulls over ~5s
      for (let i = 0; i < n; i++) {
        setTimeout(() => spawnCursed({ storm: true }), 300 * i + Math.random() * 250);
      }
    }

    /* ═══════ DEBUFFS (defined, NOT spawned yet) ═══════
       The Skullpocalypse "wrath" skulls will trigger these through the same
       framework. Left unused/gated for now — nothing calls WRATH_DEBUFFS. */
    function outClot() {
      addTimedBuff({ id:'clot', name:'Clot', kind:'debuff', cpsMult:0.5, durationMs:30000, icon:'🩸', chipClass:'debuff' });
      return { msg:'CLOT — production halved for 30s', kind:'reap', rarity:'common' };
    }
    function outRuin() {
      const loss = Math.min(skulls * 0.05, getCPS() * 30);
      skulls = Math.max(0, skulls - loss);
      return { msg:'RUIN — lost ' + formatNum(loss) + ' skulls', kind:'reap', rarity:'common' };
    }
    const WRATH_DEBUFFS = { clot: outClot, ruin: outRuin };   /* used by the future wrath system */

    function showBuffToast(msg, kind) {
      const el = document.createElement('div');
      el.className = 'buff-toast ' + kind;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    /* Standing indicator of every active timed effect (buff or debuff) with a
       live countdown, plus the active-click combo. */
    function renderBuffs() {
      const bar = document.getElementById('buffBar');
      if (!bar) return;
      const now = Date.now();
      let html = '';
      for (const b of activeBuffs) {
        const secs = Math.ceil((b.endsAt - now) / 1000);
        if (secs <= 0) continue;
        html += '<span class="buff-chip ' + b.chipClass + '">' +
          (b.icon ? '<span class="buff-ico">' + b.icon + '</span> ' : '') +
          escSkull(b.name) + ' · ' + secs + 's</span>';
      }
      if (combo > 4 && now - lastClickAt < 1200) {
        html += '<span class="buff-chip combo">Combo ×' + combo + ' · +' + Math.round((comboMult() - 1) * 100) + '%</span>';
      }
      bar.innerHTML = html;
    }

    function expireBuffs() {
      tickTimedBuffs();
      if (combo > 0 && Date.now() - lastClickAt >= 1200) combo = 0;
    }

    /* ═══════ STREAM EVENTS ═══════
       A hype train (or a moderator) can fire a site-wide frenzy: cursed skulls
       come thick and fast for everyone playing. Polled so an OBS-less viewer
       still gets it; cursedFreqMult already reads window.__streamFrenzy. */
    let streamEventUntil = 0;
    async function pollSkullEvent() {
      try {
        const res = await fetch('/api/skull-clicker?event=1', { cache: 'no-store' });
        if (!res.ok) return;
        const d = await res.json();
        const ev = d && d.event;
        const now = Date.now();
        if (ev && ev.until > now) {
          window.__streamFrenzy = true;
          if (ev.until > streamEventUntil + 1000) {   /* a newly-started frenzy */
            streamEventUntil = ev.until;
            showBuffToast('🚂 STREAM FRENZY — cursed skulls incoming!', 'frenzy');
            playSound('cursed');
            spawnCursed();
          } else {
            streamEventUntil = ev.until;
          }
        } else {
          window.__streamFrenzy = false;
        }
      } catch (e) { /* silent — an event is a bonus, never load-bearing */ }
    }

    /* ═══════ RAID REWARD (claim in-game) ═══════
       A raid code is whispered, but the whisper can fail to arrive — so the
       server also stashes it per account and the game surfaces it here, code
       and all. Logged-in only; guests earn no code. */
    async function fetchRaidReward() {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-raid?reward=1', { cache: 'no-store', credentials: 'same-origin' });
        if (!res.ok) return;
        const d = await res.json();
        if (d && d.reward && d.reward.code) renderRewardBanner(d.reward);
      } catch (e) { /* the whisper is still the backup */ }
    }

    function renderRewardBanner(r) {
      const el = document.getElementById('rewardBanner');
      if (!el) return;
      const rar = String(r.rarity || 'uncommon');
      el.className = 'reward-banner rar-' + rar;
      el.hidden = false;
      el.innerHTML =
        '<div class="reward-title">🏆 Raid Reward — ' + (r.top ? 'Top Damage!' : 'Raider') + '</div>' +
        '<div class="reward-sub">You earned a <b>' + rar + '</b> code for ' + escSkull(r.boss || 'the boss') + '</div>' +
        '<div class="reward-code" title="Click to copy" onclick="copyRaidCode(this)">' + escSkull(r.code) + '</div>' +
        '<div class="reward-actions">' +
          '<button class="reward-btn" onclick="copyRaidCode(this)">Copy code</button>' +
          '<a class="reward-btn" href="/redeem.html" target="_blank" rel="noopener">Redeem</a>' +
          '<button class="reward-btn ghost" onclick="dismissRaidReward()">Got it</button>' +
        '</div>';
    }

    async function dismissRaidReward() {
      const el = document.getElementById('rewardBanner');
      if (el) el.hidden = true;
      try {
        await fetch('/api/skull-raid', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'claim-reward' }),
        });
      } catch (e) { /* it will TTL out regardless */ }
    }

    /* Copy the raid code to the clipboard. Reads it from the banner so both the
       code text and the Copy button trigger the same thing; feedback shows on
       the button. execCommand fallback for any context where the async
       Clipboard API is unavailable. */
    function copyRaidCode() {
      const banner = document.getElementById('rewardBanner');
      if (!banner) return;
      const codeEl = banner.querySelector('.reward-code');
      const code = codeEl ? codeEl.textContent.trim() : '';
      if (!code) return;
      const btn = banner.querySelector('.reward-actions .reward-btn');
      const flash = () => {
        if (!btn) return;
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(flash).catch(() => fallbackCopySkull(code, flash));
      } else {
        fallbackCopySkull(code, flash);
      }
    }
    function fallbackCopySkull(text, done) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        if (done) done();
      } catch (e) { /* clipboard blocked — the code is still shown to copy by hand */ }
    }

    /* ═══════ CO-OP RAID BOSS ═══════
       One boss shared by everyone. While it lives, each skull click also
       strikes it (queued and flushed to the server in small batches). Beat
       it and the whole site gets a frenzy (delivered via the event poller). */
    let raidState = null;
    let raidQueue = 0;          /* clicks dealt since the last flush */
    let raidSeenStatus = null;  /* to announce transitions once */

    function raidActive() { return raidState && raidState.status === 'active'; }

    async function pollRaid() {
      try {
        const res = await fetch('/api/skull-raid', { cache: 'no-store', credentials: 'same-origin' });
        if (!res.ok) return;
        applyRaid(await res.json());
      } catch (e) { /* a boss is a bonus, never load-bearing */ }
    }

    function applyRaid(s) {
      const prev = raidSeenStatus;
      raidState = s;
      renderRaidBanner();
      if (s && s.status !== prev) {
        raidSeenStatus = s.status;
        if (s.status === 'defeated' && prev === 'active') {
          showBuffToast('☠️ ' + (s.defeatedBy || 'The chat') + ' felled ' + s.name + '! Frenzy!', 'reap');
          screenShake();
          setTimeout(fetchRaidReward, 1500);   /* your code is minted on the killing blow */
        } else if (s.status === 'expired' && prev === 'active') {
          showBuffToast(s.name + ' escaped into the dark…', 'frenzy');
        } else if (s.status === 'active' && prev !== 'active') {
          showBuffToast('⚔️ ' + s.name + ' rises — click to strike!', 'rush');
          screenShake();
        }
      }
    }

    async function flushRaidDamage() {
      if (!raidActive() || raidQueue <= 0) return;
      const dmg = Math.min(100, raidQueue);
      raidQueue -= dmg;
      const p = getPlayerId();
      const body = { action: 'hit', damage: dmg };
      if (p.guestId) { body.guestId = p.guestId; body.guestName = p.guestName; }
      try {
        const res = await fetch('/api/skull-raid', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        if (res.ok) applyRaid(await res.json());
      } catch (e) { raidQueue += dmg; /* put it back to retry next flush */ }
    }

    function renderRaidBanner() {
      const el = document.getElementById('raidBanner');
      if (!el) return;
      if (!raidState || raidState.status !== 'active') { el.hidden = true; return; }
      const pct = Math.max(0, Math.min(100, (raidState.hp / raidState.maxHp) * 100));
      const secs = Math.max(0, Math.floor((raidState.endsAt - Date.now()) / 1000));
      const top = (raidState.top || []).slice(0, 3).map(t => escSkull(t.name) + ' (' + formatNum(t.dmg) + ')').join(' · ');
      const shielded = raidState.shielded ? ' shielded' : '';
      const mins = (raidState.minions && raidState.minions.hp > 0)
        ? ' <span class="raid-mini-tag">minions!</span>' : '';
      el.hidden = false;
      el.innerHTML =
        '<div class="raid-head">' +
          '<span class="raid-boss-mini' + shielded + '"></span>' +
          '<span class="raid-name">⚔️ ' + escSkull(raidState.name) + mins + '</span>' +
          '<span class="raid-timer">' + formatTime(secs * 1000) + '</span></div>' +
        '<div class="raid-track"><i style="width:' + pct + '%"></i>' +
          '<span class="raid-hp">' + formatNum(raidState.hp) + ' / ' + formatNum(raidState.maxHp) + '</span></div>' +
        (top ? '<div class="raid-top">Top: ' + top + '</div>' : '<div class="raid-top">Click the skull to strike!</div>');
    }

    /* A quick particle burst where a cursed skull was popped (juice). */
    function burstParticles(el) {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const ang = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 50;
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 650);
      }
    }

    /* ═══════ FORMATTING ═══════ */

    function formatNum(n) {
      if (n < 0) return '-' + formatNum(-n);
      if (n < 1000) return Math.floor(n).toLocaleString();
      const units = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
      const tier = Math.min(Math.floor(Math.log10(n) / 3), units.length - 1);
      const scaled = n / Math.pow(10, tier * 3);
      const str = scaled < 10 ? scaled.toFixed(2) : scaled < 100 ? scaled.toFixed(1) : scaled.toFixed(0);
      return str + ' ' + units[tier];
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
      const h = Math.floor(s/3600);
      return h + 'h ' + Math.floor((s%3600)/60) + 'm';
    }

    /* ═══════ RENDER ═══════ */

    function render() {
      document.getElementById('score').textContent = formatNum(Math.floor(skulls));
      document.getElementById('perSec').textContent = formatNum(getCPS()) + ' per second';
      if (activeTab === 'prestige') renderPrestige();
      if (activeTab === 'reaping') renderReaping();
      if (activeTab === 'pet') renderPet();
      if (activeTab === 'buildings') renderBuildings();
      else if (activeTab === 'upgrades') renderUpgrades();
      else if (activeTab === 'feats') renderAchievements();
      else if (activeTab === 'ranks') renderRanks();
      else if (activeTab === 'cosmetics') renderCosmetics();
      else if (activeTab === 'stats') renderStats();
    }

    /* ═══════ RANKS (leaderboards) ═══════ */
    let ranksBoard = 'season';   /* 'season' | 'alltime' */
    let ranksData = { season: null, alltime: null };

    function setRanksBoard(which) { ranksBoard = which; renderRanks(); loadRanks(); }

    function daysLeftInSeason() {
      const now = new Date();
      const end = Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1);
      return Math.max(0, Math.ceil((end - now.getTime()) / 86400000));
    }

    async function loadRanks() {
      try {
        const url = ranksBoard === 'season' ? '/api/skull-clicker?board=season' : '/api/skull-clicker?board=alltime';
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return;
        const d = await res.json();
        ranksData[ranksBoard] = ranksBoard === 'season' ? (Array.isArray(d.entries) ? d.entries : []) : (Array.isArray(d) ? d : []);
        if (activeTab === 'ranks') renderRanks();
      } catch (e) { /* leave whatever we last had */ }
    }

    function renderRanks() {
      const el = document.getElementById('tab-ranks');
      const entries = ranksData[ranksBoard];
      const me = (playerName || '').toLowerCase();

      let head = '<div class="ranks-toggle">' +
        '<button class="ranks-tab ' + (ranksBoard === 'season' ? 'active' : '') + '" onclick="setRanksBoard(\'season\')">This Season</button>' +
        '<button class="ranks-tab ' + (ranksBoard === 'alltime' ? 'active' : '') + '" onclick="setRanksBoard(\'alltime\')">All-Time</button></div>';

      if (ranksBoard === 'season') {
        head += '<div class="ranks-note">Skulls gathered this month · <b>' + daysLeftInSeason() + ' days</b> left · ' +
          '🥇 mythic 🥈 rare 🥉 uncommon codes at season\'s end</div>' +
          '<div class="ranks-you">Your season: <b>' + formatNum(seasonScore()) + '</b></div>';
      } else {
        head += '<div class="ranks-note">Lifetime skulls gathered — never resets.</div>' +
          '<div class="ranks-you">Your lifetime: <b>' + formatNum(Math.floor(lifetimeSkulls)) + '</b></div>';
      }

      let rows;
      if (entries === null) {
        rows = '<div class="ranks-empty">Loading…</div>';
      } else if (!entries.length) {
        rows = '<div class="ranks-empty">No one has ranked yet. Be the first.</div>';
      } else {
        rows = entries.map((e, i) => {
          const mine = (e.name || '').toLowerCase() === me && me;
          const pb = e.prestige > 0 ? ' <span class="rank-prestige">P' + e.prestige + '</span>' : '';
          /* Ascension count beside the prestige badge — only when > 0, and safe
             for older entries that have no ascensions field (treated as 0). */
          const ab = (e.ascensions || 0) > 0 ? ' <span class="rank-ascension">A' + e.ascensions + '</span>' : '';
          return '<div class="rank-row ' + (mine ? 'mine' : '') + '">' +
            '<span class="rank-pos ' + (i < 3 ? 'medal' : '') + '">' + (i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1)) + '</span>' +
            '<span class="rank-name">' + escSkull(e.name) + pb + ab + '</span>' +
            '<span class="rank-score">' + formatNum(e.score) + '</span></div>';
        }).join('');
      }
      el.innerHTML = head + '<div class="ranks-list">' + rows + '</div>';
    }

    function escSkull(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    function renderAchievements() {
      const el = document.getElementById('tab-feats');
      const earned = achievements.size, total = ACHIEVEMENTS.length;
      let html = '<div class="feats-head">' + earned + ' / ' + total +
        ' feats · <b>+' + earned + '%</b> to all production</div><div class="feats-grid">';
      for (const a of ACHIEVEMENTS) {
        const got = achievements.has(a.id);
        html += '<div class="feat ' + (got ? 'got' : 'locked') + '">' +
          '<div class="feat-name">' + a.name + '</div>' +
          '<div class="feat-desc">' + (got ? a.desc : '???') + '</div></div>';
      }
      el.innerHTML = html + '</div>';
    }

    function renderSettings() {
      const b = document.getElementById('soundBtn');
      if (b) b.textContent = soundOn ? '🔊' : '🔇';
    }

    /* ═══════ THE WORLD ═══════
       Cookie-Clicker-style: every building you own is drawn here and the
       crowd fills up as you buy more, capped so a band never overflows —
       past the cap the count keeps climbing on the label. Rebuilt only on
       buy, load and prestige (never in the tick loop), so it stays cheap.
       Positions are seeded off (band, index) so a rebuild lands every sprite
       exactly where it was — no flicker — and only the just-bought one pops. */
    const WORLD_CAP = 18;
    let lastBought = null;

    function wRand(s) { const x = Math.sin(s) * 43758.5453; return x - Math.floor(x); }

    function renderWorld() {
      const ground = document.getElementById('worldGround');
      const empty = document.getElementById('worldEmpty');
      if (!ground) return;
      let html = '';
      let any = false;
      for (let bi = 0; bi < BUILDINGS.length; bi++) {
        const b = BUILDINGS[bi];
        const cnt = owned[b.id] || 0;
        if (cnt <= 0) continue;
        any = true;
        const n = Math.min(cnt, WORLD_CAP);
        const step = WORLD_CAP > 1 ? 86 / (WORLD_CAP - 1) : 0;
        let sprites = '';
        for (let i = 0; i < n; i++) {
          const left = 3 + i * step;
          const jx = (wRand(bi * 31.7 + i * 2.3) - 0.5) * 3;
          const jy = wRand(bi * 17.1 + i * 5.9) * 9;
          const sc = 0.82 + wRand(bi * 11.3 + i * 3.1) * 0.34;
          const fresh = (lastBought === b.id && i === n - 1) ? ' fresh' : '';
          sprites += '<img class="world-sprite' + fresh + '" src="assets/buildings/' + b.id +
            '.png" alt="" onerror="this.remove()" style="left:calc(' + left.toFixed(2) + '% + ' +
            jx.toFixed(1) + 'px);bottom:' + (4 + jy).toFixed(1) + 'px;transform:scale(' +
            sc.toFixed(2) + ');z-index:' + i + '">';
        }
        const label = b.name + ' ×' + (cnt >= 1000 ? formatNum(cnt) : cnt);
        html += '<div class="world-band">' + sprites +
          '<span class="world-band-label">' + label + '</span></div>';
      }
      ground.innerHTML = html;
      empty.style.display = any ? 'none' : 'flex';
      lastBought = null;
      renderMiasma();
    }

    /* Size the Miasma pool from the meter (cheap; called on buy/load/prestige
       and whenever a feat is earned — never per frame). Flavor deepens at feat
       milestones, all within the black/grey/red palette. */
    function renderMiasma() {
      const pool = document.getElementById('miasmaPool');
      if (!pool) return;
      const m = Math.min(1, miasma());                 /* 0..1 for the visual */
      pool.style.height = (m > 0 ? (8 + m * 72) : 0) + '%';
      pool.style.opacity = (m > 0 ? (0.25 + m * 0.7) : 0).toFixed(2);
      const n = achievements.size;
      const flavor = n >= 22 ? 'flavor-void' : n >= 14 ? 'flavor-ash' : n >= 7 ? 'flavor-crimson' : '';
      pool.className = 'miasma-pool ' + flavor;
    }

    function bloomTimerText() {
      const ready = readyBlooms();
      if (ready > 0) return ready + ' bloom' + (ready === 1 ? '' : 's') + ' ready to harvest';
      return 'Next bloom ripens in ' + formatTime(nextBloomInMs());
    }

    function renderBuildings() {
      const el = document.getElementById('tab-buildings');
      const ready = readyBlooms();
      const bloomPanel = `<div class="bloom-panel">
        <img class="bloom-ico" src="${BLOOM_ICON}" alt="" onerror="this.style.display='none'">
        <div class="bloom-info">
          <div class="bloom-count"><b id="bloomCount">${formatNum(graveBlooms)}</b> Grave Bloom${graveBlooms === 1 ? '' : 's'} · spend to level buildings</div>
          <div class="bloom-timer" id="bloomTimer">${bloomTimerText()}</div>
        </div>
        <button class="bloom-harvest" id="bloomHarvest" ${ready > 0 ? '' : 'disabled'} onclick="harvestBlooms()">${ready > 0 ? 'Harvest ' + ready : 'Ripening'}</button>
      </div>`;

      const amounts = [1, 10, 100, 'max'];
      let html = bloomPanel + '<div class="buy-toggle">' + amounts.map(a =>
        `<button class="buy-amt ${buyAmount === a ? 'active' : ''}" onclick="setBuyAmount(${a === 'max' ? "'max'" : a})">${a === 'max' ? 'Max' : '×' + a}</button>`
      ).join('') + '</div>';
      let rows = '';
      for (const b of BUILDINGS) {
        const cnt = owned[b.id];
        const revealed = totalSkulls >= b.baseCost * 0.5 || cnt > 0;
        if (!revealed) continue;
        const qty = buyAmount === 'max' ? Math.max(1, maxAffordable(b)) : buyAmount;
        const cost = getBulkCost(b, qty);
        const can = buyAmount === 'max' ? maxAffordable(b) >= 1 : skulls >= cost;
        const cps = (b.baseCps * cnt * getBuildingMult(b) * buildingLevelMult(b.id) * globalCpsMult);
        const qtyBadge = buyAmount === 1 ? '' : ` <span class="buy-qty">×${qty}</span>`;
        const lvl = buildingLevel(b.id);
        const lvlCost = bloomLevelCost(b.id);
        const canLvl = graveBlooms >= lvlCost;
        /* Level control appears once you own the building; clicking it spends
           blooms, not skulls, and never triggers the row's buy (stopPropagation). */
        const levelCtl = cnt > 0
          ? `<div class="bldg-level ${canLvl ? 'can' : ''}" onclick="levelBuilding('${b.id}', event)" title="Spend Grave Blooms to level this building (+${Math.round(BLOOM_LEVEL_BONUS * 100)}% output)">
               <span class="bldg-lv">Lv ${lvl}</span>
               <span class="bldg-lvcost">${lvlCost}<img class="bloom-mini" src="${BLOOM_ICON}" alt="" onerror="this.style.display='none'"></span>
             </div>`
          : '';
        rows += `<div class="building-row ${can ? 'affordable' : ''}" onclick="buyBuilding('${b.id}', event)">
          <div class="building-icon"><img src="assets/buildings/${b.id}.png" alt="" onerror="this.remove()">${cnt > 0 ? `<span class="building-count">${cnt}</span>` : ''}</div>
          <div class="building-info">
            <div class="building-name">${b.name}${lvl > 0 ? ` <span class="bldg-lv-tag">Lv ${lvl}</span>` : ''}</div>
            <div class="building-desc">${b.desc}</div>
            ${cnt > 0 ? `<div class="building-cps">${formatNum(cps)}/s total</div>` : ''}
          </div>
          <div class="building-right">
            <div class="building-cost">${formatNum(cost)}${qtyBadge}</div>
            ${levelCtl}
          </div>
        </div>`;
      }
      el.innerHTML = html + (rows || '<div style="text-align:center;color:#333;padding:20px;font-size:12px;text-shadow:none">Keep clicking to unlock buildings!</div>');
    }

    /* Live-update the bloom panel's timer/count/harvest button in place (no row
       rebuild, so scrolling is never interrupted). Cheap; runs once a second. */
    function updateBloomTimer() {
      const t = document.getElementById('bloomTimer');
      if (!t) return;   /* buildings tab not showing */
      t.textContent = bloomTimerText();
      const ready = readyBlooms();
      const btn = document.getElementById('bloomHarvest');
      if (btn) { btn.disabled = ready <= 0; btn.textContent = ready > 0 ? 'Harvest ' + ready : 'Ripening'; }
      const c = document.getElementById('bloomCount');
      if (c) c.textContent = formatNum(graveBlooms);
    }
    setInterval(updateBloomTimer, 1000);

    function renderUpgrades() {
      const el = document.getElementById('tab-upgrades');
      let html = '';

      /* Synergy first when any are in reach — they are the interesting, deep
         buys, so surface them rather than burying them under the flat list. */
      const synViz = SYNERGY.filter(u => boughtUpgrades.has(u.id) || (owned[u.building] || 0) >= Math.ceil(u.req / 2));
      if (synViz.length) {
        html += '<div class="section-label">Synergy</div>';
        for (const u of synViz) html += synergyRow(u);
      }

      html += '<div class="section-label">Click Power</div>';
      for (const u of UPGRADES.filter(u => u.tag === 'click')) html += upgradeRow(u);
      html += '<div class="section-label">CPS Multipliers</div>';
      for (const u of UPGRADES.filter(u => u.tag === 'mult')) html += upgradeRow(u);

      /* Ghouls — feed on the Miasma. Reveal each once it is roughly in reach (or
         already owned) so early runs are not flooded with far-off buys. */
      const ghoulViz = GHOULS.filter(g => boughtGhouls.has(g.id) || totalSkulls >= g.cost * 0.3);
      if (ghoulViz.length) {
        const mp = Math.round(miasma() * 100);
        const gm = Math.round((ghoulMult() - 1) * 100);
        html += '<div class="section-label">Ghouls — they feed on the Miasma</div>';
        html += '<div class="feats-head">Miasma <b>' + mp + '%</b> · your ghouls give <b>+' + gm + '%</b> production</div>';
        for (const g of ghoulViz) html += ghoulRow(g);
      }

      el.innerHTML = html;
    }

    function ghoulRow(g) {
      const bought = boughtGhouls.has(g.id);
      const can = skulls >= g.cost;
      return `<div class="upgrade-row ${bought ? 'bought' : can ? 'affordable' : ''}" onclick="${bought ? '' : `buyGhoul('${g.id}', event)`}">
        <div class="building-info">
          <div class="building-name">${g.name} <span class="upgrade-tag tag-ghoul">ghoul</span></div>
          <div class="building-desc">${g.desc} <span class="perk-now">(+${(g.factor * 100).toFixed(0)}% at full miasma)</span></div>
        </div>
        <div class="building-right"><div class="building-cost">${bought ? 'Owned' : formatNum(g.cost)}</div></div>
      </div>`;
    }

    function synergyRow(u) {
      const bought = boughtUpgrades.has(u.id);
      const have = owned[u.building] || 0;
      const unlocked = have >= u.req;
      const can = unlocked && skulls >= u.cost;
      const state = bought ? 'bought' : can ? 'affordable' : unlocked ? '' : 'locked';
      const right = bought ? 'Owned' : unlocked ? formatNum(u.cost) : ('Needs ' + u.req);
      return `<div class="upgrade-row ${state}" onclick="${bought || !unlocked ? '' : `buySynergy('${u.id}', event)`}">
        <div class="building-info">
          <div class="building-name">${u.name} <span class="upgrade-tag tag-syn">synergy</span></div>
          <div class="building-desc">${u.desc}</div>
        </div>
        <div class="building-right"><div class="building-cost">${right}</div></div>
      </div>`;
    }

    function upgradeRow(u) {
      const bought = boughtUpgrades.has(u.id);
      const can = skulls >= u.cost;
      const tagClass = u.tag === 'click' ? 'tag-click' : u.tag === 'cps' ? 'tag-cps' : 'tag-mult';
      return `<div class="upgrade-row ${bought ? 'bought' : can ? 'affordable' : ''}" onclick="${bought ? '' : `buyUpgrade('${u.id}', event)`}">
        <div class="building-info">
          <div class="building-name">${u.name} <span class="upgrade-tag ${tagClass}">${u.tag}</span></div>
          <div class="building-desc">${u.desc}</div>
        </div>
        <div class="building-right">
          <div class="building-cost">${bought ? 'Owned' : formatNum(u.cost)}</div>
        </div>
      </div>`;
    }

    function renderStats() {
      const cps = getCPS();
      const cp = getClickPower();
      const elapsed = Date.now() - startTime;
      let bldgTotal = 0;
      let bldgBreakdown = '';
      for (const b of BUILDINGS) {
        if (owned[b.id] > 0) {
          const c = b.baseCps * owned[b.id] * globalCpsMult;
          bldgTotal += owned[b.id];
          bldgBreakdown += `<div class="stat-row"><span class="stat-label">${b.name}</span><span class="stat-val">x${owned[b.id]} (${formatNum(c)}/s)</span></div>`;
        }
      }
      document.getElementById('tab-stats').innerHTML = `
        <div class="section-label">Overview</div>
        <div class="stat-row"><span class="stat-label">Total skulls earned</span><span class="stat-val">${formatNum(totalSkulls)}</span></div>
        <div class="stat-row"><span class="stat-label">Current skulls</span><span class="stat-val">${formatNum(skulls)}</span></div>
        <div class="stat-row"><span class="stat-label">Total clicks</span><span class="stat-val">${totalClicks.toLocaleString()}</span></div>
        <div class="stat-row"><span class="stat-label">Time played</span><span class="stat-val">${formatTime(elapsed)}</span></div>
        <div class="stat-row"><span class="stat-label">Prestige tier</span><span class="stat-val">${prestige}</span></div>
        <div class="stat-row"><span class="stat-label">Highest prestige</span><span class="stat-val">${highestPrestige}</span></div>
        <div class="stat-row"><span class="stat-label">Ascensions</span><span class="stat-val">${ascensions}</span></div>
        <div class="stat-row"><span class="stat-label">Epitaphs</span><span class="stat-val">${formatNum(epitaphs)}</span></div>
        <div class="stat-row"><span class="stat-label">Grave Blooms</span><span class="stat-val">${formatNum(graveBlooms)}${readyBlooms() > 0 ? ' (+' + readyBlooms() + ' ripe)' : ''}</span></div>
        <div class="stat-row"><span class="stat-label">Building levels</span><span class="stat-val">${BUILDINGS.reduce((s, b) => s + buildingLevel(b.id), 0)}</span></div>
        <div class="stat-row"><span class="stat-label">${PET_NAME}</span><span class="stat-val">Level ${petLevel}${selectedAuras.length ? ' · ' + selectedAuras.length + ' aura' + (selectedAuras.length === 1 ? '' : 's') : ''}</span></div>
        <div class="section-label">Production</div>
        <div class="stat-row"><span class="stat-label">Click power</span><span class="stat-val">${formatNum(cp)}</span></div>
        <div class="stat-row"><span class="stat-label">Per second</span><span class="stat-val">${formatNum(cps)}</span></div>
        <div class="stat-row"><span class="stat-label">CPS multiplier</span><span class="stat-val">x${globalCpsMult}</span></div>
        <div class="stat-row"><span class="stat-label">Miasma</span><span class="stat-val">${Math.round(miasma() * 100)}%</span></div>
        <div class="stat-row"><span class="stat-label">Ghoul bonus</span><span class="stat-val">+${Math.round((ghoulMult() - 1) * 100)}% (${boughtGhouls.size}/${GHOULS.length} ghouls)</span></div>
        <div class="stat-row"><span class="stat-label">Buildings owned</span><span class="stat-val">${bldgTotal}</span></div>
        <div class="stat-row"><span class="stat-label">Upgrades bought</span><span class="stat-val">${boughtUpgrades.size}/${UPGRADES.length}</span></div>
        ${bldgBreakdown ? '<div class="section-label">Buildings Breakdown</div>' + bldgBreakdown : ''}
        <div style="margin-top:20px;text-align:center">
          <button style="background:#1a0000;border:1px solid #330000;color:#ff4444;padding:8px 20px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;text-shadow:none" onclick="hardReset()">Reset All Progress</button>
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      const tabs = ['buildings','upgrades','prestige','reaping','pet','feats','ranks','cosmetics','stats'];
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        const on = tabs[i] === tab;
        btn.classList.toggle('active', on);
        if (on && btn.scrollIntoView) btn.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      });
      document.querySelectorAll('.tab-content').forEach((el, i) => {
        el.classList.toggle('active', tabs[i] === tab);
      });
      render();
      if (tab === 'ranks') loadRanks();
    }

    /* ═══════ GAME LOOP ═══════ */

    let tickCount = 0;
    function tick() {
      const now = Date.now();
      const dt = (now - lastTick) / 1000;
      lastTick = now;
      expireBuffs();
      const earned = getCPS() * dt;
      if (earned > 0) {
        earn(earned);
        checkMilestones();
      }
      document.getElementById('score').textContent = formatNum(Math.floor(skulls));
      document.getElementById('perSec').textContent = formatNum(getCPS()) + ' per second';
      renderBuffs();

      /* Passive feats (skulls/buildings) caught about once a second — cheap,
         and no need to check 10×/s. */
      if (++tickCount % 10 === 0) checkAchievements();

      if (now - lastSave > 30000) {
        save();
        lastSave = now;
      }
    }

    setInterval(tick, 100);

    /* ═══════ AUTOMATION (Reaping meta unlocks) ═══════
       Each loop is a cheap no-op until its meta node is unlocked. Fast loop
       for the auto-click feel; a slower loop for the bookkeeping actions so
       buying/prestiging never floods the render or the network. */
    function autoClickTick() {
      if (!metaHas('auto_click')) return;
      let power = getClickPower();
      if (Math.random() < critChance()) power *= critMult();
      earn(power);
      totalClicks++;
      if (raidActive()) raidQueue++;
    }
    setInterval(autoClickTick, 200);

    /* Buy the cheapest affordable building; returns whether anything was bought. */
    function buyCheapestAffordable() {
      let best = null, bestCost = Infinity;
      for (const b of BUILDINGS) {
        const c = getBuildingCost(b);
        if (c <= skulls && c < bestCost) { best = b; bestCost = c; }
      }
      if (!best) return false;
      skulls -= bestCost;
      owned[best.id] += 1;
      lastBought = best.id;
      return true;
    }

    function autoManageTick() {
      let touched = false;
      if (metaHas('auto_buy')) {
        /* A few per second so it feels alive without a per-frame loop. */
        for (let i = 0; i < 5 && buyCheapestAffordable(); i++) touched = true;
      }
      if (metaHas('auto_prestige') && canPrestige()) { doPrestige(true); touched = true; }
      if (touched) {
        checkAchievements();
        if (activeTab === 'buildings') renderBuildings();
        renderWorld();
      }
    }
    setInterval(autoManageTick, 1000);

    /* ═══════ CHANNEL POINT BOOST ═══════ */

    function checkSkullBoost() {
      if (cpBoostExpires > 0 && Date.now() >= cpBoostExpires) {
        cpBoostMult = 1;
        cpBoostExpires = 0;
        const el = document.getElementById('boostBanner');
        if (el) el.remove();
        render();
      }
      fetch('/api/channel-points?action=skull-boost', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.active) return;
          cpBoostMult = d.multiplier || 2;
          cpBoostExpires = d.expiresAt || 0;
          var el = document.getElementById('boostBanner');
          if (!el) {
            el = document.createElement('div');
            el.id = 'boostBanner';
            el.className = 'boost-banner';
            document.querySelector('.game-wrap').prepend(el);
          }
          var secs = Math.max(0, Math.ceil((cpBoostExpires - Date.now()) / 1000));
          el.textContent = 'SKULL BOOST x' + cpBoostMult + ' — ' + secs + 's remaining';
          render();
        })
        .catch(function () {});
    }
    setInterval(checkSkullBoost, 15000);

    /* ═══════ PRESTIGE ═══════ */

    /* The bar to reset rises each tier: 1,000,000 this run for the first
       prestige, ten times as much for each after. Steep on purpose — a
       prestige should be earned, and the multiplier it grants is forever. */
    function prestigeRequirement() { return 1e6 * Math.pow(10, prestige) * prestigeCostMult(); }
    function canPrestige() { return totalSkulls >= prestigeRequirement(); }

    /* Free buildings a fresh run starts with — from the Headstart/Standing
       Legion perks AND the permanent Grave Inheritance meta node. Called by
       both a prestige and a reap so the two stay in step. */
    function applyStartBonuses() {
      if (pHas('headstart')) { owned.shard += 10; owned.ghost += 5; }
      const legion = pLvl('t_start');
      if (legion > 0) { ['shard', 'ghost', 'crypt', 'altar', 'army'].forEach(id => { owned[id] += legion; }); }
      const inherit = metaLvl('m_start');
      if (inherit > 0) { BUILDINGS.forEach(b => { owned[b.id] += inherit; }); }
    }

    /* Wipe the RUN (not the meta): skulls, buildings, base+synergy upgrades and
       run milestones. Lifetime, prestige, shards, feats, cosmetics and every
       Reaping stat are left alone by design. */
    function resetRun() {
      skulls = 0;
      totalSkulls = 0;
      clickBonus = 0;
      clickMulti = 1;
      cpsClickPct = 0;
      globalCpsMult = 1;
      owned = {};
      BUILDINGS.forEach(b => owned[b.id] = 0);
      boughtUpgrades = new Set();
      boughtGhouls = new Set();      /* Ghouls are re-bought each run, like base upgrades */
      hitMilestones = new Set();
      startTime = Date.now();
    }

    function doPrestige(silent) {
      if (!canPrestige()) return;
      const nextMult = 1 + 0.1 * (prestige + 1);
      const gained = pendingShards();
      if (!silent && !confirm('Prestige to tier ' + (prestige + 1) + '? This resets this run — skulls, ' +
                   'buildings and upgrades — but grants a permanent ' + nextMult.toFixed(1) +
                   'x to everything, forever' + (gained > 0 ? ', and ' + gained + ' Bone Shard' + (gained === 1 ? '' : 's') + ' to spend in the shop' : '') +
                   '. Your lifetime total and rank are kept.')) return;

      /* Legacy perk keeps the base upgrades; capture them before the wipe. */
      const keptUpgrades = perks.has('legacy')
        ? [...boughtUpgrades].filter(id => UPGRADES.some(u => u.id === id)) : [];

      prestige += 1;
      if (prestige > highestPrestige) highestPrestige = prestige;
      boneShards += gained;

      resetRun();

      /* Legacy: restore the kept upgrades and re-apply their baked effects
         (clickMulti/globalCpsMult were just reset). */
      for (const id of keptUpgrades) {
        const u = UPGRADES.find(x => x.id === id);
        if (u) { boughtUpgrades.add(id); if (u.apply) u.apply(); }
      }
      applyStartBonuses();

      if (!silent) {
        const el = document.createElement('div');
        el.className = 'milestone';
        el.innerHTML = '<h3>PRESTIGE ' + prestige + '</h3><p>' + getPrestigeMult().toFixed(1) + 'x forever</p>';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }

      /* Auto-prestige (silent) leans on the 30s autosave rather than hammering
         the server every time the bar refills. */
      if (!silent) save();
      render();
      renderWorld();
    }

    /* ═══════ THE REAPING (ascension) ═══════
       The one meta-reset. Converts the whole prestige climb — tier, Bone
       Shards, the entire shard shop — into Epitaphs, then wipes it so it can be
       re-climbed with the permanent meta-tree behind you. Lifetime skulls,
       feats, cosmetics and the meta-tree itself are kept, so no maxed player is
       wiped and the leaderboard (lifetime) is untouched. */
    function doAscend() {
      if (!canAscend()) return;
      const gained = pendingEpitaphs();
      if (!confirm('Reap for Ascension ' + (ascensions + 1) + '?\n\n' +
                   'This RESETS your prestige tier (' + prestige + '), your Bone Shards and the entire ' +
                   'Bone Shard shop — converting them into ' + gained + ' Epitaph' + (gained === 1 ? '' : 's') + ' to spend ' +
                   'in The Reaping. Your lifetime skulls, feats, cosmetics and everything you already own in ' +
                   'The Reaping are KEPT. This cannot be undone.')) return;

      ascensions += 1;
      epitaphs += gained;

      /* Meta-reset: drop the prestige layer entirely. */
      prestige = 0;
      boneShards = 0;
      perks = new Set();
      perkLevels = {};

      resetRun();
      applyStartBonuses();

      const el = document.createElement('div');
      el.className = 'milestone';
      el.innerHTML = '<h3>THE REAPING ' + ascensions + '</h3><p>+' + gained + ' Epitaph' + (gained === 1 ? '' : 's') + '</p>';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
      screenShake();
      playSound('feat');

      checkAchievements();   /* grant "The First Reaping" the instant it happens */
      save();
      render();
      renderWorld();
    }

    function buyMeta(id) {
      const m = metaDef(id);
      if (!m || metaMaxed(m)) return;
      if (m.req && !metaHas(m.req)) return;
      const cost = metaCost(m);
      if (epitaphs < cost) return;
      epitaphs -= cost;
      if (m.type === 'endless') metaLevels[id] = metaLvl(id) + 1;
      else metaPerks.add(id);
      playSound('feat');
      save();
      render();
      renderWorld();
    }

    function buyPerk(id) {
      const p = perkDef(id);
      if (!p || perkMaxed(p)) return;
      if (p.req && !pHas(p.req)) return;
      const cost = perkCost(p);
      if (boneShards < cost) return;
      boneShards -= cost;
      if (p.type === 'tiered') perkLevels[id] = pLvl(id) + 1;
      else perks.add(id);
      playSound('feat');
      save();
      render();
      renderWorld();
    }

    /* The running total a tiered perk is currently giving, for its row. */
    function perkNowLabel(p) {
      const lv = pLvl(p.id), pct = Math.round(p.per * lv * 100);
      switch (p.id) {
        case 't_critdmg': return '×' + critMult().toFixed(1) + ' crit dmg';
        case 't_frenzy':  return '×' + frenzyMultValue() + ' frenzy';
        case 't_cost':    return pct + '% cheaper';
        case 't_start':   return '+' + lv + ' each';
        default:          return '+' + pct + '%';
      }
    }

    function renderPrestige() {
      const mult = getPrestigeMult();
      const req = prestigeRequirement();
      const ready = canPrestige();
      const pct = Math.min(100, (totalSkulls / req) * 100);
      const gained = pendingShards();

      function perkRow(p) {
        const tiered = p.type === 'tiered';
        const maxed = perkMaxed(p);
        const locked = p.req && !pHas(p.req);
        const cost = perkCost(p);
        const can = !maxed && !locked && boneShards >= cost;
        const state = maxed ? 'bought' : can ? 'affordable' : locked ? 'locked' : '';
        const lvlTag = tiered ? ' <span class="perk-lvl">Lv ' + pLvl(p.id) + '/' + p.max + '</span>' : '';
        const right = maxed ? (tiered ? 'Maxed' : 'Owned') : locked ? 'Locked' : '🦴 ' + formatNum(cost);
        return '<div class="upgrade-row ' + state + '" onclick="' + (can ? "buyPerk('" + p.id + "')" : '') + '">' +
          '<div class="building-info"><div class="building-name">' + p.name + lvlTag + '</div>' +
          '<div class="building-desc">' + p.desc + (tiered && pLvl(p.id) > 0 ? ' <span class="perk-now">(now ' + perkNowLabel(p) + ')</span>' : '') + '</div></div>' +
          '<div class="building-right"><div class="building-cost">' + right + '</div></div></div>';
      }

      let shop = '<div class="section-label">Bone Shard Shop — Unlocks</div>' +
        '<div class="shard-balance">🦴 <b>' + formatNum(boneShards) + '</b> Bone Shard' + (boneShards === 1 ? '' : 's') + '</div>';
      for (const p of PERKS) if (p.type !== 'tiered') shop += perkRow(p);
      shop += '<div class="section-label">Bone Shard Shop — Endless Climbs</div>';
      for (const p of PERKS) if (p.type === 'tiered') shop += perkRow(p);

      document.getElementById('tab-prestige').innerHTML =
        '<div class="prestige-panel">' +
          '<div class="prestige-tier">Prestige ' + prestige + '</div>' +
          '<div class="prestige-mult">' + mult.toFixed(1) + 'x to all skull gathering</div>' +
          '<div class="prestige-next">Next tier: ' + (mult + 0.1).toFixed(1) + 'x at ' +
            formatNum(req) + ' skulls this run</div>' +
          '<div class="prestige-bar"><div class="prestige-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="prestige-have">' + formatNum(Math.floor(totalSkulls)) + ' / ' + formatNum(req) + '</div>' +
          '<button class="prestige-btn" ' + (ready ? '' : 'disabled') +
            ' onclick="doPrestige()">' + (ready ? 'Prestige now' : 'Not yet') + '</button>' +
          '<div class="prestige-note">Resets this run. Keeps your lifetime total, rank, the multiplier, and your Bone Shards' +
            (gained > 0 ? '. Prestiging now earns <b style="color:#ff5555">' + gained + '</b> shard' + (gained === 1 ? '' : 's') : '') + '.</div>' +
        '</div>' + shop;
    }

    /* ═══════ THE BOUND REAPER (pet) ═══════ */
    function renderPet() {
      const el = document.getElementById('tab-pet');
      const b = petFeedBuilding();
      const need = petFeedCount();
      const have = owned[b.id] || 0;
      const canFeed = have >= need;
      const slots = auraSlots();

      const slotText = slots === 0
        ? 'Reach level ' + PET_AURA_SLOT_L1 + ' to unlock an aura slot'
        : selectedAuras.length + '/' + slots + ' aura' + (slots === 1 ? '' : 's') + ' active' +
          (slots < 2 ? ' · 2nd slot at level ' + PET_AURA_SLOT_L2 : '');

      let auraHtml = '';
      for (const a of AURAS) {
        const active = auraActive(a.id);
        const locked = slots <= 0;
        const state = active ? 'equipped' : locked ? 'locked' : '';
        auraHtml += '<div class="aura-row ' + state + '" onclick="' + (locked ? '' : "toggleAura('" + a.id + "')") + '">' +
          '<div class="cosmetic-info"><div class="cosmetic-name">' + a.name +
          (active ? ' <span class="aura-on">ACTIVE</span>' : '') + '</div>' +
          '<div class="cosmetic-desc">' + a.desc + '</div></div></div>';
      }

      el.innerHTML =
        '<div class="pet-panel">' +
          '<div class="pet-sprite"></div>' +
          '<div class="pet-name">' + PET_NAME + '</div>' +
          '<div class="pet-level">Level ' + petLevel + '</div>' +
          '<div class="pet-feed-info">Feed: sacrifice <b>' + need + '</b> ' + escSkull(b.name) + (need === 1 ? '' : 's') +
            ' <span class="pet-have">(you have ' + formatNum(have) + ')</span></div>' +
          '<button class="pet-feed-btn" ' + (canFeed ? '' : 'disabled') + ' onclick="feedPet(event)">' +
            (canFeed ? 'Feed the ' + PET_NAME : 'Need ' + need + ' ' + escSkull(b.name)) + '</button>' +
        '</div>' +
        '<div class="section-label">Auras — ' + slotText + '</div>' +
        auraHtml;
    }

    /* The running total an endless meta node is currently giving, for its row. */
    function metaNowLabel(m) {
      const lv = metaLvl(m.id);
      switch (m.id) {
        case 'm_prod':    return '+' + Math.round(0.10 * lv * 100) + '%';
        case 'm_click':   return '+' + Math.round(0.12 * lv * 100) + '%';
        case 'm_epitaph': return '+' + Math.round(0.08 * lv * 100) + '%';
        case 'm_start':   return '+' + lv + ' each';
        case 'm_prcost':  return Math.round((1 - prestigeCostMult()) * 100) + '% cheaper';
        default:          return 'Lv ' + lv;
      }
    }

    function renderReaping() {
      const el = document.getElementById('tab-reaping');
      const ready = canAscend();
      const gained = pendingEpitaphs();

      /* Before the first reap, the tree is a locked promise — but the moment
         someone has ascended once, the tab stays available forever. */
      if (ascensions === 0 && !ready) {
        el.innerHTML =
          '<div class="prestige-panel">' +
            '<div class="reaping-tier">The Reaping</div>' +
            '<div class="reaping-sub">A power beyond prestige.</div>' +
            '<div class="ascend-locked">Reach <b>Prestige ' + ASCEND_MIN_PRESTIGE + '</b> to unlock The Reaping.<br>' +
              'You are at Prestige <b>' + prestige + '</b>.<br><br>' +
              'Reaping trades your whole prestige climb for <b>Epitaphs</b> — a permanent currency ' +
              'that buys an endless meta-tree. Your lifetime skulls and feats are kept.</div>' +
          '</div>';
        return;
      }

      function metaRow(m) {
        const endless = m.type === 'endless';
        const maxed = metaMaxed(m);
        const locked = m.req && !metaHas(m.req);
        const cost = metaCost(m);
        const can = !maxed && !locked && epitaphs >= cost;
        const state = maxed ? 'bought' : can ? 'affordable' : locked ? 'locked' : '';
        const lvlTag = endless
          ? ' <span class="meta-lvl">Lv ' + metaLvl(m.id) + (m.max ? '/' + m.max : '') + '</span>'
          : (metaHas(m.id) ? ' <span class="meta-lvl">on</span>' : '');
        const right = maxed ? (endless ? 'Maxed' : 'Owned') : locked ? 'Locked' : '🪦 ' + formatNum(cost);
        const now = endless && metaLvl(m.id) > 0 ? ' <span class="perk-now">(now ' + metaNowLabel(m) + ')</span>' : '';
        return '<div class="upgrade-row ' + state + '" onclick="' + (can ? "buyMeta('" + m.id + "')" : '') + '">' +
          '<div class="building-info"><div class="building-name">' + m.name + lvlTag + '</div>' +
          '<div class="building-desc">' + m.desc + now + '</div></div>' +
          '<div class="building-right"><div class="building-cost">' + right + '</div></div></div>';
      }

      let tree = '<div class="section-label">The Reaping — Automation</div>';
      for (const m of META) if (m.type !== 'endless') tree += metaRow(m);
      tree += '<div class="section-label">The Reaping — Endless Climbs</div>';
      for (const m of META) if (m.type === 'endless') tree += metaRow(m);

      const summary =
        '<div class="ascend-summary">Meta bonuses: <b>+' + Math.round((metaProdMult() - 1) * 100) + '%</b> production · ' +
        '<b>+' + Math.round((metaClickMult() - 1) * 100) + '%</b> click · ' +
        '<b>+' + Math.round((epitaphGainMult() - 1) * 100) + '%</b> Epitaph gain<br>' +
        'Highest prestige reached: <b>' + highestPrestige + '</b></div>';

      el.innerHTML =
        '<div class="prestige-panel">' +
          '<div class="reaping-tier">Ascension ' + ascensions + '</div>' +
          '<div class="reaping-sub">The Reaping — a permanent power above prestige</div>' +
          summary +
          '<button class="prestige-btn" ' + (ready ? '' : 'disabled') +
            ' onclick="doAscend()">' + (ready ? 'Reap for ' + gained + ' Epitaph' + (gained === 1 ? '' : 's') : 'Reach Prestige ' + ASCEND_MIN_PRESTIGE) + '</button>' +
          '<div class="prestige-note">Resets your prestige tier, Bone Shards and the shard shop into Epitaphs. ' +
            'Keeps lifetime skulls, feats, cosmetics, and everything in The Reaping.' +
            (ready ? '' : ' You are at Prestige ' + prestige + '.') + '</div>' +
        '</div>' +
        '<div class="shard-balance">🪦 <b>' + formatNum(epitaphs) + '</b> Epitaph' + (epitaphs === 1 ? '' : 's') + '</div>' +
        tree;
    }

    /* ═══════ SAVE / LOAD ═══════ */

    const SAVE_VERSION = 6;

    function migrateSave(d) {
      if (typeof d.version !== 'number') d.version = 1;
      if (d.skulls === undefined) d.skulls = 0;
      if (d.totalSkulls === undefined) d.totalSkulls = 0;
      if (d.totalClicks === undefined) d.totalClicks = 0;
      if (d.clickBonus === undefined) d.clickBonus = 0;
      if (d.clickMulti === undefined) d.clickMulti = 1;
      if (d.cpsClickPct === undefined) d.cpsClickPct = 0;
      if (d.globalCpsMult === undefined) d.globalCpsMult = 1;
      if (!d.owned) d.owned = {};
      BUILDINGS.forEach(b => { if (!(b.id in d.owned)) d.owned[b.id] = 0; });
      if (!d.boughtUpgrades) d.boughtUpgrades = [];
      /* v4 — Ghouls (the miasma servants). Bought with skulls, reset each run;
         a v3 save simply loads with none owned. */
      if (!d.boughtGhouls) d.boughtGhouls = [];
      if (!d.hitMilestones) d.hitMilestones = [];
      if (!d.perks) d.perks = [];
      if (!d.perkLevels || typeof d.perkLevels !== 'object') d.perkLevels = {};
      if (!d.achievements) d.achievements = [];
      if (d.boneShards === undefined) d.boneShards = 0;
      if (d.cursedPopped === undefined) d.cursedPopped = 0;
      /* v3 — The Reaping. All default to nothing, so a v2 save (any maxed
         player) loads with the meta-layer at zero and NOTHING wiped. */
      if (d.ascensions === undefined) d.ascensions = 0;
      if (d.epitaphs === undefined) d.epitaphs = 0;
      if (!d.metaLevels || typeof d.metaLevels !== 'object') d.metaLevels = {};
      if (!d.metaPerks) d.metaPerks = [];
      /* Seed highest-prestige from the current tier so history is never lost. */
      if (d.highestPrestige === undefined) d.highestPrestige = d.prestige || 0;
      if (d.highestPrestige < (d.prestige || 0)) d.highestPrestige = d.prestige || 0;
      /* v5 — Grave Bloom (permanent meta layer). A v4 save loads with 0 blooms,
         no building levels, and the ripen clock starting now (never crediting a
         backlog from epoch 0). */
      if (d.graveBlooms === undefined) d.graveBlooms = 0;
      if (!d.bloomStart) d.bloomStart = Date.now();
      if (!d.buildingLevels || typeof d.buildingLevels !== 'object') d.buildingLevels = {};
      /* v6 — the Bound Reaper (pet). A v5 save loads at level 0 with no auras. */
      if (d.petLevel === undefined) d.petLevel = 0;
      if (!Array.isArray(d.selectedAuras)) d.selectedAuras = [];
      if (d.seasonBaseline === undefined) d.seasonBaseline = 0;
      if (typeof d.seasonMonth !== 'string') d.seasonMonth = '';
      if (d.startTime === undefined) d.startTime = Date.now();
      if (d.prestige === undefined) d.prestige = 0;
      /* Pre-prestige saves had no lifetime field; their run total IS their
         lifetime so far, so seed it there. Never let it drop below the run
         total on any load. */
      if (d.lifetimeSkulls === undefined) d.lifetimeSkulls = d.totalSkulls || 0;
      if (d.lifetimeSkulls < d.totalSkulls) d.lifetimeSkulls = d.totalSkulls;
      d.version = SAVE_VERSION;
      return d;
    }

    function save() {
      const data = {
        skulls, totalSkulls, lifetimeSkulls, prestige,
        totalClicks, clickBonus, clickMulti,
        cpsClickPct, globalCpsMult, owned, startTime,
        boneShards, cursedPopped, seasonBaseline, seasonMonth,
        ascensions, epitaphs, metaLevels, highestPrestige,
        graveBlooms, bloomStart, buildingLevels,
        petLevel, selectedAuras: [...selectedAuras],
        metaPerks: [...metaPerks],
        boughtUpgrades: [...boughtUpgrades],
        boughtGhouls: [...boughtGhouls],
        hitMilestones: [...hitMilestones],
        perks: [...perks],
        perkLevels,
        achievements: [...achievements],
        savedAt: Date.now(),
        version: SAVE_VERSION
      };
      try {
        localStorage.setItem('sc_save', JSON.stringify(data));
        const msg = document.getElementById('saveMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 1500);
      } catch(e) {}
      submitScore();
      pushSaveToServer(data);
    }

    /* Mirror the save server-side for logged-in players. Best-effort and
       fire-and-forget: local save already succeeded, and the server keeps
       whichever total is higher, so a lost request costs nothing. If the
       server turns out to be ahead (a wipe, or another device), adopt what
       it returns rather than letting this device overwrite it. */
    async function pushSaveToServer(data) {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-clicker', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ action: 'save-state', state: data }),
        });
        if (!res.ok) return;
        const out = await res.json();
        if (out && out.adopted && out.state && serverOutranks(out.state)) {
          applyState(out.state);
          render();
        }
      } catch(e) {}
    }

    /* Apply a save blob (from localStorage OR the server) into the live
       game, then credit offline earnings from its savedAt. One path, so a
       server-restored save behaves exactly like a local one. */
    function applyState(d) {
      d = migrateSave(d);
      skulls = d.skulls;
      totalSkulls = d.totalSkulls;
      totalClicks = d.totalClicks;
      clickBonus = d.clickBonus;
      clickMulti = d.clickMulti;
      cpsClickPct = d.cpsClickPct;
      globalCpsMult = d.globalCpsMult;
      owned = d.owned;
      startTime = d.startTime;
      prestige = d.prestige || 0;
      lifetimeSkulls = d.lifetimeSkulls || 0;
      boneShards = d.boneShards || 0;
      cursedPopped = d.cursedPopped || 0;
      seasonBaseline = d.seasonBaseline || 0;
      seasonMonth = d.seasonMonth || '';
      ascensions = d.ascensions || 0;
      epitaphs = d.epitaphs || 0;
      metaLevels = (d.metaLevels && typeof d.metaLevels === 'object') ? d.metaLevels : {};
      metaPerks = new Set(d.metaPerks || []);
      highestPrestige = d.highestPrestige || 0;
      graveBlooms = d.graveBlooms || 0;
      bloomStart = d.bloomStart || Date.now();
      buildingLevels = (d.buildingLevels && typeof d.buildingLevels === 'object') ? d.buildingLevels : {};
      petLevel = d.petLevel || 0;
      selectedAuras = Array.isArray(d.selectedAuras) ? d.selectedAuras : [];
      boughtUpgrades = new Set(d.boughtUpgrades);
      boughtGhouls = new Set(d.boughtGhouls || []);
      hitMilestones = new Set(d.hitMilestones);
      perks = new Set(d.perks || []);
      perkLevels = (d.perkLevels && typeof d.perkLevels === 'object') ? d.perkLevels : {};
      achievements = new Set(d.achievements || []);

      if (d.savedAt) {
        const away = (Date.now() - d.savedAt) / 1000;
        if (away > 10) {
          const cps = getCPS();
          if (cps > 0) {
            const earned = cps * away * offlineRate();
            earn(earned);
            const banner = document.getElementById('offlineBanner');
            banner.innerHTML = `<div class="offline-banner" onclick="this.remove()">Welcome back! You earned <b>${formatNum(earned)}</b> skulls while away (${formatTime(away * 1000)}). Click to dismiss.</div>`;
          }
        }
      }

      /* Back-grant any state-based feats the loaded save already qualifies for
         (e.g. "The First Reaping" for an ascensions>=1 save) so a load can
         never miss one. */
      checkAchievements();
      renderWorld();
    }

    function load() {
      try {
        const raw = localStorage.getItem('sc_save');
        if (!raw) return;
        applyState(JSON.parse(raw));
      } catch(e) {}
    }

    /* Higher prestige wins; at equal prestige, more lifetime skulls wins.
       IDENTICAL to the server's merge rank — a prestige reset (same
       lifetime, higher tier) must beat the old save so the sync never
       undoes it, and normal progress (more lifetime) still adopts forward. */
    function serverOutranks(server) {
      /* Ascension outranks prestige: a freshly-reaped save (prestige reset to 0,
         same lifetime) must beat a stale non-ascended save, or the sync would
         silently undo the reap. Kept identical to the server's outranks(). */
      const sa = Number(server.ascensions || 0), la = ascensions || 0;
      if (sa !== la) return sa > la;
      const sp = Number(server.prestige || 0), lp = prestige || 0;
      if (sp !== lp) return sp > lp;
      return Number(server.lifetimeSkulls || server.totalSkulls || 0) > lifetimeSkulls;
    }

    /* THE RECOVERY. A logged-in player's save also lives on the server;
       whichever has the higher lifetime total wins. A cleared browser
       (local total 0, or no local save at all) adopts the server's — the
       whole point of this — and a device that played further pushes its
       save up on the next save(). Guests have no server save by design.

       Runs after the local load so the comparison is against real local
       progress, and re-renders once whatever won is in place. */
    async function syncFromServer() {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-clicker', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ action: 'load-state' }),
        });
        if (!res.ok) return;
        const data = await res.json();
        const server = data && data.state;
        if (server && serverOutranks(server)) {
          applyState(server);
          render();
        }
      } catch(e) {}
    }

    function hardReset() {
      if (!confirm('This will permanently erase all progress. Are you sure?')) return;
      localStorage.removeItem('sc_save');
      location.reload();
    }

    /* ═══════ LEADERBOARD ═══════ */

    function getPlayerId() {
      // Shared reader — see js/session-read.js.
      const cookie = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (cookie) {
        try {
          const s = cookie;
          playerName = s.display_name;
          return { userId: s.user_id, displayName: s.display_name };
        } catch(e) {}
      }
      let gid = null;
      try { gid = localStorage.getItem('sc_guestId'); } catch(e) {}
      if (!gid) {
        gid = 'g_' + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem('sc_guestId', gid); } catch(e) {}
      }
      let gname = null;
      try { gname = localStorage.getItem('sc_guestName'); } catch(e) {}
      if (!gname) {
        gname = 'Skull#' + gid.slice(2, 6).toUpperCase();
        try { localStorage.setItem('sc_guestName', gname); } catch(e) {}
      }
      playerName = gname;
      return { guestId: gid, guestName: gname };
    }

    /* Current UTC month, matching the server's monthKeyUTC. */
    function currentMonthKey() {
      const d = new Date();
      return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
    }
    /* Roll the client baseline when the month turns, then report skulls
       gathered this season. */
    function seasonScore() {
      const cur = currentMonthKey();
      if (seasonMonth !== cur) { seasonMonth = cur; seasonBaseline = lifetimeSkulls; }
      return Math.max(0, Math.floor(lifetimeSkulls - seasonBaseline));
    }

    async function submitScore() {
      if (totalSkulls < 100) return;
      const player = getPlayerId();
      try {
        await fetch('/api/skull-clicker', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'submit-score', score: Math.floor(lifetimeSkulls), seasonScore: seasonScore(), prestige, ascensions, ...player })
        });
        fetch('/api/leaderboards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ game: 'skull-clicker', score: Math.floor(lifetimeSkulls) }),
        }).catch(function () {});
      } catch(e) {}
    }

    /* ═══════ COSMETICS ═══════ */

    const COSMETIC_DEFS = {
      'skull-skin': { slot: 'skull-theme', icon: '💀', category: 'Skull Themes' },
      'click-effect': { slot: 'click-effect', icon: '✨', category: 'Click Effects' },
      /* 'building-skin' was declared here with no BUILDING_SKINS table to
         draw from, so the category existed and could never hold anything.
         The two rewards that granted building skins now grant skull themes,
         which is why it is gone rather than filled in. */
      'badge-skull': { slot: 'skull-image', icon: '🎖️', category: 'Loyalty Skulls' },
    };

    const SKULL_THEMES = {
      'default': { name: 'Default', desc: 'The classic bone skull', cssClass: '' },
      'blood': { name: 'Blood Skull', desc: 'A crimson-stained skull with dripping aura', cssClass: 'theme-blood' },
      'void': { name: 'Void Skull', desc: 'A skull from beyond the cosmic veil', cssClass: 'theme-void' },
      'chaos': { name: 'Chaos Skull', desc: 'Burning with chaotic energy', cssClass: 'theme-chaos' },
      'eternal': { name: 'Eternal Darkness', desc: 'A mythic skull pulsing with dark power', cssClass: 'theme-eternal' },
    };

    const CLICK_EFFECTS = {
      'default': { name: 'Default', desc: 'Standard white click numbers', cssClass: '' },
      'blood': { name: 'Blood Splash', desc: 'Crimson damage numbers', cssClass: 'click-effect-blood' },
      'void': { name: 'Void Click', desc: 'Purple ethereal numbers', cssClass: 'click-effect-void' },
      'chaos': { name: 'Chaos Strike', desc: 'Fiery orange numbers', cssClass: 'click-effect-chaos' },
      'eternal': { name: 'Eternal Darkness', desc: 'Mythic glowing magenta numbers', cssClass: 'click-effect-eternal' },
    };

    let ownedCosmetics = [];
    let badgeSkulls = [];
    let equippedCosmetics = { 'skull-theme': 'default', 'click-effect': 'default', 'skull-image': 'default' };

    async function loadCosmetics() {
      try {
        const res = await fetch('/api/inventory?game=skull-clicker');
        if (!res.ok) return;
        const data = await res.json();
        ownedCosmetics = data.items || [];
        if (data.equips) {
          if (data.equips['skull-theme']) equippedCosmetics['skull-theme'] = data.equips['skull-theme'];
          if (data.equips['click-effect']) equippedCosmetics['click-effect'] = data.equips['click-effect'];
        }
      } catch {}

      /* LOYALTY SKULLS. A subscriber's Twitch badges are already imported
         into the profile inventory with their artwork, already gated by how
         long they have actually subscribed, and already ranked by rarity.
         Nothing needs granting — the badge someone earned by subscribing
         becomes the skull they click.

         They stay in the profile inventory rather than being copied here:
         equipping under game 'profile' passes the ownership check as it
         stands, and the list grows on its own as their badges do. */
      try {
        const res = await fetch('/api/inventory?game=profile');
        if (res.ok) {
          const prof = await res.json();
          badgeSkulls = (prof.items || [])
            .filter(i => i.type === 'badge' && i.meta && i.meta.imageUrl4x)
            .sort((a, b) => (b.meta.monthThreshold || 0) - (a.meta.monthThreshold || 0));
          if (prof.equips && prof.equips['skull-image']) {
            equippedCosmetics['skull-image'] = prof.equips['skull-image'];
          }
        }
      } catch {}

      applyCosmetics();
    }

    /* The frame and the face are separate things. A theme styles the button
       — border and gradient — and a loyalty skull replaces the image inside
       it, so the two combine rather than competing for one slot. */
    function badgeSkullFor(id) {
      return badgeSkulls.find(b => b.id === id) || null;
    }

    function applyCosmetics() {
      const btn = document.getElementById('skullBtn');
      btn.className = 'skull-btn';
      const themeId = equippedCosmetics['skull-theme'] || 'default';
      const theme = SKULL_THEMES[themeId];
      if (theme && theme.cssClass) btn.classList.add(theme.cssClass);

      const area = document.querySelector('.skull-area');
      area.className = 'skull-area';
      const effectId = equippedCosmetics['click-effect'] || 'default';
      const effect = CLICK_EFFECTS[effectId];
      if (effect && effect.cssClass) area.classList.add(effect.cssClass);

      const img = btn.querySelector('img');
      if (img) {
        if (!img.dataset.defaultSrc) img.dataset.defaultSrc = img.getAttribute('src') || '';
        const badge = badgeSkullFor(equippedCosmetics['skull-image']);
        /* A Twitch badge is 72px at its largest and the skull renders at
           91px, so it upscales by about a quarter. Rendered pixelated
           rather than smoothed, the way Dino Park's sprites and the
           overlay's eggs already are, so the edge reads as deliberate. */
        img.src = badge ? badge.meta.imageUrl4x : img.dataset.defaultSrc;
        img.style.imageRendering = badge ? 'pixelated' : '';
        img.alt = badge ? badge.name : 'Skull';
      }
    }

    async function equipCosmetic(slot, itemId) {
      equippedCosmetics[slot] = itemId;
      applyCosmetics();
      render();
      /* Loyalty skulls belong to the profile inventory, so they equip
         against 'profile'. Sending them as 'skull-clicker' would fail the
         ownership check, which only matches an item within its own game. */
      const ownerGame = slot === 'skull-image' ? 'profile' : 'skull-clicker';
      try {
        await fetch('/api/inventory', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'equip', game: ownerGame, slot, itemId: itemId === 'default' ? 'none' : itemId }),
        });
      } catch {}
    }

    function getCosmeticThemeId(item) {
      const n = (item.name || '').toLowerCase();
      if (n.includes('blood') || n.includes('crimson')) return 'blood';
      if (n.includes('void')) return 'void';
      if (n.includes('chaos')) return 'chaos';
      if (n.includes('eternal') || n.includes('darkness')) return 'eternal';
      return item.id;
    }

    function renderCosmetics() {
      const el = document.getElementById('tab-cosmetics');

      /* Type first. These used to be sorted by matching words in the item's
         name, because every reward arrived as type 'cosmetic' and the name
         was the only thing that distinguished a skull skin from a click
         effect. Rewards now carry the real type; the name test stays as a
         fallback so anything granted under the old scheme still appears. */
      const legacyName = (i, words) =>
        i.type === 'cosmetic' && i.name && words.some(w => i.name.toLowerCase().includes(w));
      const themes = ownedCosmetics.filter(i =>
        i.type === 'skull-skin' || legacyName(i, ['skin', 'skull', 'theme']));
      const effects = ownedCosmetics.filter(i =>
        i.type === 'click-effect' || legacyName(i, ['effect', 'click']));

      let html = '<div class="section-label">Skull Themes</div>';
      html += cosmeticOptionRow('skull-theme', 'default', SKULL_THEMES['default'], 'common');
      for (const item of themes) {
        const tid = getCosmeticThemeId(item);
        const def = SKULL_THEMES[tid] || { name: item.name, desc: item.name };
        html += cosmeticOptionRow('skull-theme', tid, def, item.rarity || 'common');
      }

      html += '<div class="section-label">Click Effects</div>';
      html += cosmeticOptionRow('click-effect', 'default', CLICK_EFFECTS['default'], 'common');
      for (const item of effects) {
        const eid = getCosmeticThemeId(item);
        const def = CLICK_EFFECTS[eid] || { name: item.name, desc: item.name };
        html += cosmeticOptionRow('click-effect', eid, def, item.rarity || 'common');
      }

      if (badgeSkulls.length) {
        html += '<div class="section-label">Loyalty Skulls</div>';
        html += cosmeticOptionRow('skull-image', 'default',
          { name: 'Default', desc: 'The classic bone skull' }, 'common');
        for (const b of badgeSkulls) {
          const months = b.meta.monthThreshold || 0;
          html += cosmeticOptionRow('skull-image', b.id, {
            name: b.name,
            desc: months > 0
              ? `Your ${months}-month subscriber badge, worn as a skull`
              : 'Your subscriber badge, worn as a skull',
            img: b.meta.imageUrl4x,
          }, b.rarity || 'common');
        }
      }

      if (themes.length === 0 && effects.length === 0 && badgeSkulls.length === 0) {
        html += '<div class="cosmetic-empty">No cosmetics unlocked yet.<br>'
          + 'Earn them through Phamily Time rewards, or import your Twitch '
          + 'subscriber badges from your inventory to wear them as skulls.</div>';
      }

      el.innerHTML = html;
    }

    function cosmeticOptionRow(slot, id, def, rarity) {
      const isEquipped = equippedCosmetics[slot] === id;
      return `<div class="cosmetic-row ${isEquipped ? 'equipped' : ''}" onclick="equipCosmetic('${slot}','${id}')">
        <div class="cosmetic-icon">${def.img
          ? `<img src="${def.img}" alt="" style="width:28px;height:28px;image-rendering:pixelated">`
          : (slot === 'click-effect' ? '✨' : '💀')}</div>
        <div class="cosmetic-info">
          <div class="cosmetic-name">${def.name} ${id !== 'default' ? `<span class="cosmetic-badge badge-${rarity}">${rarity}</span>` : ''}</div>
          <div class="cosmetic-desc">${def.desc}</div>
        </div>
        ${isEquipped ? '<span class="cosmetic-equipped-tag">EQUIPPED</span>' : ''}
      </div>`;
    }

    /* ═══════ INIT ═══════ */

    document.getElementById('skullBtn').addEventListener('click', handleClick);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });

    window.addEventListener('beforeunload', save);

    try { const ba = localStorage.getItem('sc_buyAmount'); if (ba) buyAmount = ba === 'max' ? 'max' : (parseInt(ba, 10) || 1); } catch(e) {}
    try { soundOn = localStorage.getItem('sc_sound') === '1'; } catch(e) {}

    load();
    syncFromServer();
    loadCosmetics();
    lastTick = Date.now();
    checkAchievements();
    renderSettings();
    render();
    renderWorld();
    renderBuffs();
    scheduleCursed();
    { const nt = document.getElementById('newsTicker'); if (nt) nt.textContent = pickNews(); }
    setInterval(cycleNews, 11000);
    pollSkullEvent();
    setInterval(pollSkullEvent, 30000);
    pollRaid();
    setInterval(pollRaid, 4000);
    setInterval(flushRaidDamage, 3000);
    fetchRaidReward();
    setInterval(fetchRaidReward, 30000);
  </script>
</body>
</html>
