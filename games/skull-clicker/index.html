<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skull Clicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      user-select: none;
      overflow-x: hidden;
    }

    .game-wrap {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 16px 12px 8px;
      border-bottom: 1px solid #1a1a1a;
    }
    .header h1 { font-size: 22px; color: #ff0000; margin-bottom: 2px; }
    .score-display { font-size: 32px; font-weight: 800; color: #fff; line-height: 1.2; }
    .per-sec { font-size: 11px; color: #fff; margin-top: 2px; }

    /* Skull Button */
    .skull-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      flex-shrink: 0;
    }
    .skull-btn {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #222, #111, #000);
      border: 2px solid #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s, border-color 0.2s, background 0.2s;
      position: relative;
    }
    .skull-btn:hover { border-color: #ff0000; background: radial-gradient(circle at 40% 35%, #331111, #1a0000, #000); }
    .skull-btn:active { transform: scale(0.93); }
    .skull-btn img { width: 65%; height: auto; pointer-events: none; }
    .click-pop {
      position: absolute;
      font-size: 15px; font-weight: 800;
      color: #ff0000;
      pointer-events: none;
      animation: pop-up 0.5s ease-out forwards;
    }
    @keyframes pop-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
    }

    /* The world — accumulating building sprites */
    .world-panel {
      position: relative;
      margin: 0 12px 8px;
      height: 172px;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      background: linear-gradient(#0c0c0c, #050505);
      flex-shrink: 0;
    }
    .world-ground { display: flex; flex-direction: column; min-height: 100%; }
    /* Each building gets a tier the crowd stands on. The gradient reads as
       ground the sprites sit atop rather than a flat list. */
    .world-band {
      position: relative;
      height: 46px;
      border-bottom: 1px solid #121212;
      background: linear-gradient(180deg, transparent 60%, #0e0606 100%);
    }
    .world-band:last-child { border-bottom: none; }
    .world-band-label {
      position: absolute;
      right: 6px; top: 5px;
      z-index: 400;
      font-size: 10px;
      font-weight: 800;
      color: #ff5555;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #2a0d0d;
      border-radius: 3px;
      padding: 0 5px;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    .world-sprite {
      position: absolute;
      bottom: 4px;
      width: 30px;
      height: 30px;
      object-fit: contain;
      image-rendering: pixelated;
      transform-origin: bottom center;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.8));
    }
    /* The one just bought pops in; a rebuild does not replay it because only
       the freshest sprite carries the class. */
    .world-sprite.fresh { animation: sprite-in 0.35s ease-out; }
    @keyframes sprite-in {
      0% { opacity: 0; transform: translateY(-8px) scale(0.5); }
      100% { opacity: 1; }
    }
    .world-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
      color: #333;
      font-size: 12px;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .world-sprite.fresh { animation: none; }
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-family: inherit;
    }
    .tab-btn.active { color: #ff0000; border-bottom-color: #ff0000; }
    .prestige-panel { text-align: center; padding: 20px 16px; }
    .prestige-tier { font-size: 26px; font-weight: 800; color: #ff0000; }
    .prestige-mult { font-size: 15px; color: #fff; margin-top: 4px; }
    .prestige-next { font-size: 12px; color: #ffffff99; margin: 10px 0 8px; }
    .prestige-bar { height: 10px; background: #1a1a1a; border: 1px solid #ffffff28; border-radius: 5px; overflow: hidden; margin: 0 auto; max-width: 320px; }
    .prestige-fill { height: 100%; background: #ff0000; transition: width 0.3s; }
    .prestige-have { font-size: 11px; color: #ffffffaa; margin-top: 6px; }
    .prestige-btn { margin-top: 16px; padding: 10px 22px; background: #ff0000; color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; }
    .prestige-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .prestige-btn:not(:disabled):hover { background: #cc0000; }
    .prestige-note { font-size: 10px; color: #ffffff77; margin-top: 12px; }
    .tab-btn:hover { color: #ff4444; }

    /* Content panels */
    .tab-content { display: none; flex: 1; overflow-y: auto; padding: 8px 12px 80px; }
    .tab-content.active { display: block; }

    /* Building rows */
    .building-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .building-row:hover:not(.locked) { border-color: #ff0000; background: #110000; }
    .building-row.locked { opacity: 0.25; cursor: not-allowed; }
    .building-row.affordable { border-color: #331111; }
    .building-icon {
      position: relative;
      width: 40px; height: 40px;
      border-radius: 4px;
      background: #151515;
      border: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .building-icon img {
      width: 36px; height: 36px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .building-count {
      position: absolute;
      right: -1px; bottom: -1px;
      min-width: 14px;
      padding: 0 3px;
      background: #000;
      border: 1px solid #ff0000;
      border-radius: 3px;
      font-size: 10px;
      line-height: 14px;
      text-align: center;
      color: #ff0000;
      font-weight: 800;
    }
    .building-info { flex: 1; min-width: 0; }
    .building-name { font-size: 13px; font-weight: 600; color: #fff; }
    .building-desc { font-size: 9px; color: #fff; margin-top: 1px; }
    .building-cps { font-size: 9px; color: #444; margin-top: 1px; }
    .building-right { text-align: right; flex-shrink: 0; }
    .building-cost { font-size: 12px; color: #ff0000; font-weight: 600; }
    .building-owned { font-size: 18px; font-weight: 800; color: #333; }

    /* Upgrade rows */
    .upgrade-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upgrade-row:hover:not(.locked):not(.bought) { border-color: #ff0000; background: #110000; }
    .upgrade-row.locked { opacity: 0.25; cursor: not-allowed; }
    .upgrade-row.bought { opacity: 0.4; cursor: default; border-color: #1a1a1a; }
    .upgrade-row.bought .building-cost { color: #0a0; }

    @keyframes reject-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .building-row.reject-shake, .upgrade-row.reject-shake {
      animation: reject-shake 0.35s ease-in-out;
      border-color: #ff0000 !important;
    }
    .upgrade-tag {
      font-size: 8px; font-weight: 700;
      padding: 2px 6px; border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tag-click { background: #220000; color: #ff4444; }
    .tag-cps { background: #001122; color: #4488ff; }
    .tag-mult { background: #112200; color: #88cc44; }

    /* Stats */
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #111;
      font-size: 12px;
    }
    .stat-label { color: #fff; }
    .stat-val { color: #fff; font-weight: 600; }

    /* Milestone popup */
    .milestone {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #111;
      border: 1px solid #ff0000;
      border-radius: 8px;
      padding: 20px 36px;
      text-align: center;
      z-index: 100;
      animation: ms-pop 2s ease-out forwards;
    }
    .milestone h3 { font-size: 16px; color: #ff0000; margin-bottom: 4px; }
    .milestone p { font-size: 11px; color: #fff; }
    @keyframes ms-pop {
      0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
      12% { transform: translate(-50%,-50%) scale(1.1); opacity: 1; }
      22% { transform: translate(-50%,-50%) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
    }

    /* Save indicator */
    .save-msg {
      position: fixed; bottom: 12px; right: 12px;
      font-size: 10px; color: #333;
      opacity: 0; transition: opacity 0.3s;
    }
    .save-msg.show { opacity: 1; }

    /* Offline earnings banner */
    .offline-banner {
      text-align: center;
      padding: 10px;
      background: #0a0a00;
      border: 1px solid #332200;
      border-radius: 4px;
      margin: 8px 12px;
      font-size: 12px;
      color: #ffaa00;
      cursor: pointer;
    }
    .offline-banner:hover { background: #111100; }

    .boost-banner {
      text-align: center;
      padding: 8px 12px;
      background: linear-gradient(90deg, #1a0000, #330000, #1a0000);
      border: 1px solid #ff0000;
      border-radius: 4px;
      margin: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #ff0000;
      animation: boost-pulse 1.5s ease-in-out infinite;
    }
    @keyframes boost-pulse {
      0%, 100% { border-color: #ff0000; background: linear-gradient(90deg, #1a0000, #330000, #1a0000); }
      50% { border-color: #ff8888; background: linear-gradient(90deg, #330000, #660000, #330000); }
    }

    .section-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #333;
      margin: 12px 0 6px;
    }

    /* Cosmetics */
    .cosmetic-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border: 1px solid #1a1a1a; border-radius: 4px;
      margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s;
    }
    .cosmetic-row:hover { border-color: #333; }
    .cosmetic-row.equipped { border-color: #ff0000; background: rgba(255,0,0,0.05); }
    .cosmetic-icon { width: 36px; height: 36px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0; }
    .cosmetic-info { flex: 1; }
    .cosmetic-name { font-size: 12px; font-weight: 600; color: #fff; }
    .cosmetic-desc { font-size: 10px; color: #fff; margin-top: 2px; }
    .cosmetic-badge { font-size: 8px; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 1px 6px; border-radius: 2px; font-weight: 700; }
    .badge-common { background: #1a1a1a; color: #fff; }
    .badge-uncommon { background: #0a1a0a; color: #44bb44; }
    .badge-rare { background: #0a0a1e; color: #4466ee; }
    .badge-mythic { background: #1a0a1a; color: #aa44ff; }
    .cosmetic-equipped-tag { font-size: 9px; color: #ff0000; font-weight: 700; }
    .cosmetic-empty { text-align: center; color: #333; padding: 30px 16px; font-size: 12px; line-height: 1.6; }

    .skull-btn.theme-blood { border-color: #cc0000; border-width: 3px; background: radial-gradient(circle at 40% 35%, #440000, #1a0000, #000); }
    .skull-btn.theme-void { border-color: #6600cc; border-width: 3px; background: radial-gradient(circle at 40% 35%, #2a0044, #150022, #000); }
    .skull-btn.theme-chaos { border-color: #ff6600; border-width: 3px; background: radial-gradient(circle at 40% 35%, #442200, #221100, #000); }
    .skull-btn.theme-eternal { border-color: #aa44ff; border-width: 3px;
      background: radial-gradient(circle at 40% 35%, #33115a, #1a0a2e, #000);
      animation: eternal-pulse 2s ease-in-out infinite; }
    @keyframes eternal-pulse {
      0%, 100% { border-color: #aa44ff; }
      50% { border-color: #ff99ff; }
    }
    .click-effect-blood .click-pop { color: #ff3333 !important; }
    .click-effect-void .click-pop { color: #aa66ff !important; }
    .click-effect-chaos .click-pop { color: #ffaa00 !important; }
    .click-effect-eternal .click-pop { color: #ff00ff !important; text-shadow: 0 0 6px rgba(255,0,255,0.5); }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="header">
      <h1>Skull Clicker</h1>
      <div class="score-display" id="score">0</div>
      <div class="per-sec" id="perSec">0 per second</div>
    </div>

    <div class="skull-area">
      <div class="skull-btn" id="skullBtn">
        <img src="/assets/images/skull.png" alt="Click">
      </div>
    </div>

    <!-- The living world: every building you own appears here and stacks up,
         Cookie-Clicker style, so the screen fills as you go deeper. -->
    <div class="world-panel" id="worldPanel">
      <div class="world-ground" id="worldGround"></div>
      <div class="world-empty" id="worldEmpty">Your dominion is empty. Buy a building to raise it.</div>
    </div>

    <div id="offlineBanner"></div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('buildings')">Buildings</button>
      <button class="tab-btn" onclick="switchTab('upgrades')">Upgrades</button>
      <button class="tab-btn" onclick="switchTab('prestige')">Prestige</button>
      <button class="tab-btn" onclick="switchTab('cosmetics')">Cosmetics</button>
      <button class="tab-btn" onclick="switchTab('stats')">Stats</button>
    </div>

    <div class="tab-content active" id="tab-buildings"></div>
    <div class="tab-content" id="tab-upgrades"></div>
    <div class="tab-content" id="tab-prestige"></div>
    <div class="tab-content" id="tab-cosmetics"></div>
    <div class="tab-content" id="tab-stats"></div>
  </div>

  <div class="save-msg" id="saveMsg">Saved</div>

  <script src="/js/session-read.js"></script>
<script>
    /* ═══════ CONSTANTS ═══════ */

    const BUILDINGS = [
      { id:'shard',     name:'Bone Shard',       baseCost:15,           baseCps:0.1,      desc:'Tiny bone fragments click for you' },
      { id:'ghost',     name:'Ghost Hand',        baseCost:100,          baseCps:1,        desc:'Spectral hands from beyond' },
      { id:'crypt',     name:'Crypt Keeper',      baseCost:1100,         baseCps:8,        desc:'Undead servants guard your hoard' },
      { id:'altar',     name:'Dark Altar',        baseCost:12000,        baseCps:47,       desc:'Blood sacrifices fuel the chaos' },
      { id:'army',      name:'Phantom Army',      baseCost:130000,       baseCps:260,      desc:'Legions of the damned march for you' },
      { id:'necro',     name:'Necropolis',         baseCost:1400000,      baseCps:1400,     desc:'A city of the dead, endlessly producing' },
      { id:'shadow',    name:'Shadow Realm',       baseCost:20000000,     baseCps:7800,     desc:'An entire dimension of darkness' },
      { id:'engine',    name:'Chaos Engine',       baseCost:330000000,    baseCps:44000,    desc:'Reality-bending machine of doom' },
      { id:'portal',    name:'Void Portal',        baseCost:5.1e9,        baseCps:260000,   desc:'Gateway to infinite skull dimensions' },
      { id:'horror',    name:'Eldritch Horror',    baseCost:75e9,         baseCps:1600000,  desc:'Cosmic entity that devours reality' },
      { id:'fracture',  name:'Reality Fracture',   baseCost:1e12,         baseCps:10000000, desc:'The fabric of existence, torn asunder' },
      { id:'darkness',  name:'Eternal Darkness',   baseCost:14e12,        baseCps:65000000, desc:'The end of all light, the birth of skulls' },
      { id:'singularity', name:'Skull Singularity', baseCost:2e14,         baseCps:430000000,  desc:'Collapses matter itself into bone' },
      { id:'oblivion',    name:'Oblivion Maw',      baseCost:3e15,         baseCps:2.9e9,      desc:'Devours whole timelines for their skulls' },
      { id:'apex',        name:'Apex Revenant',     baseCost:5e16,         baseCps:2e10,       desc:'The last thing the universe ever fears' },
    ];

    const UPGRADES = [
      { id:'c1', name:'Iron Fingers',        cost:100,        desc:'+1 click power',      tag:'click',  apply:() => { clickBonus += 1; } },
      { id:'c2', name:'Crimson Touch',       cost:500,        desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c3', name:'Skull Crusher',       cost:5000,       desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c4', name:'Chaos Multiplier',    cost:50000,      desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c5', name:'Digital Devastation', cost:500000,     desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c6', name:'Phantom Strike',      cost:5e6,        desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c7', name:'Void Touch',          cost:50e6,       desc:'+5% of CPS per click',tag:'click',  apply:() => { cpsClickPct += 5; } },
      { id:'c8', name:'Reality Shatter',     cost:500e6,      desc:'+5% of CPS per click',tag:'click',  apply:() => { cpsClickPct += 5; } },
      { id:'m1', name:'Dark Blessing',       cost:1000,       desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m2', name:'Unholy Pact',         cost:100000,     desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m3', name:'Eternal Curse',       cost:10e6,       desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m4', name:'Cosmic Horror',       cost:1e9,        desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m5', name:'Entropy Engine',      cost:100e9,      desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m6', name:'Final Darkness',      cost:10e12,      desc:'x3 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 3; } },
      { id:'c9', name:'Oblivion Grip',       cost:5e9,        desc:'+10% of CPS per click',tag:'click', apply:() => { cpsClickPct += 10; } },
    ];

    const MILESTONES = [100, 1000, 10000, 100000, 1e6, 10e6, 100e6, 1e9, 10e9, 100e9, 1e12, 100e12, 10e15];
    const MS_NAMES = ['Apprentice','Acolyte','Dark Mage','Necromancer','Lich King','Shadow Lord','Void Walker','Chaos Weaver','Reality Bender','Cosmic Terror','Eternal One','Skull God','Bone Absolute'];

    /* ═══════ STATE ═══════ */

    let skulls = 0;
    let totalSkulls = 0;         /* this run — resets on prestige */
    let lifetimeSkulls = 0;      /* every skull ever gathered — never resets */
    let prestige = 0;            /* permanent multiplier tier */
    let totalClicks = 0;
    let clickBonus = 0;
    let clickMulti = 1;
    let cpsClickPct = 0;
    let globalCpsMult = 1;
    let cpBoostMult = 1;
    let cpBoostExpires = 0;
    let owned = {};
    let boughtUpgrades = new Set();
    let hitMilestones = new Set();
    let startTime = Date.now();
    let lastTick = Date.now();
    let lastSave = Date.now();
    let activeTab = 'buildings';
    let playerName = null;

    BUILDINGS.forEach(b => owned[b.id] = 0);

    /* ═══════ COMPUTED ═══════ */

    function getBuildingCost(b) {
      return Math.ceil(b.baseCost * Math.pow(1.15, owned[b.id]));
    }

    /* Prestige is the whole point of a resource-gathering game with no win:
       reset the run for a permanent speed-up, so you gather MORE over time.
       +0.1x per tier — P1 is 1.1x, P2 1.2x — applied to everything that
       produces skulls. */
    function getPrestigeMult() { return 1 + 0.1 * prestige; }

    function getCPS() {
      let cps = 0;
      for (const b of BUILDINGS) {
        cps += b.baseCps * owned[b.id];
      }
      return cps * globalCpsMult * cpBoostMult * getPrestigeMult();
    }

    function getClickPower() {
      return ((1 + clickBonus) * clickMulti) * getPrestigeMult() + (getCPS() * cpsClickPct / 100);
    }

    /* Every skull earned flows through here so the run total and the
       lifetime total can never drift apart — lifetime is the leaderboard
       score and the save-merge key, so it must count every path. */
    function earn(amount) {
      skulls += amount;
      totalSkulls += amount;
      lifetimeSkulls += amount;
    }

    /* ═══════ ACTIONS ═══════ */

    function handleClick(e) {
      const power = getClickPower();
      earn(power);
      totalClicks++;
      spawnPop(e, power);
      checkMilestones();
      render();
    }

    function shakeReject(e) {
      const row = e && e.currentTarget;
      if (!row) return;
      row.classList.remove('reject-shake');
      void row.offsetWidth;
      row.classList.add('reject-shake');
      setTimeout(() => row.classList.remove('reject-shake'), 350);
    }

    function buyBuilding(id, e) {
      const b = BUILDINGS.find(x => x.id === id);
      if (!b) return;
      const cost = getBuildingCost(b);
      if (skulls < cost) { shakeReject(e); return; }
      skulls -= cost;
      owned[b.id]++;
      lastBought = b.id;
      render();
      renderWorld();
    }

    function buyUpgrade(id, e) {
      const u = UPGRADES.find(x => x.id === id);
      if (!u || boughtUpgrades.has(id)) return;
      if (skulls < u.cost) { shakeReject(e); return; }
      skulls -= u.cost;
      boughtUpgrades.add(id);
      u.apply();
      render();
    }

    /* ═══════ POPUPS ═══════ */

    function spawnPop(e, val) {
      const btn = document.getElementById('skullBtn');
      const rect = btn.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'click-pop';
      pop.textContent = `+${formatNum(Math.floor(val))}`;
      pop.style.left = (e.clientX - rect.left) + 'px';
      pop.style.top = (e.clientY - rect.top - 10) + 'px';
      btn.appendChild(pop);
      setTimeout(() => pop.remove(), 500);
    }

    function checkMilestones() {
      for (let i = 0; i < MILESTONES.length; i++) {
        const m = MILESTONES[i];
        if (totalSkulls >= m && !hitMilestones.has(m)) {
          hitMilestones.add(m);
          showMilestone(m, MS_NAMES[i] || 'Unknown');
        }
      }
    }

    function showMilestone(n, title) {
      const el = document.createElement('div');
      el.className = 'milestone';
      el.innerHTML = `<h3>${title}</h3><p>${formatNum(n)} skulls earned</p>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }

    /* ═══════ FORMATTING ═══════ */

    function formatNum(n) {
      if (n < 0) return '-' + formatNum(-n);
      if (n < 1000) return Math.floor(n).toLocaleString();
      const units = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
      const tier = Math.min(Math.floor(Math.log10(n) / 3), units.length - 1);
      const scaled = n / Math.pow(10, tier * 3);
      const str = scaled < 10 ? scaled.toFixed(2) : scaled < 100 ? scaled.toFixed(1) : scaled.toFixed(0);
      return str + ' ' + units[tier];
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
      const h = Math.floor(s/3600);
      return h + 'h ' + Math.floor((s%3600)/60) + 'm';
    }

    /* ═══════ RENDER ═══════ */

    function render() {
      document.getElementById('score').textContent = formatNum(Math.floor(skulls));
      document.getElementById('perSec').textContent = formatNum(getCPS()) + ' per second';
      if (activeTab === 'prestige') renderPrestige();
      if (activeTab === 'buildings') renderBuildings();
      else if (activeTab === 'upgrades') renderUpgrades();
      else if (activeTab === 'cosmetics') renderCosmetics();
      else if (activeTab === 'stats') renderStats();
    }

    /* ═══════ THE WORLD ═══════
       Cookie-Clicker-style: every building you own is drawn here and the
       crowd fills up as you buy more, capped so a band never overflows —
       past the cap the count keeps climbing on the label. Rebuilt only on
       buy, load and prestige (never in the tick loop), so it stays cheap.
       Positions are seeded off (band, index) so a rebuild lands every sprite
       exactly where it was — no flicker — and only the just-bought one pops. */
    const WORLD_CAP = 18;
    let lastBought = null;

    function wRand(s) { const x = Math.sin(s) * 43758.5453; return x - Math.floor(x); }

    function renderWorld() {
      const ground = document.getElementById('worldGround');
      const empty = document.getElementById('worldEmpty');
      if (!ground) return;
      let html = '';
      let any = false;
      for (let bi = 0; bi < BUILDINGS.length; bi++) {
        const b = BUILDINGS[bi];
        const cnt = owned[b.id] || 0;
        if (cnt <= 0) continue;
        any = true;
        const n = Math.min(cnt, WORLD_CAP);
        const step = WORLD_CAP > 1 ? 86 / (WORLD_CAP - 1) : 0;
        let sprites = '';
        for (let i = 0; i < n; i++) {
          const left = 3 + i * step;
          const jx = (wRand(bi * 31.7 + i * 2.3) - 0.5) * 3;
          const jy = wRand(bi * 17.1 + i * 5.9) * 9;
          const sc = 0.82 + wRand(bi * 11.3 + i * 3.1) * 0.34;
          const fresh = (lastBought === b.id && i === n - 1) ? ' fresh' : '';
          sprites += '<img class="world-sprite' + fresh + '" src="assets/buildings/' + b.id +
            '.png" alt="" onerror="this.remove()" style="left:calc(' + left.toFixed(2) + '% + ' +
            jx.toFixed(1) + 'px);bottom:' + (4 + jy).toFixed(1) + 'px;transform:scale(' +
            sc.toFixed(2) + ');z-index:' + i + '">';
        }
        const label = b.name + ' ×' + (cnt >= 1000 ? formatNum(cnt) : cnt);
        html += '<div class="world-band">' + sprites +
          '<span class="world-band-label">' + label + '</span></div>';
      }
      ground.innerHTML = html;
      empty.style.display = any ? 'none' : 'flex';
      lastBought = null;
    }

    function renderBuildings() {
      const el = document.getElementById('tab-buildings');
      let html = '';
      for (const b of BUILDINGS) {
        const cost = getBuildingCost(b);
        const can = skulls >= cost;
        const cnt = owned[b.id];
        const revealed = totalSkulls >= b.baseCost * 0.5 || cnt > 0;
        if (!revealed) continue;
        const cps = (b.baseCps * cnt * globalCpsMult);
        html += `<div class="building-row ${can ? 'affordable' : ''}" onclick="buyBuilding('${b.id}', event)">
          <div class="building-icon"><img src="assets/buildings/${b.id}.png" alt="" onerror="this.remove()">${cnt > 0 ? `<span class="building-count">${cnt}</span>` : ''}</div>
          <div class="building-info">
            <div class="building-name">${b.name}</div>
            <div class="building-desc">${b.desc}</div>
            ${cnt > 0 ? `<div class="building-cps">${formatNum(cps)}/s total</div>` : ''}
          </div>
          <div class="building-right">
            <div class="building-cost">${formatNum(cost)}</div>
          </div>
        </div>`;
      }
      if (!html) html = '<div style="text-align:center;color:#333;padding:20px;font-size:12px">Keep clicking to unlock buildings!</div>';
      el.innerHTML = html;
    }

    function renderUpgrades() {
      const el = document.getElementById('tab-upgrades');
      let html = '<div class="section-label">Click Power</div>';
      for (const u of UPGRADES.filter(u => u.tag === 'click')) {
        html += upgradeRow(u);
      }
      html += '<div class="section-label">CPS Multipliers</div>';
      for (const u of UPGRADES.filter(u => u.tag === 'mult')) {
        html += upgradeRow(u);
      }
      el.innerHTML = html;
    }

    function upgradeRow(u) {
      const bought = boughtUpgrades.has(u.id);
      const can = skulls >= u.cost;
      const tagClass = u.tag === 'click' ? 'tag-click' : u.tag === 'cps' ? 'tag-cps' : 'tag-mult';
      return `<div class="upgrade-row ${bought ? 'bought' : can ? 'affordable' : ''}" onclick="${bought ? '' : `buyUpgrade('${u.id}', event)`}">
        <div class="building-info">
          <div class="building-name">${u.name} <span class="upgrade-tag ${tagClass}">${u.tag}</span></div>
          <div class="building-desc">${u.desc}</div>
        </div>
        <div class="building-right">
          <div class="building-cost">${bought ? 'Owned' : formatNum(u.cost)}</div>
        </div>
      </div>`;
    }

    function renderStats() {
      const cps = getCPS();
      const cp = getClickPower();
      const elapsed = Date.now() - startTime;
      let bldgTotal = 0;
      let bldgBreakdown = '';
      for (const b of BUILDINGS) {
        if (owned[b.id] > 0) {
          const c = b.baseCps * owned[b.id] * globalCpsMult;
          bldgTotal += owned[b.id];
          bldgBreakdown += `<div class="stat-row"><span class="stat-label">${b.name}</span><span class="stat-val">x${owned[b.id]} (${formatNum(c)}/s)</span></div>`;
        }
      }
      document.getElementById('tab-stats').innerHTML = `
        <div class="section-label">Overview</div>
        <div class="stat-row"><span class="stat-label">Total skulls earned</span><span class="stat-val">${formatNum(totalSkulls)}</span></div>
        <div class="stat-row"><span class="stat-label">Current skulls</span><span class="stat-val">${formatNum(skulls)}</span></div>
        <div class="stat-row"><span class="stat-label">Total clicks</span><span class="stat-val">${totalClicks.toLocaleString()}</span></div>
        <div class="stat-row"><span class="stat-label">Time played</span><span class="stat-val">${formatTime(elapsed)}</span></div>
        <div class="section-label">Production</div>
        <div class="stat-row"><span class="stat-label">Click power</span><span class="stat-val">${formatNum(cp)}</span></div>
        <div class="stat-row"><span class="stat-label">Per second</span><span class="stat-val">${formatNum(cps)}</span></div>
        <div class="stat-row"><span class="stat-label">CPS multiplier</span><span class="stat-val">x${globalCpsMult}</span></div>
        <div class="stat-row"><span class="stat-label">Buildings owned</span><span class="stat-val">${bldgTotal}</span></div>
        <div class="stat-row"><span class="stat-label">Upgrades bought</span><span class="stat-val">${boughtUpgrades.size}/${UPGRADES.length}</span></div>
        ${bldgBreakdown ? '<div class="section-label">Buildings Breakdown</div>' + bldgBreakdown : ''}
        <div style="margin-top:20px;text-align:center">
          <button style="background:#1a0000;border:1px solid #330000;color:#ff4444;padding:8px 20px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px" onclick="hardReset()">Reset All Progress</button>
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      const tabs = ['buildings','upgrades','prestige','cosmetics','stats'];
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', tabs[i] === tab);
      });
      document.querySelectorAll('.tab-content').forEach((el, i) => {
        el.classList.toggle('active', tabs[i] === tab);
      });
      render();
    }

    /* ═══════ GAME LOOP ═══════ */

    function tick() {
      const now = Date.now();
      const dt = (now - lastTick) / 1000;
      lastTick = now;
      const earned = getCPS() * dt;
      if (earned > 0) {
        earn(earned);
        checkMilestones();
      }
      document.getElementById('score').textContent = formatNum(Math.floor(skulls));
      document.getElementById('perSec').textContent = formatNum(getCPS()) + ' per second';

      if (now - lastSave > 30000) {
        save();
        lastSave = now;
      }
    }

    setInterval(tick, 100);

    /* ═══════ CHANNEL POINT BOOST ═══════ */

    function checkSkullBoost() {
      if (cpBoostExpires > 0 && Date.now() >= cpBoostExpires) {
        cpBoostMult = 1;
        cpBoostExpires = 0;
        const el = document.getElementById('boostBanner');
        if (el) el.remove();
        render();
      }
      fetch('/api/channel-points?action=skull-boost', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.active) return;
          cpBoostMult = d.multiplier || 2;
          cpBoostExpires = d.expiresAt || 0;
          var el = document.getElementById('boostBanner');
          if (!el) {
            el = document.createElement('div');
            el.id = 'boostBanner';
            el.className = 'boost-banner';
            document.querySelector('.game-area').prepend(el);
          }
          var secs = Math.max(0, Math.ceil((cpBoostExpires - Date.now()) / 1000));
          el.textContent = 'SKULL BOOST x' + cpBoostMult + ' — ' + secs + 's remaining';
          render();
        })
        .catch(function () {});
    }
    setInterval(checkSkullBoost, 15000);

    /* ═══════ PRESTIGE ═══════ */

    /* The bar to reset rises each tier: 1,000,000 this run for the first
       prestige, ten times as much for each after. Steep on purpose — a
       prestige should be earned, and the multiplier it grants is forever. */
    function prestigeRequirement() { return 1e6 * Math.pow(10, prestige); }
    function canPrestige() { return totalSkulls >= prestigeRequirement(); }

    function doPrestige() {
      if (!canPrestige()) return;
      const nextMult = 1 + 0.1 * (prestige + 1);
      if (!confirm('Prestige to tier ' + (prestige + 1) + '? This resets this run — skulls, ' +
                   'buildings and upgrades — but grants a permanent ' + nextMult.toFixed(1) +
                   'x to everything, forever. Your lifetime total and rank are kept.')) return;

      prestige += 1;
      /* Reset the RUN. Lifetime, prestige and cosmetics are untouched — the
         first two are what the leaderboard and the save-merge rank on, so a
         reset can never cost standing or be undone by a sync. */
      skulls = 0;
      totalSkulls = 0;
      clickBonus = 0;
      clickMulti = 1;
      cpsClickPct = 0;
      globalCpsMult = 1;
      owned = {};
      BUILDINGS.forEach(b => owned[b.id] = 0);
      boughtUpgrades = new Set();
      hitMilestones = new Set();
      startTime = Date.now();

      const el = document.createElement('div');
      el.className = 'milestone';
      el.innerHTML = '<h3>PRESTIGE ' + prestige + '</h3><p>' + getPrestigeMult().toFixed(1) + 'x forever</p>';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);

      save();
      render();
      renderWorld();
    }

    function renderPrestige() {
      const mult = getPrestigeMult();
      const req = prestigeRequirement();
      const ready = canPrestige();
      const pct = Math.min(100, (totalSkulls / req) * 100);
      document.getElementById('tab-prestige').innerHTML =
        '<div class="prestige-panel">' +
          '<div class="prestige-tier">Prestige ' + prestige + '</div>' +
          '<div class="prestige-mult">' + mult.toFixed(1) + 'x to all skull gathering</div>' +
          '<div class="prestige-next">Next tier: ' + (mult + 0.1).toFixed(1) + 'x at ' +
            formatNum(req) + ' skulls this run</div>' +
          '<div class="prestige-bar"><div class="prestige-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="prestige-have">' + formatNum(Math.floor(totalSkulls)) + ' / ' + formatNum(req) + '</div>' +
          '<button class="prestige-btn" ' + (ready ? '' : 'disabled') +
            ' onclick="doPrestige()">' + (ready ? 'Prestige now' : 'Not yet') + '</button>' +
          '<div class="prestige-note">Resets this run. Keeps your lifetime total, rank, and the multiplier — forever.</div>' +
        '</div>';
    }

    /* ═══════ SAVE / LOAD ═══════ */

    const SAVE_VERSION = 2;

    function migrateSave(d) {
      if (typeof d.version !== 'number') d.version = 1;
      if (d.skulls === undefined) d.skulls = 0;
      if (d.totalSkulls === undefined) d.totalSkulls = 0;
      if (d.totalClicks === undefined) d.totalClicks = 0;
      if (d.clickBonus === undefined) d.clickBonus = 0;
      if (d.clickMulti === undefined) d.clickMulti = 1;
      if (d.cpsClickPct === undefined) d.cpsClickPct = 0;
      if (d.globalCpsMult === undefined) d.globalCpsMult = 1;
      if (!d.owned) d.owned = {};
      BUILDINGS.forEach(b => { if (!(b.id in d.owned)) d.owned[b.id] = 0; });
      if (!d.boughtUpgrades) d.boughtUpgrades = [];
      if (!d.hitMilestones) d.hitMilestones = [];
      if (d.startTime === undefined) d.startTime = Date.now();
      if (d.prestige === undefined) d.prestige = 0;
      /* Pre-prestige saves had no lifetime field; their run total IS their
         lifetime so far, so seed it there. Never let it drop below the run
         total on any load. */
      if (d.lifetimeSkulls === undefined) d.lifetimeSkulls = d.totalSkulls || 0;
      if (d.lifetimeSkulls < d.totalSkulls) d.lifetimeSkulls = d.totalSkulls;
      d.version = SAVE_VERSION;
      return d;
    }

    function save() {
      const data = {
        skulls, totalSkulls, lifetimeSkulls, prestige,
        totalClicks, clickBonus, clickMulti,
        cpsClickPct, globalCpsMult, owned, startTime,
        boughtUpgrades: [...boughtUpgrades],
        hitMilestones: [...hitMilestones],
        savedAt: Date.now(),
        version: SAVE_VERSION
      };
      try {
        localStorage.setItem('sc_save', JSON.stringify(data));
        const msg = document.getElementById('saveMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 1500);
      } catch(e) {}
      submitScore();
      pushSaveToServer(data);
    }

    /* Mirror the save server-side for logged-in players. Best-effort and
       fire-and-forget: local save already succeeded, and the server keeps
       whichever total is higher, so a lost request costs nothing. If the
       server turns out to be ahead (a wipe, or another device), adopt what
       it returns rather than letting this device overwrite it. */
    async function pushSaveToServer(data) {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-clicker', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ action: 'save-state', state: data }),
        });
        if (!res.ok) return;
        const out = await res.json();
        if (out && out.adopted && out.state && serverOutranks(out.state)) {
          applyState(out.state);
          render();
        }
      } catch(e) {}
    }

    /* Apply a save blob (from localStorage OR the server) into the live
       game, then credit offline earnings from its savedAt. One path, so a
       server-restored save behaves exactly like a local one. */
    function applyState(d) {
      d = migrateSave(d);
      skulls = d.skulls;
      totalSkulls = d.totalSkulls;
      totalClicks = d.totalClicks;
      clickBonus = d.clickBonus;
      clickMulti = d.clickMulti;
      cpsClickPct = d.cpsClickPct;
      globalCpsMult = d.globalCpsMult;
      owned = d.owned;
      startTime = d.startTime;
      prestige = d.prestige || 0;
      lifetimeSkulls = d.lifetimeSkulls || 0;
      boughtUpgrades = new Set(d.boughtUpgrades);
      hitMilestones = new Set(d.hitMilestones);

      if (d.savedAt) {
        const away = (Date.now() - d.savedAt) / 1000;
        if (away > 10) {
          const cps = getCPS();
          if (cps > 0) {
            const earned = cps * away * 0.5;
            earn(earned);
            const banner = document.getElementById('offlineBanner');
            banner.innerHTML = `<div class="offline-banner" onclick="this.remove()">Welcome back! You earned <b>${formatNum(earned)}</b> skulls while away (${formatTime(away * 1000)}). Click to dismiss.</div>`;
          }
        }
      }

      renderWorld();
    }

    function load() {
      try {
        const raw = localStorage.getItem('sc_save');
        if (!raw) return;
        applyState(JSON.parse(raw));
      } catch(e) {}
    }

    /* Higher prestige wins; at equal prestige, more lifetime skulls wins.
       IDENTICAL to the server's merge rank — a prestige reset (same
       lifetime, higher tier) must beat the old save so the sync never
       undoes it, and normal progress (more lifetime) still adopts forward. */
    function serverOutranks(server) {
      const sp = Number(server.prestige || 0), lp = prestige || 0;
      if (sp !== lp) return sp > lp;
      return Number(server.lifetimeSkulls || server.totalSkulls || 0) > lifetimeSkulls;
    }

    /* THE RECOVERY. A logged-in player's save also lives on the server;
       whichever has the higher lifetime total wins. A cleared browser
       (local total 0, or no local save at all) adopts the server's — the
       whole point of this — and a device that played further pushes its
       save up on the next save(). Guests have no server save by design.

       Runs after the local load so the comparison is against real local
       progress, and re-renders once whatever won is in place. */
    async function syncFromServer() {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-clicker', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ action: 'load-state' }),
        });
        if (!res.ok) return;
        const data = await res.json();
        const server = data && data.state;
        if (server && serverOutranks(server)) {
          applyState(server);
          render();
        }
      } catch(e) {}
    }

    function hardReset() {
      if (!confirm('This will permanently erase all progress. Are you sure?')) return;
      localStorage.removeItem('sc_save');
      location.reload();
    }

    /* ═══════ LEADERBOARD ═══════ */

    function getPlayerId() {
      // Shared reader — see js/session-read.js.
      const cookie = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (cookie) {
        try {
          const s = cookie;
          playerName = s.display_name;
          return { userId: s.user_id, displayName: s.display_name };
        } catch(e) {}
      }
      let gid = null;
      try { gid = localStorage.getItem('sc_guestId'); } catch(e) {}
      if (!gid) {
        gid = 'g_' + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem('sc_guestId', gid); } catch(e) {}
      }
      let gname = null;
      try { gname = localStorage.getItem('sc_guestName'); } catch(e) {}
      if (!gname) {
        gname = 'Skull#' + gid.slice(2, 6).toUpperCase();
        try { localStorage.setItem('sc_guestName', gname); } catch(e) {}
      }
      playerName = gname;
      return { guestId: gid, guestName: gname };
    }

    async function submitScore() {
      if (totalSkulls < 100) return;
      const player = getPlayerId();
      try {
        await fetch('/api/skull-clicker', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'submit-score', score: Math.floor(lifetimeSkulls), prestige, ...player })
        });
        fetch('/api/leaderboards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ game: 'skull-clicker', score: Math.floor(lifetimeSkulls) }),
        }).catch(function () {});
      } catch(e) {}
    }

    /* ═══════ COSMETICS ═══════ */

    const COSMETIC_DEFS = {
      'skull-skin': { slot: 'skull-theme', icon: '💀', category: 'Skull Themes' },
      'click-effect': { slot: 'click-effect', icon: '✨', category: 'Click Effects' },
      /* 'building-skin' was declared here with no BUILDING_SKINS table to
         draw from, so the category existed and could never hold anything.
         The two rewards that granted building skins now grant skull themes,
         which is why it is gone rather than filled in. */
      'badge-skull': { slot: 'skull-image', icon: '🎖️', category: 'Loyalty Skulls' },
    };

    const SKULL_THEMES = {
      'default': { name: 'Default', desc: 'The classic bone skull', cssClass: '' },
      'blood': { name: 'Blood Skull', desc: 'A crimson-stained skull with dripping aura', cssClass: 'theme-blood' },
      'void': { name: 'Void Skull', desc: 'A skull from beyond the cosmic veil', cssClass: 'theme-void' },
      'chaos': { name: 'Chaos Skull', desc: 'Burning with chaotic energy', cssClass: 'theme-chaos' },
      'eternal': { name: 'Eternal Darkness', desc: 'A mythic skull pulsing with dark power', cssClass: 'theme-eternal' },
    };

    const CLICK_EFFECTS = {
      'default': { name: 'Default', desc: 'Standard white click numbers', cssClass: '' },
      'blood': { name: 'Blood Splash', desc: 'Crimson damage numbers', cssClass: 'click-effect-blood' },
      'void': { name: 'Void Click', desc: 'Purple ethereal numbers', cssClass: 'click-effect-void' },
      'chaos': { name: 'Chaos Strike', desc: 'Fiery orange numbers', cssClass: 'click-effect-chaos' },
      'eternal': { name: 'Eternal Darkness', desc: 'Mythic glowing magenta numbers', cssClass: 'click-effect-eternal' },
    };

    let ownedCosmetics = [];
    let badgeSkulls = [];
    let equippedCosmetics = { 'skull-theme': 'default', 'click-effect': 'default', 'skull-image': 'default' };

    async function loadCosmetics() {
      try {
        const res = await fetch('/api/inventory?game=skull-clicker');
        if (!res.ok) return;
        const data = await res.json();
        ownedCosmetics = data.items || [];
        if (data.equips) {
          if (data.equips['skull-theme']) equippedCosmetics['skull-theme'] = data.equips['skull-theme'];
          if (data.equips['click-effect']) equippedCosmetics['click-effect'] = data.equips['click-effect'];
        }
      } catch {}

      /* LOYALTY SKULLS. A subscriber's Twitch badges are already imported
         into the profile inventory with their artwork, already gated by how
         long they have actually subscribed, and already ranked by rarity.
         Nothing needs granting — the badge someone earned by subscribing
         becomes the skull they click.

         They stay in the profile inventory rather than being copied here:
         equipping under game 'profile' passes the ownership check as it
         stands, and the list grows on its own as their badges do. */
      try {
        const res = await fetch('/api/inventory?game=profile');
        if (res.ok) {
          const prof = await res.json();
          badgeSkulls = (prof.items || [])
            .filter(i => i.type === 'badge' && i.meta && i.meta.imageUrl4x)
            .sort((a, b) => (b.meta.monthThreshold || 0) - (a.meta.monthThreshold || 0));
          if (prof.equips && prof.equips['skull-image']) {
            equippedCosmetics['skull-image'] = prof.equips['skull-image'];
          }
        }
      } catch {}

      applyCosmetics();
    }

    /* The frame and the face are separate things. A theme styles the button
       — border and gradient — and a loyalty skull replaces the image inside
       it, so the two combine rather than competing for one slot. */
    function badgeSkullFor(id) {
      return badgeSkulls.find(b => b.id === id) || null;
    }

    function applyCosmetics() {
      const btn = document.getElementById('skullBtn');
      btn.className = 'skull-btn';
      const themeId = equippedCosmetics['skull-theme'] || 'default';
      const theme = SKULL_THEMES[themeId];
      if (theme && theme.cssClass) btn.classList.add(theme.cssClass);

      const area = document.querySelector('.skull-area');
      area.className = 'skull-area';
      const effectId = equippedCosmetics['click-effect'] || 'default';
      const effect = CLICK_EFFECTS[effectId];
      if (effect && effect.cssClass) area.classList.add(effect.cssClass);

      const img = btn.querySelector('img');
      if (img) {
        if (!img.dataset.defaultSrc) img.dataset.defaultSrc = img.getAttribute('src') || '';
        const badge = badgeSkullFor(equippedCosmetics['skull-image']);
        /* A Twitch badge is 72px at its largest and the skull renders at
           91px, so it upscales by about a quarter. Rendered pixelated
           rather than smoothed, the way Dino Park's sprites and the
           overlay's eggs already are, so the edge reads as deliberate. */
        img.src = badge ? badge.meta.imageUrl4x : img.dataset.defaultSrc;
        img.style.imageRendering = badge ? 'pixelated' : '';
        img.alt = badge ? badge.name : 'Skull';
      }
    }

    async function equipCosmetic(slot, itemId) {
      equippedCosmetics[slot] = itemId;
      applyCosmetics();
      render();
      /* Loyalty skulls belong to the profile inventory, so they equip
         against 'profile'. Sending them as 'skull-clicker' would fail the
         ownership check, which only matches an item within its own game. */
      const ownerGame = slot === 'skull-image' ? 'profile' : 'skull-clicker';
      try {
        await fetch('/api/inventory', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'equip', game: ownerGame, slot, itemId: itemId === 'default' ? 'none' : itemId }),
        });
      } catch {}
    }

    function getCosmeticThemeId(item) {
      const n = (item.name || '').toLowerCase();
      if (n.includes('blood') || n.includes('crimson')) return 'blood';
      if (n.includes('void')) return 'void';
      if (n.includes('chaos')) return 'chaos';
      if (n.includes('eternal') || n.includes('darkness')) return 'eternal';
      return item.id;
    }

    function renderCosmetics() {
      const el = document.getElementById('tab-cosmetics');

      /* Type first. These used to be sorted by matching words in the item's
         name, because every reward arrived as type 'cosmetic' and the name
         was the only thing that distinguished a skull skin from a click
         effect. Rewards now carry the real type; the name test stays as a
         fallback so anything granted under the old scheme still appears. */
      const legacyName = (i, words) =>
        i.type === 'cosmetic' && i.name && words.some(w => i.name.toLowerCase().includes(w));
      const themes = ownedCosmetics.filter(i =>
        i.type === 'skull-skin' || legacyName(i, ['skin', 'skull', 'theme']));
      const effects = ownedCosmetics.filter(i =>
        i.type === 'click-effect' || legacyName(i, ['effect', 'click']));

      let html = '<div class="section-label">Skull Themes</div>';
      html += cosmeticOptionRow('skull-theme', 'default', SKULL_THEMES['default'], 'common');
      for (const item of themes) {
        const tid = getCosmeticThemeId(item);
        const def = SKULL_THEMES[tid] || { name: item.name, desc: item.name };
        html += cosmeticOptionRow('skull-theme', tid, def, item.rarity || 'common');
      }

      html += '<div class="section-label">Click Effects</div>';
      html += cosmeticOptionRow('click-effect', 'default', CLICK_EFFECTS['default'], 'common');
      for (const item of effects) {
        const eid = getCosmeticThemeId(item);
        const def = CLICK_EFFECTS[eid] || { name: item.name, desc: item.name };
        html += cosmeticOptionRow('click-effect', eid, def, item.rarity || 'common');
      }

      if (badgeSkulls.length) {
        html += '<div class="section-label">Loyalty Skulls</div>';
        html += cosmeticOptionRow('skull-image', 'default',
          { name: 'Default', desc: 'The classic bone skull' }, 'common');
        for (const b of badgeSkulls) {
          const months = b.meta.monthThreshold || 0;
          html += cosmeticOptionRow('skull-image', b.id, {
            name: b.name,
            desc: months > 0
              ? `Your ${months}-month subscriber badge, worn as a skull`
              : 'Your subscriber badge, worn as a skull',
            img: b.meta.imageUrl4x,
          }, b.rarity || 'common');
        }
      }

      if (themes.length === 0 && effects.length === 0 && badgeSkulls.length === 0) {
        html += '<div class="cosmetic-empty">No cosmetics unlocked yet.<br>'
          + 'Earn them through Phamily Time rewards, or import your Twitch '
          + 'subscriber badges from your inventory to wear them as skulls.</div>';
      }

      el.innerHTML = html;
    }

    function cosmeticOptionRow(slot, id, def, rarity) {
      const isEquipped = equippedCosmetics[slot] === id;
      return `<div class="cosmetic-row ${isEquipped ? 'equipped' : ''}" onclick="equipCosmetic('${slot}','${id}')">
        <div class="cosmetic-icon">${def.img
          ? `<img src="${def.img}" alt="" style="width:28px;height:28px;image-rendering:pixelated">`
          : (slot === 'click-effect' ? '✨' : '💀')}</div>
        <div class="cosmetic-info">
          <div class="cosmetic-name">${def.name} ${id !== 'default' ? `<span class="cosmetic-badge badge-${rarity}">${rarity}</span>` : ''}</div>
          <div class="cosmetic-desc">${def.desc}</div>
        </div>
        ${isEquipped ? '<span class="cosmetic-equipped-tag">EQUIPPED</span>' : ''}
      </div>`;
    }

    /* ═══════ INIT ═══════ */

    document.getElementById('skullBtn').addEventListener('click', handleClick);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });

    window.addEventListener('beforeunload', save);

    load();
    syncFromServer();
    loadCosmetics();
    lastTick = Date.now();
    render();
    renderWorld();
  </script>
</body>
</html>
