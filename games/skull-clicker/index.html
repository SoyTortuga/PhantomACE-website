      kick.connect(kg); kg.connect(audioCtx.destination);
      kick.start(t); kick.stop(t + 0.21);

      const noise = audioCtx.createBufferSource();
      noise.buffer = getNoise();
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 1400;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.45, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      noise.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination);
      noise.start(t); noise.stop(t + 0.14);

      const body = audioCtx.createOscillator();
      body.type = 'triangle';
      body.frequency.setValueAtTime(210, t);
      body.frequency.exponentialRampToValueAtTime(120, t + 0.1);
      const bg = audioCtx.createGain();
      bg.gain.setValueAtTime(0.28, t);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      body.connect(bg); bg.connect(audioCtx.destination);
      body.start(t); body.stop(t + 0.12);
    }

    function playSound(kind) {
      if (!soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        loadClickSample();                                 /* decode the sample once, lazily */
        const t = audioCtx.currentTime;
        if (kind === 'click') { clickBuffer ? playClickSample(t) : playSnare(t); return; }

        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        let f = 180, dur = 0.05, type = 'square', vol = 0.05;
        if (kind === 'buy')    { f = 320; dur = 0.08; type = 'triangle'; vol = 0.06; }
        if (kind === 'cursed') { f = 90;  dur = 0.30; type = 'sawtooth'; vol = 0.09; }
        if (kind === 'feat')   { f = 520; dur = 0.18; type = 'triangle'; vol = 0.07; }
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (kind === 'cursed' || kind === 'feat') o.frequency.exponentialRampToValueAtTime(f * 2, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.start(t); o.stop(t + dur);
      } catch (e) { /* audio is a nicety; never let it break the game */ }
    }
    function toggleSound() {
      soundOn = !soundOn;
      try { localStorage.setItem('sc_sound', soundOn ? '1' : '0'); } catch(e) {}
      if (soundOn) playSound('feat');
      renderSettings();
    }

    /* Rarity stingers for buff spawn/collect. ONE Audio element per rarity,
       created lazily and reused (never new Audio() per fire — marathon-safe). */
    const STINGER_RARITIES = ['common', 'uncommon', 'rare', 'epic', 'legendary'];
    const stingers = {};
    function playStinger(rarity) {
      if (!soundOn) return;
      const r = STINGER_RARITIES.includes(rarity) ? rarity : 'common';
      try {
        let a = stingers[r];
        if (!a) { a = new Audio('assets/audio/' + r + '.mp3'); a.preload = 'auto'; a.volume = 0.5; stingers[r] = a; }
        a.currentTime = 0;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* audio is a nicety; never let it break the game */ }
    }

    BUILDINGS.forEach(b => owned[b.id] = 0);

    /* ═══════ COMPUTED ═══════ */

    function getBuildingCost(b) {
      /* Decimal: cost = baseCost · 1.15^owned, which overflows a double around
         owned ≈ 4900. */
      return new Decimal(b.baseCost).mul(new Decimal(1.15).pow(owned[b.id])).mul(buildingCostMult() * buffCostMult()).ceil();
    }

    /* Prestige is the whole point of a resource-gathering game with no win:
       reset the run for a permanent speed-up, so you gather MORE over time.
       +0.1x per tier — P1 is 1.1x, P2 1.2x — applied to everything that
       produces skulls. */
    function getPrestigeMult() { return 1 + 0.1 * prestige; }

    /* Every earned feat is a small permanent multiplier on everything — the
       "milk" of this game, so the achievements screen is a real power source,
       not a trophy shelf. */
    function achMult() { return 1 + 0.01 * achievements.size; }

    /* ═══════ MIASMA + GHOULS ═══════
       Miasma is the "milk" analog: purely DERIVED from feats, no stored state.
       +4% per feat, so the 25-feat maximum reads as a clean 100%. Ghouls (bought
       with skulls, reset each run) turn that meter into production:
         ghoulMult() = 1 + miasma × Σ(factor of owned ghouls).
       With all ghouls (Σfactor = 1.0) at 100% miasma that is a ×2 channel, so
       every feat gains a multiplicative payoff on top of its flat +1%. */
    function miasma() { return achievements.size * 0.04; }   /* fraction: 1.0 = 100% */
    function ghoulFactorSum() {
      let f = 0;
      for (const g of GHOULS) if (boughtGhouls.has(g.id)) f += g.factor;
      return f;
    }
    function ghoulMult() { return 1 + miasma() * ghoulFactorSum(); }

    /* ── Grave Bloom helpers ── */
    /* Effective ripen interval, sped up by the Hallowtide Soul Bell relic. All
       three readers below use this ONE helper, so the timestamp math stays
       coherent (and offline-correct) whether or not the relic is owned. */
    function bloomRipenMs() { return BLOOM_RIPEN_MS / ripenSpeedMult(); }
    /* Blooms fully ripened and waiting (offline-aware: derived purely from the
       timestamp, so a long absence accrues the whole gap). */
    function readyBlooms() { return Math.max(0, Math.floor((Date.now() - bloomStart) / bloomRipenMs())); }
    /* Milliseconds until the next bloom ripens. */
    function nextBloomInMs() {
      const ripen = bloomRipenMs();
      const rem = (Date.now() - bloomStart) % ripen;
      return Math.max(0, ripen - rem);
    }
    /* Harvest everything ripe; advance the ripen clock so a partial bloom keeps
       growing. Returns how many were collected. */
    function harvestBlooms() {
      const n = readyBlooms();
      if (n <= 0) return 0;
      graveBlooms += n;
      bloomStart += n * bloomRipenMs();
      playStinger('rare');
      save();
      renderBuildings();
      return n;
    }
    function buildingLevel(id) { return buildingLevels[id] || 0; }
    function buildingLevelMult(id) { return 1 + buildingLevel(id) * BLOOM_LEVEL_BONUS; }
    /* CC-style triangular cost: leveling a building to level N costs N blooms. */
    function bloomLevelCost(id) { return buildingLevel(id) + 1; }
    function levelBuilding(id, e) {
      if (e) e.stopPropagation();
      const b = BUILDINGS.find(x => x.id === id);
      if (!b) return;
      const cost = bloomLevelCost(id);
      if (graveBlooms < cost) { shakeReject(e); return; }
      graveBlooms -= cost;
      buildingLevels[id] = buildingLevel(id) + 1;
      playSound('buy');
      save();
      render();
      renderWorld();
    }

    /* ── Bound Reaper (pet) helpers ── */
    function auraSlots() { return petLevel >= PET_AURA_SLOT_L2 ? 2 : petLevel >= PET_AURA_SLOT_L1 ? 1 : 0; }
    function auraActive(id) { return selectedAuras.includes(id); }
    /* The pet eats progressively higher building tiers as it levels; the count
       it demands grows with its level. Consumes run-reset `owned`; level persists. */
    function petFeedBuilding() { return BUILDINGS[Math.min(petLevel, BUILDINGS.length - 1)]; }
    function petFeedCount() { return 10 + petLevel * 5; }
    function feedPet(e) {
      const b = petFeedBuilding();
      const need = petFeedCount();
      if ((owned[b.id] || 0) < need) { shakeReject(e); return; }
      owned[b.id] -= need;
      petLevel += 1;
      playStinger('epic');
      save();
      render();
      renderWorld();
    }
    /* Equip/unequip an aura. When a slot is full, the newest replaces the oldest
       so switching is one click. */
    function toggleAura(id) {
      if (auraActive(id)) {
        selectedAuras = selectedAuras.filter(x => x !== id);
      } else {
        if (auraSlots() <= 0) return;
        if (selectedAuras.length >= auraSlots()) selectedAuras.shift();
        selectedAuras.push(id);
      }
      save();
      render();
    }
    /* Aura effect readers, folded into their systems below. */
    function petAuraCpsMult() {
      let m = 1;
      if (auraActive('ravenous')) m *= 1.5;
      if (auraActive('miasma_breath')) m *= (1 + miasma());
      return m;
    }
    function windfallMult()   { return auraActive('grave_fortune') ? 1.25 : 1; }
    function auraShardMult()  { return auraActive('reapers_boon') ? 1.25 : 1; }

    /* ═══════ TIMED BUFF / DEBUFF FRAMEWORK ═══════
       Add a timed effect; re-collecting the same id refreshes it rather than
       stacking a duplicate. cpsMult/clickMult default to 1 (no effect on that
       channel). Callers pass the FINAL durationMs (any perk scaling already
       applied). Instant payouts do not go here — they are applied directly. */
    function addTimedBuff({ id, name, kind, cpsMult, clickMult, costMult, durationMs, icon, chipClass }) {
      const b = {
        id, name, kind: kind || 'buff',
        cpsMult: cpsMult || 1, clickMult: clickMult || 1, costMult: costMult || 1,
        endsAt: Date.now() + durationMs,
        icon: icon || '💀',
        chipClass: chipClass || (kind === 'debuff' ? 'debuff' : 'buff'),
      };
      const i = activeBuffs.findIndex(x => x.id === id);
      if (i >= 0) activeBuffs[i] = b; else activeBuffs.push(b);
      renderBuffs();
      return b;
    }
    function removeTimedBuff(id) { activeBuffs = activeBuffs.filter(b => b.id !== id); }
    function buffCpsMult()   { let m = 1; for (const b of activeBuffs) m *= b.cpsMult;   return m; }
    function buffClickMult() { let m = 1; for (const b of activeBuffs) m *= b.clickMult; return m; }
    /* Temporary building-cost discount from timed buffs (Grave Bargain spell). */
    function buffCostMult()  { let m = 1; for (const b of activeBuffs) m *= (b.costMult || 1); return m; }
    /* Drop expired effects; re-render only when the set actually changed. */
    function tickTimedBuffs() {
      const now = Date.now();
      const before = activeBuffs.length;
      activeBuffs = activeBuffs.filter(b => b.endsAt > now);
      if (activeBuffs.length !== before) renderBuffs();
    }

    /* Per-building multiplier from synergy upgrades: a building's own tiered
       upgrades multiply it, and a cross-boost scales it by how many of ANOTHER
       building you own. Computed live so nothing has to be baked into a saved
       stat. (SYNERGY is filled in Phase B; empty here means ×1.) */
    /* ── Big-number helpers (break_infinity) ─────────────────────────────
       The old overflow problem — a long auto-buy/auto-prestige idle run growing
       the multiplier stack until getGrossCPS()'s product crossed Number.MAX_VALUE
       and rounded to Infinity, which then stuck in every total and displayed as
       "Infinity"/"MAX" — cannot happen with Decimal: there is no overflow and no
       ceiling, so the VALUE_CAP / clampFinite clamp is gone. toDec() is the one
       guard the Decimal path still needs: it coerces anything (legacy Number, a
       saved string, undefined, or a stray non-finite) into a sane Decimal, since
       new Decimal(NaN/Infinity) is not useful. The four big-number currencies
       serialize to strings on save and parse back through toDec on load. */
    const SC_DECIMAL_FIELDS = ['skulls', 'totalSkulls', 'lifetimeSkulls', 'seasonBaseline'];
    function toDec(v) {
      if (v instanceof Decimal) return v;
      if (v === undefined || v === null || v === '') return new Decimal(0);
      if (typeof v === 'number' && !Number.isFinite(v)) return new Decimal(0);
      let d;
      try { d = new Decimal(v); } catch (e) { return new Decimal(0); }
      return (d && Number.isFinite(d.mantissa) && Number.isFinite(d.exponent)) ? d : new Decimal(0);
    }
    /* Heal the plain-Number fields of a loaded save blob so a non-finite/negative
       value can never enter the game. The four Decimal fields are handled by toDec
       in migrateSave; everything else is a bounded Number. clickMulti/globalCpsMult
       never heal to 0 (that would zero out clicks/CPS). */
    function healPlainNumbers(d) {
      if (!d || typeof d !== 'object') return d;
      for (const map of [d.owned, d.metaLevels, d.buildingLevels, d.perkLevels]) {
        if (map && typeof map === 'object') for (const k in map) {
          const n = Number(map[k]);
          if (!Number.isFinite(n) || n < 0) map[k] = 0;
        }
      }
      if (!(Number(d.clickMulti) > 0)) d.clickMulti = 1;
      if (!(Number(d.globalCpsMult) > 0)) d.globalCpsMult = 1;
      return d;
    }

    function getBuildingMult(b) {
      let m = 1;
      for (const u of SYNERGY) {
        if (!boughtUpgrades.has(u.id)) continue;
        if (u.building === b.id) m *= u.mult || 1;
        if (u.cross && u.cross.target === b.id) m *= 1 + (u.cross.per || 0) * (owned[u.building] || 0);
      }
      return m;
    }

    /* Gross production — everything the buildings make before wraith drain.
       Returns a Decimal: the building sum can climb past the double ceiling, so
       the per-building contributions accumulate as Decimal. The global multiplier
       stack is all bounded Numbers, folded into one Number factor. */
    function getGrossCPS() {
      let cps = new Decimal(0);
      for (const b of BUILDINGS) {
        cps = cps.add(new Decimal(b.baseCps).mul(owned[b.id]).mul(getBuildingMult(b)).mul(buildingLevelMult(b.id)));
      }
      return cps.mul(globalCpsMult * cpBoostMult * getPrestigeMult() * achMult() * perkCpsMult() * metaProdMult() * ghoulMult() * petAuraCpsMult() * apocProdMult() * buffCpsMult() * gardenCpsMult() * seasonRelicCpsMult());
    }
    /* Net production the player actually receives — gross minus wraith drain. */
    function getCPS() { return getGrossCPS().mul(wraithDrainMult()); }

    /* ── Skullpocalypse computed state ── */
    function apocCalm() { return apocPacifiedUntil > Date.now(); }
    function apocPhase() {
      if (!apocActive || apocCalm()) return 0;
      const el = Date.now() - apocStart;
      if (el >= APOC_PHASE3_MS) return 3;
      if (el >= APOC_PHASE2_MS) return 2;
      return 1;
    }
    function apocProdMult() { return 1 + APOC_PROD_BONUS[apocPhase()]; }
    function apocWrathChance() { return APOC_WRATH_CHANCE[apocPhase()]; }
    function wraithDrainMult() {
      const n = (apocActive && !apocCalm()) ? wraiths.length : 0;
      return n <= 0 ? 1 : Math.max(0.4, 1 - WRAITH_DRAIN * n);
    }
    function apocUnlockable() { return lifetimeSkulls.gte(APOC_UNLOCK_LIFETIME) || prestige >= APOC_UNLOCK_PRESTIGE; }

    /* Blood Rush multiplies the WHOLE click, not just the base term. It used
       to sit inside `base`, so anyone with a %-of-CPS click upgrade (Void
       Touch/Reality Shatter/Oblivion Grip) and real CPS built up saw Blood
       Rush do almost nothing — the CPS-based term dwarfs the buffable base
       once CPS gets big, since it's fed by getCPS() which is itself already
       multiplied by every CPS buff going. ×100 has to apply to the total a
       click is actually worth, or the buff is invisible for exactly the
       players who've played long enough to unlock it. */
    function getClickPower() {
      const base = ((1 + clickBonus) * clickMulti) * getPrestigeMult() * achMult() * perkClickMult() * metaClickMult();
      return new Decimal(base).add(getCPS().mul(cpsClickPct / 100)).mul(buffClickMult() * gardenClickMult() * seasonRelicClickMult());
    }

    /* Every skull earned flows through here so the run total and the
       lifetime total can never drift apart — lifetime is the leaderboard
       score and the save-merge key, so it must count every path. All three
       are Decimal, so there is no overflow to guard against. */
    function earn(amount) {
      const a = (amount instanceof Decimal) ? amount : toDec(amount);
      skulls = skulls.add(a);
      totalSkulls = totalSkulls.add(a);
      lifetimeSkulls = lifetimeSkulls.add(a);
    }

    /* ═══════ ACTIONS ═══════ */

    /* Crit chance comes from prestige perks (Phase B); zero until one is
       bought. A crit is a big, satisfying spike on an otherwise steady click. */
    function critChance() {
      return Math.min(0.9, (pHas('crit') ? 0.05 : 0) + (pHas('crit2') ? 0.10 : 0) + 0.01 * pLvl('t_crit'));
    }
    /* Combo rewards SUSTAINED clicking: each click within the window bumps it,
       a pause resets it. Caps at +50% (or +100% with Relentless) so it never
       dwarfs idle income. */
    function comboMult() { return 1 + Math.min(combo, 100) * comboCapPer(); }

    function handleClick(e) {
      const now = Date.now();
      combo = (now - lastClickAt < 1200) ? Math.min(combo + 1, 100) : 1;
      lastClickAt = now;

      let power = getClickPower().mul(comboMult());
      const crit = Math.random() < critChance();
      if (crit) power = power.mul(critMult());

      earn(power);
      totalClicks++;
      if (raidActive()) raidQueue++;   /* each strike also hits the shared boss */
      spawnPop(e, power, crit);
      playSound('click');
      checkMilestones();
      checkAchievements();
      render();
    }

    function shakeReject(e) {
      const row = e && e.currentTarget;
      if (!row) return;
      row.classList.remove('reject-shake');
      void row.offsetWidth;
      row.classList.add('reject-shake');
      setTimeout(() => row.classList.remove('reject-shake'), 350);
    }

    const COST_RATE = 1.15;

    /* Sum of the next `amount` prices for a building — a geometric series, so
       ×10 and ×100 are one formula rather than a loop. */
    function getBulkCost(b, amount) {
      const r = COST_RATE;
      const base = new Decimal(b.baseCost).mul(new Decimal(r).pow(owned[b.id])).mul(buildingCostMult() * buffCostMult());
      return base.mul(Math.pow(r, amount) - 1).div(r - 1).ceil();
    }

    /* How many of a building the current bank can buy — the inverse of the
       series above, so "Max" is exact rather than a loop that could stall.
       Returns a plain integer count; the Decimal log keeps it correct even when
       skulls/base are astronomically large. */
    function maxAffordable(b) {
      const r = COST_RATE;
      const base = new Decimal(b.baseCost).mul(new Decimal(r).pow(owned[b.id])).mul(buildingCostMult() * buffCostMult());
      /* n = floor( log_r( skulls·(r-1)/base + 1 ) ) = floor( log10(X) / log10(r) ) */
      const X = skulls.mul(r - 1).div(base).add(1);
      const n = Math.floor(X.log10() / Math.log10(r));
      return Math.max(0, Number.isFinite(n) ? n : 0);
    }

    /* The quantity a click will buy right now, honouring the ×1/×10/×100/Max
       toggle. Fixed amounts are all-or-nothing; Max buys everything affordable. */
    function buyQuantity(b) {
      if (buyAmount === 'max') return maxAffordable(b);
      return buyAmount;
    }

    function buyBuilding(id, e) {
      const b = BUILDINGS.find(x => x.id === id);
      if (!b) return;
      const qty = buyQuantity(b);
      if (qty < 1) { shakeReject(e); return; }
      const cost = getBulkCost(b, qty);
      if (skulls.lt(cost)) { shakeReject(e); return; }
      skulls = skulls.sub(cost);
      owned[b.id] += qty;
      lastBought = b.id;
      playSound('buy');
      checkAchievements();
      render();
      renderWorld();
    }

    function setBuyAmount(a) {
      buyAmount = a;
      try { localStorage.setItem('sc_buyAmount', String(a)); } catch(e) {}
      if (activeTab === 'buildings') renderBuildings();
    }

    function buyUpgrade(id, e) {
      const u = UPGRADES.find(x => x.id === id);
      if (!u || boughtUpgrades.has(id)) return;
      if (skulls.lt(u.cost)) { shakeReject(e); return; }
      skulls = skulls.sub(u.cost);
      boughtUpgrades.add(id);
      if (u.apply) u.apply();   /* synergy upgrades have no apply — computed live */
      checkAchievements();
      render();
    }

    /* Buy a Ghoul — one-time, skulls, effect computed live in ghoulMult(). */
    function buyGhoul(id, e) {
      const g = GHOULS.find(x => x.id === id);
      if (!g || boughtGhouls.has(id)) return;
      if (skulls.lt(g.cost)) { shakeReject(e); return; }
      skulls = skulls.sub(g.cost);
      boughtGhouls.add(id);
      playSound('buy');
      checkAchievements();
      render();
    }

    /* Buy a synergy upgrade (separate list from UPGRADES). */
    function buySynergy(id, e) {
      const u = SYNERGY.find(x => x.id === id);
      if (!u || boughtUpgrades.has(id)) return;
      if ((owned[u.building] || 0) < u.req) { shakeReject(e); return; }
      if (skulls.lt(u.cost)) { shakeReject(e); return; }
      skulls = skulls.sub(u.cost);
      boughtUpgrades.add(id);
      checkAchievements();
      render();
      renderWorld();
    }

    /* ═══════ POPUPS ═══════ */

    function spawnPop(e, val, crit) {
      const btn = document.getElementById('skullBtn');
      const rect = btn.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'click-pop' + (crit ? ' crit' : '');
      pop.textContent = (crit ? 'CRIT +' : '+') + formatNum(toDec(val).floor());
      pop.style.left = (e.clientX - rect.left) + 'px';
      pop.style.top = (e.clientY - rect.top - 10) + 'px';
      btn.appendChild(pop);
      setTimeout(() => pop.remove(), crit ? 700 : 500);
    }

    function checkMilestones() {
      for (let i = 0; i < MILESTONES.length; i++) {
        const m = MILESTONES[i];
        if (totalSkulls.gte(m) && !hitMilestones.has(m)) {
          hitMilestones.add(m);
          showMilestone(m, MS_NAMES[i] || 'Unknown');
        }
      }
    }

    function showMilestone(n, title) {
      const el = document.createElement('div');
      el.className = 'milestone';
      el.innerHTML = `<h3>${title}</h3><p>${formatNum(n)} skulls earned</p>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
      screenShake();
      playSound('feat');
    }

    /* A brief shake on the big moments — the cheapest juice there is. */
    function screenShake() {
      const w = document.querySelector('.game-wrap');
      if (!w) return;
      w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
      setTimeout(() => w.classList.remove('shake'), 500);
    }

    /* ═══════ NEWS TICKER ═══════
       A gothic crawl that reacts to how far along you are — atmosphere for
       almost nothing. Static generic lines, plus lines conjured from the
       current state so it feels aware of your dominion. */
    const NEWS_GENERIC = [
      'The bones whisper of a coming harvest.',
      'Local villagers report a chill on the wind.',
      'A raven watches from the ossuary gate.',
      'The candles gutter, though there is no draft.',
      'Something in the crypt is counting.',
      'The dead do not rest; they produce.',
      'Rumors of a skull that moves on its own.',
      'The altar is warm to the touch again.',
      'Night lasts a little longer here each day.',
      'They say the reaper keeps a leaderboard.',
    ];
    function pickNews() {
      const dyn = [];
      if (prestige > 0) dyn.push('The cycle turns for the ' + ordinal(prestige) + ' time. The dark remembers.');
      if (cursedPopped >= 10) dyn.push('The cursed skulls fear you now — ' + cursedPopped + ' claimed.');
      const tb = totalBuildings();
      if (tb >= 100) dyn.push('Your dominion numbers ' + tb + ' and grows restless.');
      else if (tb >= 20) dyn.push('Word spreads of a growing necropolis.');
      if (achievements.size >= 10) dyn.push('Scholars catalogue your ' + achievements.size + ' dread feats.');
      if (getCPS().gt(1e9)) dyn.push('The skull-tide rises by ' + formatNum(getCPS()) + ' every second.');
      const pool = dyn.length && Math.random() < 0.6 ? dyn : NEWS_GENERIC;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function ordinal(n) {
      const s = ['th','st','nd','rd'], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }
    function cycleNews() {
      const el = document.getElementById('newsTicker');
      if (!el) return;
      el.classList.add('fade');
      setTimeout(() => { el.textContent = pickNews(); el.classList.remove('fade'); }, 400);
    }

    /* ═══════ FEATS (achievements) ═══════ */

    function checkAchievements() {
      let gained = false;
      for (const a of ACHIEVEMENTS) {
        if (!achievements.has(a.id) && a.check()) {
          achievements.add(a.id);
          gained = true;
          showAchievement(a);
        }
      }
      if (gained) renderMiasma();   /* a new feat raises the miasma meter */
      if (gained && activeTab === 'feats') renderAchievements();
    }

    function showAchievement(a) {
      const el = document.createElement('div');
      el.className = 'ach-toast';
      el.innerHTML = '<div class="ach-toast-kind">Feat Unlocked</div>' +
        '<div class="ach-toast-name">' + a.name + '</div>' +
        '<div class="ach-toast-desc">' + a.desc + ' &mdash; +1% forever</div>';
      document.body.appendChild(el);
      playSound('feat');
      setTimeout(() => el.remove(), 3200);
    }

    /* ═══════ CURSED SKULLS ═══════
       The golden-cookie of this game: one drifts across the screen now and
       then; catch it for a big timed buff or an instant windfall. This is the
       reason to keep the tab open. */
    let cursedTimer = null;

    function cursedFreqMult() {
      /* Prestige perks shorten the wait; a stream event and the Grave Fortune
         aura can too. */
      return (pHas('omen') ? 1.5 : 1) * (1 + 0.08 * pLvl('t_omen')) *
        (window.__streamFrenzy ? 3 : 1) * (auraActive('grave_fortune') ? 1.5 : 1);
    }

    function scheduleCursed() {
      clearTimeout(cursedTimer);
      const wait = (60 + Math.random() * 120) / cursedFreqMult();  // 60–180s, sped up by perks/events
      cursedTimer = setTimeout(spawnCursed, wait * 1000);
    }

    /* opts.storm — a skull spawned by a Skull Storm: shorter-lived, does NOT
       touch the main cursed-skull timer, and cannot chain another storm. */
    function spawnCursed(opts) {
      opts = opts || {};
      const storm = !!opts.storm;
      /* During the uprising a non-storm skull can turn WRATHFUL (bigger boon,
         but it can bite back with a debuff). Distinct red tint on the sprite. */
      const wrath = !storm && apocActive && !apocCalm() && Math.random() < apocWrathChance();
      const el = document.createElement('div');
      el.className = 'cursed-skull' + (wrath ? ' wrath' : '');
      el.innerHTML = '<img src="' + (wrath ? 'assets/icons/wrath-skull.png' : '/assets/images/skull.png') + '" alt="' + (wrath ? 'Wrath skull' : 'Cursed skull') + '">';
      el.style.top = (10 + Math.random() * 60) + 'vh';
      /* Drift across the game column, not the whole viewport, so the skull
         stays over the play area instead of the empty margins beside it. */
      const wrap = document.querySelector('.game-wrap');
      const wr = wrap ? wrap.getBoundingClientRect() : { left: 0, right: window.innerWidth };
      el.style.left = (wr.left - 90) + 'px';
      document.body.appendChild(el);
      /* Kick off the drift on the next frame so the transition runs. */
      requestAnimationFrame(() => { el.style.left = (wr.right + 90) + 'px'; });

      /* Storm skulls must not reset the main spawn timer. */
      const reschedule = () => { if (!storm) scheduleCursed(); };

      let done = false;
      const life = setTimeout(() => {
        if (done) return;
        done = true;
        el.classList.add('fade');
        setTimeout(() => el.remove(), 400);
        reschedule();
      }, storm ? 7000 : 13000);

      el.addEventListener('click', () => {
        if (done) return;
        done = true;
        clearTimeout(life);
        popCursed(el, { storm, wrath });
        reschedule();
      });

      /* Ever-Watchful (meta): catch the skull automatically a beat after it
         appears, so it is never missed. */
      if (autoEnabled('auto_cursed')) {
        setTimeout(() => {
          if (done) return;
          done = true;
          clearTimeout(life);
          popCursed(el, { storm, wrath });
          reschedule();
        }, 1500);
      }
    }

    function popCursed(el, opts) {
      opts = opts || {};
      cursedPopped++;
      const res = opts.wrath ? rollWrathOutcome() : rollCursedOutcome(!opts.storm);
      /* Wrath skulls drip bonus Bone Shards (and a small Epitaph chance). */
      if (opts.wrath) {
        const bonus = 1 + apocPhase();
        boneShards += bonus;
        res.msg += ' · +' + bonus + ' 🦴';
        if (Math.random() < 0.08) { epitaphs += 1; res.msg += ' · +1 🪦'; }
      }
      /* Deathflight aura: a chance the skull also grants a short Blood Rush. */
      if (auraActive('deathflight') && Math.random() < 0.25) {
        addTimedBuff({ id:'rush', name:'Blood Rush ×100', kind:'buff', clickMult:100, durationMs:8000, icon:'assets/icons/buff-bloodrush.png', chipClass:'rush' });
        res.msg += ' · Deathflight!';
      }
      /* Fated: a chance the skull also drops a Bone Shard. */
      if (pHas('luckyskull') && Math.random() < 0.12) {
        boneShards += 1;
        res.msg += ' · +1 🦴';
      }
      /* Hallowtide: while the season burns, a cursed skull can also shed Wisps.
         The Witch's Knot relic boosts both the chance and the amount. */
      if (seasonActive() && Math.random() < WISP_DROP_CHANCE * (1 + wispDropBonus())) {
        const roll = WISP_DROP_MIN + Math.floor(Math.random() * (WISP_DROP_MAX - WISP_DROP_MIN + 1));
        const amt = Math.max(1, Math.round(roll * (1 + wispDropBonus())));
        wisps += amt;
        res.msg += ' · +' + amt + ' ' + WISP_ICON + ' Wisp' + (amt === 1 ? '' : 's');
      }
      burstParticles(el);
      showBuffToast(res.msg, res.kind, res.icon);
      playStinger(res.rarity);
      el.classList.add('popped');
      setTimeout(() => el.remove(), 300);
      checkAchievements();
      render();
      renderBuffs();
    }

    /* ═══════ CURSED-SKULL OUTCOMES ═══════
       A Cookie-Clicker-style spread of golden-cookie effects. Timed effects go
       through the buff framework; the rest pay out instantly. allowStorm is
       false for storm-spawned skulls so a storm cannot chain into another. */
    function rollCursedOutcome(allowStorm) {
      const roll = Math.random();
      if (roll < 0.34) return outFrenzy();
      if (roll < 0.54) return outBloodRush();
      if (roll < 0.74) return outLucky();
      if (roll < 0.86) return outReap();
      if (roll < 0.96) return outBuildingSpecial();
      return allowStorm ? outSkullStorm() : outLucky();
    }

    function outFrenzy() {
      const mult = frenzyMultValue(), dur = 20000 * buffScale();
      addTimedBuff({ id:'frenzy', name:'Frenzy ×' + mult, kind:'buff', cpsMult:mult, durationMs:dur, icon:'assets/icons/buff-frenzy.png', chipClass:'frenzy' });
      return { msg:'FRENZY — ×' + mult + ' production for ' + Math.round(dur / 1000) + 's', kind:'frenzy', rarity:'rare', icon:'assets/icons/buff-frenzy.png' };
    }
    function outBloodRush() {
      const dur = 13000 * buffScale();
      addTimedBuff({ id:'rush', name:'Blood Rush ×100', kind:'buff', clickMult:100, durationMs:dur, icon:'assets/icons/buff-bloodrush.png', chipClass:'rush' });
      return { msg:'BLOOD RUSH — ×100 clicks for ' + Math.round(dur / 1000) + 's', kind:'rush', rarity:'epic', icon:'assets/icons/buff-bloodrush.png' };
    }
    /* Lucky — a capped windfall: 15% of the bank (cap) plus a minute of CpS. */
    function outLucky() {
      const reward = Decimal.min(Decimal.max(skulls.mul(0.15), getClickPower().mul(20)), getCPS().mul(900)).add(getCPS().mul(60)).mul(windfallMult());
      earn(reward);
      return { msg:'LUCKY — +' + formatNum(reward) + ' skulls', kind:'reap', rarity:'uncommon', icon:'assets/icons/buff-lucky.png' };
    }
    /* Reap — the big windfall (scales with the Plunder perk). */
    function outReap() {
      const reap = Decimal.max(getCPS().mul(600), skulls.mul(0.10), getClickPower().mul(100)).mul(reapMult() * windfallMult());
      earn(reap);
      return { msg:'REAP — +' + formatNum(reap) + ' skulls', kind:'reap', rarity:'epic', icon:'assets/icons/buff-reap.png' };
    }
    /* Building Special — an instant payout scaled off one random building you own. */
    function outBuildingSpecial() {
      const ownedB = BUILDINGS.filter(b => owned[b.id] > 0);
      if (!ownedB.length) return outLucky();
      const b = ownedB[Math.floor(Math.random() * ownedB.length)];
      const perSec = new Decimal(b.baseCps).mul(owned[b.id]).mul(getBuildingMult(b) * globalCpsMult *
        getPrestigeMult() * achMult() * perkCpsMult() * metaProdMult() * ghoulMult());
      const reward = Decimal.max(perSec.mul(60 + Math.random() * 180), getClickPower().mul(50)).mul(windfallMult());
      earn(reward);
      return { msg:b.name + ' SPECIAL — +' + formatNum(reward) + ' skulls', kind:'reap', rarity:'uncommon', icon:'assets/icons/buff-building.png' };
    }
    /* Skull Storm — a short flurry of extra cursed skulls (CC's Cookie Storm). */
    function outSkullStorm() {
      skullStorm();
      return { msg:'SKULL STORM — catch them all!', kind:'frenzy', rarity:'legendary', icon:'assets/icons/buff-skullstorm.png' };
    }
    function skullStorm() {
      const n = 8 + Math.floor(Math.random() * 7);   // 8–14 skulls over ~5s
      for (let i = 0; i < n; i++) {
        setTimeout(() => spawnCursed({ storm: true }), 300 * i + Math.random() * 250);
      }
    }

    /* ═══════ DEBUFFS (defined, NOT spawned yet) ═══════
       The Skullpocalypse "wrath" skulls will trigger these through the same
       framework. Left unused/gated for now — nothing calls WRATH_DEBUFFS. */
    function outClot() {
      addTimedBuff({ id:'clot', name:'Clot', kind:'debuff', cpsMult:0.5, durationMs:30000, icon:'🩸', chipClass:'debuff' });
      return { msg:'CLOT — production halved for 30s', kind:'reap', rarity:'common' };
    }
    function outRuin() {
      const loss = Decimal.min(skulls.mul(0.05), getCPS().mul(30));
      skulls = Decimal.max(0, skulls.sub(loss));
      return { msg:'RUIN — lost ' + formatNum(loss) + ' skulls', kind:'reap', rarity:'common' };
    }
    const WRATH_DEBUFFS = { clot: outClot, ruin: outRuin };   /* triggered by wrath skulls, below */

    /* ═══════ SKULLPOCALYPSE — wrath outcomes, wraiths, and the levers ═══════ */

    /* A wrath cursed skull: mostly a BIGGER boon, but a 30% chance the uprising
       bites back with one of the WRATH_DEBUFFS. Everything routes through the
       buff framework / the shared debuff helpers. */
    function rollWrathOutcome() {
      if (Math.random() < 0.30) {
        return (Math.random() < 0.5) ? WRATH_DEBUFFS.clot() : WRATH_DEBUFFS.ruin();
      }
      if (Math.random() < 0.5) {
        const mult = Math.ceil(frenzyMultValue() * 1.5), dur = 24000 * buffScale();
        addTimedBuff({ id:'frenzy', name:'Wrath Frenzy ×' + mult, kind:'buff', cpsMult:mult, durationMs:dur, icon:'assets/icons/buff-frenzy.png', chipClass:'frenzy' });
        return { msg:'WRATH FRENZY — ×' + mult + ' for ' + Math.round(dur / 1000) + 's', kind:'frenzy', rarity:'legendary', icon:'assets/icons/buff-frenzy.png' };
      }
      const reap = Decimal.max(getCPS().mul(1200), skulls.mul(0.20), getClickPower().mul(200)).mul(reapMult() * windfallMult());
      earn(reap);
      return { msg:'WRATH REAP — +' + formatNum(reap) + ' skulls', kind:'reap', rarity:'legendary', icon:'assets/icons/buff-reap.png' };
    }

    /* Auto-grant the permanent unlock the moment the gate is met. */
    function checkApocUnlock() {
      if (!apocUnlocked && apocUnlockable()) {
        apocUnlocked = true;
        showBuffToast('☠️ A dread power stirs — The Skullpocalypse can be unearthed', 'reap');
      }
    }

    function beginApocalypse() {
      if (!apocUnlocked || apocActive) return;
      apocActive = true;
      apocEverActive = true;
      apocStart = Date.now();
      apocPacifiedUntil = 0;
      playStinger('legendary');
      screenShake();
      showBuffToast('☠️ THE SKULLPOCALYPSE BEGINS', 'reap');
      scheduleWraith();
      checkAchievements();
      save();
      render();
    }

    function endApocalypse() {
      apocActive = false;
      apocPacifiedUntil = 0;
      clearTimeout(wraithTimer); wraithTimer = null;
      clearWraiths();
      save();
      render();
      renderBuffs();
    }

    function pacifyApocalypse() {
      if (!apocActive || apocCalm()) return;
      if (boneShards < APOC_PACIFY_COST) return;
      boneShards -= APOC_PACIFY_COST;
      apocPacifiedUntil = Date.now() + APOC_PACIFY_MS;
      clearTimeout(wraithTimer); wraithTimer = null;
      clearWraiths();            /* calm removes the leeches; the bonus is suspended too */
      playStinger('uncommon');
      save();
      render();
      renderBuffs();
    }

    /* ── Wraith-leeches (the wrinkler analog) ── */
    function scheduleWraith() {
      clearTimeout(wraithTimer);
      if (!apocActive || apocCalm()) { wraithTimer = null; return; }
      const p = Math.max(1, apocPhase());
      const wait = (30000 + Math.random() * 20000) / p;   /* faster at higher phases */
      wraithTimer = setTimeout(spawnWraith, wait);
    }

    function spawnWraith() {
      wraithTimer = null;
      if (!apocActive || apocCalm()) return;
      if (wraiths.length < MAX_WRAITHS) {
        const area = document.querySelector('.skull-area');
        if (area) {
          const el = document.createElement('div');
          el.className = 'wraith';   /* sprite is the CSS background (animated strip) */
          el.setAttribute('role', 'button');
          el.setAttribute('aria-label', 'Wraith-leech');
          el.style.left = (18 + Math.random() * 64) + '%';
          el.style.top = (8 + Math.random() * 64) + '%';
          const w = { el, bank: new Decimal(0) };
          el.addEventListener('click', () => popWraith(w));
          area.appendChild(el);
          wraiths.push(w);
        }
      }
      scheduleWraith();
    }

    function popWraith(w) {
      const i = wraiths.indexOf(w);
      if (i < 0) return;
      wraiths.splice(i, 1);
      const payout = Decimal.max(toDec(w.bank).mul(WRAITH_POP_MULT), getClickPower().mul(20));
      earn(payout);
      const bonusShards = 1 + apocPhase();
      boneShards += bonusShards;
      let msg = 'WRAITH DISGORGES — +' + formatNum(payout) + ' skulls · +' + bonusShards + ' 🦴';
      if (Math.random() < 0.10) { epitaphs += 1; msg += ' · +1 🪦'; }
      showBuffToast(msg, 'reap');
      playStinger('rare');
      burstParticles(w.el);
      if (w.el) { w.el.classList.add('pop'); setTimeout(() => w.el.remove(), 300); }
      checkAchievements();
      render();
    }

    function clearWraiths() {
      for (const w of wraiths) if (w.el) w.el.remove();
      wraiths = [];
    }

    /* ═══════ THE GRIMOIRE OF THE DEAD — Essence, unlock, and casting ═══════ */

    /* Max Essence scales off lifetime skulls (stable, never reset). */
    function essenceMax() { return Math.floor(ESSENCE_BASE + Math.pow(Math.max(0, lifetimeSkulls.add(1).log10()), 2) * ESSENCE_MAX_K); }
    function essenceRegenPerSec() { return essenceMax() * ESSENCE_REGEN_FRAC; }
    function spellCost(s) { return Math.ceil(s.costFlat + s.costFrac * essenceMax()); }
    /* Rises with the LIFETIME spells-cast counter toward a ceiling, then scaled
       by the spell's own risk — the CC "spelling mistakes" mechanic. */
    function backfireChance(s) {
      const base = BACKFIRE_MAX * (1 - 1 / (1 + spellsCast / BACKFIRE_SCALE));
      return Math.min(0.30, base * (s.risk || 1));
    }

    function unlockGrimoire() {
      if (grimoireUnlocked || graveBlooms < GRIMOIRE_UNLOCK_BLOOMS) return;
      graveBlooms -= GRIMOIRE_UNLOCK_BLOOMS;
      grimoireUnlocked = true;
      essence = essenceMax();          /* a full pool on the first unearthing */
      playStinger('legendary');
      screenShake();
      showBuffToast('📖 The Grimoire of the Dead is unearthed', 'reap');
      checkAchievements();
      save();
      render();
      renderBuildings();
    }

    function castSpell(id) {
      if (!grimoireUnlocked) return;
      const s = SPELLS.find(x => x.id === id);
      if (!s) return;
      const cost = spellCost(s);
      if (essence < cost) return;
      essence -= cost;
      spellsCast += 1;
      let msg, kind;
      if (Math.random() < backfireChance(s)) {
        spellsBackfired += 1;
        msg = s.backfire ? s.backfire() : (Math.random() < 0.5 ? WRATH_DEBUFFS.clot() : WRATH_DEBUFFS.ruin()).msg;
        kind = 'rush';                 /* orange border reads as a warning */
        playStinger('common');
        screenShake();
        msg = '⚠️ BACKFIRE — ' + msg;
      } else {
        msg = s.cast();
        kind = 'frenzy';
        playStinger('rare');
      }
      showBuffToast(msg, kind, s.icon);
      checkAchievements();
      save();
      render();
      renderBuffs();
    }

    function showBuffToast(msg, kind, icon) {
      const el = document.createElement('div');
      el.className = 'buff-toast ' + kind;
      /* Escape the (developer-authored) message, then swap the Epitaph token for
         its sprite and, when given, lead with the outcome's icon. */
      let inner = escSkull(msg).replace(/🪦/g, EPITAPH_IMG);
      if (icon && icon.indexOf('/') >= 0) inner = '<img class="toast-ico" src="' + icon + '" alt=""> ' + inner;
      el.innerHTML = inner;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
    }

    /* Standing indicator of every active timed effect (buff or debuff) with a
       live countdown, plus the active-click combo. */
    function renderBuffs() {
      const bar = document.getElementById('buffBar');
      if (!bar) return;
      const now = Date.now();
      let html = '';
      /* Skullpocalypse status leads the bar while it rages (or calms). */
      if (apocActive) {
        if (apocCalm()) {
          html += '<span class="buff-chip buff">☠️ Uprising calmed · ' + Math.ceil((apocPacifiedUntil - now) / 1000) + 's</span>';
        } else {
          const ph = apocPhase();
          html += '<span class="buff-chip apoc">☠️ ' + APOC_PHASE_NAMES[ph] + ' · +' + Math.round(APOC_PROD_BONUS[ph] * 100) + '%</span>';
        }
      }
      for (const b of activeBuffs) {
        const secs = Math.ceil((b.endsAt - now) / 1000);
        if (secs <= 0) continue;
        const ico = b.icon
          ? (b.icon.indexOf('/') >= 0
              ? '<img class="buff-ico-img" src="' + b.icon + '" alt=""> '
              : '<span class="buff-ico">' + b.icon + '</span> ')
          : '';
        html += '<span class="buff-chip ' + b.chipClass + '">' + ico + escSkull(b.name) + ' · ' + secs + 's</span>';
      }
      if (combo > 4 && now - lastClickAt < 1200) {
        html += '<span class="buff-chip combo">Combo ×' + combo + ' · +' + Math.round((comboMult() - 1) * 100) + '%</span>';
      }
      bar.innerHTML = html;
    }

    function expireBuffs() {
      tickTimedBuffs();
      if (combo > 0 && Date.now() - lastClickAt >= 1200) combo = 0;
    }

    /* ═══════ STREAM EVENTS ═══════
       A hype train (or a moderator) can fire a site-wide frenzy: cursed skulls
       come thick and fast for everyone playing. Polled so an OBS-less viewer
       still gets it; cursedFreqMult already reads window.__streamFrenzy. */
    let streamEventUntil = 0;
    async function pollSkullEvent() {
      try {
        const res = await fetch('/api/skull-clicker?event=1', { cache: 'no-store' });
        if (!res.ok) return;
        const d = await res.json();
        const ev = d && d.event;
        const now = Date.now();
        if (ev && ev.until > now) {
          window.__streamFrenzy = true;
          if (ev.until > streamEventUntil + 1000) {   /* a newly-started frenzy */
            streamEventUntil = ev.until;
            showBuffToast('🚂 STREAM FRENZY — cursed skulls incoming!', 'frenzy');
            playSound('cursed');
            spawnCursed();
          } else {
            streamEventUntil = ev.until;
          }
        } else {
          window.__streamFrenzy = false;
        }
      } catch (e) { /* silent — an event is a bonus, never load-bearing */ }
    }

    /* ═══════ RAID REWARD (claim in-game) ═══════
       A raid code is whispered, but the whisper can fail to arrive — so the
       server also stashes it per account and the game surfaces it here, code
       and all. Logged-in only; guests earn no code. */
    async function fetchRaidReward() {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-raid?reward=1', { cache: 'no-store', credentials: 'same-origin' });
        if (!res.ok) return;
        const d = await res.json();
        if (d && d.reward && d.reward.code) renderRewardBanner(d.reward);
      } catch (e) { /* the whisper is still the backup */ }
    }

    function renderRewardBanner(r) {
      const el = document.getElementById('rewardBanner');
      if (!el) return;
      const rar = String(r.rarity || 'uncommon');
      el.className = 'reward-banner rar-' + rar;
      el.hidden = false;
      el.innerHTML =
        '<div class="reward-title">🏆 Raid Reward — ' + (r.top ? 'Top Damage!' : 'Raider') + '</div>' +
        '<div class="reward-sub">You earned a <b>' + rar + '</b> code for ' + escSkull(r.boss || 'the boss') + '</div>' +
        '<div class="reward-code" title="Click to copy" onclick="copyRaidCode(this)">' + escSkull(r.code) + '</div>' +
        '<div class="reward-actions">' +
          '<button class="reward-btn" onclick="copyRaidCode(this)">Copy code</button>' +
          '<a class="reward-btn" href="/redeem.html" target="_blank" rel="noopener">Redeem</a>' +
          '<button class="reward-btn ghost" onclick="dismissRaidReward()">Got it</button>' +
        '</div>';
    }

    async function dismissRaidReward() {
      const el = document.getElementById('rewardBanner');
      if (el) el.hidden = true;
      try {
        await fetch('/api/skull-raid', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'claim-reward' }),
        });
      } catch (e) { /* it will TTL out regardless */ }
    }

    /* Copy the raid code to the clipboard. Reads it from the banner so both the
       code text and the Copy button trigger the same thing; feedback shows on
       the button. execCommand fallback for any context where the async
       Clipboard API is unavailable. */
    function copyRaidCode() {
      const banner = document.getElementById('rewardBanner');
      if (!banner) return;
      const codeEl = banner.querySelector('.reward-code');
      const code = codeEl ? codeEl.textContent.trim() : '';
      if (!code) return;
      const btn = banner.querySelector('.reward-actions .reward-btn');
      const flash = () => {
        if (!btn) return;
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(flash).catch(() => fallbackCopySkull(code, flash));
      } else {
        fallbackCopySkull(code, flash);
      }
    }
    function fallbackCopySkull(text, done) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        if (done) done();
      } catch (e) { /* clipboard blocked — the code is still shown to copy by hand */ }
    }

    /* ═══════ CO-OP RAID BOSS ═══════
       One boss shared by everyone. While it lives, each skull click also
       strikes it (queued and flushed to the server in small batches). Beat
       it and the whole site gets a frenzy (delivered via the event poller). */
    let raidState = null;
    let raidQueue = 0;          /* clicks dealt since the last flush */
    let raidSeenStatus = null;  /* to announce transitions once */

    function raidActive() { return raidState && raidState.status === 'active'; }

    async function pollRaid() {
      try {
        const res = await fetch('/api/skull-raid', { cache: 'no-store', credentials: 'same-origin' });
        if (!res.ok) return;
        applyRaid(await res.json());
      } catch (e) { /* a boss is a bonus, never load-bearing */ }
    }

    function applyRaid(s) {
      const prev = raidSeenStatus;
      raidState = s;
      renderRaidBanner();
      if (s && s.status !== prev) {
        raidSeenStatus = s.status;
        if (s.status === 'defeated' && prev === 'active') {
          showBuffToast('☠️ ' + (s.defeatedBy || 'The chat') + ' felled ' + s.name + '! Frenzy!', 'reap');
          screenShake();
          setTimeout(fetchRaidReward, 1500);   /* your code is minted on the killing blow */
        } else if (s.status === 'expired' && prev === 'active') {
          showBuffToast(s.name + ' escaped into the dark…', 'frenzy');
        } else if (s.status === 'active' && prev !== 'active') {
          showBuffToast('⚔️ ' + s.name + ' rises — click to strike!', 'rush');
          screenShake();
        }
      }
    }

    async function flushRaidDamage() {
      if (!raidActive() || raidQueue <= 0) return;
      const dmg = Math.min(100, raidQueue);
      raidQueue -= dmg;
      const p = getPlayerId();
      const body = { action: 'hit', damage: dmg };
      if (p.guestId) { body.guestId = p.guestId; body.guestName = p.guestName; }
      try {
        const res = await fetch('/api/skull-raid', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        });
        if (res.ok) applyRaid(await res.json());
      } catch (e) { raidQueue += dmg; /* put it back to retry next flush */ }
    }

    function renderRaidBanner() {
      const el = document.getElementById('raidBanner');
      if (!el) return;
      if (!raidState || raidState.status !== 'active') { el.hidden = true; return; }
      const pct = Math.max(0, Math.min(100, (raidState.hp / raidState.maxHp) * 100));
      const secs = Math.max(0, Math.floor((raidState.endsAt - Date.now()) / 1000));
      const top = (raidState.top || []).slice(0, 3).map(t => escSkull(t.name) + ' (' + formatNum(t.dmg) + ')').join(' · ');
      const shielded = raidState.shielded ? ' shielded' : '';
      const mins = (raidState.minions && raidState.minions.hp > 0)
        ? ' <span class="raid-mini-tag">minions!</span>' : '';
      el.hidden = false;
      el.innerHTML =
        '<div class="raid-head">' +
          '<span class="raid-boss-mini' + shielded + '"></span>' +
          '<span class="raid-name">⚔️ ' + escSkull(raidState.name) + mins + '</span>' +
          '<span class="raid-timer">' + formatTime(secs * 1000) + '</span></div>' +
        '<div class="raid-track"><i style="width:' + pct + '%"></i>' +
          '<span class="raid-hp">' + formatNum(raidState.hp) + ' / ' + formatNum(raidState.maxHp) + '</span></div>' +
        (top ? '<div class="raid-top">Top: ' + top + '</div>' : '<div class="raid-top">Click the skull to strike!</div>');
    }

    /* A quick particle burst where a cursed skull was popped (juice). */
    function burstParticles(el) {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      for (let i = 0; i < 10; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const ang = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 50;
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 650);
      }
    }

    /* ═══════ FORMATTING ═══════ */

    /* Tiers beyond Vigintillion (10^63) have no common name, so they fall back to
       a two-letter code (AA, AB, ... ZZ) the same way most incremental games do
       once they run out of "-illion" names — covers up to 10^63 + 676*3 ≈ 10^2091,
       comfortably beyond anything a finite double can ever hold (~1.8e308). */
    function letterSuffix(n) {
      /* Bijective-ish base-26, lowercase so it can never be mistaken for a named
         suffix above (e.g. "dc" vs "Dc"). Two letters cover aa…zz (0…675) exactly
         as before; past that it simply grows (baa, bab, …), so the scheme works for
         ARBITRARILY large exponents now that Decimal has no ceiling. */
      let s = '';
      n = Math.floor(n);
      do { s = String.fromCharCode(97 + (n % 26)) + s; n = Math.floor(n / 26); } while (n > 0);
      if (s.length < 2) s = 'a' + s;
      return s;
    }
    const NUM_UNITS = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc',
      'Ud','DD','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg'];

    /* Format a Decimal (or Number/string) in the short-scale suffix style, driven
       by the Decimal's exponent/mantissa so there is no upper bound. For a
       normalised Decimal, mantissa ∈ [1,10) and floor(log10) === exponent, so the
       tier and scaled value fall straight out of exponent/mantissa — no overflow,
       no VALUE_CAP, no "MAX". */
    function formatNum(n) {
      const d = (n instanceof Decimal) ? n : toDec(n);
      if (!Number.isFinite(d.mantissa) || !Number.isFinite(d.exponent)) return '0';
      if (d.lt(0)) return '-' + formatNum(d.neg());
      if (d.lt(1000)) return Math.floor(d.toNumber()).toLocaleString();
      const tier = Math.floor(d.exponent / 3);
      const scaled = d.mantissa * Math.pow(10, d.exponent - tier * 3);
      const str = scaled < 10 ? scaled.toFixed(2) : scaled < 100 ? scaled.toFixed(1) : scaled.toFixed(0);
      const suffix = tier < NUM_UNITS.length ? NUM_UNITS[tier] : letterSuffix(tier - NUM_UNITS.length);
      return str + ' ' + suffix;
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
      const h = Math.floor(s/3600);
      return h + 'h ' + Math.floor((s%3600)/60) + 'm';
    }

    /* ═══════ RENDER ═══════ */

    function render() {
      document.getElementById('score').textContent = formatNum(skulls.floor());
      document.getElementById('perSec').textContent = formatNum(getCPS()) + ' per second';
      if (activeTab === 'prestige') renderPrestige();
      if (activeTab === 'reaping') renderReaping();
      if (activeTab === 'pet') renderPet();
      if (activeTab === 'grimoire') renderGrimoire();
      if (activeTab === 'garden') renderGarden();
      if (activeTab === 'hallowtide') renderSeason();
      if (activeTab === 'buildings') renderBuildings();
      else if (activeTab === 'upgrades') renderUpgrades();
      else if (activeTab === 'feats') renderAchievements();
      else if (activeTab === 'ranks') renderRanks();
      else if (activeTab === 'cosmetics') renderCosmetics();
      else if (activeTab === 'stats') renderStats();
    }

    /* ═══════ RANKS (leaderboards) ═══════ */
    let ranksBoard = 'season';   /* 'season' | 'alltime' */
    let ranksData = { season: null, alltime: null };

    function setRanksBoard(which) { ranksBoard = which; renderRanks(); loadRanks(); }

    function daysLeftInSeason() {
      const now = new Date();
      const end = Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1);
      return Math.max(0, Math.ceil((end - now.getTime()) / 86400000));
    }

    async function loadRanks() {
      try {
        const url = ranksBoard === 'season' ? '/api/skull-clicker?board=season' : '/api/skull-clicker?board=alltime';
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return;
        const d = await res.json();
        ranksData[ranksBoard] = ranksBoard === 'season' ? (Array.isArray(d.entries) ? d.entries : []) : (Array.isArray(d) ? d : []);
        if (activeTab === 'ranks') renderRanks();
      } catch (e) { /* leave whatever we last had */ }
    }

    function renderRanks() {
      const el = document.getElementById('tab-ranks');
      const entries = ranksData[ranksBoard];
      const me = (playerName || '').toLowerCase();

      let head = helpBox('ranks', HELP.ranks) +
        '<div class="ranks-toggle">' +
        '<button class="ranks-tab ' + (ranksBoard === 'season' ? 'active' : '') + '" onclick="setRanksBoard(\'season\')">This Season</button>' +
        '<button class="ranks-tab ' + (ranksBoard === 'alltime' ? 'active' : '') + '" onclick="setRanksBoard(\'alltime\')">All-Time</button></div>';

      if (ranksBoard === 'season') {
        head += '<div class="ranks-note">Skulls gathered this month · <b>' + daysLeftInSeason() + ' days</b> left · resets each month, bragging rights only</div>' +
          '<div class="ranks-you">Your season: <b>' + formatNum(seasonScore()) + '</b></div>';
      } else {
        head += '<div class="ranks-note">Lifetime skulls gathered — never resets.</div>' +
          '<div class="ranks-you">Your lifetime: <b>' + formatNum(lifetimeSkulls.floor()) + '</b></div>';
      }

      let rows;
      if (entries === null) {
        rows = '<div class="ranks-empty">Loading…</div>';
      } else if (!entries.length) {
        rows = '<div class="ranks-empty">No one has ranked yet. Be the first.</div>';
      } else {
        rows = entries.map((e, i) => {
          const mine = (e.name || '').toLowerCase() === me && me;
          const pb = e.prestige > 0 ? ' <span class="rank-prestige">P' + e.prestige + '</span>' : '';
          /* Ascension count beside the prestige badge — only when > 0, and safe
             for older entries that have no ascensions field (treated as 0). */
          const ab = (e.ascensions || 0) > 0 ? ' <span class="rank-ascension">A' + e.ascensions + '</span>' : '';
          return '<div class="rank-row ' + (mine ? 'mine' : '') + '">' +
            '<span class="rank-pos ' + (i < 3 ? 'medal' : '') + '">' + (i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1)) + '</span>' +
            '<span class="rank-name">' + escSkull(e.name) + pb + ab + '</span>' +
            '<span class="rank-score">' + formatNum(e.score) + '</span></div>';
        }).join('');
      }
      el.innerHTML = head + '<div class="ranks-list">' + rows + '</div>';
    }

    function escSkull(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

    function renderAchievements() {
      const el = document.getElementById('tab-feats');
      const earned = achievements.size, total = ACHIEVEMENTS.length;
      let html = '<div class="feats-head">' + earned + ' / ' + total +
        ' feats · <b>+' + earned + '%</b> to all production</div><div class="feats-grid">';
      for (const a of ACHIEVEMENTS) {
        const got = achievements.has(a.id);
        html += '<div class="feat ' + (got ? 'got' : 'locked') + '">' +
          '<div class="feat-name">' + a.name + '</div>' +
          '<div class="feat-desc">' + (got ? a.desc : '???') + '</div></div>';
      }
      el.innerHTML = html + '</div>';
    }

    function renderSettings() {
      const b = document.getElementById('soundBtn');
      if (b) b.textContent = soundOn ? '🔊' : '🔇';
    }

    /* ═══════ THE WORLD ═══════
       Cookie-Clicker-style: every building you own is drawn here and the
       crowd fills up as you buy more, capped so a band never overflows —
       past the cap the count keeps climbing on the label. Rebuilt only on
       buy, load and prestige (never in the tick loop), so it stays cheap.
       Positions are seeded off (band, index) so a rebuild lands every sprite
       exactly where it was — no flicker — and only the just-bought one pops. */
    const WORLD_CAP = 18;
    let lastBought = null;

    function wRand(s) { const x = Math.sin(s) * 43758.5453; return x - Math.floor(x); }

    function renderWorld() {
      const ground = document.getElementById('worldGround');
      const empty = document.getElementById('worldEmpty');
      if (!ground) return;
      let html = '';
      let any = false;
      for (let bi = 0; bi < BUILDINGS.length; bi++) {
        const b = BUILDINGS[bi];
        const cnt = owned[b.id] || 0;
        if (cnt <= 0) continue;
        any = true;
        const n = Math.min(cnt, WORLD_CAP);
        const step = WORLD_CAP > 1 ? 86 / (WORLD_CAP - 1) : 0;
        let sprites = '';
        for (let i = 0; i < n; i++) {
          const left = 3 + i * step;
          const jx = (wRand(bi * 31.7 + i * 2.3) - 0.5) * 3;
          const jy = wRand(bi * 17.1 + i * 5.9) * 9;
          const sc = 0.82 + wRand(bi * 11.3 + i * 3.1) * 0.34;
          const fresh = (lastBought === b.id && i === n - 1) ? ' fresh' : '';
          sprites += '<img class="world-sprite' + fresh + '" src="assets/buildings/' + b.id +
            '.png" alt="" onerror="this.remove()" style="left:calc(' + left.toFixed(2) + '% + ' +
            jx.toFixed(1) + 'px);bottom:' + (4 + jy).toFixed(1) + 'px;transform:scale(' +
            sc.toFixed(2) + ');z-index:' + i + '">';
        }
        const label = b.name + ' ×' + (cnt >= 1000 ? formatNum(cnt) : cnt);
        html += '<div class="world-band">' + sprites +
          '<span class="world-band-label">' + label + '</span></div>';
      }
      ground.innerHTML = html;
      empty.style.display = any ? 'none' : 'flex';
      lastBought = null;
      renderMiasma();
    }

    /* Size the Miasma pool from the meter (cheap; called on buy/load/prestige
       and whenever a feat is earned — never per frame). Flavor deepens at feat
       milestones, all within the black/grey/red palette. */
    function renderMiasma() {
      const pool = document.getElementById('miasmaPool');
      if (!pool) return;
      const m = Math.min(1, miasma());                 /* 0..1 for the visual */
      pool.style.height = (m > 0 ? (8 + m * 72) : 0) + '%';
      pool.style.opacity = (m > 0 ? (0.25 + m * 0.7) : 0).toFixed(2);
      const n = achievements.size;
      const flavor = n >= 22 ? 'flavor-void' : n >= 14 ? 'flavor-ash' : n >= 7 ? 'flavor-crimson' : '';
      pool.className = 'miasma-pool ' + flavor;
    }

    function bloomTimerText() {
      const ready = readyBlooms();
      if (ready > 0) return ready + ' bloom' + (ready === 1 ? '' : 's') + ' ready to harvest';
      return 'Next bloom ripens in ' + formatTime(nextBloomInMs());
    }

    /* ═══════ "HOW IT WORKS" DROPDOWNS ═══════
       Presentational only — a native <details> per major system, collapsed by
       default so veterans see no clutter. Content is authored to match the real
       mechanics/numbers in this file. */
    /* Open/closed state is kept in this in-memory Set (keyed by a stable id per
       placement) so it survives the per-second innerHTML rebuild on the Grimoire /
       Garden / Hallowtide tabs — rebuilding the DOM would otherwise recreate the
       <details> collapsed every tick. EPHEMERAL: never saved, resets on reload. */
    let helpOpen = new Set();
    function helpToggle(id, isOpen) { if (isOpen) helpOpen.add(id); else helpOpen.delete(id); }
    function helpBox(id, body) {
      return '<details class="help-box"' + (helpOpen.has(id) ? ' open' : '') +
        ' ontoggle="helpToggle(\'' + id + '\', this.open)">' +
        '<summary class="help-sum">❔ How it works</summary>' +
        '<div class="help-body">' + body + '</div></details>';
    }

      upgrades: 'Upgrades are one-time buys that permanently sharpen your run — some boost click power, some multiply whole buildings (synergies). They reset when you prestige, so grab the cheap ones early each run. Tip: <b>synergy</b> upgrades unlock once you own enough of a building and are often the best value on the board.',

      prestige: 'Prestige resets your current run — skulls, buildings and upgrades — for a permanent <b>+0.1×</b> production multiplier and <b>Bone Shards</b> to spend in the shard shop. Do it once the bar is full and the next run will blow past this one. Tip: your run + prestige also reset at the start of each month, but ascension, Grave Blooms, the minigames and feats are always kept.',

      apoc: 'Unlocks at <b>1 trillion</b> lifetime skulls or <b>Prestige ' + APOC_UNLOCK_PRESTIGE + '</b>. Toggle it on for a growing production bonus, but it escalates through <b>Stirring → Rising → Full Undeath</b>: wraith-leeches latch onto the skull and drain CPS (pop them for a payout), and cursed skulls can turn wrathful — bigger buffs, but a chance to curse you. Tip: spend Bone Shards to <b>pacify</b> the uprising for a few minutes of calm.',

    function renderBuildings() {
      const el = document.getElementById('tab-buildings');
      const ready = readyBlooms();
      const bloomPanel = `<div class="bloom-panel">
        <img class="bloom-ico" src="${BLOOM_ICON}" alt="" onerror="this.style.display='none'">
        <div class="bloom-info">
          <div class="bloom-count"><b id="bloomCount">${formatNum(graveBlooms)}</b> Grave Bloom${graveBlooms === 1 ? '' : 's'} · spend to level buildings</div>
          <div class="bloom-timer" id="bloomTimer">${bloomTimerText()}</div>
        </div>
        <button class="bloom-harvest" id="bloomHarvest" ${ready > 0 ? '' : 'disabled'} onclick="harvestBlooms()">${ready > 0 ? 'Harvest ' + ready : 'Ripening'}</button>
      </div>`;

      const amounts = [1, 10, 100, 'max'];
      let html = helpBox('buildings', HELP.buildings) + bloomPanel + helpBox('blooms', HELP.blooms) + '<div class="buy-toggle">' + amounts.map(a =>
        `<button class="buy-amt ${buyAmount === a ? 'active' : ''}" onclick="setBuyAmount(${a === 'max' ? "'max'" : a})">${a === 'max' ? 'Max' : '×' + a}</button>`
      ).join('') + '</div>';
      let rows = '';
      for (const b of BUILDINGS) {
        const cnt = owned[b.id];
        const revealed = totalSkulls.gte(b.baseCost * 0.5) || cnt > 0;
        if (!revealed) continue;
        const qty = buyAmount === 'max' ? Math.max(1, maxAffordable(b)) : buyAmount;
        const cost = getBulkCost(b, qty);
        const can = buyAmount === 'max' ? maxAffordable(b) >= 1 : skulls.gte(cost);
        const cps = new Decimal(b.baseCps).mul(cnt).mul(getBuildingMult(b) * buildingLevelMult(b.id) * globalCpsMult);
        const qtyBadge = buyAmount === 1 ? '' : ` <span class="buy-qty">×${qty}</span>`;
        const lvl = buildingLevel(b.id);
        const lvlCost = bloomLevelCost(b.id);
        const canLvl = graveBlooms >= lvlCost;
        /* Level control appears once you own the building; clicking it spends
           blooms, not skulls, and never triggers the row's buy (stopPropagation). */
        const levelCtl = cnt > 0
          ? `<div class="bldg-level ${canLvl ? 'can' : ''}" onclick="levelBuilding('${b.id}', event)" title="Spend Grave Blooms to level this building (+${Math.round(BLOOM_LEVEL_BONUS * 100)}% output)">
               <span class="bldg-lv">Lv ${lvl}</span>
               <span class="bldg-lvcost">${lvlCost}<img class="bloom-mini" src="${BLOOM_ICON}" alt="" onerror="this.style.display='none'"></span>
             </div>`
          : '';
        rows += `<div class="building-row ${can ? 'affordable' : ''}" onclick="buyBuilding('${b.id}', event)">
          <div class="building-icon"><img src="assets/buildings/${b.id}.png" alt="" onerror="this.remove()">${cnt > 0 ? `<span class="building-count">${cnt}</span>` : ''}</div>
          <div class="building-info">
            <div class="building-name">${b.name}${lvl > 0 ? ` <span class="bldg-lv-tag">Lv ${lvl}</span>` : ''}</div>
            <div class="building-desc">${b.desc}</div>
            ${cnt > 0 ? `<div class="building-cps">${formatNum(cps)}/s total</div>` : ''}
          </div>
          <div class="building-right">
            <div class="building-cost">${formatNum(cost)}${qtyBadge}</div>
            ${levelCtl}
          </div>
        </div>`;
      }
      el.innerHTML = html + (rows || '<div style="text-align:center;color:#333;padding:20px;font-size:12px;text-shadow:none">Keep clicking to unlock buildings!</div>');
    }

    /* Live-update the bloom panel's timer/count/harvest button in place (no row
       rebuild, so scrolling is never interrupted). Cheap; runs once a second. */
    function updateBloomTimer() {
      const t = document.getElementById('bloomTimer');
      if (!t) return;   /* buildings tab not showing */
      t.textContent = bloomTimerText();
      const ready = readyBlooms();
      const btn = document.getElementById('bloomHarvest');
      if (btn) { btn.disabled = ready <= 0; btn.textContent = ready > 0 ? 'Harvest ' + ready : 'Ripening'; }
      const c = document.getElementById('bloomCount');
      if (c) c.textContent = formatNum(graveBlooms);
    }
    setInterval(updateBloomTimer, 1000);

    function renderUpgrades() {
      const el = document.getElementById('tab-upgrades');
      let html = helpBox('upgrades', HELP.upgrades);

      /* Synergy first when any are in reach — they are the interesting, deep
         buys, so surface them rather than burying them under the flat list. */
      const synViz = SYNERGY.filter(u => boughtUpgrades.has(u.id) || (owned[u.building] || 0) >= Math.ceil(u.req / 2));
      if (synViz.length) {
        html += '<div class="section-label">Synergy</div>';
        for (const u of synViz) html += synergyRow(u);
      }

      html += '<div class="section-label">Click Power</div>';
      for (const u of UPGRADES.filter(u => u.tag === 'click')) html += upgradeRow(u);
      html += '<div class="section-label">CPS Multipliers</div>';
      for (const u of UPGRADES.filter(u => u.tag === 'mult')) html += upgradeRow(u);

      /* Ghouls — feed on the Miasma. Reveal each once it is roughly in reach (or
         already owned) so early runs are not flooded with far-off buys. */
      const ghoulViz = GHOULS.filter(g => boughtGhouls.has(g.id) || totalSkulls.gte(g.cost * 0.3));
      if (ghoulViz.length) {
        const mp = Math.round(miasma() * 100);
        const gm = Math.round((ghoulMult() - 1) * 100);
        html += helpBox('ghouls', HELP.ghouls);
        html += '<div class="section-label">Ghouls — they feed on the Miasma</div>';
        html += '<div class="feats-head">Miasma <b>' + mp + '%</b> · your ghouls give <b>+' + gm + '%</b> production</div>';
        for (const g of ghoulViz) html += ghoulRow(g);
      }

      el.innerHTML = html;
    }

    function ghoulRow(g) {
      const bought = boughtGhouls.has(g.id);
      const can = skulls.gte(g.cost);
      return `<div class="upgrade-row ${bought ? 'bought' : can ? 'affordable' : ''}" onclick="${bought ? '' : `buyGhoul('${g.id}', event)`}">
        <img class="ghoul-ico" src="assets/icons/ghoul.png" alt="" onerror="this.remove()">
        <div class="building-info">
          <div class="building-name">${g.name} <span class="upgrade-tag tag-ghoul">ghoul</span></div>
          <div class="building-desc">${g.desc} <span class="perk-now">(+${(g.factor * 100).toFixed(0)}% at full miasma)</span></div>
        </div>
        <div class="building-right"><div class="building-cost">${bought ? 'Owned' : formatNum(g.cost)}</div></div>
      </div>`;
    }

    function synergyRow(u) {
      const bought = boughtUpgrades.has(u.id);
      const have = owned[u.building] || 0;
      const unlocked = have >= u.req;
      const can = unlocked && skulls.gte(u.cost);
      const state = bought ? 'bought' : can ? 'affordable' : unlocked ? '' : 'locked';
      const right = bought ? 'Owned' : unlocked ? formatNum(u.cost) : ('Needs ' + u.req);
      return `<div class="upgrade-row ${state}" onclick="${bought || !unlocked ? '' : `buySynergy('${u.id}', event)`}">
        <div class="building-info">
          <div class="building-name">${u.name} <span class="upgrade-tag tag-syn">synergy</span></div>
          <div class="building-desc">${u.desc}</div>
        </div>
        <div class="building-right"><div class="building-cost">${right}</div></div>
      </div>`;
    }

    function upgradeRow(u) {
      const bought = boughtUpgrades.has(u.id);
      const can = skulls.gte(u.cost);
      const tagClass = u.tag === 'click' ? 'tag-click' : u.tag === 'cps' ? 'tag-cps' : 'tag-mult';
      return `<div class="upgrade-row ${bought ? 'bought' : can ? 'affordable' : ''}" onclick="${bought ? '' : `buyUpgrade('${u.id}', event)`}">
        <div class="building-info">
          <div class="building-name">${u.name} <span class="upgrade-tag ${tagClass}">${u.tag}</span></div>
          <div class="building-desc">${u.desc}</div>
        </div>
        <div class="building-right">
          <div class="building-cost">${bought ? 'Owned' : formatNum(u.cost)}</div>
        </div>
      </div>`;
    }

      const cp = getClickPower();

        if (owned[b.id] > 0) {

          bldgTotal += owned[b.id];
          bldgBreakdown += `<div class="stat-row"><span class="stat-label">${b.name}</span><span class="stat-val">x${owned[b.id]} (${formatNum(c)}/s)</span></div>`;

      }
      document.getElementById('tab-stats').innerHTML = `
        <div class="section-label">Overview</div>

        <div class="stat-row"><span class="stat-label">Time played</span><span class="stat-val">${formatTime(elapsed)}</span></div>
        <div class="stat-row"><span class="stat-label">Prestige tier</span><span class="stat-val">${prestige}</span></div>
        <div class="stat-row"><span class="stat-label">Highest prestige</span><span class="stat-val">${highestPrestige}</span></div>

        <div class="stat-row"><span class="stat-label">Epitaphs</span><span class="stat-val">${EPITAPH_IMG} ${formatNum(epitaphs)}</span></div>
        <div class="stat-row"><span class="stat-label">Grave Blooms</span><span class="stat-val">${formatNum(graveBlooms)}${readyBlooms() > 0 ? ' (+' + readyBlooms() + ' ripe)' : ''}</span></div>
        <div class="stat-row"><span class="stat-label">Building levels</span><span class="stat-val">${BUILDINGS.reduce((s, b) => s + buildingLevel(b.id), 0)}</span></div>
        <div class="stat-row"><span class="stat-label">${PET_NAME}</span><span class="stat-val">Level ${petLevel}${selectedAuras.length ? ' · ' + selectedAuras.length + ' aura' + (selectedAuras.length === 1 ? '' : 's') : ''}</span></div>
        <div class="stat-row"><span class="stat-label">Skullpocalypse</span><span class="stat-val">${!apocUnlocked ? 'Locked' : apocActive ? (apocCalm() ? 'Calmed' : APOC_PHASE_NAMES[apocPhase()]) : 'Dormant'}</span></div>
        <div class="stat-row"><span class="stat-label">Grimoire</span><span class="stat-val">${grimoireUnlocked ? 'Unearthed · ' + formatNum(Math.floor(Math.min(essence, essenceMax()))) + '/' + formatNum(essenceMax()) + ' Essence' : 'Buried'}</span></div>
        <div class="stat-row"><span class="stat-label">Spells cast / backfired</span><span class="stat-val">${formatNum(spellsCast)} / ${formatNum(spellsBackfired)}</span></div>
        <div class="stat-row"><span class="stat-label">Cursed Garden</span><span class="stat-val">${gardenUnlocked ? gardenSide() + '×' + gardenSide() + ' · ' + STRAINS.filter(s => s.plantable && discoveredStrains.has(s.id)).length + '/' + STRAINS.filter(s => s.plantable).length + ' strains · ' + formatNum(gardenHarvests) + ' harvested' : 'Untilled'}</span></div>
        <div class="stat-row"><span class="stat-label">Hallowtide</span><span class="stat-val">${!seasonUnlocked ? 'Dormant' : (seasonActive() ? (seasonAutoWindow() ? 'Lit (auto)' : 'Lit') : 'Ready') + ' · ' + seasonRelics.size + '/' + SEASON_RELICS.length + ' relics · ' + formatNum(wisps) + ' ' + WISP_IMG}</span></div>
        <div class="section-label">Production</div>
        <div class="stat-row"><span class="stat-label">Click power</span><span class="stat-val">${formatNum(cp)}</span></div>
        <div class="stat-row"><span class="stat-label">Per second</span><span class="stat-val">${formatNum(cps)}</span></div>

        <div class="stat-row"><span class="stat-label">Miasma</span><span class="stat-val">${Math.round(miasma() * 100)}%</span></div>
        <div class="stat-row"><span class="stat-label">Ghoul bonus</span><span class="stat-val">+${Math.round((ghoulMult() - 1) * 100)}% (${boughtGhouls.size}/${GHOULS.length} ghouls)</span></div>
        <div class="stat-row"><span class="stat-label">Buildings owned</span><span class="stat-val">${bldgTotal}</span></div>
        <div class="stat-row"><span class="stat-label">Upgrades bought</span><span class="stat-val">${boughtUpgrades.size}/${UPGRADES.length}</span></div>
        ${bldgBreakdown ? '<div class="section-label">Buildings Breakdown</div>' + bldgBreakdown : ''}
        <div style="margin-top:20px;text-align:center">
          <button style="background:#1a0000;border:1px solid #330000;color:#ff4444;padding:8px 20px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:11px;text-shadow:none" onclick="hardReset()">Reset All Progress</button>
        </div>
      `;
    }

    function switchTab(tab) {
      activeTab = tab;
      const tabs = ['buildings','upgrades','prestige','reaping','pet','grimoire','garden','hallowtide','feats','ranks','cosmetics','stats'];
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        const on = tabs[i] === tab;
        btn.classList.toggle('active', on);
        if (on && btn.scrollIntoView) btn.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      });
      document.querySelectorAll('.tab-content').forEach((el, i) => {
        el.classList.toggle('active', tabs[i] === tab);
      });
      render();
      if (tab === 'ranks') loadRanks();
    }

    /* ═══════ GAME LOOP ═══════ */

    let tickCount = 0;
    function tick() {
      const now = Date.now();
      const dt = (now - lastTick) / 1000;
      lastTick = now;
      expireBuffs();
      if (grimoireUnlocked && essence < essenceMax()) essence = Math.min(essenceMax(), essence + essenceRegenPerSec() * dt);
      const earned = getCPS().mul(dt);
      if (earned.gt(0)) {
        earn(earned);
        checkMilestones();
      }
      /* Wraith-leeches fatten on the gross production the drain removed. */
      if (wraiths.length) {
        const perW = getGrossCPS().mul(WRAITH_DRAIN * dt);
        for (const w of wraiths) w.bank = toDec(w.bank).add(perW);
      }
      document.getElementById('score').textContent = formatNum(skulls.floor());
      document.getElementById('perSec').textContent = formatNum(getCPS()) + ' per second';
      renderBuffs();

      /* Passive feats (skulls/buildings) caught about once a second — cheap,
         and no need to check 10×/s. */
      if (++tickCount % 10 === 0) {
        checkAchievements();
        checkApocUnlock();
        /* Reach Full Undeath → flag the feat; restart wraith spawns after a calm. */
        if (apocActive && !apocCalm()) {
          if (apocPhase() >= 3 && !apocEverFull) { apocEverFull = true; checkAchievements(); }
          if (!wraithTimer) scheduleWraith();
        }
      }

      if (now - lastSave > 30000) {
        save();
        lastSave = now;
      }
    }

    setInterval(tick, 100);

    /* ═══════ AUTOMATION (Reaping meta unlocks) ═══════
       Each loop is a cheap no-op until its meta node is unlocked. Fast loop
       for the auto-click feel; a slower loop for the bookkeeping actions so
       buying/prestiging never floods the render or the network. */
    function autoClickTick() {
      if (!autoEnabled('auto_click')) return;
      let power = getClickPower();
      if (Math.random() < critChance()) power = power.mul(critMult());
      earn(power);
