<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skull Clicker</title>
  <script>try{var _pt=function(t){var e=document.documentElement;if(t==="light")e.setAttribute("data-theme","light");else e.removeAttribute("data-theme");};_pt(localStorage.getItem("pham-theme"));addEventListener("storage",function(v){if(v.key==="pham-theme")_pt(v.newValue);});}catch(e){}</script>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/game-identity.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      color: var(--text-pri);
      font-family: var(--font-ui);
      min-height: 100vh;
      user-select: none;
      overflow-x: hidden;
    }

    .game-wrap {
      display: flex;
      flex-direction: column;
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 16px 12px 8px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-family: var(--font-display);
 letter-spacing: normal; font-size: 22px; color: var(--red); margin-bottom: 2px; }
    .score-display { font-size: 45px; font-weight: 800; color: var(--text-pri); line-height: 1.2; }
    .per-sec { font-size: 15px;
 text-shadow: none; color: var(--text-pri); margin-top: 2px; }

    /* News ticker */
    .news-ticker {
      text-align: center;
      font-size: 15px;
      text-shadow: none;
      font-style: italic;
      color: #c7a3a3;
      padding: 6px 16px 0;
      min-height: 20px;
      transition: opacity 0.4s;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .news-ticker.fade { opacity: 0; }
    /* Light mode: the muted mauve whisper is invisible on parchment — use a
       muted ink-brown that reads as a whisper on paper. */
    :root[data-theme="light"] .news-ticker { color: #8a7350; }

    /* Screen shake on milestones */
    .shake { animation: shake 0.5s; }
    @keyframes shake {
      0%,100% { transform: translate(0,0); }
      20% { transform: translate(-5px, 2px); }
      40% { transform: translate(5px, -2px); }
      60% { transform: translate(-4px, -1px); }
      80% { transform: translate(4px, 1px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .shake { animation: none; }
      .news-ticker { transition: none; }
    }

    /* Skull Button */
    .skull-area {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
      flex-shrink: 0;
    }
    .skull-btn {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #222, #111, #000);
      border: 2px solid var(--border-mid);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s, border-color 0.2s, background 0.2s;
      position: relative;
    }
    .skull-btn:hover { border-color: var(--red); background: radial-gradient(circle at 40% 35%, #331111, #1a0000, #000); }
    .skull-btn:active { transform: scale(0.93); }
    .skull-btn img { width: 65%; height: auto; pointer-events: none; }
    .click-pop {
      position: absolute;
      font-size: 21px; font-weight: 800;
      color: var(--red);
      pointer-events: none;
      animation: pop-up 0.5s ease-out forwards;
    }
    @keyframes pop-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
    }

    /* The world — accumulating building sprites */
    .world-panel {
      position: relative;
      margin: 0 12px 8px;
      height: 172px;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: linear-gradient(#0c0c0c, #050505);
      flex-shrink: 0;
    }
    .world-ground { display: flex; flex-direction: column; min-height: 100%; position: relative; z-index: 2; }
    /* The Miasma pool — the "milk pool" analog. A rising fog at the bottom of
       the world whose height/opacity are set from the meter on render (no
       per-frame loop). Palette-compliant: dark blood-red / black only, NEVER
       green. Flavor classes deepen it at feat milestones. */
    .miasma-pool {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 0; opacity: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(40,0,0,0) 0%, rgba(60,0,0,0.35) 55%, rgba(20,0,0,0.85) 100%);
      transition: height 0.6s ease, opacity 0.6s ease;
    }
    .miasma-pool.flavor-crimson { background: linear-gradient(180deg, rgba(70,0,0,0) 0%, rgba(95,0,0,0.42) 55%, rgba(32,0,0,0.9) 100%); }
    .miasma-pool.flavor-ash     { background: linear-gradient(180deg, rgba(34,24,24,0) 0%, rgba(52,32,32,0.44) 55%, rgba(16,10,10,0.92) 100%); }
    .miasma-pool.flavor-void    { background: linear-gradient(180deg, rgba(24,0,0,0) 0%, rgba(12,0,0,0.5) 55%, rgba(0,0,0,0.96) 100%); }
    @media (prefers-reduced-motion: reduce) { .miasma-pool { transition: none; } }
    /* Each building gets a tier the crowd stands on. The gradient reads as
       ground the sprites sit atop rather than a flat list. */
    .world-band {
      position: relative;
      height: 46px;
      border-bottom: 1px solid #121212;
      background: linear-gradient(180deg, transparent 60%, #0e0606 100%);
    }
    .world-band:last-child { border-bottom: none; }
    .world-band-label {
      position: absolute;
      right: 6px; top: 5px;
      z-index: 400;
      font-size: 14px;
      text-shadow: none;
      font-weight: 800;
      color: #ff5555;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #2a0d0d;
      border-radius: 3px;
      padding: 0 5px;
      letter-spacing: 0.02em;
      pointer-events: none;
    }
    .world-sprite {
      position: absolute;
      bottom: 4px;
      width: 30px;
      height: 30px;
      object-fit: contain;
      image-rendering: pixelated;
      transform-origin: bottom center;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.8));
    }
    /* The one just bought pops in; a rebuild does not replay it because only
       the freshest sprite carries the class. */
    .world-sprite.fresh { animation: sprite-in 0.35s ease-out; }
    @keyframes sprite-in {
      0% { opacity: 0; transform: translateY(-8px) scale(0.5); }
      100% { opacity: 1; }
    }
    .world-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
      color: #fff;
      font-size: 17px;
      text-shadow: none;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .world-sprite.fresh { animation: none; }
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      color: var(--text-pri);
      font-family: var(--font-system);
      font-size: 14px;
      text-shadow: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }
    .prestige-panel { text-align: center; padding: 20px 16px; }
    .prestige-tier { font-size: 36px; font-weight: 800; color: var(--red); }
    .prestige-mult { font-size: 21px; color: var(--text-pri); margin-top: 4px; }
    .prestige-next { font-size: 17px;
 text-shadow: none; color: var(--text-dim); margin: 10px 0 8px; }
    .prestige-bar { height: 10px; background: var(--gray-mid); border: 1px solid var(--border-mid); border-radius: 5px; overflow: hidden; margin: 0 auto; max-width: 320px; }
    .prestige-fill { height: 100%; background: var(--red); transition: width 0.3s; }
    .prestige-have { font-size: 15px;
 text-shadow: none; color: var(--text-dim); margin-top: 6px; }
    .prestige-btn { margin-top: 16px; padding: 10px 22px; background: var(--red); color: #fff; border: none; border-radius: 6px; font-size: 20px; font-weight: 800; cursor: pointer; }
    .prestige-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .prestige-btn:not(:disabled):hover { background: #cc0000; }
    .prestige-note { font-size: 14px;
 text-shadow: none; color: var(--text-dim); margin-top: 12px; }
    .shard-balance { text-align: center; font-size: 20px; color: var(--text-pri); margin: 4px 0 10px; }
    .shard-balance b { color: #ff5555; }
    .perk-lvl { font-size: 14px;
 text-shadow: none; font-weight: 800; color: #d98fff; margin-left: 4px; }
    .perk-now { color: #6ac46a; font-size: 14px;
 text-shadow: none; }

    /* The Reaping (ascension) — reuses prestige-panel / upgrade-row / shard-balance.
       Meta levels are red (never purple) to stay on the black/grey/red/white palette. */
    .meta-lvl { font-size: 14px; text-shadow: none; font-weight: 800; color: #ff5555; margin-left: 4px; }
    .ascend-summary { font-size: 15px; text-shadow: none; color: var(--text-dim); margin: 6px 0 2px; line-height: 1.5; }
    .ascend-summary b { color: #ff5555; }
    .ascend-locked { text-align: center; color: var(--text-dim); padding: 30px 18px; font-size: 16px; line-height: 1.6; }
    .ascend-locked b { color: #ff5555; }
    .reaping-tier { font-size: 36px; font-weight: 800; color: var(--red); }
    .reaping-sub { font-size: 17px; text-shadow: none; color: var(--text-pri); margin-top: 4px; }

    /* Ranks / leaderboard */
    .ranks-toggle { display: flex; gap: 4px; margin-bottom: 10px; }
    .ranks-tab {
      flex: 1; padding: 8px 0; background: var(--gray-lo); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text-dim); font-size: 17px;
 text-shadow: none; font-weight: 800;
      cursor: pointer; font-family: inherit;
    }
    .ranks-tab.active { border-color: var(--red); color: var(--red); background: rgba(255,0,0,0.06); }
    .ranks-note { font-size: 15px;
 text-shadow: none; color: var(--text-dim); text-align: center; margin-bottom: 6px; line-height: 1.5; }
    .ranks-note b { color: #ff5555; }
    .ranks-you { font-size: 17px;
 text-shadow: none; color: var(--text-pri); text-align: center; margin-bottom: 12px; }
    .ranks-you b { color: #ff5555; }
    .ranks-list { display: flex; flex-direction: column; gap: 4px; }
    .rank-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; background: var(--gray-lo); border: 1px solid var(--border); border-radius: 4px;
    }
    .rank-row.mine { border-color: var(--red); background: rgba(255,0,0,0.08); }
    .rank-pos { width: 26px; flex: none; text-align: center; font-weight: 800; color: var(--text-pri); font-variant-numeric: tabular-nums; }
    .rank-pos.medal { font-size: 22px; }
    .rank-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-sec); }
    .rank-prestige { font-size: 14px;
 text-shadow: none; font-weight: 800; color: #d98fff; }
    /* Ascension (Reaping) badge — display only. Red, staying on the sanctioned
       black/grey/red/white palette rather than adding a new accent. */
    .rank-ascension { font-size: 14px; text-shadow: none; font-weight: 800; color: #ff5555; }
    .rank-score { flex: none; font-weight: 800; color: var(--text-pri); font-variant-numeric: tabular-nums; }
    .ranks-empty { text-align: center; color: var(--text-pri); font-size: 17px;
 text-shadow: none; padding: 24px; }
    .tab-btn:hover { color: #ff4444; }
    /* Eight tabs: on a narrow phone they must NOT squeeze below their text
       (that ran the labels together). Keep each at its content width — grow
       to fill on a wide screen, never shrink — and let the bar scroll
       horizontally when they don't all fit. */
    .tab-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 1 0 auto; font-size: 14px;
 text-shadow: none; letter-spacing: 0.02em; padding: 10px 12px; white-space: nowrap; }

    /* Sound toggle */
    .header { position: relative; }
    .sound-btn {
      position: absolute; top: 12px; right: 12px;
      background: none; border: none; cursor: pointer;
      font-size: 25px; line-height: 1; opacity: 0.7;
    }
    .sound-btn:hover { opacity: 1; }

    /* Buff bar + chips */
    .buff-bar {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      min-height: 22px; padding: 0 12px 4px;
    }
    .buff-chip {
      font-size: 15px;
      text-shadow: none; font-weight: 800; padding: 3px 9px; border-radius: 3px;
      border: 1px solid; letter-spacing: 0.02em;
    }
    .buff-chip.frenzy { color: #ff3b3b; border-color: #ff3b3b; }
    .buff-chip.rush   { color: #ff9500; border-color: #ff9500; }
    .buff-chip.combo  { color: #ffd23b; border-color: #7a6a12; }
    /* Generic buff — neutral on-palette chrome (bone-white on grey). */
    .buff-chip.buff   { color: #e8e8e8; border-color: #555; }
    /* Debuff — distinct red outline on a dark ground so it reads as harmful. */
    .buff-chip.debuff { color: #ff5555; border-color: #ff3b3b; background: #1a0000; }
    .buff-ico { font-style: normal; }

    /* Co-op raid banner (in-game) */
    .raid-banner {
      margin: 0 12px 8px; padding: 8px 12px;
      background: rgba(28,0,0,0.92); border: 1px solid var(--red); border-radius: 6px;
    }
    .raid-head { display: flex; align-items: center; gap: 8px; }
    .raid-boss-mini {
      width: 34px; height: 34px; flex: none;
      background: url('assets/raid/idle.png') 0 0 no-repeat;
      background-size: 136px 34px;  /* idle.png is 4 frames (see js/pages/overlay-skull-raid.js's BOSS.idle) × 34px */
      image-rendering: pixelated;
      filter: drop-shadow(0 0 4px rgba(255,0,0,0.7));
      animation: raid-mini-idle 0.6s steps(4) infinite;
    }
    .raid-boss-mini.shielded { filter: drop-shadow(0 0 5px rgba(90,160,255,0.9)); }
    @keyframes raid-mini-idle { from { background-position-x: 0; } to { background-position-x: -136px; } }
    .raid-name { font-size: 18px;
 text-shadow: none; font-weight: 800; color: #ff5555; flex: 1; }
    .raid-mini-tag { font-size: 14px;
 text-shadow: none; color: #b060ff; font-weight: 800; }
    .raid-timer { font-size: 15px;
 text-shadow: none; color: #fff; font-variant-numeric: tabular-nums; }
    .raid-track {
      position: relative; height: 16px; margin: 6px 0 4px; background: #1a0000;
      border: 1px solid #3a0000; border-radius: 4px; overflow: hidden;
    }
    .raid-track i { display: block; height: 100%; background: linear-gradient(90deg,var(--red),#ff5a1f); transition: width 0.4s; }
    .raid-hp {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000;
    }
    .raid-top { font-size: 14px;
 text-shadow: none; color: #fff; text-align: center; }
    @media (prefers-reduced-motion: reduce) { .raid-track i { transition: none; } }

    /* Raid reward banner (claim your code in-game) */
    .reward-banner {
      margin: 0 12px 8px; padding: 12px; text-align: center;
      background: var(--gray-lo); border: 1px solid #ffb300; border-radius: 6px;
    }
    .reward-banner.rar-rare { border-color: #ffb300; }
    .reward-banner.rar-uncommon { border-color: #7fd0e6; }
    .reward-banner.rar-mythic { border-color: #ff5a1f; }
    .reward-title { font-size: 20px; font-weight: 800; color: var(--text-pri); }
    .reward-banner.rar-rare .reward-title { color: #ffb300; }
    .reward-banner.rar-uncommon .reward-title { color: #7fd0e6; }
    .reward-sub { font-size: 15px;
 text-shadow: none; color: var(--text-dim); margin: 3px 0 8px; }
    .reward-sub b { text-transform: uppercase; color: var(--text-pri); }
    .reward-code {
      font-size: 28px; font-weight: 800; letter-spacing: 0.15em; color: var(--text-pri);
      background: var(--black); border: 1px dashed #444; border-radius: 4px; padding: 6px; margin-bottom: 10px;
      cursor: pointer;
    }
    .reward-code:hover { border-color: var(--red); }
    .reward-actions { display: flex; gap: 8px; justify-content: center; }
    .reward-btn {
      padding: 7px 18px; border-radius: 4px; font-size: 17px;
 text-shadow: none; font-weight: 800;
      cursor: pointer; font-family: inherit; text-decoration: none;
      background: var(--red); color: #fff; border: none;
    }
    .reward-btn:hover { background: #cc0000; }
    .reward-btn.ghost { background: transparent; border: 1px solid var(--border-mid); color: var(--text-dim); }
    .reward-btn.ghost:hover { border-color: #666; color: var(--text-pri); }

    /* Buff toast (transient, centre-top) */
    .buff-toast {
      position: fixed; top: 18%; left: 50%; transform: translateX(-50%);
      z-index: 1200; padding: 12px 22px; border-radius: 6px;
      font-size: 25px; font-weight: 800; letter-spacing: 0.03em; text-align: center;
      background: var(--black); border: 2px solid var(--red); color: var(--text-pri);
      animation: toast-in 0.3s ease-out, toast-out 0.4s ease-in 2.2s forwards;
    }
    .buff-toast.frenzy { border-color: #ff3b3b; }
    .buff-toast.rush   { border-color: #ff9500; }
    .buff-toast.reap   { border-color: #7a1fff; }
    @keyframes toast-in { 0% { opacity: 0; transform: translate(-50%, -12px) scale(0.9); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    @keyframes toast-out { 100% { opacity: 0; } }

    /* Cursed skull — drifts across, click for a buff */
    .cursed-skull {
      position: fixed; top: 30vh; left: -90px; width: 72px; height: 72px;
      z-index: 1100; cursor: pointer;
      transition: left 13s linear;
      filter: drop-shadow(0 0 10px var(--red));
      animation: cursed-bob 1.4s ease-in-out infinite;
    }
    .cursed-skull img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .cursed-skull.fade { opacity: 0; transition: left 13s linear, opacity 0.4s; }
    .cursed-skull.popped { animation: cursed-pop 0.3s ease-out forwards; }
    @keyframes cursed-bob { 0%,100% { margin-top: 0; } 50% { margin-top: -12px; } }
    @keyframes cursed-pop { 100% { transform: scale(2); opacity: 0; } }

    /* Particles on a cursed pop */
    .particle {
      position: fixed; width: 6px; height: 6px; border-radius: 50%;
      background: var(--red); z-index: 1150; pointer-events: none;
      animation: particle-fly 0.65s ease-out forwards;
    }
    @keyframes particle-fly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    /* Crit click pop */
    .click-pop.crit { font-size: 31px; color: #ffd23b; }

    /* Feat toast */
    .ach-toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      z-index: 1200; background: var(--gray-lo); border: 1px solid var(--red); border-radius: 6px;
      padding: 10px 18px; text-align: center; min-width: 200px;
      animation: toast-in 0.3s ease-out, toast-out 0.5s ease-in 2.6s forwards;
    }
    .ach-toast-kind { font-size: 14px;
 text-shadow: none; text-transform: uppercase; letter-spacing: 0.14em; color: var(--red); }
    .ach-toast-name { font-size: 21px; font-weight: 800; margin: 2px 0; }
    .ach-toast-desc { font-size: 15px;
 text-shadow: none; color: var(--text-dim); }

    /* Buy-amount toggle */
    .buy-toggle { display: flex; gap: 4px; margin-bottom: 8px; }
    .buy-amt {
      flex: 1; padding: 6px 0; background: var(--gray-lo); border: 1px solid var(--border);
      border-radius: 4px; color: var(--text-dim); font-size: 17px;
 text-shadow: none; font-weight: 800;
      cursor: pointer; font-family: inherit;
    }
    .buy-amt.active { border-color: var(--red); color: var(--red); background: rgba(255,0,0,0.06); }
    .buy-qty { font-size: 14px;
 text-shadow: none; color: #ff5555; font-weight: 800; }

    /* Synergy tag + locked upgrade */
    .upgrade-tag.tag-syn { background: #2a0d2a; color: #d98fff; }
    .upgrade-row.locked { opacity: 0.4; cursor: default; }

    /* Feats grid */
    .feats-head { font-size: 17px;
 text-shadow: none; color: var(--text-dim); text-align: center; padding: 6px 0 12px; }
    .feats-head b { color: #ff3b3b; }
    .feats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .feat { border: 1px solid var(--border); border-radius: 4px; padding: 10px; background: var(--gray-lo); }
    .feat.got { border-color: #7a1212; background: rgba(152,9,10,0.10); }
    .feat.locked { opacity: 0.5; }
    .feat-name { font-size: 17px;
 text-shadow: none; font-weight: 800; color: var(--text-pri); }
    .feat.got .feat-name { color: #ff5555; }
    .feat-desc { font-size: 14px;
 text-shadow: none; color: var(--text-dim); margin-top: 3px; }

    @media (prefers-reduced-motion: reduce) {
      .cursed-skull { animation: none; }
      .particle { display: none; }
    }

    /* Content panels */
    .tab-content { display: none; flex: 1; overflow-y: auto; padding: 8px 12px 80px; }
    .tab-content.active { display: block; }

    /* Building rows */
    .building-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--gray-lo);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .building-row:hover:not(.locked) { border-color: var(--red); background: var(--red-glow); }
    .building-row.locked { opacity: 0.25; cursor: not-allowed; }
    .building-row.affordable { border-color: var(--red-dim); }
    .building-icon {
      position: relative;
      width: 40px; height: 40px;
      border-radius: 4px;
      background: var(--gray-mid);
      border: 1px solid var(--border-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .building-icon img {
      width: 36px; height: 36px;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .building-count {
      position: absolute;
      right: -1px; bottom: -1px;
      min-width: 14px;
      padding: 0 3px;
      background: var(--black);
      border: 1px solid var(--red);
      border-radius: 3px;
      font-size: 14px;
      text-shadow: none;
      line-height: 14px;
      text-align: center;
      color: var(--red);
      font-weight: 800;
    }
    .building-info { flex: 1; min-width: 0; }
    .building-name { font-size: 18px;
 text-shadow: none; font-weight: 600; color: var(--text-pri); }
    .building-desc { font-size: 14px;
 text-shadow: none; color: var(--text-pri); margin-top: 1px; }
    .building-cps { font-size: 14px;
 text-shadow: none; color: var(--text-dim); margin-top: 1px; }
    .building-right { text-align: right; flex-shrink: 0; }
    .building-cost { font-size: 17px;
 text-shadow: none; color: var(--red); font-weight: 600; }
    .building-owned { font-size: 25px; font-weight: 800; color: var(--text-dim); }

    /* Grave Bloom panel (top of the Buildings tab) + per-building level control.
       On-palette black/grey/red/white, full borders only — no box-shadow /
       side-border accent / backdrop-filter. */
    .bloom-panel {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; margin-bottom: 8px;
      background: var(--gray-lo); border: 1px solid var(--border); border-radius: 4px;
    }
    .bloom-ico { width: 34px; height: 34px; object-fit: contain; image-rendering: pixelated; flex: none; }
    .bloom-info { flex: 1; min-width: 0; }
    .bloom-count { font-size: 15px; text-shadow: none; color: var(--text-pri); }
    .bloom-count b { color: #ff5555; font-weight: 800; }
    .bloom-timer { font-size: 14px; text-shadow: none; color: var(--text-dim); margin-top: 1px; }
    .bloom-harvest {
      flex: none; padding: 7px 14px; border-radius: 4px; font-size: 15px; font-weight: 800;
      cursor: pointer; font-family: inherit; background: var(--red); color: #fff; border: none;
    }
    .bloom-harvest:not(:disabled):hover { background: #cc0000; }
    .bloom-harvest:disabled { opacity: 0.4; cursor: default; background: var(--gray-mid); color: var(--text-dim); }
    .bldg-level {
      margin-top: 4px; display: inline-flex; flex-direction: column; align-items: center;
      padding: 2px 7px; border: 1px solid var(--border-mid); border-radius: 4px;
      cursor: pointer; line-height: 1.15;
    }
    .bldg-level.can { border-color: var(--red); }
    .bldg-level:hover { border-color: var(--red); }
    .bldg-lv { font-size: 14px; text-shadow: none; font-weight: 800; color: var(--text-pri); }
    .bldg-lvcost { font-size: 13px; text-shadow: none; color: #ff5555; font-weight: 800; display: inline-flex; align-items: center; gap: 2px; }
    .bldg-lvcost .bloom-mini { width: 12px; height: 12px; object-fit: contain; image-rendering: pixelated; }
    .bldg-lv-tag { font-size: 13px; text-shadow: none; font-weight: 800; color: #ff5555; }

    /* The Bound Reaper (pet) panel + animated sprite + aura rows. On-palette;
       depth from borders and a drop-shadow on the NON-box sprite only. */
    .pet-panel { text-align: center; padding: 14px 12px 12px; }
    .pet-sprite {
      width: 84px; height: 84px; margin: 0 auto;
      background: url('assets/pet/reaper.png') 0 0 no-repeat;
      background-size: 672px 84px;   /* 448×56 strip, 8 frames, scaled ×1.5 */
      image-rendering: pixelated;
      animation: pet-idle 0.9s steps(8) infinite;
      filter: drop-shadow(0 0 6px rgba(255, 0, 0, 0.5));
    }
    @keyframes pet-idle { from { background-position-x: 0; } to { background-position-x: -672px; } }
    .pet-name { font-family: var(--font-display); letter-spacing: normal; font-size: 22px; color: var(--red); margin-top: 6px; }
    .pet-level { font-size: 17px; text-shadow: none; color: var(--text-pri); font-weight: 800; }
    .pet-feed-info { font-size: 15px; text-shadow: none; color: var(--text-dim); margin: 8px 0 4px; }
    .pet-feed-info b { color: #ff5555; }
    .pet-have { color: var(--text-dim); }
    .pet-feed-btn {
      margin-top: 6px; padding: 9px 20px; background: var(--red); color: #fff; border: none;
      border-radius: 6px; font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit;
    }
    .pet-feed-btn:not(:disabled):hover { background: #cc0000; }
    .pet-feed-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--gray-mid); color: var(--text-dim); }
    .aura-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--gray-lo); border: 1px solid var(--border); border-radius: 4px;
      margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s, background 0.2s;
    }
    .aura-row:hover:not(.locked) { border-color: var(--red); }
    .aura-row.equipped { border-color: var(--red); background: rgba(255, 0, 0, 0.06); }
    .aura-row.locked { opacity: 0.4; cursor: not-allowed; }
    .aura-on { font-size: 13px; text-shadow: none; color: var(--red); font-weight: 800; letter-spacing: 0.05em; }
    @media (prefers-reduced-motion: reduce) { .pet-sprite { animation: none; } }

    /* Upgrade rows */
    .upgrade-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--gray-lo);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upgrade-row:hover:not(.locked):not(.bought) { border-color: var(--red); background: var(--red-glow); }
    .upgrade-row.locked { opacity: 0.25; cursor: not-allowed; }
    .upgrade-row.bought { opacity: 0.4; cursor: default; border-color: var(--border); }
    .upgrade-row.bought .building-cost { color: #0a0; }

    @keyframes reject-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }
    .building-row.reject-shake, .upgrade-row.reject-shake {
      animation: reject-shake 0.35s ease-in-out;
      border-color: var(--red) !important;
    }
    .upgrade-tag {
      font-size: 14px;
      text-shadow: none; font-weight: 700;
      padding: 2px 6px; border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tag-click { background: #220000; color: #ff4444; }
    .tag-cps { background: #001122; color: #4488ff; }
    .tag-mult { background: #112200; color: #88cc44; }
    .tag-ghoul { background: #1a0000; color: #ff5555; }

    /* Stats */
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
      text-shadow: none;
    }
    .stat-label { color: var(--text-pri); }
    .stat-val { color: var(--text-pri); font-weight: 600; }

    /* Milestone popup */
    .milestone {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: var(--gray-mid);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 20px 36px;
      text-align: center;
      z-index: 100;
      animation: ms-pop 2s ease-out forwards;
    }
    .milestone h3 { font-size: 16px;
 text-shadow: none; color: var(--red); margin-bottom: 4px; }
    .milestone p { font-size: 15px;
 text-shadow: none; color: var(--text-pri); }
    @keyframes ms-pop {
      0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
      12% { transform: translate(-50%,-50%) scale(1.1); opacity: 1; }
      22% { transform: translate(-50%,-50%) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
    }

    /* Save indicator */
    .save-msg {
      position: fixed; bottom: 12px; right: 12px;
      font-size: 14px;
      text-shadow: none; color: var(--text-dim);
      opacity: 0; transition: opacity 0.3s;
    }
    .save-msg.show { opacity: 1; }

    /* Offline earnings banner */
    .offline-banner {
      text-align: center;
      padding: 10px;
      background: var(--gray-mid);
      border: 1px solid var(--border-mid);
      border-radius: 4px;
      margin: 8px 12px;
      font-size: 17px;
      text-shadow: none;
      color: var(--amber);
      cursor: pointer;
    }
    .offline-banner:hover { background: var(--gray-hi); }

    .boost-banner {
      text-align: center;
      padding: 8px 12px;
      background: linear-gradient(90deg, #1a0000, #330000, #1a0000);
      border: 1px solid var(--red);
      border-radius: 4px;
      margin: 8px 12px;
      font-size: 18px;
      text-shadow: none;
      font-weight: bold;
      color: var(--red);
      animation: boost-pulse 1.5s ease-in-out infinite;
    }
    @keyframes boost-pulse {
      0%, 100% { border-color: var(--red); background: linear-gradient(90deg, #1a0000, #330000, #1a0000); }
      50% { border-color: #ff8888; background: linear-gradient(90deg, #330000, #660000, #330000); }
    }

    .section-label {
      font-size: 14px;
      text-shadow: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin: 12px 0 6px;
    }

    /* Cosmetics */
    .cosmetic-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; border: 1px solid var(--border); border-radius: 4px;
      margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s;
    }
    .cosmetic-row:hover { border-color: var(--border-mid); }
    .cosmetic-row.equipped { border-color: var(--red); background: rgba(255,0,0,0.05); }
    .cosmetic-icon { width: 36px; height: 36px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 25px; flex-shrink: 0; }
    .cosmetic-info { flex: 1; }
    .cosmetic-name { font-size: 17px;
 text-shadow: none; font-weight: 600; color: var(--text-pri); }
    .cosmetic-desc { font-size: 14px;
 text-shadow: none; color: var(--text-pri); margin-top: 2px; }
    .cosmetic-badge { font-size: 14px;
 text-shadow: none; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 1px 6px; border-radius: 2px; font-weight: 700; }
    .badge-common { background: var(--gray-mid); color: var(--text-pri); }
    .badge-uncommon { background: #0a1a0a; color: #44bb44; }
    .badge-rare { background: #0a0a1e; color: #4466ee; }
    .badge-mythic { background: #1a0a1a; color: #aa44ff; }
    .cosmetic-equipped-tag { font-size: 14px;
 text-shadow: none; color: var(--red); font-weight: 700; }
    .cosmetic-empty { text-align: center; color: var(--text-dim); padding: 30px 16px; font-size: 17px;
 text-shadow: none; line-height: 1.6; }

    .skull-btn.theme-blood { border-color: #cc0000; border-width: 3px; background: radial-gradient(circle at 40% 35%, #440000, #1a0000, #000); }
    .skull-btn.theme-void { border-color: #6600cc; border-width: 3px; background: radial-gradient(circle at 40% 35%, #2a0044, #150022, #000); }
    .skull-btn.theme-chaos { border-color: #ff6600; border-width: 3px; background: radial-gradient(circle at 40% 35%, #442200, #221100, #000); }
    .skull-btn.theme-eternal { border-color: #aa44ff; border-width: 3px;
      background: radial-gradient(circle at 40% 35%, #33115a, #1a0a2e, #000);
      animation: eternal-pulse 2s ease-in-out infinite; }
    @keyframes eternal-pulse {
      0%, 100% { border-color: #aa44ff; }
      50% { border-color: #ff99ff; }
    }
    .click-effect-blood .click-pop { color: #ff3333 !important; }
    .click-effect-void .click-pop { color: #aa66ff !important; }
    .click-effect-chaos .click-pop { color: #ffaa00 !important; }
    .click-effect-eternal .click-pop { color: #ff00ff !important; text-shadow: 0 0 6px rgba(255,0,255,0.5); }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="header">
      <button class="sound-btn" id="soundBtn" onclick="toggleSound()" title="Toggle sound">🔇</button>
      <h1>Skull Clicker</h1>
      <div class="score-display" id="score">0</div>
      <div class="per-sec" id="perSec">0 per second</div>
    </div>

    <div class="news-ticker" id="newsTicker"></div>

    <div class="skull-area">
      <div class="skull-btn" id="skullBtn">
        <img src="/assets/images/skull.png" alt="Click">
      </div>
    </div>

    <div class="buff-bar" id="buffBar"></div>
    <div class="raid-banner" id="raidBanner" hidden></div>
    <div class="reward-banner" id="rewardBanner" hidden></div>

    <!-- The living world: every building you own appears here and stacks up,
         Cookie-Clicker style, so the screen fills as you go deeper. -->
    <div class="world-panel" id="worldPanel">
      <div class="miasma-pool" id="miasmaPool"></div>
      <div class="world-ground" id="worldGround"></div>
      <div class="world-empty" id="worldEmpty">Your dominion is empty. Buy a building to raise it.</div>
    </div>

    <div id="offlineBanner"></div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('buildings')">Buildings</button>
      <button class="tab-btn" onclick="switchTab('upgrades')">Upgrades</button>
      <button class="tab-btn" onclick="switchTab('prestige')">Prestige</button>
      <button class="tab-btn" onclick="switchTab('reaping')">Reaping</button>
      <button class="tab-btn" onclick="switchTab('pet')">Pet</button>
      <button class="tab-btn" onclick="switchTab('feats')">Feats</button>
      <button class="tab-btn" onclick="switchTab('ranks')">Ranks</button>
      <button class="tab-btn" onclick="switchTab('cosmetics')">Cosmetics</button>
      <button class="tab-btn" onclick="switchTab('stats')">Stats</button>
    </div>

    <div class="tab-content active" id="tab-buildings"></div>
    <div class="tab-content" id="tab-upgrades"></div>
    <div class="tab-content" id="tab-prestige"></div>
    <div class="tab-content" id="tab-reaping"></div>
    <div class="tab-content" id="tab-pet"></div>
    <div class="tab-content" id="tab-feats"></div>
    <div class="tab-content" id="tab-ranks"></div>
    <div class="tab-content" id="tab-cosmetics"></div>
    <div class="tab-content" id="tab-stats"></div>
  </div>

  <div class="save-msg" id="saveMsg">Saved</div>

  <script src="/js/session-read.js"></script>
<script>
    /* ═══════ CONSTANTS ═══════ */

    const BUILDINGS = [
      { id:'shard',     name:'Bone Shard',       baseCost:15,           baseCps:0.1,      desc:'Tiny bone fragments click for you' },
      { id:'ghost',     name:'Ghost Hand',        baseCost:100,          baseCps:1,        desc:'Spectral hands from beyond' },
      { id:'crypt',     name:'Crypt Keeper',      baseCost:1100,         baseCps:8,        desc:'Undead servants guard your hoard' },
      { id:'altar',     name:'Dark Altar',        baseCost:12000,        baseCps:47,       desc:'Blood sacrifices fuel the chaos' },
      { id:'army',      name:'Phantom Army',      baseCost:130000,       baseCps:260,      desc:'Legions of the damned march for you' },
      { id:'necro',     name:'Necropolis',         baseCost:1400000,      baseCps:1400,     desc:'A city of the dead, endlessly producing' },
      { id:'shadow',    name:'Shadow Realm',       baseCost:20000000,     baseCps:7800,     desc:'An entire dimension of darkness' },
      { id:'engine',    name:'Chaos Engine',       baseCost:330000000,    baseCps:44000,    desc:'Reality-bending machine of doom' },
      { id:'portal',    name:'Void Portal',        baseCost:5.1e9,        baseCps:260000,   desc:'Gateway to infinite skull dimensions' },
      { id:'horror',    name:'Eldritch Horror',    baseCost:75e9,         baseCps:1600000,  desc:'Cosmic entity that devours reality' },
      { id:'fracture',  name:'Reality Fracture',   baseCost:1e12,         baseCps:10000000, desc:'The fabric of existence, torn asunder' },
      { id:'darkness',  name:'Eternal Darkness',   baseCost:14e12,        baseCps:65000000, desc:'The end of all light, the birth of skulls' },
      { id:'singularity', name:'Skull Singularity', baseCost:2e14,         baseCps:430000000,  desc:'Collapses matter itself into bone' },
      { id:'oblivion',    name:'Oblivion Maw',      baseCost:3e15,         baseCps:2.9e9,      desc:'Devours whole timelines for their skulls' },
      { id:'apex',        name:'Apex Revenant',     baseCost:5e16,         baseCps:2e10,       desc:'The last thing the universe ever fears' },
    ];

    const UPGRADES = [
      { id:'c1', name:'Iron Fingers',        cost:100,        desc:'+1 click power',      tag:'click',  apply:() => { clickBonus += 1; } },
      { id:'c2', name:'Crimson Touch',       cost:500,        desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c3', name:'Skull Crusher',       cost:5000,       desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c4', name:'Chaos Multiplier',    cost:50000,      desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c5', name:'Digital Devastation', cost:500000,     desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c6', name:'Phantom Strike',      cost:5e6,        desc:'x2 click power',      tag:'click',  apply:() => { clickMulti *= 2; } },
      { id:'c7', name:'Void Touch',          cost:50e6,       desc:'+5% of CPS per click',tag:'click',  apply:() => { cpsClickPct += 5; } },
      { id:'c8', name:'Reality Shatter',     cost:500e6,      desc:'+5% of CPS per click',tag:'click',  apply:() => { cpsClickPct += 5; } },
      { id:'m1', name:'Dark Blessing',       cost:1000,       desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m2', name:'Unholy Pact',         cost:100000,     desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m3', name:'Eternal Curse',       cost:10e6,       desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m4', name:'Cosmic Horror',       cost:1e9,        desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m5', name:'Entropy Engine',      cost:100e9,      desc:'x2 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 2; } },
      { id:'m6', name:'Final Darkness',      cost:10e12,      desc:'x3 all CPS',          tag:'mult',   apply:() => { globalCpsMult *= 3; } },
      { id:'c9', name:'Oblivion Grip',       cost:5e9,        desc:'+10% of CPS per click',tag:'click', apply:() => { cpsClickPct += 10; } },
    ];

    /* Synergy upgrades — unlock at owning N of a building and multiply it, some
       also cross-boosting another building by how many you own. Effects are
       computed live in getBuildingMult (no apply()), so they survive a load
       without being baked into a saved stat. */
    const SYNERGY = [
      { id:'s_shard1', building:'shard', req:10,  mult:2,   cost:1000,   name:'Sharpened Bone', desc:'Bone Shards are twice as productive' },
      { id:'s_shard2', building:'shard', req:50,  mult:2,   cost:2e6,    name:'Marrow Extraction', desc:'Bone Shards ×2 again' },
      { id:'s_ghost1', building:'ghost', req:10,  mult:2,   cost:8000,   name:'Ectoplasm', desc:'Ghost Hands are twice as productive' },
      { id:'s_ghost2', building:'ghost', req:25,  mult:1,   cost:120000, name:'Poltergeist Pact', desc:'Each Necropolis boosts Ghost Hands +2%', cross:{ target:'ghost', per:0.02 } },
      { id:'s_crypt1', building:'crypt', req:10,  mult:2,   cost:90000,  name:'Reinforced Crypts', desc:'Crypt Keepers ×2' },
      { id:'s_altar1', building:'altar', req:10,  mult:2,   cost:1.2e6,  name:'Blood Rites', desc:'Dark Altars ×2' },
      { id:'s_army1',  building:'army',  req:10,  mult:2,   cost:1.3e7,  name:'Endless Ranks', desc:'Phantom Armies ×2' },
      { id:'s_necro1', building:'necro', req:10,  mult:2,   cost:1.4e8,  name:'Mass Graves', desc:'Necropoli ×2' },
      { id:'s_necro2', building:'necro', req:25,  mult:1,   cost:5e9,    name:'Ossuary Network', desc:'Each Shadow Realm boosts Necropoli +3%', cross:{ target:'necro', per:0.03 } },
      { id:'s_shadow1',building:'shadow',req:10,  mult:2,   cost:2e9,    name:'Deeper Dark', desc:'Shadow Realms ×2' },
      { id:'s_engine1',building:'engine',req:10,  mult:2,   cost:3.3e10, name:'Overclocked Chaos', desc:'Chaos Engines ×2' },
      { id:'s_portal1',building:'portal',req:10,  mult:2,   cost:5.1e11, name:'Stable Rifts', desc:'Void Portals ×2' },
      { id:'s_horror1',building:'horror',req:10,  mult:2,   cost:7.5e12, name:'Maddening Whispers', desc:'Eldritch Horrors ×2' },
    ];

    /* GHOULS — the "kitten" analog. One-time upgrades bought with SKULLS that
       each raise how hard the Miasma (the feat-derived "milk" meter) pushes
       production: ghoulMult() = 1 + miasma × Σ(factor of owned ghouls), stacked
       multiplicatively into getCPS. They RESET on prestige and are re-bought
       each run, exactly like the base upgrades. Factors sum to 1.0, so a maxed
       feat count (100% miasma) with every ghoul owned is a clean ×2 channel. */
    const GHOULS = [
      { id:'g1', name:'Ghoul Whelp',    cost:5e3,  factor:0.15, desc:'A newborn ghoul laps at the fog' },
      { id:'g2', name:'Ghoul',          cost:5e5,  factor:0.15, desc:'A full-grown ghoul, hungry and loyal' },

    /* ═══════ ASCENSION — "THE REAPING" ═══════

       permanent currency that buys an ENDLESS, geometrically-priced meta-tree.
       Lifetime skulls, feats and cosmetics are never touched, so the
       leaderboard and every maxed player survive a reap untouched.

       META has two kinds, mirroring PERKS:
         'once'    — a single unlock (automation), stored in the `metaPerks` Set.
         'endless' — bought forever; the level lives in `metaLevels`, each level
                     costs base·growth^level. Two headline nodes (production,
                     click) are pure multipliers with NO cap, so the ceiling can
                     never return. Effects are read live by the compute helpers. */
    const ASCEND_MIN_PRESTIGE = 15;   /* a genuine end-game gate */
    const META = [
      // ── Automation (one-time unlocks) ──
      { id:'auto_click',    type:'once', cost:3,  name:'Grasping Hands',    desc:'The skull is struck for you, without pause' },
      { id:'auto_buy',      type:'once', cost:6,  name:'Dutiful Dead',      desc:'Your coffers buy the cheapest building on their own' },
      { id:'auto_cursed',   type:'once', cost:10, name:'Ever-Watchful',     desc:'Cursed skulls are caught the moment they drift by' },
      { id:'auto_prestige', type:'once', cost:25, name:'Eternal Cycle',     desc:'Prestige fires itself the instant the bar is full' },
      // ── Endless climbs (repeatable, no ceiling) ──
      { id:'m_prod',    type:'endless', base:1, growth:1.55, per:0.10,           unit:'prod',    name:'Deathless Toil',    desc:'+10% to all production' },
      { id:'m_click',   type:'endless', base:1, growth:1.55, per:0.12,           unit:'click',   name:'Reapers Grip',      desc:'+12% click power' },
      { id:'m_epitaph', type:'endless', base:2, growth:1.7,  per:0.08,           unit:'epitaph', name:'Richer Graves',     desc:'+8% Epitaphs earned when you reap' },
      { id:'m_start',   type:'endless', base:3, growth:1.8,  per:1,              unit:'build',   name:'Grave Inheritance', desc:'Begin each run with +1 of every building' },
      { id:'m_prcost',  type:'endless', base:2, growth:1.6,  per:0.05, max:18,   unit:'cheaper', name:'Hasten the Cycle',  desc:'Prestige needs 5% fewer skulls' },
    ];

    /* ── Meta readers ── */
    function metaHas(id) { return metaPerks.has(id); }
    function metaLvl(id) { return metaLevels[id] || 0; }
    function metaDef(id) { return META.find(m => m.id === id); }
    function metaCost(m) {
      if (m.type !== 'endless') return m.cost;
      return Math.ceil(m.base * Math.pow(m.growth, metaLvl(m.id)));
    }
    function metaMaxed(m) { return m.type !== 'endless' ? metaHas(m.id) : (m.max ? metaLvl(m.id) >= m.max : false); }

    /* ── Aggregated meta effects (read live each frame) ── */
    function metaProdMult()     { return 1 + 0.10 * metaLvl('m_prod'); }
    function metaClickMult()    { return 1 + 0.12 * metaLvl('m_click'); }
    function epitaphGainMult()  { return 1 + 0.08 * metaLvl('m_epitaph'); }
    function prestigeCostMult() { return Math.max(0.1, 1 - 0.05 * metaLvl('m_prcost')); }

    /* Epitaphs a reap would grant. Driven mainly by the prestige tier reached
       this cycle (prestige^1.5, so climbing higher pays more), plus a small
       log-scaled bonus that finally gives idle Bone Shards a purpose, all
       lifted by Richer Graves. Monotonic in prestige, so a higher climb always
       reaps more. */
    function pendingEpitaphs() {
      const fromPrestige = Math.pow(Math.max(0, prestige), 1.5) / 4;
      const fromShards = boneShards > 0 ? Math.log10(boneShards + 1) : 0;
      return Math.floor((fromPrestige + fromShards) * epitaphGainMult() * auraShardMult());
    }
    function canAscend() { return prestige >= ASCEND_MIN_PRESTIGE; }

    /* ── Perk readers ── */
    function pHas(id) { return perks.has(id); }
    function pLvl(id) { return perkLevels[id] || 0; }
    function perkDef(id) { return PERKS.find(p => p.id === id); }
    /* Cost of the NEXT level of a tiered perk (or the flat cost of a once perk). */
    function perkCost(p) {
      if (p.type !== 'tiered') return p.cost;
      return Math.ceil(p.base * Math.pow(p.growth, pLvl(p.id)));
    }
    function perkMaxed(p) { return p.type === 'tiered' ? pLvl(p.id) >= p.max : pHas(p.id); }

    /* ── Aggregated effects (read by the game each frame) ── */
    function perkCpsMult()    { return 1 + p_per('t_cps'); }
    function perkClickMult()  { return 1 + p_per('t_click'); }
    function critMult()       { return 7 + 0.5 * pLvl('t_critdmg'); }
    function reapMult()       { return 1 + 0.15 * pLvl('t_reap'); }
    function frenzyMultValue(){ return 7 + pLvl('t_frenzy'); }
    function buffScale()      { return pHas('everfrenzy') ? 2 : 1; }
    function comboCapPer()    { return pHas('comboking') ? 0.01 : 0.005; }
    function buildingCostMult() { return Math.max(0.5, 1 - 0.01 * pLvl('t_cost')); }
    function p_per(id) { const p = perkDef(id); return (p ? p.per : 0) * pLvl(id); }

    /* Shards a prestige would grant — cube-root of the run total (so a fresh
       reset yields none and cannot be farmed), lifted by Bone Harvest. */
    function pendingShards() {
      const base = Math.floor(Math.cbrt(Math.max(0, totalSkulls) / 1e6));
      return Math.floor(base * (1 + 0.04 * pLvl('t_shard')) * auraShardMult());
    }
    function offlineRate() { return (pHas('offline2') ? 1.5 : (pHas('greed') ? 1 : 0.5)) * (auraActive('hoard') ? 1.5 : 1); }

    const MILESTONES = [100, 1000, 10000, 100000, 1e6, 10e6, 100e6, 1e9, 10e9, 100e9, 1e12, 100e12, 10e15];
    const MS_NAMES = ['Apprentice','Acolyte','Dark Mage','Necromancer','Lich King','Shadow Lord','Void Walker','Chaos Weaver','Reality Bender','Cosmic Terror','Eternal One','Skull God','Bone Absolute'];

    /* Feats — each earned one is a permanent +1% to all production (achMult).
       check() reads live state; it runs only for feats not yet earned. */
    function totalBuildings() { let n = 0; for (const b of BUILDINGS) n += owned[b.id]; return n; }
    function maxOwned() { let n = 0; for (const b of BUILDINGS) n = Math.max(n, owned[b.id]); return n; }
    const ACHIEVEMENTS = [
      { id:'clk1', name:'Knuckle Deep',    desc:'Click 100 times',           check:() => totalClicks >= 100 },
      { id:'clk2', name:'Relentless',      desc:'Click 1,000 times',         check:() => totalClicks >= 1000 },

      { id:'sk1',  name:'First Blood',     desc:'Gather 1M skulls',          check:() => lifetimeSkulls >= 1e6 },
      { id:'sk2',  name:'Charnel Lord',    desc:'Gather 1B skulls',          check:() => lifetimeSkulls >= 1e9 },

      { id:'bld2', name:'Warden',          desc:'Own 50 buildings',          check:() => totalBuildings() >= 50 },
      { id:'bld3', name:'Overseer',        desc:'Own 100 buildings',         check:() => totalBuildings() >= 100 },
      { id:'bld4', name:'Dominion',        desc:'Own 250 buildings',         check:() => totalBuildings() >= 250 },
      { id:'one1', name:'Collector',       desc:'Own 25 of one building',    check:() => maxOwned() >= 25 },
      { id:'one2', name:'Hoarder',         desc:'Own 50 of one building',    check:() => maxOwned() >= 50 },
      { id:'one3', name:'Obsessed',        desc:'Own 100 of one building',   check:() => maxOwned() >= 100 },
      { id:'var1', name:'Diversified',     desc:'Own one of every building', check:() => BUILDINGS.every(b => owned[b.id] > 0) },
      { id:'up1',  name:'Shopper',         desc:'Buy 10 upgrades',           check:() => boughtUpgrades.size >= 10 },
      { id:'up2',  name:'Completionist',   desc:'Buy every base upgrade',    check:() => UPGRADES.every(u => boughtUpgrades.has(u.id)) },
      { id:'pr1',  name:'Reborn',          desc:'Prestige once',             check:() => prestige >= 1 },
      { id:'pr2',  name:'Cycle of Bone',   desc:'Reach prestige 5',          check:() => prestige >= 5 },
      { id:'pr3',  name:'Eternal Return',  desc:'Reach prestige 10',         check:() => prestige >= 10 },
      { id:'asc1', name:'The First Reaping', desc:'Ascend once beyond prestige', check:() => ascensions >= 1 },
      { id:'cur1', name:'Cursed',          desc:'Pop a cursed skull',        check:() => cursedPopped >= 1 },
      { id:'cur2', name:'Skull Hunter',    desc:'Pop 10 cursed skulls',      check:() => cursedPopped >= 10 },
      { id:'cur3', name:'Doom Magnet',     desc:'Pop 50 cursed skulls',      check:() => cursedPopped >= 50 },
    ];

    /* ═══════ STATE ═══════ */

    let skulls = 0;
    let totalSkulls = 0;         /* this run — resets on prestige */
    let lifetimeSkulls = 0;      /* every skull ever gathered — never resets */
    let prestige = 0;            /* permanent multiplier tier */
    let totalClicks = 0;
    let clickBonus = 0;
    let clickMulti = 1;
    let cpsClickPct = 0;
    let globalCpsMult = 1;
    let cpBoostMult = 1;
    let cpBoostExpires = 0;
    let owned = {};
    let boughtUpgrades = new Set();
    let boughtGhouls = new Set();     /* Ghoul upgrades owned this run — reset on prestige, like base upgrades */
    let hitMilestones = new Set();
    let startTime = Date.now();
    let lastTick = Date.now();
    let lastSave = Date.now();
    let activeTab = 'buildings';
    let playerName = null;

    /* ── New systems ── */
    let boneShards = 0;             /* prestige currency, spent in the shop */
    let perks = new Set();          /* one-time prestige perks owned */
    let perkLevels = {};            /* tiered prestige perk -> level */
    /* ── Ascension (The Reaping) ── */
    let ascensions = 0;             /* times reaped — the meta-prestige tier */
    let epitaphs = 0;               /* meta currency, spent in the Reaping tree */
    let metaLevels = {};            /* endless meta node -> level */
    let metaPerks = new Set();      /* one-time meta unlocks (automation) owned */
    let highestPrestige = 0;        /* best prestige tier ever reached (history kept through a reap) */
    /* ── Grave Bloom (permanent meta layer — survives prestige AND ascension) ── */
    let graveBlooms = 0;            /* harvested blooms available to spend */
    let bloomStart = Date.now();    /* when the currently-ripening bloom began (real-time, offline-aware) */
    let buildingLevels = {};        /* building id -> bloom level (+2% output each) */
    /* ── The Bound Reaper (permanent meta layer — survives prestige AND ascension) ── */
    let petLevel = 0;               /* raised by feeding (sacrificing buildings) */
    let selectedAuras = [];         /* active passive auras, up to auraSlots() */
    let achievements = new Set();   /* earned feats — each is a permanent boost */
    let cursedPopped = 0;           /* lifetime cursed skulls clicked */
    let buyAmount = 1;              /* 1 | 10 | 100 | 'max' */
    /* Season race: skulls gathered since this month's baseline. The baseline
       is lifetime at the season's start; when the month turns it moves up to
       the current lifetime, so the new month counts from zero. */
    let seasonBaseline = 0, seasonMonth = '';

    /* Timed buff/debuff framework — a list of active effects, each
       { id, name, kind:'buff'|'debuff', cpsMult, clickMult, endsAt, icon, chipClass }.
       Never saved (transient); they tick down on the existing game tick and
       stack multiplicatively into getCPS()/getClickPower(). Reusable: the Bone
       Dragon auras and the Skullpocalypse wrath skulls hook in via addTimedBuff. */
    let activeBuffs = [];

    /* Active-click combo — builds while you keep clicking, decays when you stop. */
    let combo = 0, lastClickAt = 0;

    /* Sound — synthesized with WebAudio so there are no audio files to ship.
       Off by default; the AudioContext is created lazily inside a user gesture
       so browsers do not block it. */
    let soundOn = false;
    let audioCtx = null;
    let noiseBuffer = null;

    /* The click sound is a real snare sample. It is decoded once, the actual
       hit onset is found (the file has leading silence) and its level measured
       so playback is normalised — then each click plays a short, tight slice
       from the onset, cutting the long room tail so rapid clicking stays
       crisp. Auto-adapts if the sample file is swapped. Falls back to the
       synth snare until it has loaded (or if it fails to). */
    const CLICK_SAMPLE = 'assets/audio/snare.mp3';
    const CLICK_SLICE = 0.5;          // seconds of the hit to play
    let clickBuffer = null, clickOnset = 0, clickGain = 1, clickLoading = false;

    function loadClickSample() {
      if (clickBuffer || clickLoading || !audioCtx) return;
      clickLoading = true;
      fetch(CLICK_SAMPLE)
        .then(r => r.ok ? r.arrayBuffer() : Promise.reject())
        .then(a => audioCtx.decodeAudioData(a))
        .then(buf => {
          const d = buf.getChannelData(0), sr = buf.sampleRate;
          let onset = 0, peak = 0;
          for (let i = 0; i < d.length; i++) { if (Math.abs(d[i]) > 0.03) { onset = i; break; } }
          for (let i = onset; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
          clickBuffer = buf;
          clickOnset = onset / sr;
          clickGain = peak > 0 ? Math.min(3.5, 0.6 / peak) : 1;
        })
        .catch(() => { /* keep the synth fallback */ })
        .finally(() => { clickLoading = false; });
    }

    function playClickSample(t) {
      const src = audioCtx.createBufferSource();
      src.buffer = clickBuffer;
      const g = audioCtx.createGain();
      const fade = 0.05;
      g.gain.setValueAtTime(clickGain, t);
      g.gain.setValueAtTime(clickGain, t + CLICK_SLICE - fade);
      g.gain.linearRampToValueAtTime(0.0001, t + CLICK_SLICE);
      src.connect(g); g.connect(audioCtx.destination);
      src.start(t, clickOnset, CLICK_SLICE);
    }

    /* ~0.25s of white noise, made once and reused — the "wires" of the snare. */
    function getNoise() {
      if (noiseBuffer) return noiseBuffer;
      const len = Math.floor(audioCtx.sampleRate * 0.25);
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return noiseBuffer;
    }

    /* A snare hit: a bright, fast noise burst (the wire rattle) over a short
       tonal body (the drum head) that drops in pitch, with a kick thump under
       it for weight. On theme — this is a drummer's stream — and short enough
       that rapid clicking stays tight. */
    function playSnare(t) {
      /* Kick: a low sine that drops fast in pitch — the thump under the hit.
         Louder than the rest because low frequencies read quieter. */
      const kick = audioCtx.createOscillator();
      kick.type = 'sine';
      kick.frequency.setValueAtTime(160, t);
      kick.frequency.exponentialRampToValueAtTime(42, t + 0.14);
      const kg = audioCtx.createGain();
      kg.gain.setValueAtTime(0.95, t);
      kg.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      kick.connect(kg); kg.connect(audioCtx.destination);
      kick.start(t); kick.stop(t + 0.21);

      const noise = audioCtx.createBufferSource();
      noise.buffer = getNoise();
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 1400;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.45, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      noise.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination);
      noise.start(t); noise.stop(t + 0.14);

      const body = audioCtx.createOscillator();
      body.type = 'triangle';
      body.frequency.setValueAtTime(210, t);
      body.frequency.exponentialRampToValueAtTime(120, t + 0.1);
      const bg = audioCtx.createGain();
      bg.gain.setValueAtTime(0.28, t);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      body.connect(bg); bg.connect(audioCtx.destination);
      body.start(t); body.stop(t + 0.12);
    }

    function playSound(kind) {
      if (!soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        loadClickSample();                                 /* decode the sample once, lazily */
        const t = audioCtx.currentTime;
        if (kind === 'click') { clickBuffer ? playClickSample(t) : playSnare(t); return; }

        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        let f = 180, dur = 0.05, type = 'square', vol = 0.05;
        if (kind === 'buy')    { f = 320; dur = 0.08; type = 'triangle'; vol = 0.06; }
        if (kind === 'cursed') { f = 90;  dur = 0.30; type = 'sawtooth'; vol = 0.09; }
        if (kind === 'feat')   { f = 520; dur = 0.18; type = 'triangle'; vol = 0.07; }
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (kind === 'cursed' || kind === 'feat') o.frequency.exponentialRampToValueAtTime(f * 2, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.start(t); o.stop(t + dur);
      } catch (e) { /* audio is a nicety; never let it break the game */ }
    }
    function toggleSound() {
      soundOn = !soundOn;
      try { localStorage.setItem('sc_sound', soundOn ? '1' : '0'); } catch(e) {}
      if (soundOn) playSound('feat');
      renderSettings();
    }

    /* Rarity stingers for buff spawn/collect. ONE Audio element per rarity,
       created lazily and reused (never new Audio() per fire — marathon-safe). */
    const STINGER_RARITIES = ['common', 'uncommon', 'rare', 'epic', 'legendary'];
    const stingers = {};
    function playStinger(rarity) {
      if (!soundOn) return;
      const r = STINGER_RARITIES.includes(rarity) ? rarity : 'common';
      try {
        let a = stingers[r];
        if (!a) { a = new Audio('assets/audio/' + r + '.mp3'); a.preload = 'auto'; a.volume = 0.5; stingers[r] = a; }
        a.currentTime = 0;
        const p = a.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) { /* audio is a nicety; never let it break the game */ }
    }

    BUILDINGS.forEach(b => owned[b.id] = 0);

    /* ═══════ COMPUTED ═══════ */

    function getBuildingCost(b) {
      return Math.ceil(b.baseCost * Math.pow(1.15, owned[b.id]) * buildingCostMult());
    }

    /* Prestige is the whole point of a resource-gathering game with no win:
       reset the run for a permanent speed-up, so you gather MORE over time.
       +0.1x per tier — P1 is 1.1x, P2 1.2x — applied to everything that
       produces skulls. */
    function getPrestigeMult() { return 1 + 0.1 * prestige; }

    /* Every earned feat is a small permanent multiplier on everything — the
       "milk" of this game, so the achievements screen is a real power source,
       not a trophy shelf. */
    function achMult() { return 1 + 0.01 * achievements.size; }

    /* ═══════ MIASMA + GHOULS ═══════
       Miasma is the "milk" analog: purely DERIVED from feats, no stored state.
       +4% per feat, so the 25-feat maximum reads as a clean 100%. Ghouls (bought
       with skulls, reset each run) turn that meter into production:
         ghoulMult() = 1 + miasma × Σ(factor of owned ghouls).
       With all ghouls (Σfactor = 1.0) at 100% miasma that is a ×2 channel, so
       every feat gains a multiplicative payoff on top of its flat +1%. */
    function miasma() { return achievements.size * 0.04; }   /* fraction: 1.0 = 100% */
    function ghoulFactorSum() {
      let f = 0;
      for (const g of GHOULS) if (boughtGhouls.has(g.id)) f += g.factor;
      return f;
    }
    function ghoulMult() { return 1 + miasma() * ghoulFactorSum(); }

    /* ── Grave Bloom helpers ── */
    /* Blooms fully ripened and waiting (offline-aware: derived purely from the
       timestamp, so a long absence accrues the whole gap). */
    function readyBlooms() { return Math.max(0, Math.floor((Date.now() - bloomStart) / BLOOM_RIPEN_MS)); }
    /* Milliseconds until the next bloom ripens. */
    function nextBloomInMs() {
      const rem = (Date.now() - bloomStart) % BLOOM_RIPEN_MS;
      return Math.max(0, BLOOM_RIPEN_MS - rem);
    }
    /* Harvest everything ripe; advance the ripen clock so a partial bloom keeps
       growing. Returns how many were collected. */
    function harvestBlooms() {
      const n = readyBlooms();
      if (n <= 0) return 0;
      graveBlooms += n;
      bloomStart += n * BLOOM_RIPEN_MS;
      playStinger('rare');
      save();
      renderBuildings();
      return n;
    }
    function buildingLevel(id) { return buildingLevels[id] || 0; }
    function buildingLevelMult(id) { return 1 + buildingLevel(id) * BLOOM_LEVEL_BONUS; }
    /* CC-style triangular cost: leveling a building to level N costs N blooms. */
    function bloomLevelCost(id) { return buildingLevel(id) + 1; }
    function levelBuilding(id, e) {
      if (e) e.stopPropagation();
      const b = BUILDINGS.find(x => x.id === id);
      if (!b) return;
      const cost = bloomLevelCost(id);
      if (graveBlooms < cost) { shakeReject(e); return; }
      graveBlooms -= cost;
      buildingLevels[id] = buildingLevel(id) + 1;
      playSound('buy');
      save();
      render();
      renderWorld();
    }

    /* ── Bound Reaper (pet) helpers ── */
    function auraSlots() { return petLevel >= PET_AURA_SLOT_L2 ? 2 : petLevel >= PET_AURA_SLOT_L1 ? 1 : 0; }
    function auraActive(id) { return selectedAuras.includes(id); }
    /* The pet eats progressively higher building tiers as it levels; the count
       it demands grows with its level. Consumes run-reset `owned`; level persists. */
    function petFeedBuilding() { return BUILDINGS[Math.min(petLevel, BUILDINGS.length - 1)]; }
    function petFeedCount() { return 10 + petLevel * 5; }
    function feedPet(e) {
      const b = petFeedBuilding();
      const need = petFeedCount();
      if ((owned[b.id] || 0) < need) { shakeReject(e); return; }
      owned[b.id] -= need;
      petLevel += 1;
      playStinger('epic');
      save();
      render();
      renderWorld();
    }
    /* Equip/unequip an aura. When a slot is full, the newest replaces the oldest
       so switching is one click. */
    function toggleAura(id) {
      if (auraActive(id)) {
        selectedAuras = selectedAuras.filter(x => x !== id);
      } else {
        if (auraSlots() <= 0) return;
        if (selectedAuras.length >= auraSlots()) selectedAuras.shift();
        selectedAuras.push(id);
      }
      save();
      render();
    }
    /* Aura effect readers, folded into their systems below. */
    function petAuraCpsMult() {
      let m = 1;
      if (auraActive('ravenous')) m *= 1.5;
      if (auraActive('miasma_breath')) m *= (1 + miasma());
      return m;
    }
    function windfallMult()   { return auraActive('grave_fortune') ? 1.25 : 1; }
    function auraShardMult()  { return auraActive('reapers_boon') ? 1.25 : 1; }

    /* ═══════ TIMED BUFF / DEBUFF FRAMEWORK ═══════
       Add a timed effect; re-collecting the same id refreshes it rather than
       stacking a duplicate. cpsMult/clickMult default to 1 (no effect on that
       channel). Callers pass the FINAL durationMs (any perk scaling already
       applied). Instant payouts do not go here — they are applied directly. */
    function addTimedBuff({ id, name, kind, cpsMult, clickMult, durationMs, icon, chipClass }) {
      const b = {
        id, name, kind: kind || 'buff',
        cpsMult: cpsMult || 1, clickMult: clickMult || 1,
        endsAt: Date.now() + durationMs,
        icon: icon || '💀',
        chipClass: chipClass || (kind === 'debuff' ? 'debuff' : 'buff'),
      };
      const i = activeBuffs.findIndex(x => x.id === id);
      if (i >= 0) activeBuffs[i] = b; else activeBuffs.push(b);
      renderBuffs();
      return b;
    }
    function removeTimedBuff(id) { activeBuffs = activeBuffs.filter(b => b.id !== id); }
    function buffCpsMult()   { let m = 1; for (const b of activeBuffs) m *= b.cpsMult;   return m; }
    function buffClickMult() { let m = 1; for (const b of activeBuffs) m *= b.clickMult; return m; }
    /* Drop expired effects; re-render only when the set actually changed. */
    function tickTimedBuffs() {
      const now = Date.now();
      const before = activeBuffs.length;
      activeBuffs = activeBuffs.filter(b => b.endsAt > now);
      if (activeBuffs.length !== before) renderBuffs();
    }

    /* Per-building multiplier from synergy upgrades: a building's own tiered
       upgrades multiply it, and a cross-boost scales it by how many of ANOTHER
       building you own. Computed live so nothing has to be baked into a saved
       stat. (SYNERGY is filled in Phase B; empty here means ×1.) */
    function getBuildingMult(b) {
      let m = 1;
      for (const u of SYNERGY) {
        if (!boughtUpgrades.has(u.id)) continue;
        if (u.building === b.id) m *= u.mult || 1;
        if (u.cross && u.cross.target === b.id) m *= 1 + (u.cross.per || 0) * (owned[u.building] || 0);
      }
      return m;
    }

    function getCPS() {
      let cps = 0;
      for (const b of BUILDINGS) {
        cps += b.baseCps * owned[b.id] * getBuildingMult(b) * buildingLevelMult(b.id);
      }
      return cps * globalCpsMult * cpBoostMult * getPrestigeMult() * achMult() * perkCpsMult() * metaProdMult() * ghoulMult() * petAuraCpsMult() * buffCpsMult();
    }

    /* Blood Rush multiplies the WHOLE click, not just the base term. It used
       to sit inside `base`, so anyone with a %-of-CPS click upgrade (Void
       Touch/Reality Shatter/Oblivion Grip) and real CPS built up saw Blood
       Rush do almost nothing — the CPS-based term dwarfs the buffable base
       once CPS gets big, since it's fed by getCPS() which is itself already
       multiplied by every CPS buff going. ×100 has to apply to the total a
       click is actually worth, or the buff is invisible for exactly the
       players who've played long enough to unlock it. */
    function getClickPower() {
      const base = ((1 + clickBonus) * clickMulti) * getPrestigeMult() * achMult() * perkClickMult() * metaClickMult();
      return (base + (getCPS() * cpsClickPct / 100)) * buffClickMult();
    }

    /* Every skull earned flows through here so the run total and the
       lifetime total can never drift apart — lifetime is the leaderboard
       score and the save-merge key, so it must count every path. */
    function earn(amount) {
      skulls += amount;
      totalSkulls += amount;
      lifetimeSkulls += amount;
    }

    /* ═══════ ACTIONS ═══════ */

    /* Crit chance comes from prestige perks (Phase B); zero until one is
       bought. A crit is a big, satisfying spike on an otherwise steady click. */
    function critChance() {
      return Math.min(0.9, (pHas('crit') ? 0.05 : 0) + (pHas('crit2') ? 0.10 : 0) + 0.01 * pLvl('t_crit'));
    }
    /* Combo rewards SUSTAINED clicking: each click within the window bumps it,
       a pause resets it. Caps at +50% (or +100% with Relentless) so it never
       dwarfs idle income. */
    function comboMult() { return 1 + Math.min(combo, 100) * comboCapPer(); }

    function handleClick(e) {
      const now = Date.now();
      combo = (now - lastClickAt < 1200) ? Math.min(combo + 1, 100) : 1;
      lastClickAt = now;

      let power = getClickPower() * comboMult();
      const crit = Math.random() < critChance();
      if (crit) power *= critMult();

      earn(power);
      totalClicks++;
      if (raidActive()) raidQueue++;   /* each strike also hits the shared boss */
      spawnPop(e, power, crit);
      playSound('click');
      checkMilestones();
      checkAchievements();
      render();
    }

    function shakeReject(e) {
      const row = e && e.currentTarget;
      if (!row) return;
      row.classList.remove('reject-shake');
      void row.offsetWidth;
      row.classList.add('reject-shake');
      setTimeout(() => row.classList.remove('reject-shake'), 350);
    }

    const COST_RATE = 1.15;

    /* Sum of the next `amount` prices for a building — a geometric series, so
       ×10 and ×100 are one formula rather than a loop. */
    function getBulkCost(b, amount) {
      const r = COST_RATE, base = b.baseCost * Math.pow(r, owned[b.id]) * buildingCostMult();
      return Math.ceil(base * (Math.pow(r, amount) - 1) / (r - 1));
    }

    /* How many of a building the current bank can buy — the inverse of the
       series above, so "Max" is exact rather than a loop that could stall. */
    function maxAffordable(b) {
      const r = COST_RATE, base = b.baseCost * Math.pow(r, owned[b.id]) * buildingCostMult();
      const n = Math.floor(Math.log((skulls * (r - 1)) / base + 1) / Math.log(r));
      return Math.max(0, n);
    }

    /* The quantity a click will buy right now, honouring the ×1/×10/×100/Max
       toggle. Fixed amounts are all-or-nothing; Max buys everything affordable. */
    function buyQuantity(b) {
      if (buyAmount === 'max') return maxAffordable(b);
      return buyAmount;
    }

    function buyBuilding(id, e) {
      const b = BUILDINGS.find(x => x.id === id);
      if (!b) return;
      const qty = buyQuantity(b);
      if (qty < 1) { shakeReject(e); return; }
      const cost = getBulkCost(b, qty);
      if (skulls < cost) { shakeReject(e); return; }
      skulls -= cost;
      owned[b.id] += qty;
      lastBought = b.id;
      playSound('buy');
      checkAchievements();
      render();
      renderWorld();
    }

    function setBuyAmount(a) {
      buyAmount = a;
      try { localStorage.setItem('sc_buyAmount', String(a)); } catch(e) {}
      if (activeTab === 'buildings') renderBuildings();
    }

    function buyUpgrade(id, e) {
      const u = UPGRADES.find(x => x.id === id);
      if (!u || boughtUpgrades.has(id)) return;
      if (skulls < u.cost) { shakeReject(e); return; }
      skulls -= u.cost;
      boughtUpgrades.add(id);
      if (u.apply) u.apply();   /* synergy upgrades have no apply — computed live */
      checkAchievements();
      render();
    }

    /* Buy a Ghoul — one-time, skulls, effect computed live in ghoulMult(). */
    function buyGhoul(id, e) {
      const g = GHOULS.find(x => x.id === id);
      if (!g || boughtGhouls.has(id)) return;
      if (skulls < g.cost) { shakeReject(e); return; }
      skulls -= g.cost;
      boughtGhouls.add(id);
      playSound('buy');
      checkAchievements();
      render();
    }

    /* Buy a synergy upgrade (separate list from UPGRADES). */
    function buySynergy(id, e) {
      const u = SYNERGY.find(x => x.id === id);
      if (!u || boughtUpgrades.has(id)) return;
      if ((owned[u.building] || 0) < u.req) { shakeReject(e); return; }
      if (skulls < u.cost) { shakeReject(e); return; }
      skulls -= u.cost;
      boughtUpgrades.add(id);
      checkAchievements();
      render();
      renderWorld();
    }

    /* ═══════ POPUPS ═══════ */

    function spawnPop(e, val, crit) {
      const btn = document.getElementById('skullBtn');
      const rect = btn.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'click-pop' + (crit ? ' crit' : '');
      pop.textContent = (crit ? 'CRIT +' : '+') + formatNum(Math.floor(val));
      pop.style.left = (e.clientX - rect.left) + 'px';
      pop.style.top = (e.clientY - rect.top - 10) + 'px';
      btn.appendChild(pop);
      setTimeout(() => pop.remove(), crit ? 700 : 500);
    }

    function checkMilestones() {
      for (let i = 0; i < MILESTONES.length; i++) {
        const m = MILESTONES[i];
        if (totalSkulls >= m && !hitMilestones.has(m)) {
          hitMilestones.add(m);
          showMilestone(m, MS_NAMES[i] || 'Unknown');
        }
      }
    }

    function showMilestone(n, title) {
      const el = document.createElement('div');
      el.className = 'milestone';
      el.innerHTML = `<h3>${title}</h3><p>${formatNum(n)} skulls earned</p>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2200);
      screenShake();
      playSound('feat');
    }

    /* A brief shake on the big moments — the cheapest juice there is. */
    function screenShake() {
      const w = document.querySelector('.game-wrap');
      if (!w) return;
      w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
      setTimeout(() => w.classList.remove('shake'), 500);
    }

    /* ═══════ NEWS TICKER ═══════
       A gothic crawl that reacts to how far along you are — atmosphere for
       almost nothing. Static generic lines, plus lines conjured from the
       current state so it feels aware of your dominion. */
    const NEWS_GENERIC = [
      'The bones whisper of a coming harvest.',
      'Local villagers report a chill on the wind.',
      'A raven watches from the ossuary gate.',
      'The candles gutter, though there is no draft.',
      'Something in the crypt is counting.',
      'The dead do not rest; they produce.',
      'Rumors of a skull that moves on its own.',
      'The altar is warm to the touch again.',
      'Night lasts a little longer here each day.',
      'They say the reaper keeps a leaderboard.',
    ];
    function pickNews() {
      const dyn = [];
      if (prestige > 0) dyn.push('The cycle turns for the ' + ordinal(prestige) + ' time. The dark remembers.');
      if (cursedPopped >= 10) dyn.push('The cursed skulls fear you now — ' + cursedPopped + ' claimed.');
      const tb = totalBuildings();
      if (tb >= 100) dyn.push('Your dominion numbers ' + tb + ' and grows restless.');
      else if (tb >= 20) dyn.push('Word spreads of a growing necropolis.');
      if (achievements.size >= 10) dyn.push('Scholars catalogue your ' + achievements.size + ' dread feats.');
      if (getCPS() > 1e9) dyn.push('The skull-tide rises by ' + formatNum(getCPS()) + ' every second.');
      const pool = dyn.length && Math.random() < 0.6 ? dyn : NEWS_GENERIC;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function ordinal(n) {
      const s = ['th','st','nd','rd'], v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }
    function cycleNews() {
      const el = document.getElementById('newsTicker');
      if (!el) return;
      el.classList.add('fade');
      setTimeout(() => { el.textContent = pickNews(); el.classList.remove('fade'); }, 400);
    }

    /* ═══════ FEATS (achievements) ═══════ */

    function checkAchievements() {
      let gained = false;
      for (const a of ACHIEVEMENTS) {
        if (!achievements.has(a.id) && a.check()) {
          achievements.add(a.id);
          gained = true;
          showAchievement(a);
        }
      }
      if (gained) renderMiasma();   /* a new feat raises the miasma meter */
      if (gained && activeTab === 'feats') renderAchievements();
    }

    function showAchievement(a) {
      const el = document.createElement('div');
      el.className = 'ach-toast';
      el.innerHTML = '<div class="ach-toast-kind">Feat Unlocked</div>' +
        '<div class="ach-toast-name">' + a.name + '</div>' +
        '<div class="ach-toast-desc">' + a.desc + ' &mdash; +1% forever</div>';
      document.body.appendChild(el);
      playSound('feat');
      setTimeout(() => el.remove(), 3200);
    }

    /* ═══════ CURSED SKULLS ═══════
       The golden-cookie of this game: one drifts across the screen now and
       then; catch it for a big timed buff or an instant windfall. This is the
       reason to keep the tab open. */
    let cursedTimer = null;

    function cursedFreqMult() {
      /* Prestige perks shorten the wait; a stream event and the Grave Fortune
         aura can too. */
      return (pHas('omen') ? 1.5 : 1) * (1 + 0.08 * pLvl('t_omen')) *
        (window.__streamFrenzy ? 3 : 1) * (auraActive('grave_fortune') ? 1.5 : 1);
    }

    function scheduleCursed() {
      clearTimeout(cursedTimer);
      const wait = (60 + Math.random() * 120) / cursedFreqMult();  // 60–180s, sped up by perks/events
      cursedTimer = setTimeout(spawnCursed, wait * 1000);
    }

    /* opts.storm — a skull spawned by a Skull Storm: shorter-lived, does NOT
