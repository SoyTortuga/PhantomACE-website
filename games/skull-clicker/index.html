<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skull Clicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      user-select: none;
    }

    h1 {
      font-size: 24px;
      color: #ff0000;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    .score-display {
      font-size: 36px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .per-sec {
      font-size: 12px;
      color: #666;
      margin-bottom: 24px;
    }

    .skull-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #222, #111, #000);
      border: 2px solid #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.2s;
      position: relative;
      margin-bottom: 32px;
    }

    .skull-btn:hover {
      border-color: #ff0000;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
    }

    .skull-btn:active {
      transform: scale(0.95);
    }

    .skull-btn img {
      width: 70%;
      height: auto;
      pointer-events: none;
    }

    .click-pop {
      position: absolute;
      font-size: 16px;
      font-weight: bold;
      color: #ff0000;
      pointer-events: none;
      animation: pop-up 0.6s ease-out forwards;
    }

    @keyframes pop-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    .upgrades {
      width: 100%;
      max-width: 360px;
    }

    .upgrades h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #444;
      margin-bottom: 12px;
      text-align: center;
    }

    .upgrade-btn {
      width: 100%;
      padding: 12px 16px;
      background: #111;
      border: 1px solid #222;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s, background 0.2s;
      font-family: system-ui, sans-serif;
    }

    .upgrade-btn:hover:not(:disabled) {
      border-color: #ff0000;
      background: #1a0000;
    }

    .upgrade-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .upgrade-name {
      font-size: 13px;
    }

    .upgrade-detail {
      font-size: 10px;
      color: #666;
      margin-top: 2px;
    }

    .upgrade-cost {
      font-size: 12px;
      color: #ff0000;
      white-space: nowrap;
    }

    .milestone {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #111;
      border: 1px solid #ff0000;
      border-radius: 8px;
      padding: 24px 40px;
      text-align: center;
      z-index: 100;
      animation: milestone-pop 2s ease-out forwards;
    }

    .milestone h3 { font-size: 18px; color: #ff0000; margin-bottom: 4px; }
    .milestone p { font-size: 12px; color: #999; }

    @keyframes milestone-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
      25% { transform: translate(-50%, -50%) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    }
  </style>
</head>
<body>
  <h1>Skull Clicker</h1>
  <p class="subtitle">Click the skull. Embrace the chaos.</p>

  <div class="score-display" id="score">0</div>
  <div class="per-sec" id="perSec">0 per second</div>

  <div class="skull-btn" id="skullBtn" onclick="handleClick(event)">
    <img src="/assets/images/skull.png" alt="Click me">
  </div>

  <div class="upgrades">
    <h2>Upgrades</h2>
    <div id="upgradeList"></div>
  </div>

  <script>
    let score = 0;
    let clickPower = 1;
    let autoClicks = 0;

    const UPGRADES = [
      { id: 'power1', name: 'Sharper Bones', desc: '+1 per click', cost: 10, type: 'click', value: 1, bought: false },
      { id: 'auto1', name: 'Ghost Hand', desc: '+1 per second', cost: 25, type: 'auto', value: 1, bought: false },
      { id: 'power2', name: 'Crimson Edge', desc: '+3 per click', cost: 75, type: 'click', value: 3, bought: false },
      { id: 'auto2', name: 'Phantom Army', desc: '+5 per second', cost: 200, type: 'auto', value: 5, bought: false },
      { id: 'power3', name: 'Chaos Multiplier', desc: '+10 per click', cost: 500, type: 'click', value: 10, bought: false },
      { id: 'auto3', name: 'Undead Legion', desc: '+20 per second', cost: 1000, type: 'auto', value: 20, bought: false },
      { id: 'power4', name: 'Digital Devastation', desc: '+50 per click', cost: 5000, type: 'click', value: 50, bought: false },
      { id: 'auto4', name: 'Eternal Engine', desc: '+100 per second', cost: 10000, type: 'auto', value: 100, bought: false },
    ];

    const MILESTONES = [100, 500, 1000, 5000, 10000, 50000, 100000];
    let hitMilestones = new Set();

    function handleClick(e) {
      score += clickPower;
      updateDisplay();
      spawnPopup(e);
      checkMilestones();
    }

    function spawnPopup(e) {
      const btn = document.getElementById('skullBtn');
      const rect = btn.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'click-pop';
      pop.textContent = `+${clickPower}`;
      pop.style.left = (e.clientX - rect.left) + 'px';
      pop.style.top = (e.clientY - rect.top - 10) + 'px';
      btn.appendChild(pop);
      setTimeout(() => pop.remove(), 600);
    }

    function updateDisplay() {
      document.getElementById('score').textContent = formatNum(Math.floor(score));
      document.getElementById('perSec').textContent = `${formatNum(autoClicks)} per second`;
      renderUpgrades();
    }

    function formatNum(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toString();
    }

    function renderUpgrades() {
      const list = document.getElementById('upgradeList');
      list.innerHTML = UPGRADES.map(u => {
        if (u.bought) return '';
        const canBuy = score >= u.cost;
        return `
          <button class="upgrade-btn" ${canBuy ? '' : 'disabled'} onclick="buyUpgrade('${u.id}')">
            <div>
              <div class="upgrade-name">${u.name}</div>
              <div class="upgrade-detail">${u.desc}</div>
            </div>
            <div class="upgrade-cost">${formatNum(u.cost)} skulls</div>
          </button>
        `;
      }).join('');
    }

    function buyUpgrade(id) {
      const u = UPGRADES.find(x => x.id === id);
      if (!u || u.bought || score < u.cost) return;

      score -= u.cost;
      u.bought = true;

      if (u.type === 'click') clickPower += u.value;
      if (u.type === 'auto') autoClicks += u.value;

      updateDisplay();
    }

    function checkMilestones() {
      for (const m of MILESTONES) {
        if (score >= m && !hitMilestones.has(m)) {
          hitMilestones.add(m);
          showMilestone(m);
        }
      }
    }

    function showMilestone(n) {
      const el = document.createElement('div');
      el.className = 'milestone';
      el.innerHTML = `<h3>${formatNum(n)} Skulls!</h3><p>The chaos grows stronger</p>`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2100);
    }

    setInterval(() => {
      if (autoClicks > 0) {
        score += autoClicks;
        updateDisplay();
        checkMilestones();
      }
    }, 1000);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && window.parent !== window) {
        window.parent.postMessage('close-game', '*');
      }
    });

    updateDisplay();
  </script>
</body>
</html>
