      totalClicks++;
      if (raidActive()) raidQueue++;
    }
    setInterval(autoClickTick, 200);

    /* Buy the cheapest affordable building; returns whether anything was bought. */
    function buyCheapestAffordable() {
      let best = null, bestCost = null;
      for (const b of BUILDINGS) {
        const c = getBuildingCost(b);
        if (c.lte(skulls) && (bestCost === null || c.lt(bestCost))) { best = b; bestCost = c; }
      }
      if (!best) return false;
      skulls = skulls.sub(bestCost);
      owned[best.id] += 1;
      lastBought = best.id;
      return true;
    }

    function autoManageTick() {
      let touched = false;
      if (autoEnabled('auto_buy')) {
        /* A few per second so it feels alive without a per-frame loop. */
        for (let i = 0; i < 5 && buyCheapestAffordable(); i++) touched = true;
      }
      if (autoEnabled('auto_prestige') && canPrestige()) { doPrestige(true); touched = true; }
      if (touched) {
        checkAchievements();
        if (activeTab === 'buildings') renderBuildings();
        renderWorld();
      }
    }
    setInterval(autoManageTick, 1000);

    /* ═══════ CHANNEL POINT BOOST ═══════ */

    function checkSkullBoost() {
      if (cpBoostExpires > 0 && Date.now() >= cpBoostExpires) {
        cpBoostMult = 1;
        cpBoostExpires = 0;
        const el = document.getElementById('boostBanner');
        if (el) el.remove();
        render();
      }
      fetch('/api/channel-points?action=skull-boost', { credentials: 'same-origin' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || !d.active) return;
          cpBoostMult = d.multiplier || 2;
          cpBoostExpires = d.expiresAt || 0;
          var el = document.getElementById('boostBanner');
          if (!el) {
            el = document.createElement('div');
            el.id = 'boostBanner';
            el.className = 'boost-banner';
            document.querySelector('.game-wrap').prepend(el);
          }
          var secs = Math.max(0, Math.ceil((cpBoostExpires - Date.now()) / 1000));
          el.textContent = 'SKULL BOOST x' + cpBoostMult + ' — ' + secs + 's remaining';
          render();
        })
        .catch(function () {});
    }
    setInterval(checkSkullBoost, 15000);

    /* ═══════ PRESTIGE ═══════ */

    /* The bar to reset rises each tier: 1,000,000 this run for the first
       prestige, ten times as much for each after. Steep on purpose — a
       prestige should be earned, and the multiplier it grants is forever. */
    function prestigeRequirement() { return new Decimal(1e6).mul(new Decimal(10).pow(prestige)).mul(prestigeCostMult()); }
    function canPrestige() { return totalSkulls.gte(prestigeRequirement()); }

    /* Free buildings a fresh run starts with — from the Headstart/Standing
       Legion perks AND the permanent Grave Inheritance meta node. Called by
       both a prestige and a reap so the two stay in step. */
    function applyStartBonuses() {
      if (pHas('headstart')) { owned.shard += 10; owned.ghost += 5; }
      const legion = pLvl('t_start');
      if (legion > 0) { ['shard', 'ghost', 'crypt', 'altar', 'army'].forEach(id => { owned[id] += legion; }); }
      const inherit = metaLvl('m_start');
      if (inherit > 0) { BUILDINGS.forEach(b => { owned[b.id] += inherit; }); }
    }

    /* Wipe the RUN (not the meta): skulls, buildings, base+synergy upgrades and
       run milestones. Lifetime, prestige, shards, feats, cosmetics and every
       Reaping stat are left alone by design. The Grave Bloom layer, the Bound
       Reaper, the Grimoire, the Cursed Garden (grid, discovered strains,
       harvest/plant counts) and Hallowtide (unlock, lit-season end time, Wisps,
       relics) are permanent meta layers and are DELIBERATELY not touched here, so
       they survive both prestige and ascension. */
    function resetRun() {
      skulls = new Decimal(0);
      totalSkulls = new Decimal(0);
      clickBonus = 0;
      clickMulti = 1;
      cpsClickPct = 0;
      globalCpsMult = 1;
      owned = {};
      BUILDINGS.forEach(b => owned[b.id] = 0);
      boughtUpgrades = new Set();
      boughtGhouls = new Set();      /* Ghouls are re-bought each run, like base upgrades */
      hitMilestones = new Set();
      startTime = Date.now();
    }

    function doPrestige(silent) {
      if (!canPrestige()) return;
      const nextMult = 1 + 0.1 * (prestige + 1);
      const gained = pendingShards();
      if (!silent && !confirm('Prestige to tier ' + (prestige + 1) + '? This resets this run — skulls, ' +
                   'buildings and upgrades — but grants a permanent ' + nextMult.toFixed(1) +
                   'x to everything, forever' + (gained > 0 ? ', and ' + gained + ' Bone Shard' + (gained === 1 ? '' : 's') + ' to spend in the shop' : '') +
                   '. Your lifetime total and rank are kept.')) return;

      /* Legacy perk keeps the base upgrades; capture them before the wipe. */
      const keptUpgrades = perks.has('legacy')
        ? [...boughtUpgrades].filter(id => UPGRADES.some(u => u.id === id)) : [];

      prestige += 1;
      if (prestige > highestPrestige) highestPrestige = prestige;
      boneShards += gained;

      resetRun();

      /* Legacy: restore the kept upgrades and re-apply their baked effects
         (clickMulti/globalCpsMult were just reset). */
      for (const id of keptUpgrades) {
        const u = UPGRADES.find(x => x.id === id);
        if (u) { boughtUpgrades.add(id); if (u.apply) u.apply(); }
      }
      applyStartBonuses();

      if (!silent) {
        const el = document.createElement('div');
        el.className = 'milestone';
        el.innerHTML = '<h3>PRESTIGE ' + prestige + '</h3><p>' + getPrestigeMult().toFixed(1) + 'x forever</p>';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }

      /* Auto-prestige (silent) leans on the 30s autosave rather than hammering
         the server every time the bar refills. */
      if (!silent) save();
      render();
      renderWorld();
    }

    /* ═══════ THE REAPING (ascension) ═══════
       The one meta-reset. Converts the whole prestige climb — tier, Bone
       Shards, the entire shard shop — into Epitaphs, then wipes it so it can be
       re-climbed with the permanent meta-tree behind you. Lifetime skulls,
       feats, cosmetics and the meta-tree itself are kept, so no maxed player is
       wiped and the leaderboard (lifetime) is untouched. */
    function doAscend() {
      if (!canAscend()) return;
      const gained = pendingEpitaphs();
      if (!confirm('Reap for Ascension ' + (ascensions + 1) + '?\n\n' +
                   'This RESETS your prestige tier (' + prestige + '), your Bone Shards and the entire ' +
                   'Bone Shard shop — converting them into ' + gained + ' Epitaph' + (gained === 1 ? '' : 's') + ' to spend ' +
                   'in The Reaping. Your lifetime skulls, feats, cosmetics and everything you already own in ' +
                   'The Reaping are KEPT. This cannot be undone.')) return;

      ascensions += 1;
      epitaphs += gained;

      /* Meta-reset: drop the prestige layer entirely. */
      prestige = 0;
      boneShards = 0;
      perks = new Set();
      perkLevels = {};

      resetRun();
      applyStartBonuses();

      const el = document.createElement('div');
      el.className = 'milestone';
      el.innerHTML = '<h3>THE REAPING ' + ascensions + '</h3><p>+' + gained + ' Epitaph' + (gained === 1 ? '' : 's') + '</p>';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2600);
      screenShake();
      playSound('feat');

      checkAchievements();   /* grant "The First Reaping" the instant it happens */
      save();
      render();
      renderWorld();
    }

    /* ═══════ MONTHLY SEASONAL RESET — "wipe the run, keep the legacy" ═══════
       At each new server month every player's RUN and PRESTIGE layer reset to a
       fresh start, while the permanent legacy endures. This is the ONE place the
       WIPE-vs-KEEP partition lives, so it is trivial to adjust after review.

       WIPE (reset to fresh):
         · run: skulls, totalSkulls, click/CPS run multipliers, buildings owned,
           base+synergy+ghoul upgrades, run milestones, run clock  (via resetRun)
         · prestige layer: prestige tier, Bone Shards, prestige perks + perkLevels
         · per-run event/minigame state: active buffs, the active Skullpocalypse
           (unlock KEPT), Grimoire Essence pool, the live Garden grid contents
           (tier/discoveries KEPT), any lit Hallowtide timer (seasonEndsAt)
       KEEP (legacy — survives):
         · lifetime skulls (all-time board), totalClicks + cursedPopped (lifetime
           feat progress — see report FLAG), every earned feat/achievement
         · the whole Ascension layer: ascensions, epitaphs, metaLevels, metaPerks,
           highestPrestige, and the per-automation ON/OFF toggles (autoOff) — a
           preference tied to those (kept) automation unlocks
         · Grave Blooms + bloom ripen clock + building LEVELS (bloom-bought)
         · Bound Reaper: petLevel + selectedAuras
         · Skullpocalypse UNLOCK + ever-flags; Grimoire UNLOCK + spellsCast/backfired
         · Garden UNLOCK + tier + discoveredStrains + planted/harvest totals
         · Hallowtide UNLOCK + seasonRelics + WISPS (hard-won like blooms — FLAG)
         · leaderboard baseline (seasonBaseline/seasonMonth) + the seasonEpoch stamp
       Reuses resetRun() and the same prestige-layer drop a reap performs, minus
       the epitaph/ascension grant. */
    function applySeasonReset() {
      /* Drop the PRESTIGE layer (like a reap, WITHOUT granting epitaphs/ascension). */
      prestige = 0;
      boneShards = 0;
      perks = new Set();
      perkLevels = {};
      /* Wipe the run. */
      resetRun();
      /* Wipe per-run event + minigame state; the permanent unlocks/legacy above
         are deliberately left untouched. */
      activeBuffs = [];
      combo = 0;
      apocActive = false; apocStart = 0; apocPacifiedUntil = 0;
      clearWraiths(); clearTimeout(wraithTimer); wraithTimer = null;
      essence = 0;                                   /* Grimoire consumable refills over time */
      gardenPlots = [];                              /* clear the live grid; tier + discoveries KEPT */
      ensureGardenShape();
      seasonEndsAt = 0;                              /* any lit Hallowtide ends; relics + wisps KEPT */
      /* Re-grant fresh-run starting buildings (perks were just cleared, so only
         the permanent meta node m_start contributes now). */
      applyStartBonuses();
    }

    /* Monotonic month index from a 'YYYY-MM' epoch; 0 (oldest) when missing. */
    function epochNum(m) {
      if (!m || typeof m !== 'string') return 0;
      const [y, mo] = m.split('-').map(Number);
      return (y && mo) ? y * 12 + (mo - 1) : 0;
    }

    /* The server's authoritative season epoch — never the local clock. Returns
       null on any failure so the reset check can safely no-op (never wipe blind). */
    async function fetchServerEpoch() {
      try {
        const res = await fetch('/api/skull-clicker?epoch=1', { cache: 'no-store' });
        if (!res.ok) return null;
        const d = await res.json();
        return (d && typeof d.epoch === 'string') ? d.epoch : null;
      } catch (e) { return null; }
    }

    /* Run once at load, AFTER the local+server saves have settled on a state.
       Migration-safe: a missing stamp adopts the current epoch with no wipe. */
    async function checkSeasonReset() {
      const ep = await fetchServerEpoch();
      if (!ep) return;                               /* cannot verify → never wipe */
      if (seasonEpoch == null || seasonEpoch === '') {
        seasonEpoch = ep;                            /* migration safety: adopt, do NOT wipe */
        save();
        return;
      }
      if (epochNum(seasonEpoch) < epochNum(ep)) {    /* a new season has begun */
        submitScore();                               /* capture the outgoing month's final score once */
        applySeasonReset();
        seasonEpoch = ep;                            /* stamp BEFORE saving so the server merge accepts it */
        save();
        const banner = document.getElementById('offlineBanner');
        if (banner) banner.innerHTML = '<div class="offline-banner" onclick="this.remove()">🕯️ A new season has begun. Your run and prestige start fresh — but your Grave Blooms, ascensions, minigame unlocks, relics and feats endure. Click to dismiss.</div>';
        render();
        renderWorld();
      }
      /* Equal epoch → normal play, nothing to do. */
    }

    function buyMeta(id) {
      const m = metaDef(id);
      if (!m || metaMaxed(m)) return;
      if (m.req && !metaHas(m.req)) return;
      const cost = metaCost(m);
      if (epitaphs < cost) return;
      epitaphs -= cost;
      if (m.type === 'endless') metaLevels[id] = metaLvl(id) + 1;
      else metaPerks.add(id);
      playSound('feat');
      save();
      render();
      renderWorld();
    }

    function buyPerk(id) {
      const p = perkDef(id);
      if (!p || perkMaxed(p)) return;
      if (p.req && !pHas(p.req)) return;
      const cost = perkCost(p);
      if (boneShards < cost) return;
      boneShards -= cost;
      if (p.type === 'tiered') perkLevels[id] = pLvl(id) + 1;
      else perks.add(id);
      playSound('feat');
      save();
      render();
      renderWorld();
    }

    /* The running total a tiered perk is currently giving, for its row. */
    function perkNowLabel(p) {
      const lv = pLvl(p.id), pct = Math.round(p.per * lv * 100);
      switch (p.id) {
        case 't_critdmg': return '×' + critMult().toFixed(1) + ' crit dmg';
        case 't_frenzy':  return '×' + frenzyMultValue() + ' frenzy';
        case 't_cost':    return pct + '% cheaper';
        case 't_start':   return '+' + lv + ' each';
        default:          return '+' + pct + '%';
      }
    }

    function renderPrestige() {
      const mult = getPrestigeMult();
      const req = prestigeRequirement();
      const ready = canPrestige();
      const pct = Math.min(100, totalSkulls.div(req).toNumber() * 100);
      const gained = pendingShards();

      function perkRow(p) {
        const tiered = p.type === 'tiered';
        const maxed = perkMaxed(p);
        const locked = p.req && !pHas(p.req);
        const cost = perkCost(p);
        const can = !maxed && !locked && boneShards >= cost;
        const state = maxed ? 'bought' : can ? 'affordable' : locked ? 'locked' : '';
        const lvlTag = tiered ? ' <span class="perk-lvl">Lv ' + pLvl(p.id) + '/' + p.max + '</span>' : '';
        const right = maxed ? (tiered ? 'Maxed' : 'Owned') : locked ? 'Locked' : '🦴 ' + formatNum(cost);
        return '<div class="upgrade-row ' + state + '" onclick="' + (can ? "buyPerk('" + p.id + "')" : '') + '">' +
          '<div class="building-info"><div class="building-name">' + p.name + lvlTag + '</div>' +
          '<div class="building-desc">' + p.desc + (tiered && pLvl(p.id) > 0 ? ' <span class="perk-now">(now ' + perkNowLabel(p) + ')</span>' : '') + '</div></div>' +
          '<div class="building-right"><div class="building-cost">' + right + '</div></div></div>';
      }

      let shop = '<div class="section-label">Bone Shard Shop — Unlocks</div>' +
        '<div class="shard-balance">🦴 <b>' + formatNum(boneShards) + '</b> Bone Shard' + (boneShards === 1 ? '' : 's') + '</div>';
      for (const p of PERKS) if (p.type !== 'tiered') shop += perkRow(p);
      shop += '<div class="section-label">Bone Shard Shop — Endless Climbs</div>';
      for (const p of PERKS) if (p.type === 'tiered') shop += perkRow(p);

      document.getElementById('tab-prestige').innerHTML =
        helpBox('prestige', HELP.prestige) +
        '<div class="prestige-panel">' +
          '<div class="prestige-tier">Prestige ' + prestige + '</div>' +
          '<div class="prestige-mult">' + mult.toFixed(1) + 'x to all skull gathering</div>' +
          '<div class="prestige-next">Next tier: ' + (mult + 0.1).toFixed(1) + 'x at ' +
            formatNum(req) + ' skulls this run</div>' +
          '<div class="prestige-bar"><div class="prestige-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="prestige-have">' + formatNum(totalSkulls.floor()) + ' / ' + formatNum(req) + '</div>' +
          '<button class="prestige-btn" ' + (ready ? '' : 'disabled') +
            ' onclick="doPrestige()">' + (ready ? 'Prestige now' : 'Not yet') + '</button>' +
          '<div class="prestige-note">Resets this run. Keeps your lifetime total, rank, the multiplier, and your Bone Shards' +
            (gained > 0 ? '. Prestiging now earns <b style="color:#ff5555">' + gained + '</b> shard' + (gained === 1 ? '' : 's') : '') + '.</div>' +
        '</div>' + shop;
    }

    /* ═══════ THE BOUND REAPER (pet) ═══════ */
    function renderPet() {
      const el = document.getElementById('tab-pet');
      const b = petFeedBuilding();
      const need = petFeedCount();
      const have = owned[b.id] || 0;
      const canFeed = have >= need;
      const slots = auraSlots();

      const slotText = slots === 0
        ? 'Reach level ' + PET_AURA_SLOT_L1 + ' to unlock an aura slot'
        : selectedAuras.length + '/' + slots + ' aura' + (slots === 1 ? '' : 's') + ' active' +
          (slots < 2 ? ' · 2nd slot at level ' + PET_AURA_SLOT_L2 : '');

      let auraHtml = '';
      for (const a of AURAS) {
        const active = auraActive(a.id);
        const locked = slots <= 0;
        const state = active ? 'equipped' : locked ? 'locked' : '';
        auraHtml += '<div class="aura-row ' + state + '" onclick="' + (locked ? '' : "toggleAura('" + a.id + "')") + '">' +
          '<img class="aura-ico" src="' + a.icon + '" alt="" onerror="this.remove()">' +
          '<div class="cosmetic-info"><div class="cosmetic-name">' + a.name +
          (active ? ' <span class="aura-on">ACTIVE</span>' : '') + '</div>' +
          '<div class="cosmetic-desc">' + a.desc + '</div></div></div>';
      }

      el.innerHTML =
        helpBox('pet', HELP.pet) +
        '<div class="pet-panel">' +
          '<div class="pet-sprite"></div>' +
          '<div class="pet-name">' + PET_NAME + '</div>' +
          '<div class="pet-level">Level ' + petLevel + '</div>' +
          '<div class="pet-feed-info">Feed: sacrifice <b>' + need + '</b> ' + escSkull(b.name) + (need === 1 ? '' : 's') +
            ' <span class="pet-have">(you have ' + formatNum(have) + ')</span></div>' +
          '<button class="pet-feed-btn" ' + (canFeed ? '' : 'disabled') + ' onclick="feedPet(event)">' +
            (canFeed ? 'Feed the ' + PET_NAME : 'Need ' + need + ' ' + escSkull(b.name)) + '</button>' +
        '</div>' +
        '<div class="section-label">Auras — ' + slotText + '</div>' +
        auraHtml;
    }

    /* ═══════ THE GRIMOIRE OF THE DEAD ═══════
       Locked → a Grave-Bloom unlock promise; unlocked → the Essence pool with a
       regen bar, the spell list (cost + live backfire %), and the cast/backfire
       counters. Built from existing classes only — no new colour tokens. */
    function renderGrimoire() {
      const el = document.getElementById('tab-grimoire');
      if (!grimoireUnlocked) {
        const can = graveBlooms >= GRIMOIRE_UNLOCK_BLOOMS;
        el.innerHTML =
          helpBox('grimoire', HELP.grimoire) +
          '<div class="prestige-panel">' +
            '<div class="reaping-tier">The Grimoire</div>' +
            '<div class="reaping-sub">Of the Dead</div>' +
            '<div class="ascend-locked">A tome of necrotic magic lies buried in your dominion. ' +
              'Unearth it with <b>' + GRIMOIRE_UNLOCK_BLOOMS + ' Grave Blooms</b> to draw on ' +
              '<b>Necrotic Essence</b> — a power that regenerates over time and pays for spells.<br><br>' +
              'You have <b>' + formatNum(graveBlooms) + '</b> Grave Bloom' + (graveBlooms === 1 ? '' : 's') + '.</div>' +
            '<button class="prestige-btn" ' + (can ? '' : 'disabled') + ' onclick="unlockGrimoire()">' +
              (can ? 'Unearth the Grimoire — ' + GRIMOIRE_UNLOCK_BLOOMS + ' Blooms' : 'Need ' + GRIMOIRE_UNLOCK_BLOOMS + ' Grave Blooms') + '</button>' +
          '</div>';
        return;
      }

      const max = essenceMax();
      const cur = Math.min(essence, max);
      const pct = max > 0 ? (cur / max) * 100 : 0;
      const regen = essenceRegenPerSec();

      let rows = '';
      for (const s of SPELLS) {
        const cost = spellCost(s);
        const bf = Math.round(backfireChance(s) * 100);
        const can = cur >= cost;
        rows += '<div class="upgrade-row ' + (can ? 'affordable' : 'locked') + '" onclick="' + (can ? "castSpell('" + s.id + "')" : '') + '">' +
          '<img class="aura-ico" src="' + s.icon + '" alt="" onerror="this.remove()">' +
          '<div class="building-info">' +
            '<div class="building-name">' + s.name + ' <span class="bldg-lv-tag">backfire ' + bf + '%</span></div>' +
            '<div class="building-desc">' + s.desc + '</div>' +
          '</div>' +
          '<div class="building-right"><div class="building-cost">🕯️ ' + formatNum(cost) + '</div></div></div>';
      }

      el.innerHTML =
        helpBox('grimoire', HELP.grimoire) +
        '<div class="prestige-panel">' +
          '<div class="reaping-tier" style="font-size:28px">The Grimoire</div>' +
          '<div class="reaping-sub">Necrotic Essence — spend it to cast, it regenerates in time</div>' +
          '<div class="shard-balance">🕯️ <b>' + formatNum(Math.floor(cur)) + '</b> / ' + formatNum(max) + ' Essence</div>' +
          '<div class="prestige-bar"><div class="prestige-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="prestige-have">Regenerating ' + formatNum(regen) + ' / sec' +
            (cur < max ? ' · full in ' + formatTime((max - cur) / regen * 1000) : ' · at full power') + '</div>' +
          '<div class="ascend-summary">Spells cast: <b>' + formatNum(spellsCast) + '</b> · Backfires: <b>' + formatNum(spellsBackfired) + '</b><br>' +
            'The more you cast, the more the dead resist — every spell nudges the backfire chance higher.</div>' +
        '</div>' +
        '<div class="section-label">Spells</div>' +
        rows;
    }

    /* Live-refresh the Grimoire tab (Essence bar / affordability) once a second
       while it is open — cheap, and never per frame. */
    setInterval(() => { if (activeTab === 'grimoire') renderGrimoire(); }, 1000);

    /* ═══════ THE CURSED GARDEN — mults, actions, and the tick ═══════ */

    /* Mature plants fold a small, capped bonus into production; blight drags it
       down. Both channels iterate the (≤36-cell) array — negligible per call. */
    function gardenCpsMult() {
      if (!gardenUnlocked) return 1;
      let bonus = 0, blight = 0;
      for (const c of gardenPlots) {
        if (!c) continue;
        if (c.s === 'blight') { blight++; continue; }
        if (plantStage(c) !== 'mature') continue;
        const st = strainById(c.s);
        if (st && st.cpsBonus) bonus += st.cpsBonus;
      }
      const pos = 1 + Math.min(GARDEN_CPS_CAP, bonus);
      const pen = Math.max(GARDEN_BLIGHT_FLOOR, 1 - blight * GARDEN_BLIGHT_PER);
      return pos * pen;
    }
    function gardenClickMult() {
      if (!gardenUnlocked) return 1;
      let bonus = 0;
      for (const c of gardenPlots) {
        if (!c || c.s === 'blight') continue;
        if (plantStage(c) !== 'mature') continue;
        const st = strainById(c.s);
        if (st && st.clickBonus) bonus += st.clickBonus;
      }
      return 1 + Math.min(GARDEN_CLICK_CAP, bonus);
    }

    function gardenToast(msg) { showBuffToast('🌿 ' + msg, 'buff'); }

    function unlockGarden() {
      if (gardenUnlocked || graveBlooms < GARDEN_UNLOCK_BLOOMS) return;
      graveBlooms -= GARDEN_UNLOCK_BLOOMS;
      gardenUnlocked = true;
      ensureGardenShape();
      discoveredStrains.add('bone');
      discoveredStrains.add('moss');
      playStinger('legendary');
      screenShake();
      showBuffToast('🌱 The Cursed Garden is tilled', 'reap');
      checkAchievements();
      save();
      render();
      renderBuildings();
    }

    function expandGarden() {
      if (!gardenUnlocked || gardenTier >= GARDEN_SIZES.length - 1) return;
      const cost = GARDEN_EXPAND_COST[gardenTier + 1];
      if (graveBlooms < cost) { gardenToast('Need ' + cost + ' Grave Blooms to expand'); return; }
      graveBlooms -= cost;
      gardenTier += 1;
      ensureGardenShape();
      playStinger('epic');
      save();
      render();
    }

    /* Arm/disarm a seed from the tray; the next click on an empty plot sows it. */
    function armSeed(id) {
      gardenSeed = (gardenSeed === id) ? null : id;
      if (activeTab === 'garden') renderGarden();
    }

    /* One primary action per plot click — GAME-DEV-PRACTICES #8, each rejection
       says why rather than silently no-opping. Non-mature plants are never culled
       by a body click (avoids fat-finger loss); the ✕ control culls explicitly. */
    function plotClick(i) {
      if (!gardenUnlocked) return;
      const c = gardenPlots[i];
      if (c) {
        if (c.s === 'blight') { cullPlot(i); return; }
        const stg = plantStage(c);
        if (stg === 'mature') { harvestPlot(i); return; }
        gardenToast(stg === 'decaying' ? 'Overripe — cull it (✕) before it rots to blight' : 'Still growing…');
        return;
      }
      if (!isActiveCell(i)) { gardenToast('That plot is not tilled yet'); return; }
      if (!gardenSeed) { gardenToast('Pick a seed from the tray first'); return; }
      plantSeed(i, gardenSeed);
    }

    function plantSeed(i, id) {
      if (!gardenUnlocked) return;
      if (!isActiveCell(i)) { gardenToast('That plot is not tilled yet'); return; }
      if (gardenPlots[i]) { gardenToast('That plot is occupied'); return; }
      const st = strainById(id);
      if (!st || !st.plantable) { gardenToast('You cannot sow that'); return; }
      if (!discoveredStrains.has(id)) { gardenToast('That strain is still undiscovered'); return; }
      gardenPlots[i] = { s: id, t: Date.now() };
      gardenPlanted += 1;
      playSound('buy');
      checkAchievements();
      save();
      renderGarden();
    }

    function harvestPlot(i) {
      const c = gardenPlots[i];
      if (!c || c.s === 'blight') return;
      if (plantStage(c) !== 'mature') return;
      const st = strainById(c.s);
      const msg = (st && st.harvest) ? st.harvest() : '';
      gardenPlots[i] = null;
      gardenHarvests += 1;
      if (st) discoveredStrains.add(st.id);
      playStinger('rare');
      checkAchievements();
      save();
      render();
      renderGarden();
      if (msg) showBuffToast('🌾 ' + msg, 'frenzy', st ? st.icon : undefined);
    }

    function cullPlot(i, e) {
      if (e) e.stopPropagation();
      if (!gardenPlots[i]) return;
      gardenPlots[i] = null;
      playSound('buy');
      save();
      render();
      renderGarden();
    }

    /* Given the mature neighbour strains of an empty plot, pick the offspring:
       the RAREST matching recipe if any pair matches, else a self-seeded copy of
       a random neighbour so the garden keeps filling. Deterministic given the
       neighbours; randomness lives only in whether the tick fires. */
    function mutationOffspring(mats) {
      const uniq = [...new Set(mats)];
      let best = null, bestRank = -1;
      for (let i = 0; i < uniq.length; i++) {
        for (let j = i; j < uniq.length; j++) {
          if (i === j && mats.filter(x => x === uniq[i]).length < 2) continue;
          const key = [uniq[i], uniq[j]].sort().join('|');
          const res = GARDEN_RECIPES[key];
          if (res) { const rk = strainRank(res); if (rk > bestRank) { best = res; bestRank = rk; } }
        }
      }
      if (best) return best;
      return mats[Math.floor(Math.random() * mats.length)];
    }

    /* The slow idle loop: mature lilies summon cursed skulls, decaying plants rot
       to blight, blight spreads, and empty plots cross-breed. Bails instantly
       while the garden is un-tilled (marathon-safe). Growth itself needs no tick —
       it is derived from timestamps and is already offline-aware. */
    function gardenTick() {
      if (!gardenUnlocked) return;
      const S = gardenSide();
      let changed = false, discovered = false;

      for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) {
        const cell = gardenPlots[r * 6 + c];
        if (cell && cell.s !== 'blight' && plantStage(cell) === 'mature') {
          const st = strainById(cell.s);
          if (st && st.lily && Math.random() < LILY_SPAWN_CHANCE) spawnCursed({ storm: true });
        }
      }

      for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) {
        const idx = r * 6 + c, cell = gardenPlots[idx];
        if (cell && cell.s !== 'blight' && plantStage(cell) === 'decaying' && Math.random() < DECAY_TO_BLIGHT_CHANCE) {
          gardenPlots[idx] = { s: 'blight', t: Date.now() };
          changed = true;
        }
      }

      const blightIdx = [];
      for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) {
        const idx = r * 6 + c;
        if (gardenPlots[idx] && gardenPlots[idx].s === 'blight') blightIdx.push([r, c]);
      }
      for (const [r, c] of blightIdx) {
        if (Math.random() >= BLIGHT_SPREAD_CHANCE) continue;
        const ns = activeNeighbors(r, c, S);
        if (!ns.length) continue;
        const [tr, tc] = ns[Math.floor(Math.random() * ns.length)];
        const tIdx = tr * 6 + tc, tcell = gardenPlots[tIdx];
        if (!tcell) { gardenPlots[tIdx] = { s: 'blight', t: Date.now() }; changed = true; }
        else if (tcell.s !== 'blight' && Math.random() < 0.5) { gardenPlots[tIdx] = { s: 'blight', t: Date.now() }; changed = true; }
      }

      for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) {
        const idx = r * 6 + c;
        if (gardenPlots[idx]) continue;
        const mats = [];
        for (const [nr, nc] of activeNeighbors(r, c, S)) {
          const ncell = gardenPlots[nr * 6 + nc];
          if (ncell && ncell.s !== 'blight' && plantStage(ncell) === 'mature') mats.push(ncell.s);
        }
        if (mats.length < 2) continue;
        if (Math.random() >= MUTATE_CHANCE) continue;
        const off = mutationOffspring(mats);
        if (!off) continue;
        gardenPlots[idx] = { s: off, t: Date.now() };
        changed = true;
        if (!discoveredStrains.has(off)) { discoveredStrains.add(off); discovered = true; }
      }

      if (discovered) {
        checkAchievements();
        showBuffToast('🌾 A new strain takes root in your garden', 'frenzy');
      }
      /* Persist promptly only on a discovery (rare, meaningful); routine
         mutation/blight churn rides the existing 30s autosave + beforeunload,
         so this loop never hammers localStorage or the server. */
      if (discovered) save();
      if ((changed || discovered) && activeTab === 'garden') renderGarden();
    }

    function renderGarden() {
      const el = document.getElementById('tab-garden');
      if (!el) return;

      if (!gardenUnlocked) {
        const can = graveBlooms >= GARDEN_UNLOCK_BLOOMS;
        el.innerHTML =
          helpBox('garden', HELP.garden) +
          '<div class="prestige-panel">' +
            '<div class="reaping-tier">The Cursed</div>' +
            '<div class="reaping-sub">Garden</div>' +
            '<div class="ascend-locked">Salted grave-soil waits behind your dominion. Till it with ' +
              '<b>' + GARDEN_UNLOCK_BLOOMS + ' Grave Blooms</b> to sow strains that grow in real time — ' +
              'each mature plant folds a small, permanent edge into your reaping, and adjacent plants ' +
              'cross-breed into rarer, discoverable strains.<br><br>' +
              'You have <b>' + formatNum(graveBlooms) + '</b> Grave Bloom' + (graveBlooms === 1 ? '' : 's') + '.</div>' +
            '<button class="prestige-btn" ' + (can ? '' : 'disabled') + ' onclick="unlockGarden()">' +
              (can ? 'Till the Garden — ' + GARDEN_UNLOCK_BLOOMS + ' Blooms' : 'Need ' + GARDEN_UNLOCK_BLOOMS + ' Grave Blooms') + '</button>' +
          '</div>';
        return;
      }

      const S = gardenSide();
      const known = STRAINS.filter(s => s.plantable && discoveredStrains.has(s.id)).length;
      const totalPlantable = STRAINS.filter(s => s.plantable).length;

      let head =
        helpBox('garden', HELP.garden) +
        '<div class="prestige-panel">' +
          '<div class="reaping-tier" style="font-size:28px">The Cursed Garden</div>' +
          '<div class="reaping-sub">Plants grow in real time — mature them for a bonus, harvest, and cross-breed</div>' +
          '<div class="ascend-summary">Grid <b>' + S + '×' + S + '</b> · Strains discovered <b>' + known + '/' + totalPlantable + '</b>' +
            ' · Harvested <b>' + formatNum(gardenHarvests) + '</b><br>' +
            'Grave Blooms: <b>' + formatNum(graveBlooms) + '</b></div>';
      if (gardenTier < GARDEN_SIZES.length - 1) {
        const nextCost = GARDEN_EXPAND_COST[gardenTier + 1];
        const canExp = graveBlooms >= nextCost;
        head += '<button class="prestige-btn" ' + (canExp ? '' : 'disabled') + ' onclick="expandGarden()">' +
          'Expand to ' + GARDEN_SIZES[gardenTier + 1] + '×' + GARDEN_SIZES[gardenTier + 1] + ' — ' + nextCost + ' Blooms</button>';
      }
      head += '</div>';

      let grid = '<div class="garden-grid" style="grid-template-columns:repeat(' + S + ',1fr)">';
      for (let r = 0; r < S; r++) {
        for (let c = 0; c < S; c++) {
          const idx = r * 6 + c;
          const cell = gardenPlots[idx];
          if (!cell) {
            const armed = gardenSeed ? ' armed' : '';
            const face = gardenSeed ? icoImg('garden-' + gardenSeed, strainById(gardenSeed).emoji, '') : '·';
            grid += '<div class="garden-plot empty' + armed + '" onclick="plotClick(' + idx + ')" title="Empty plot">' +
              '<span class="garden-emoji">' + face + '</span>' +
              '<span class="garden-stage">' + (gardenSeed ? 'Plant' : 'Empty') + '</span></div>';
            continue;
          }
          if (cell.s === 'blight') {
            grid += '<div class="garden-plot blight" onclick="plotClick(' + idx + ')" title="Blight — click to cull">' +
              '<button class="garden-cull" onclick="cullPlot(' + idx + ',event)" title="Cull">✕</button>' +
              '<span class="garden-emoji">' + icoImg('garden-blight', '🕸️', '') + '</span>' +
              '<span class="garden-stage">BLIGHT</span></div>';
            continue;
          }
          const st = strainById(cell.s);
          const stg = plantStage(cell);
          const f = Math.min(1, plantAge(cell) / st.growMs);
          const pct = Math.round(f * 100);
          const label = stg === 'mature' ? 'HARVEST' : stg === 'decaying' ? 'Overripe' : stg === 'sprout' ? 'Sprouting' : 'Seed';
          const cull = '<button class="garden-cull" onclick="cullPlot(' + idx + ',event)" title="Cull">✕</button>';
          grid += '<div class="garden-plot ' + stg + '" onclick="plotClick(' + idx + ')" title="' + st.name + '">' +
            cull +
            '<span class="garden-emoji">' + icoImg('garden-' + cell.s, st.emoji, '') + '</span>' +
            '<span class="garden-stage">' + label + '</span>' +
            (stg === 'mature' ? '' : '<span class="garden-bar"><span class="garden-fill" style="width:' + pct + '%"></span></span>') +
            '</div>';
        }
      }
      grid += '</div>';

      let tray = '<div class="section-label">Seed Tray</div>';
      const plantable = STRAINS.filter(s => s.plantable && discoveredStrains.has(s.id));
      if (!plantable.length) {
        tray += '<div class="garden-almanac-desc">No seeds yet.</div>';
      } else {
        tray += '<div class="garden-tray">';
        for (const s of plantable) {
          const armed = gardenSeed === s.id ? ' armed' : '';
          tray += '<button class="garden-seed' + armed + '" onclick="armSeed(\'' + s.id + '\')">' +
            '<span class="garden-emoji">' + icoImg('garden-' + s.id, s.emoji, '') + '</span>' + s.name + '</button>';
        }
        tray += '</div>';
        tray += '<div class="garden-almanac-desc">' +
          (gardenSeed ? 'Armed: <b style="color:#ff5555">' + strainById(gardenSeed).name + '</b> — click an empty plot to sow.' : 'Pick a seed, then click an empty plot to sow it.') +
          '</div>';
      }

      let almanac = '<div class="section-label">Almanac</div>';
      for (const s of STRAINS) {
        if (!s.plantable) continue;
        const disc = discoveredStrains.has(s.id);
        almanac += '<div class="garden-almanac-row' + (disc ? '' : ' undiscovered') + '">' +
          '<div class="garden-almanac-name">' + (disc ? icoImg('garden-' + s.id, s.emoji, 'garden-alm-ico') + ' ' + s.name : '❓ ??? — cross-breed to discover') + '</div>' +
          (disc ? '<div class="garden-almanac-desc">' + s.desc + '</div>' +
                  '<div class="garden-almanac-eff">' + s.effect + '</div>' : '') +
          '</div>';
      }
      /* Blight is a garden hazard, not a plantable strain — note it at the foot. */
      almanac += '<div class="garden-almanac-row"><div class="garden-almanac-name">' + icoImg('garden-blight', '🕸️', 'garden-alm-ico') + ' Grave Blight</div>' +
        '<div class="garden-almanac-desc">' + strainById('blight').desc + '</div>' +
        '<div class="garden-almanac-eff">' + strainById('blight').effect + '</div></div>';

      el.innerHTML = head + grid + tray + almanac;
    }

    /* Live-refresh the Garden tab (maturity bars) once a second while open, and
       run the slow mutation/blight/lily loop on its own cadence. Both are cheap
       no-ops until the garden is tilled. */
    setInterval(() => { if (activeTab === 'garden') renderGarden(); }, 1000);
    setInterval(gardenTick, GARDEN_TICK_MS);

    /* ═══════ HALLOWTIDE — actions and render ═══════ */

    function seasonToast(msg) { showBuffToast('🕯️ ' + msg, 'buff'); }

    function unlockSeason() {
      if (seasonUnlocked || graveBlooms < SEASON_UNLOCK_BLOOMS) return;
      graveBlooms -= SEASON_UNLOCK_BLOOMS;
      seasonUnlocked = true;
      playStinger('legendary');
      screenShake();
      showBuffToast('🕯️ Hallowtide — the Season of the Dead awakens', 'reap');
      checkAchievements();
      save();
      render();
      renderBuildings();
    }

    /* Light the season with skulls (CC's season switch). No-op if the free auto-
       window already has it burning. Stores an end timestamp so it survives reload
       and expires on its own, online or off. */
    function lightSeason() {
      if (!seasonUnlocked) return;
      if (seasonAutoWindow()) { seasonToast('Hallowtide already burns bright this time of year'); return; }
      const cost = seasonSwitchCost();
      if (skulls.lt(cost)) { seasonToast('Need ' + formatNum(cost) + ' skulls to light the season'); return; }
      skulls = skulls.sub(cost);
      seasonEndsAt = Date.now() + SEASON_DURATION_MS;
      playStinger('epic');
      showBuffToast('🕯️ Hallowtide is lit — Wisps drift from cursed skulls', 'frenzy');
      save();
      render();
    }

    /* Snuff a player-lit season early (the auto-window cannot be snuffed). */
    function douseSeason() {
      if (seasonAutoWindow()) { seasonToast('The season lights itself this time of year'); return; }
      seasonEndsAt = 0;
      save();
      render();
    }

    function buyRelic(id) {
      const r = seasonRelicById(id);
      if (!r || seasonRelics.has(id)) return;
      if (wisps < r.cost) { seasonToast('Need ' + r.cost + ' ' + WISP_ICON + ' Wisps'); return; }
      wisps -= r.cost;
      seasonRelics.add(id);
      playStinger('rare');
      checkAchievements();
      save();
      render();
    }

    function renderSeason() {
      const el = document.getElementById('tab-hallowtide');
      if (!el) return;

      if (!seasonUnlocked) {
        const can = graveBlooms >= SEASON_UNLOCK_BLOOMS;
        el.innerHTML =
          helpBox('hallowtide', HELP.hallowtide) +
          '<div class="prestige-panel">' +
            '<div class="reaping-tier">Hallowtide</div>' +
            '<div class="reaping-sub">The Season of the Dead</div>' +
            '<div class="ascend-locked">Once a year the veil thins and the dead walk close. Awaken the ' +
              'season with <b>' + SEASON_UNLOCK_BLOOMS + ' Grave Blooms</b> to light Hallowtide at will — ' +
              'while it burns, cursed skulls shed <b>Wisps</b> you spend on seven permanent relics. ' +
              'It also lights itself for free at the end of every October.<br><br>' +
              'You have <b>' + formatNum(graveBlooms) + '</b> Grave Bloom' + (graveBlooms === 1 ? '' : 's') + '.</div>' +
            '<button class="prestige-btn" ' + (can ? '' : 'disabled') + ' onclick="unlockSeason()">' +
              (can ? 'Awaken Hallowtide — ' + SEASON_UNLOCK_BLOOMS + ' Blooms' : 'Need ' + SEASON_UNLOCK_BLOOMS + ' Grave Blooms') + '</button>' +
          '</div>';
        return;
      }

      const active = seasonActive();
      const auto = seasonAutoWindow();
      const owned = seasonRelics.size;

      let statusLine, switchBtn;
      if (auto) {
        statusLine = 'Hallowtide burns <b style="color:#ff5555">FREE</b> — the veil is thin this time of year';
        switchBtn = '';
      } else if (active) {
        statusLine = 'Hallowtide is <b style="color:#ff5555">LIT</b> · ' + formatTime(seasonRemainingMs()) + ' remaining';
        switchBtn = '<button class="prestige-btn" onclick="douseSeason()">Snuff the season early</button>';
      } else {
        const cost = seasonSwitchCost();
        const can = skulls.gte(cost);
        statusLine = 'Hallowtide is <b>dormant</b> · auto-lights at the end of October';
        switchBtn = '<button class="prestige-btn" ' + (can ? '' : 'disabled') + ' onclick="lightSeason()">' +
          (can ? 'Light the season — ' + formatNum(cost) + ' skulls (30 min)' : 'Need ' + formatNum(cost) + ' skulls') + '</button>';
      }

      let head =
        helpBox('hallowtide', HELP.hallowtide) +
        '<div class="prestige-panel">' +
          '<div class="reaping-tier" style="font-size:28px">Hallowtide</div>' +
          '<div class="reaping-sub">' + statusLine + '</div>' +
          '<div class="shard-balance">' + WISP_IMG + ' <b>' + formatNum(wisps) + '</b> Wisp' + (wisps === 1 ? '' : 's') + '</div>' +
          '<div class="ascend-summary">Relics gathered: <b>' + owned + ' / ' + SEASON_RELICS.length + '</b>' +
            (active ? '<br>Cursed skulls are shedding Wisps — pop them while the season burns.' :
                      '<br>Light the season (or wait for late October) to make cursed skulls shed Wisps.') + '</div>' +
          switchBtn +
        '</div>';

      let shop = '<div class="section-label">Relics — spend Wisps</div>';
      for (const r of SEASON_RELICS) {
        const have = seasonRelics.has(r.id);
        const can = !have && wisps >= r.cost;
        const state = have ? 'bought' : can ? 'affordable' : 'locked';
        const right = have ? 'Owned' : WISP_IMG + ' ' + r.cost;
        shop += '<div class="upgrade-row ' + state + '" onclick="' + (can ? "buyRelic('" + r.id + "')" : '') + '">' +
          '<div class="building-icon">' + icoImg(r.id === 'hallow' ? 'hallow-skull' : 'hallow-' + r.id, r.emoji, 'relic-ico') + '</div>' +
          '<div class="building-info">' +
            '<div class="building-name">' + r.name + '</div>' +
            '<div class="building-desc">' + r.desc + ' <span class="bldg-lv-tag">' + r.effect + '</span></div>' +
          '</div>' +
          '<div class="building-right"><div class="building-cost">' + right + '</div></div></div>';
      }

      el.innerHTML = head + shop;
    }

    /* Live-refresh the Hallowtide tab (the countdown) once a second while it is
       open — cheap, and a no-op when the tab is closed or the season is dormant. */
    setInterval(() => { if (activeTab === 'hallowtide') renderSeason(); }, 1000);

    /* The running total an endless meta node is currently giving, for its row. */
    function metaNowLabel(m) {
      const lv = metaLvl(m.id);
      switch (m.id) {
        case 'm_prod':    return '+' + Math.round(0.10 * lv * 100) + '%';
        case 'm_click':   return '+' + Math.round(0.12 * lv * 100) + '%';
        case 'm_epitaph': return '+' + Math.round(0.08 * lv * 100) + '%';
        case 'm_start':   return '+' + lv + ' each';
        case 'm_prcost':  return Math.round((1 - prestigeCostMult()) * 100) + '% cheaper';
        default:          return 'Lv ' + lv;
      }
    }

    function renderReaping() {
      const el = document.getElementById('tab-reaping');
      const ready = canAscend();
      const gained = pendingEpitaphs();

      /* Before the first reap, the tree is a locked promise — but the moment
         someone has ascended once, the tab stays available forever. */
      if (ascensions === 0 && !ready) {
        el.innerHTML =
          helpBox('reaping', HELP.reaping) +
          '<div class="prestige-panel">' +
            '<div class="reaping-tier">The Reaping</div>' +
            '<div class="reaping-sub">A power beyond prestige.</div>' +
            '<div class="ascend-locked">Reach <b>Prestige ' + ASCEND_MIN_PRESTIGE + '</b> to unlock The Reaping.<br>' +
              'You are at Prestige <b>' + prestige + '</b>.<br><br>' +
              'Reaping trades your whole prestige climb for <b>Epitaphs</b> — a permanent currency ' +
              'that buys an endless meta-tree. Your lifetime skulls and feats are kept.</div>' +
          '</div>' +
          apocSectionHtml();   /* the Skullpocalypse unlocks before ascension, so show it here too */
        return;
      }

      function metaRow(m) {
        const endless = m.type === 'endless';
        const maxed = metaMaxed(m);
        const locked = m.req && !metaHas(m.req);
        const cost = metaCost(m);
        const can = !maxed && !locked && epitaphs >= cost;
        /* An UNLOCKED automation (one-time node the player owns) gets a live ON/OFF
           toggle instead of a static "Owned" — full opacity so the switch reads
           clearly, no buy click on the row. Locked ones keep the normal unlock UI. */
        const unlockedAuto = !endless && metaHas(m.id);
        const state = unlockedAuto ? '' : maxed ? 'bought' : can ? 'affordable' : locked ? 'locked' : '';
        const lvlTag = endless
          ? ' <span class="meta-lvl">Lv ' + metaLvl(m.id) + (m.max ? '/' + m.max : '') + '</span>'
          : '';   /* once-type status is shown by the toggle, not a tag */
        let right;
        if (unlockedAuto) {
          const on = autoEnabled(m.id);
          right = '<button class="auto-toggle ' + (on ? 'on' : '') + '" onclick="event.stopPropagation();toggleAuto(\'' + m.id + '\')">' + (on ? 'ON' : 'OFF') + '</button>';
        } else {
          const label = maxed ? (endless ? 'Maxed' : 'Owned') : locked ? 'Locked' : EPITAPH_IMG + ' ' + formatNum(cost);
          right = '<div class="building-cost">' + label + '</div>';
        }
        const now = endless && metaLvl(m.id) > 0 ? ' <span class="perk-now">(now ' + metaNowLabel(m) + ')</span>' : '';
        return '<div class="upgrade-row ' + state + '" onclick="' + (can ? "buyMeta('" + m.id + "')" : '') + '">' +
          '<div class="building-info"><div class="building-name">' + m.name + lvlTag + '</div>' +
          '<div class="building-desc">' + m.desc + now + '</div></div>' +
          '<div class="building-right">' + right + '</div></div>';
      }

      let tree = '<div class="section-label">The Reaping — Automation</div>';
      for (const m of META) if (m.type !== 'endless') tree += metaRow(m);
      tree += '<div class="section-label">The Reaping — Endless Climbs</div>';
      for (const m of META) if (m.type === 'endless') tree += metaRow(m);

      const summary =
        '<div class="ascend-summary">Meta bonuses: <b>+' + Math.round((metaProdMult() - 1) * 100) + '%</b> production · ' +
        '<b>+' + Math.round((metaClickMult() - 1) * 100) + '%</b> click · ' +
        '<b>+' + Math.round((epitaphGainMult() - 1) * 100) + '%</b> Epitaph gain<br>' +
        'Highest prestige reached: <b>' + highestPrestige + '</b></div>';

      el.innerHTML =
        helpBox('reaping', HELP.reaping) +
        '<div class="prestige-panel">' +
          '<div class="reaping-tier">Ascension ' + ascensions + '</div>' +
          '<div class="reaping-sub">The Reaping — a permanent power above prestige</div>' +
          summary +
          '<button class="prestige-btn" ' + (ready ? '' : 'disabled') +
            ' onclick="doAscend()">' + (ready ? 'Reap for ' + gained + ' Epitaph' + (gained === 1 ? '' : 's') : 'Reach Prestige ' + ASCEND_MIN_PRESTIGE) + '</button>' +
          '<div class="prestige-note">Resets your prestige tier, Bone Shards and the shard shop into Epitaphs. ' +
            'Keeps lifetime skulls, feats, cosmetics, and everything in The Reaping.' +
            (ready ? '' : ' You are at Prestige ' + prestige + '.') + '</div>' +
        '</div>' +
        '<div class="shard-balance">' + EPITAPH_IMG + ' <b>' + formatNum(epitaphs) + '</b> Epitaph' + (epitaphs === 1 ? '' : 's') + '</div>' +
        tree +
        apocSectionHtml();
    }

    /* The Skullpocalypse control panel, shown at the foot of the Reaping tab. */
    function apocSectionHtml() {
      /* Hidden entirely until it is close to unlockable, then a teaser, then the
         live controls once permanently unlocked. */
      if (!apocUnlocked) {
        const near = lifetimeSkulls.gte(APOC_UNLOCK_LIFETIME * 0.2) || prestige >= 3;
        if (!near) return '';
        return '<div class="section-label">The Skullpocalypse</div>' +
          '<div class="ascend-locked">A dread power stirs beneath your dominion. ' +
          'Reach <b>' + formatNum(APOC_UNLOCK_LIFETIME) + '</b> lifetime skulls or <b>Prestige ' + APOC_UNLOCK_PRESTIGE + '</b> to unearth it.</div>';
      }

      const phase = apocPhase();
      const calm = apocCalm();
      let body;
      if (!apocActive) {
        body =
          '<div class="ascend-summary">An opt-in undead uprising. It raises production through escalating ' +
          'phases (Stirring → Rising → Full Undeath), but wraith-leeches will latch onto your skull and ' +
          'cursed skulls turn wrathful. Pop the wraiths for a windfall; pacify the uprising when it gets ' +
          'to be too much.</div>' +
          '<button class="prestige-btn" onclick="beginApocalypse()">Begin the Skullpocalypse</button>';
      } else if (calm) {
        body =
          '<div class="ascend-summary">The uprising is <b>calmed</b> for ' + Math.ceil((apocPacifiedUntil - Date.now()) / 1000) +
          's — no wraiths, no wrath, and no production bonus while calm.</div>' +
          '<button class="prestige-btn" onclick="endApocalypse()">End the Uprising</button>';
      } else {
        const canPacify = boneShards >= APOC_PACIFY_COST;
        body =
          '<div class="ascend-summary">Phase: <b>' + APOC_PHASE_NAMES[phase] + '</b> · ' +
          '<b>+' + Math.round(APOC_PROD_BONUS[phase] * 100) + '%</b> production · ' +
          'wraiths on skull: <b>' + wraiths.length + '/' + MAX_WRAITHS + '</b> · ' +
          'wrath chance: <b>' + Math.round(APOC_WRATH_CHANCE[phase] * 100) + '%</b></div>' +
          '<button class="prestige-btn" ' + (canPacify ? '' : 'disabled') + ' onclick="pacifyApocalypse()">Pacify — ' +
            APOC_PACIFY_COST + ' 🦴 (calm ' + Math.round(APOC_PACIFY_MS / 60000) + 'm)</button> ' +
          '<button class="reward-btn ghost" onclick="endApocalypse()">End the Uprising</button>';
      }

      return '<div class="section-label">The Skullpocalypse</div>' +
        helpBox('apoc', HELP.apoc) +
        '<div class="prestige-panel">' +
          '<div class="reaping-tier" style="font-size:26px">' +
            (apocActive && !calm ? '☠️ ' + APOC_PHASE_NAMES[phase] : 'Dormant') + '</div>' +
          body +
        '</div>';
    }

    /* ═══════ SAVE / LOAD ═══════ */

    /* v14 — big-number migration: skulls/totalSkulls/lifetimeSkulls/seasonBaseline
       are now break_infinity Decimals, serialized as strings. migrateSave parses
       legacy Numbers (incl. old 1e300-pinned values) back into Decimals; additive
       and never-wipe, like every version before it. */
    const SAVE_VERSION = 14;

    function migrateSave(d) {
      /* Generalises the v13 lifetimeSkulls scrub to the WHOLE save: any persisted
         number that is non-finite (or absurd) is healed before it can re-enter the
         compute path, whether the save came from localStorage or the server. */
      healPlainNumbers(d);
      /* Parse the four big-number currencies into Decimals up front — a legacy
         save stores them as Numbers (including an old 1e300-pinned lifetime, which
         is a REAL stored value and simply carries across), a current save as
         strings. All subsequent comparisons below are then Decimal, never string. */
      d.totalSkulls = toDec(d.totalSkulls);
      d.skulls = toDec(d.skulls);
      d.seasonBaseline = toDec(d.seasonBaseline);
      if (typeof d.version !== 'number') d.version = 1;
      if (d.skulls === undefined) d.skulls = 0;
      if (d.totalSkulls === undefined) d.totalSkulls = 0;
      if (d.totalClicks === undefined) d.totalClicks = 0;
      if (d.clickBonus === undefined) d.clickBonus = 0;
      if (d.clickMulti === undefined) d.clickMulti = 1;
      if (d.cpsClickPct === undefined) d.cpsClickPct = 0;
      if (d.globalCpsMult === undefined) d.globalCpsMult = 1;
      if (!d.owned) d.owned = {};
      BUILDINGS.forEach(b => { if (!(b.id in d.owned)) d.owned[b.id] = 0; });
      if (!d.boughtUpgrades) d.boughtUpgrades = [];
      /* v4 — Ghouls (the miasma servants). Bought with skulls, reset each run;
         a v3 save simply loads with none owned. */
      if (!d.boughtGhouls) d.boughtGhouls = [];
      if (!d.hitMilestones) d.hitMilestones = [];
      if (!d.perks) d.perks = [];
      if (!d.perkLevels || typeof d.perkLevels !== 'object') d.perkLevels = {};
      if (!d.achievements) d.achievements = [];
      if (d.boneShards === undefined) d.boneShards = 0;
      if (d.cursedPopped === undefined) d.cursedPopped = 0;
      /* v3 — The Reaping. All default to nothing, so a v2 save (any maxed
         player) loads with the meta-layer at zero and NOTHING wiped. */
      if (d.ascensions === undefined) d.ascensions = 0;
      if (d.epitaphs === undefined) d.epitaphs = 0;
      if (!d.metaLevels || typeof d.metaLevels !== 'object') d.metaLevels = {};
      if (!d.metaPerks) d.metaPerks = [];
      /* Seed highest-prestige from the current tier so history is never lost. */
      if (d.highestPrestige === undefined) d.highestPrestige = d.prestige || 0;
      if (d.highestPrestige < (d.prestige || 0)) d.highestPrestige = d.prestige || 0;
      /* v5 — Grave Bloom (permanent meta layer). A v4 save loads with 0 blooms,
         no building levels, and the ripen clock starting now (never crediting a
         backlog from epoch 0). */
      if (d.graveBlooms === undefined) d.graveBlooms = 0;
      if (!d.bloomStart) d.bloomStart = Date.now();
      if (!d.buildingLevels || typeof d.buildingLevels !== 'object') d.buildingLevels = {};
      /* v6 — the Bound Reaper (pet). A v5 save loads at level 0 with no auras. */
      if (d.petLevel === undefined) d.petLevel = 0;
      if (!Array.isArray(d.selectedAuras)) d.selectedAuras = [];
      /* v7 — the Skullpocalypse. A v6 save loads locked/inactive. Wraiths are
         transient (respawn on load if active) and never persisted. */
      if (d.apocUnlocked === undefined) d.apocUnlocked = false;
      if (d.apocActive === undefined) d.apocActive = false;
      if (d.apocStart === undefined) d.apocStart = 0;
      if (d.apocPacifiedUntil === undefined) d.apocPacifiedUntil = 0;
      if (d.apocEverActive === undefined) d.apocEverActive = false;
      if (d.apocEverFull === undefined) d.apocEverFull = false;
      /* v8 — the Grimoire of the Dead (permanent meta layer). A v7 save loads
         with the Grimoire un-unearthed, no Essence, and zero spell counters;
         nothing existing is touched. */
      if (d.grimoireUnlocked === undefined) d.grimoireUnlocked = false;
      if (d.essence === undefined) d.essence = 0;
      if (d.spellsCast === undefined) d.spellsCast = 0;
      if (d.spellsBackfired === undefined) d.spellsBackfired = 0;
      /* v9 — the Cursed Garden (permanent meta layer). A v7 OR v8 save loads with
         the garden un-tilled, an empty grid at the smallest tier, and only the
         starter strains known. The grid is normalised to the fixed 6×6 backing in
         applyState via ensureGardenShape(), which drops any cell whose strain or
         shape is invalid and clears anything outside the active grid — so a save
         written at a different tier (a changed grid shape) can never throw.
         Nothing existing is touched. */
      if (d.gardenUnlocked === undefined) d.gardenUnlocked = false;
      if (d.gardenTier === undefined) d.gardenTier = 0;
      if (!Array.isArray(d.gardenPlots)) d.gardenPlots = [];
      if (!Array.isArray(d.discoveredStrains)) d.discoveredStrains = [];
      if (d.gardenPlanted === undefined) d.gardenPlanted = 0;
      if (d.gardenHarvests === undefined) d.gardenHarvests = 0;
      /* v10 — Hallowtide, the Season of the Dead (permanent meta layer). A v7, v8
         OR v9 save loads with the season un-awakened, dormant (no end time), zero
         Wisps and no relics; the auto-window is computed from the date, never
         stored. Nothing existing (incl. grimoire + garden fields) is touched. */
      if (d.seasonUnlocked === undefined) d.seasonUnlocked = false;
      if (d.seasonEndsAt === undefined) d.seasonEndsAt = 0;
      if (d.wisps === undefined) d.wisps = 0;
      if (!Array.isArray(d.seasonRelics)) d.seasonRelics = [];
      if (d.seasonBaseline === undefined) d.seasonBaseline = 0;
      if (typeof d.seasonMonth !== 'string') d.seasonMonth = '';
      /* v11 — the monthly seasonal reset epoch. CRITICAL: default to null (not the
         current month) so an existing save is NOT wiped on the deploy itself — on
         first load a null stamp adopts the current server epoch WITHOUT resetting
         (see checkSeasonReset). Distinct from seasonMonth above (leaderboard). */
      if (d.seasonEpoch === undefined) d.seasonEpoch = null;
      /* v12 — per-automation ON/OFF toggles. An empty list means every unlocked
         automation is ON, so any older save (v7–v11) loads with its automations
         running exactly as before — no behavior change, never throws. */
      if (!Array.isArray(d.autoOff)) d.autoOff = [];
      if (d.startTime === undefined) d.startTime = Date.now();
      if (d.prestige === undefined) d.prestige = 0;
      /* Pre-prestige saves had no lifetime field; their run total IS their
         lifetime so far, so seed it there. Never let it drop below the run
         total on any load. */
      d.lifetimeSkulls = (d.lifetimeSkulls === undefined || d.lifetimeSkulls === null)
        ? d.totalSkulls : toDec(d.lifetimeSkulls);
      if (d.lifetimeSkulls.lt(d.totalSkulls)) d.lifetimeSkulls = d.totalSkulls;
      /* v13 — scrub a known-corrupted lifetimeSkulls. Confirmed live on three
         unrelated accounts with different prestige/ascension: same mantissa
         (7.067758797128936), exponent still climbing over time, meaning some
         still-unidentified formula produced this exact runaway value and it
         swamped their real total via float addition (once one addend is far
         enough beyond the other's magnitude, float64 addition just keeps the
         bigger one). NOT a magnitude clamp — the top of this board legitimately
         reaches past 1e200, so clamping by size would wrongly punish real
         whales. This matches only the exact known-bad mantissa, regardless of
         its current exponent, so it can never false-positive on a real value. */
      if (d.lifetimeSkulls.gt(0)) {
        const mantissa = d.lifetimeSkulls.mantissa;
        if (Math.abs(mantissa - 7.067758797128936) < 1e-9) {
          d.lifetimeSkulls = d.totalSkulls;
        }
      }
      d.version = SAVE_VERSION;
      return d;
    }

    function save() {
      const data = {
        /* The four big-number currencies serialize as strings (Decimal.toString),
           parsed back by migrateSave/toDec on load. */
        skulls: skulls.toString(), totalSkulls: totalSkulls.toString(),
        lifetimeSkulls: lifetimeSkulls.toString(), prestige,
        totalClicks, clickBonus, clickMulti,
        cpsClickPct, globalCpsMult, owned, startTime,
        boneShards, cursedPopped, seasonBaseline: seasonBaseline.toString(), seasonMonth, seasonEpoch,
        ascensions, epitaphs, metaLevels, highestPrestige, autoOff: [...autoOff],
        graveBlooms, bloomStart, buildingLevels,
        petLevel, selectedAuras: [...selectedAuras],
        apocUnlocked, apocActive, apocStart, apocPacifiedUntil, apocEverActive, apocEverFull,
        grimoireUnlocked, essence, spellsCast, spellsBackfired,
        gardenUnlocked, gardenTier, gardenPlots, gardenPlanted, gardenHarvests,
        discoveredStrains: [...discoveredStrains],
        seasonUnlocked, seasonEndsAt, wisps, seasonRelics: [...seasonRelics],
        metaPerks: [...metaPerks],
        boughtUpgrades: [...boughtUpgrades],
        boughtGhouls: [...boughtGhouls],
        hitMilestones: [...hitMilestones],
        perks: [...perks],
        perkLevels,
        achievements: [...achievements],
        savedAt: Date.now(),
        version: SAVE_VERSION
      };
      /* Heal the plain-Number fields before writing to localStorage OR up to the
         server. The four Decimal fields are already safe strings above. */
      healPlainNumbers(data);
      try {
        localStorage.setItem('sc_save', JSON.stringify(data));
        const msg = document.getElementById('saveMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 1500);
      } catch(e) {}
      submitScore();
      pushSaveToServer(data);
    }

    /* Mirror the save server-side for logged-in players. Best-effort and
       fire-and-forget: local save already succeeded, and the server keeps
       whichever total is higher, so a lost request costs nothing. If the
       server turns out to be ahead (a wipe, or another device), adopt what
       it returns rather than letting this device overwrite it. */
    async function pushSaveToServer(data) {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-clicker', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ action: 'save-state', state: data }),
        });
        if (!res.ok) return;
        const out = await res.json();
        if (out && out.adopted && out.state && serverOutranks(out.state)) {
          applyState(out.state);
          render();
        }
      } catch(e) {}
    }

    /* Apply a save blob (from localStorage OR the server) into the live
       game, then credit offline earnings from its savedAt. One path, so a
       server-restored save behaves exactly like a local one. */
    function applyState(d) {
      d = migrateSave(d);
      skulls = d.skulls;
      totalSkulls = d.totalSkulls;
      totalClicks = d.totalClicks;
      clickBonus = d.clickBonus;
      clickMulti = d.clickMulti;
      cpsClickPct = d.cpsClickPct;
      globalCpsMult = d.globalCpsMult;
      owned = d.owned;
      startTime = d.startTime;
      prestige = d.prestige || 0;
      lifetimeSkulls = d.lifetimeSkulls;   /* Decimal, set by migrateSave */
      boneShards = d.boneShards || 0;
      cursedPopped = d.cursedPopped || 0;
      seasonBaseline = d.seasonBaseline;   /* Decimal, set by migrateSave */
      seasonMonth = d.seasonMonth || '';
      seasonEpoch = d.seasonEpoch || null;   /* '' / undefined → null → adopt on load, no wipe */
      ascensions = d.ascensions || 0;
      epitaphs = d.epitaphs || 0;
      metaLevels = (d.metaLevels && typeof d.metaLevels === 'object') ? d.metaLevels : {};
      metaPerks = new Set(d.metaPerks || []);
      autoOff = new Set(Array.isArray(d.autoOff) ? d.autoOff : []);
      highestPrestige = d.highestPrestige || 0;
      graveBlooms = d.graveBlooms || 0;
      bloomStart = d.bloomStart || Date.now();
      buildingLevels = (d.buildingLevels && typeof d.buildingLevels === 'object') ? d.buildingLevels : {};
      petLevel = d.petLevel || 0;
      selectedAuras = Array.isArray(d.selectedAuras) ? d.selectedAuras : [];
      apocUnlocked = !!d.apocUnlocked;
      apocActive = !!d.apocActive;
      apocStart = d.apocStart || 0;
      apocPacifiedUntil = d.apocPacifiedUntil || 0;
      apocEverActive = !!d.apocEverActive;
      apocEverFull = !!d.apocEverFull;
      grimoireUnlocked = !!d.grimoireUnlocked;
      essence = d.essence || 0;
      spellsCast = d.spellsCast || 0;
      spellsBackfired = d.spellsBackfired || 0;
      /* The Cursed Garden. Growth is offline-aware for free: each plant carries a
         planted-at timestamp, so plantStage() alone credits everything that grew
         (and everything that went overripe) while away — no catch-up loop. Set the
         tier first so ensureGardenShape() knows the active grid before normalising. */
      gardenUnlocked = !!d.gardenUnlocked;
      gardenTier = d.gardenTier || 0;
      gardenPlots = Array.isArray(d.gardenPlots) ? d.gardenPlots : [];
      discoveredStrains = new Set(Array.isArray(d.discoveredStrains) ? d.discoveredStrains : []);
      gardenPlanted = d.gardenPlanted || 0;
      gardenHarvests = d.gardenHarvests || 0;
      ensureGardenShape();
      if (gardenUnlocked) { discoveredStrains.add('bone'); discoveredStrains.add('moss'); }
      /* Hallowtide. seasonEndsAt is an absolute timestamp, so a season lit before an
         offline gap is correctly still-burning or expired on load with no catch-up. */
      seasonUnlocked = !!d.seasonUnlocked;
      seasonEndsAt = d.seasonEndsAt || 0;
      wisps = d.wisps || 0;
      seasonRelics = new Set(Array.isArray(d.seasonRelics) ? d.seasonRelics : []);
      boughtUpgrades = new Set(d.boughtUpgrades);
      boughtGhouls = new Set(d.boughtGhouls || []);
      hitMilestones = new Set(d.hitMilestones);
      perks = new Set(d.perks || []);
      perkLevels = (d.perkLevels && typeof d.perkLevels === 'object') ? d.perkLevels : {};
      achievements = new Set(d.achievements || []);

      if (d.savedAt) {
        const away = (Date.now() - d.savedAt) / 1000;
        if (away > 10) {
          const cps = getCPS();
          if (cps.gt(0)) {
            const earned = cps.mul(away * offlineRate());
            earn(earned);
            const banner = document.getElementById('offlineBanner');
            banner.innerHTML = `<div class="offline-banner" onclick="this.remove()">Welcome back! You earned <b>${formatNum(earned)}</b> skulls while away (${formatTime(away * 1000)}). Click to dismiss.</div>`;
          }
        }
      }

      /* Necrotic Essence regenerates while away too (once the Grimoire is
         unearthed), capped at the current max. */
      if (grimoireUnlocked && d.savedAt) {
        const awayE = (Date.now() - d.savedAt) / 1000;
        if (awayE > 0) essence = Math.min(essenceMax(), essence + awayE * essenceRegenPerSec());
      }
      essence = Math.min(essence, essenceMax());

      /* Resume the Skullpocalypse cleanly: wraiths are transient, so drop any
         stragglers and restart the single scheduler if it should be running. */
      clearWraiths();
      clearTimeout(wraithTimer); wraithTimer = null;
      if (apocActive && !apocCalm()) scheduleWraith();

      /* Back-grant any state-based feats the loaded save already qualifies for
         (e.g. "The First Reaping" for an ascensions>=1 save) so a load can
         never miss one. */
      checkAchievements();
      renderWorld();
    }

    function load() {
      try {
        const raw = localStorage.getItem('sc_save');
        if (!raw) return;
        applyState(JSON.parse(raw));
      } catch(e) {}
    }

    /* Higher prestige wins; at equal prestige, more lifetime skulls wins.
       IDENTICAL to the server's merge rank — a prestige reset (same
       lifetime, higher tier) must beat the old save so the sync never
       undoes it, and normal progress (more lifetime) still adopts forward. */
    function serverOutranks(server) {
      /* SEASON EPOCH FIRST — kept identical to the server's outranks(). A save that
         has taken a newer monthly seasonal reset ALWAYS wins, so the wipe (which
         lowers prestige/run) is never reverted by a stale higher-prestige save; a
         missing stamp counts as oldest. Within the same epoch the original
         protection stands, so a stale/cleared device still cannot clobber a better
         save. */
      const se = epochNum(server.seasonEpoch), le = epochNum(seasonEpoch);
      if (se !== le) return se > le;
      /* Ascension outranks prestige: a freshly-reaped save (prestige reset to 0,
         same lifetime) must beat a stale non-ascended save, or the sync would
         silently undo the reap. clampFinite keeps a corrupt (non-finite) server save
         from ranking above real local progress. */
      const f = v => (Number.isFinite(Number(v)) ? Number(v) : 0);
      const sa = f(server.ascensions), la = f(ascensions);
      if (sa !== la) return sa > la;
      const sp = f(server.prestige), lp = f(prestige);
      if (sp !== lp) return sp > lp;
      /* Decimal compare — server lifetime may be a bignum string past the double
         ceiling; toDec handles both legacy Numbers and new strings. */
      const sLife = (server.lifetimeSkulls !== undefined && server.lifetimeSkulls !== null && server.lifetimeSkulls !== '')
        ? server.lifetimeSkulls : server.totalSkulls;
      return toDec(sLife).gt(lifetimeSkulls);
    }

    /* THE RECOVERY. A logged-in player's save also lives on the server;
       whichever has the higher lifetime total wins. A cleared browser
       (local total 0, or no local save at all) adopts the server's — the
       whole point of this — and a device that played further pushes its
       save up on the next save(). Guests have no server save by design.

       Runs after the local load so the comparison is against real local
       progress, and re-renders once whatever won is in place. */
    async function syncFromServer() {
      const session = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (!session || !session.user_id) return;
      try {
        const res = await fetch('/api/skull-clicker', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin', body: JSON.stringify({ action: 'load-state' }),
        });
        if (!res.ok) return;
        const data = await res.json();
        const server = data && data.state;
        if (server && serverOutranks(server)) {
          applyState(server);
          render();
        }
      } catch(e) {}
    }

    function hardReset() {
      if (!confirm('This will permanently erase all progress. Are you sure?')) return;
      localStorage.removeItem('sc_save');
      location.reload();
    }

    /* ═══════ LEADERBOARD ═══════ */

    function getPlayerId() {
      // Shared reader — see js/session-read.js.
      const cookie = typeof readPhamSession === 'function' ? readPhamSession() : null;
      if (cookie) {
        try {
          const s = cookie;
          playerName = s.display_name;
          return { userId: s.user_id, displayName: s.display_name };
        } catch(e) {}
      }
      let gid = null;
      try { gid = localStorage.getItem('sc_guestId'); } catch(e) {}
      if (!gid) {
        gid = 'g_' + Math.random().toString(36).slice(2, 10);
        try { localStorage.setItem('sc_guestId', gid); } catch(e) {}
      }
      let gname = null;
      try { gname = localStorage.getItem('sc_guestName'); } catch(e) {}
      if (!gname) {
        gname = 'Skull#' + gid.slice(2, 6).toUpperCase();
        try { localStorage.setItem('sc_guestName', gname); } catch(e) {}
      }
      playerName = gname;
      return { guestId: gid, guestName: gname };
    }

    /* Current UTC month, matching the server's monthKeyUTC. */
    function currentMonthKey() {
      const d = new Date();
      return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
    }
    /* Roll the client baseline when the month turns, then report skulls
       gathered this season. */
    function seasonScore() {
      const cur = currentMonthKey();
      if (seasonMonth !== cur) { seasonMonth = cur; seasonBaseline = lifetimeSkulls; }
      return Decimal.max(0, lifetimeSkulls.sub(seasonBaseline).floor());
    }

    async function submitScore() {
      if (totalSkulls.lt(100)) return;
      const player = getPlayerId();
      /* Scores can now exceed the JS double ceiling, so they travel as strings;
         scoreLog (log10, a small Number) is what the server sorts and ranks by. */
      const lifeFloor = lifetimeSkulls.floor();
      const seasonS = seasonScore();
      const lifeStr = lifeFloor.toString();
      const lifeLog = lifeFloor.gt(0) ? lifeFloor.log10() : 0;
      const seasonStr = seasonS.toString();
      const seasonLog = seasonS.gt(0) ? seasonS.log10() : 0;
      try {
        await fetch('/api/skull-clicker', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'submit-score', score: lifeStr, scoreLog: lifeLog, seasonScore: seasonStr, seasonScoreLog: seasonLog, prestige, ascensions, ...player })
        });
        fetch('/api/leaderboards', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ game: 'skull-clicker', score: lifeStr, scoreLog: lifeLog }),
        }).catch(function () {});
      } catch(e) {}
    }

    /* ═══════ COSMETICS ═══════ */

    const COSMETIC_DEFS = {
      'skull-skin': { slot: 'skull-theme', icon: '💀', category: 'Skull Themes' },
      'click-effect': { slot: 'click-effect', icon: '✨', category: 'Click Effects' },
      /* 'building-skin' was declared here with no BUILDING_SKINS table to
         draw from, so the category existed and could never hold anything.
         The two rewards that granted building skins now grant skull themes,
         which is why it is gone rather than filled in. */
      'badge-skull': { slot: 'skull-image', icon: '🎖️', category: 'Loyalty Skulls' },
    };

    const SKULL_THEMES = {
      'default': { name: 'Default', desc: 'The classic bone skull', cssClass: '' },
      'blood': { name: 'Blood Skull', desc: 'A crimson-stained skull with dripping aura', cssClass: 'theme-blood' },
      'void': { name: 'Void Skull', desc: 'A skull from beyond the cosmic veil', cssClass: 'theme-void' },
      'chaos': { name: 'Chaos Skull', desc: 'Burning with chaotic energy', cssClass: 'theme-chaos' },
      'eternal': { name: 'Eternal Darkness', desc: 'A mythic skull pulsing with dark power', cssClass: 'theme-eternal' },
      'bonewhite': { name: 'Bonewhite Skull', desc: 'Bleached bone, pale against the dark', cssClass: 'theme-bonewhite' },
      'graveash': { name: 'Graveash Skull', desc: 'Cold grey ash from a snuffed pyre', cssClass: 'theme-graveash' },
      'reapermoon': { name: 'Reaper Moon Skull', desc: 'A red harvest moon pulsing behind the bone', cssClass: 'theme-reapermoon' },
    };

    const CLICK_EFFECTS = {
      'default': { name: 'Default', desc: 'Standard white click numbers', cssClass: '' },
      'blood': { name: 'Blood Splash', desc: 'Crimson damage numbers', cssClass: 'click-effect-blood' },
      'void': { name: 'Void Click', desc: 'Purple ethereal numbers', cssClass: 'click-effect-void' },
      'chaos': { name: 'Chaos Strike', desc: 'Fiery orange numbers', cssClass: 'click-effect-chaos' },
      'eternal': { name: 'Eternal Darkness', desc: 'Mythic glowing magenta numbers', cssClass: 'click-effect-eternal' },
      'wraith': { name: 'Wraith Wisp', desc: 'Pale ghostlight numbers that glow white', cssClass: 'click-effect-wraith' },
    };

    let ownedCosmetics = [];
    let badgeSkulls = [];
    let equippedCosmetics = { 'skull-theme': 'default', 'click-effect': 'default', 'skull-image': 'default' };

    async function loadCosmetics() {
      try {
        const res = await fetch('/api/inventory?game=skull-clicker');
        if (!res.ok) return;
        const data = await res.json();
        ownedCosmetics = data.items || [];
        if (data.equips) {
          if (data.equips['skull-theme']) equippedCosmetics['skull-theme'] = data.equips['skull-theme'];
          if (data.equips['click-effect']) equippedCosmetics['click-effect'] = data.equips['click-effect'];
        }
      } catch {}

      /* LOYALTY SKULLS. A subscriber's Twitch badges are already imported
         into the profile inventory with their artwork, already gated by how
         long they have actually subscribed, and already ranked by rarity.
         Nothing needs granting — the badge someone earned by subscribing
         becomes the skull they click.

         They stay in the profile inventory rather than being copied here:
         equipping under game 'profile' passes the ownership check as it
         stands, and the list grows on its own as their badges do. */
      try {
        const res = await fetch('/api/inventory?game=profile');
        if (res.ok) {
          const prof = await res.json();
          badgeSkulls = (prof.items || [])
            .filter(i => i.type === 'badge' && i.meta && i.meta.imageUrl4x)
            .sort((a, b) => (b.meta.monthThreshold || 0) - (a.meta.monthThreshold || 0));
          if (prof.equips && prof.equips['skull-image']) {
            equippedCosmetics['skull-image'] = prof.equips['skull-image'];
          }
        }
      } catch {}

      applyCosmetics();
    }

    /* The frame and the face are separate things. A theme styles the button
       — border and gradient — and a loyalty skull replaces the image inside
       it, so the two combine rather than competing for one slot. */
    function badgeSkullFor(id) {
      return badgeSkulls.find(b => b.id === id) || null;
    }

    function applyCosmetics() {
      const btn = document.getElementById('skullBtn');
      btn.className = 'skull-btn';
      const themeId = equippedCosmetics['skull-theme'] || 'default';
      const theme = SKULL_THEMES[themeId];
      if (theme && theme.cssClass) btn.classList.add(theme.cssClass);

      const area = document.querySelector('.skull-area');
      area.className = 'skull-area';
      const effectId = equippedCosmetics['click-effect'] || 'default';
      const effect = CLICK_EFFECTS[effectId];
      if (effect && effect.cssClass) area.classList.add(effect.cssClass);

      const img = btn.querySelector('img');
      if (img) {
        if (!img.dataset.defaultSrc) img.dataset.defaultSrc = img.getAttribute('src') || '';
        const badge = badgeSkullFor(equippedCosmetics['skull-image']);
        /* A Twitch badge is 72px at its largest and the skull renders at
