<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Park</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #0a0a0a;
      border-bottom: 2px solid #ff0000;
      z-index: 100;
      height: 38px;
    }
    .top-bar-title { font-size: 16px; font-weight: 700; color: #ff0000; letter-spacing: 1px; }
    .top-bar-stats { display: flex; gap: 12px; font-size: 11px; }
    .stat-item { display: flex; align-items: center; gap: 3px; color: #fff; }
    .stat-item .val { color: #fff; font-weight: 600; }

    /* Tabs */
    .tab-bar { display: flex; background: #0a0a0a; border-bottom: 1px solid #ffffff14; height: 42px; }
    .tab-btn {
      flex: 1; padding: 6px 4px; background: transparent; border: none; color: #fff;
      font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #ff0000; border-bottom-color: #ff0000; }
    .tab-btn .tab-icon { font-size: 13px; display: block; margin-bottom: 1px; }

    /* Tab Content */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .tab-content.scrollable { padding: 12px; height: calc(100vh - 80px); overflow-y: auto; }

    /* ======================== VISUAL PARK ======================== */
    .park-viewport {
      position: relative;
      aspect-ratio: 1 / 1;
      width: min(100%, calc(100vh - 80px));
      max-height: calc(100vh - 80px);
      margin: 0 auto;
      overflow: hidden;
      background: #2d5a1e;
    }

    .park-world {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2d5a1e;
      transform-origin: 0 0;
      touch-action: none;
      cursor: grab;
    }
    .park-world.panning { cursor: grabbing; }
    .park-zoom-controls {
      position: absolute; bottom: 14px; right: 14px; z-index: 12;
      display: flex; flex-direction: column; gap: 4px;
    }
    .park-zoom-controls button {
      width: 28px; height: 28px;
      background: rgba(0,0,0,0.75); color: #fff;
      border: 1px solid #ffffff14; border-radius: 4px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .park-zoom-controls button:hover { border-color: #FF000060; color: #fff; }
    .park-zoom-controls button:active { background: rgba(255,0,0,0.15); }
    .dino-ground, .dino-over {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      image-rendering: pixelated;
    }
    .dino-ground { z-index: 0; }
    .dino-over   { z-index: 1; }

    /* Decorations */
    .park-deco {
      position: absolute;
      z-index: 3;
      font-size: 10px;
      line-height: 1;
      pointer-events: none;
      opacity: 0.7;
    }
    .park-deco.flower { opacity: 0.8; }
    .park-deco.rock { opacity: 0.5; font-size: 8px; }

    /* Roaming dino */
    .park-dino {
      position: absolute;
      z-index: 5;
      cursor: pointer;
      transition: filter 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%) scale(var(--park-scale, 1));
      transform-origin: center bottom;
    }
    .park-dino:hover { filter: brightness(1.2); z-index: 6; }
    .park-dino.selected { z-index: 7; filter: brightness(1.3) drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
    .park-dino-sprite {
      line-height: 0;
      transition: transform 0.3s;
    }
    .sprite-img { image-rendering: pixelated; display: block; }
    .park-dino-sprite.habitat-sky {
      animation: dinoFloat 3s ease-in-out infinite;
    }
    @keyframes dinoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .park-dino-sprite.habitat-water {
      animation: dinoSwim 2.5s ease-in-out infinite;
    }
    @keyframes dinoSwim {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-2px) rotate(3deg); }
      75% { transform: translateY(2px) rotate(-3deg); }
    }

    .park-dino-label {
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 8px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      white-space: nowrap;
      margin-bottom: 2px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .park-dino:hover .park-dino-label,
    .park-dino.selected .park-dino-label { opacity: 1; }

    /* Debris */
    .park-debris {
      position: absolute; z-index: 4; cursor: pointer;
      font-size: calc(14px * var(--park-scale, 1)); line-height: 1;
      transition: transform 0.15s, opacity 0.2s;
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.4));
    }
    .park-debris:hover { transform: scale(1.3); filter: brightness(1.3) drop-shadow(1px 1px 2px rgba(0,0,0,0.5)); }
    .park-debris.clearing { transform: scale(0); opacity: 0; }

    /* Yard items */
    .park-yard-item {
      position: absolute; z-index: 3; pointer-events: none;
      transform: translate(-50%, -85%);
      transition: transform 0.15s, opacity 0.2s;
      filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.45));
    }
    .park-yard-item img { image-rendering: pixelated; display: block; }
    body.decorating .park-yard-item { pointer-events: auto; cursor: pointer; }
    body.decorating .park-yard-item:hover {
      transform: translate(-50%, -85%) scale(1.15);
      filter: brightness(1.25) drop-shadow(0 0 4px #FF0000);
    }
    .park-yard-item.placing { animation: yardPop 0.25s ease-out; }
    .park-yard-item.removing { transform: translate(-50%, -85%) scale(0); opacity: 0; }
    @keyframes yardPop {
      0% { transform: translate(-50%, -85%) scale(0.2); opacity: 0; }
      70% { transform: translate(-50%, -85%) scale(1.12); opacity: 1; }
      100% { transform: translate(-50%, -85%) scale(1); opacity: 1; }
    }

    /* Stream time-of-day */
    .park-daylight {
      position: absolute; inset: 0; z-index: 6; pointer-events: none;
      mix-blend-mode: multiply; opacity: 0;
      transition: background 2s linear, opacity 2s linear;
    }
    .park-daylight.tinted { opacity: 1; }

    .park-clock {
      position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
      z-index: 12; display: flex; align-items: center; gap: 7px;
      background: rgba(0,0,0,0.75); padding: 4px 10px; border-radius: 4px;
      border: 1px solid #ffffff14; white-space: nowrap;
    }
    .clock-phase { font-size: 12px; line-height: 1; }
    .clock-text { display: flex; flex-direction: column; gap: 1px; }
    .clock-name {
      font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: #fff; line-height: 1;
    }
    .clock-sub { font-size: 8px; color: #fff; line-height: 1; }
    .park-clock.live { border-color: #FF000045; }
    .park-clock.live .clock-name { color: #FF3333; }
    .clock-live-dot {
      width: 5px; height: 5px; border-radius: 50%; background: #FF0000;
      animation: clockPulse 2s ease-in-out infinite;
    }
    @keyframes clockPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      .clock-live-dot { animation: none; }
      .park-daylight { transition: none; }
    }

    /* Decorate mode */
    .park-decorate-btn {
      position: absolute; top: 22px; left: 22px; z-index: 12;
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,0.75); padding: 5px 9px; border-radius: 4px;
      border: 1px solid #ffffff14; color: #fff; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase; transition: border-color 0.15s, color 0.15s;
    }
    .park-decorate-btn:hover { border-color: #FF000060; color: #fff; }
    .park-decorate-btn.active { border-color: #FF0000; color: #FF0000; background: rgba(40,0,0,0.85); }

    .yard-tray {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 13;
      background: rgba(0,0,0,0.92); border-top: 1px solid #FF000040;
      padding: 8px 10px; display: none;
    }
    .yard-tray.open { display: block; }
    .yard-tray-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 7px; font-size: 9px; letter-spacing: 0.1em;
      text-transform: uppercase; color: #fff;
    }
    .yard-tray-hint { color: #fff; text-transform: none; letter-spacing: 0; font-size: 9px; }
    .yard-tray-items { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .yard-item-btn {
      flex: 0 0 auto; width: 62px; padding: 6px 3px 5px;
      background: #0a0a0a; border: 1px solid #ffffff12; border-radius: 3px;
      cursor: pointer; text-align: center; font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .yard-item-btn:hover:not(:disabled) { border-color: #FF000060; background: #140505; }
    .yard-item-btn.selected { border-color: #FF0000; background: #1e0505; }
    .yard-item-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .yard-item-btn img { image-rendering: pixelated; display: block; margin: 0 auto 3px; }
    .yard-item-name { font-size: 8px; color: #fff; letter-spacing: 0.04em; display: block; }
    .yard-item-cost { font-size: 9px; color: #d4a017; display: block; margin-top: 1px; }
    .yard-item-btn.selected .yard-item-name { color: #fff; }

    /* Energy bar */
    .park-energy-bar {
      position: absolute; top: 22px; right: 22px; z-index: 12;
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.75); padding: 4px 8px; border-radius: 4px;
      border: 1px solid #ffffff14;
    }
    .energy-icon { font-size: 12px; }
    .energy-fill-ctr { width: 60px; height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    .energy-fill { height: 100%; background: #ffaa00; border-radius: 3px; transition: width 0.3s; }
    .energy-text { font-size: 9px; color: #fff; font-weight: 600; min-width: 30px; }
    .energy-refill {
      font-size: 8px; padding: 2px 6px; background: #222; border: 1px solid #ffffff28;
      border-radius: 3px; color: #ffaa00; cursor: pointer; font-weight: 600;
    }
    .energy-refill:hover { background: #333; border-color: #ffaa00; }
    .energy-refill:disabled { opacity: 0.3; cursor: default; }

    /* Sell price in panel */
    .panel-sell-info { display: flex; align-items: center; gap: 6px; }
    .panel-sell-price { font-size: 10px; color: #ffaa00; font-weight: 700; }
    .panel-action.sell-action { color: #ffaa00; }
    .panel-action.sell-action:hover { color: #ff6600; border-color: #ff6600; }

    .park-dino-alert {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 6px;
      height: 6px;
      background: #ff0000;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 4px #ff0000; }
      50% { opacity: 0.3; box-shadow: 0 0 0px #ff0000; }
    }

    /* Park empty state */
    .park-empty-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      z-index: 20;
    }
    .park-empty-msg .big { font-size: 40px; display: block; margin-bottom: 8px; }
    .park-empty-msg .msg { font-size: 12px; opacity: 0.8; }

    /* ======================== BOTTOM PANEL ======================== */
    .park-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10,10,10,0.95);
      border-top: 2px solid #333;
      z-index: 50;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      max-height: 50%;
      overflow-y: auto;
    }
    .park-panel.open { transform: translateY(0); }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px 6px;
    }
    .panel-emoji { font-size: 32px; line-height: 0; }
    .panel-info { flex: 1; min-width: 0; }
    .panel-name { font-size: 14px; font-weight: 700; color: #fff; }
    .panel-meta { display: flex; gap: 6px; margin-top: 3px; align-items: center; }
    .panel-badge {
      font-size: 8px; padding: 1px 6px; border-radius: 3px;
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    }
    .pbadge-common { background: #7a7a7a33; color: #fff; }
    .pbadge-uncommon { background: #2ecc7122; color: #2ecc71; }
    .pbadge-rare { background: #3498db22; color: #3498db; }
    .pbadge-epic { background: #9b59b622; color: #9b59b6; }
    .pbadge-legendary { background: #f39c1222; color: #f39c12; }
    .pbadge-diet { background: #ffffff0a; color: #fff; }
    .panel-fav {
      background: none; border: none; cursor: pointer;
      font-size: 22px; line-height: 1; padding: 0 6px;
      color: #fff; transition: color 0.15s;
    }
    .panel-fav:hover { color: #ffb300; }
    .panel-fav.is-fav { color: #ffb300; }

    .panel-close {
      background: transparent; border: 1px solid #333; color: #fff;
      width: 24px; height: 24px; border-radius: 4px; font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .panel-close:hover { border-color: #ff0000; color: #ff0000; }

    /* Compact stats */
    .panel-stats {
      display: flex;
      gap: 6px;
      padding: 6px 12px;
      flex-wrap: wrap;
    }
    .panel-stat {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 80px;
    }
    .panel-stat-icon { font-size: 10px; }
    .panel-stat-bar {
      flex: 1;
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }
    .panel-stat-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s;
    }
    .panel-stat-fill.hunger { background: linear-gradient(90deg, #c0392b, #e67e22); }
    .panel-stat-fill.thirst { background: linear-gradient(90deg, #2980b9, #3498db); }
    .panel-stat-fill.happiness { background: linear-gradient(90deg, #27ae60, #2ecc71); }
    .panel-stat-fill.hygiene { background: linear-gradient(90deg, #8e44ad, #9b59b6); }
    .panel-stat-fill.stamina { background: linear-gradient(90deg, #d35400, #e67e22); }

    /* Growth row */
    .panel-growth {
      padding: 2px 12px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      color: #fff;
    }
    .panel-growth-bar {
      flex: 1;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }
    .panel-growth-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #ff4444);
      border-radius: 2px;
      transition: width 0.5s;
    }

    /* Action buttons */
    .panel-actions {
      display: flex;
      gap: 1px;
      background: #1a1a1a;
      border-top: 1px solid #ffffff14;
    }
    .panel-action {
      flex: 1;
      padding: 10px 6px 8px;
      background: #0d0d0d;
      border: none;
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, color 0.2s;
    }
    .panel-action:hover:not(:disabled) { background: #1a1a1a; color: #fff; }
    .panel-action:disabled { opacity: 0.3; cursor: not-allowed; }
    .panel-action .action-icon { font-size: 16px; display: block; margin-bottom: 2px; }
    .panel-action .action-cd { font-size: 8px; color: #fff; display: block; margin-top: 1px; }
    .panel-action.details-btn { max-width: 60px; color: #fff; }
    .panel-action.details-btn:hover { color: #ff0000; }
    .panel-action.release-action { max-width: 50px; color: #fff; font-size: 9px; }
    .panel-action.release-action:hover { color: #ff0000; }

    /* ======================== MARKETPLACE ======================== */
    .market-login { text-align: center; padding: 40px 20px; color: #fff; }
    .market-login-btn {
      display: inline-block; margin-top: 12px; padding: 10px 24px;
      background: #9146FF; border: none; border-radius: 6px;
      color: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
      text-decoration: none;
    }
    .market-login-btn:hover { background: #7c3aed; }
    .market-earnings {
      background: #1a1a0a; border: 1px solid #ffaa0040; border-radius: 6px;
      padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center;
      justify-content: space-between;
    }
    .market-earnings-text { font-size: 11px; color: #ffaa00; font-weight: 600; }
    .market-earnings-btn {
      padding: 4px 12px; background: #ffaa00; border: none; border-radius: 4px;
      color: #000; font-size: 10px; font-weight: 700; cursor: pointer;
    }
    .market-section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: #444; margin-bottom: 10px; }
    .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .market-card {
      background: #111; border: 1px solid #ffffff14; border-radius: 8px;
      padding: 12px; text-align: center; cursor: pointer; transition: border-color 0.2s;
    }
    .market-card:hover { border-color: #ffaa00; }
    .market-card-sprite { margin-bottom: 6px; }
    .market-card-name { font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .market-card-meta { font-size: 9px; color: #fff; margin-bottom: 6px; }
    .market-card-seller { font-size: 8px; color: #fff; margin-bottom: 6px; }
    .market-card-price { font-size: 14px; font-weight: 700; color: #ffaa00; margin-bottom: 6px; }
    .market-card-buy {
      padding: 4px 16px; background: #ffaa00; border: none; border-radius: 4px;
      color: #000; font-size: 10px; font-weight: 700; cursor: pointer;
    }
    .market-card-buy:hover { background: #ff8800; }
    .market-card-buy:disabled { opacity: 0.4; cursor: default; }
    .market-card-cancel {
      padding: 4px 12px; background: transparent; border: 1px solid #ffffff28;
      border-radius: 4px; color: #fff; font-size: 9px; cursor: pointer; margin-top: 4px;
    }
    .market-card-cancel:hover { border-color: #ff0000; color: #ff0000; }
    .market-empty { text-align: center; color: #444; font-size: 12px; padding: 30px; }
    .market-card .rarity-chip { display: inline-block; font-size: 8px; padding: 1px 6px; border-radius: 3px; font-weight: 700; text-transform: uppercase; }
    .market-card .rarity-common { background: #333; color: #fff; }
    .market-card .rarity-uncommon { background: #1a3a1a; color: #4CAF50; }
    .market-card .rarity-rare { background: #1a2a4a; color: #42A5F5; }
    .market-card .rarity-epic { background: #2a1a3a; color: #AB47BC; }
    .market-card .rarity-legendary { background: #3a2a0a; color: #FFC107; }
    .market-mut-badge { font-size: 8px; color: #ffaa00; margin-top: 2px; }

    /* Sell dialog overlay */
    .sell-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200;
      display: flex; align-items: center; justify-content: center;
    }
    .sell-dialog {
      background: #111; border: 2px solid #ff0000; border-radius: 10px;
      padding: 20px; width: 280px; text-align: center;
    }
    .sell-dialog-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 12px; }
    .sell-dialog-sprite { margin-bottom: 8px; }
    .sell-dialog-info { font-size: 10px; color: #fff; margin-bottom: 12px; }
    .sell-dialog-price-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .sell-dialog-price-row label { font-size: 11px; color: #fff; }
    .sell-dialog-price-input {
      width: 80px; padding: 6px 10px; background: #222; border: 1px solid #ffffff28;
      border-radius: 4px; color: #ffaa00; font-size: 14px; font-weight: 700;
      text-align: center; outline: none;
    }
    .sell-dialog-price-input:focus { border-color: #ffaa00; }
    .sell-dialog-btns { display: flex; gap: 8px; justify-content: center; }
    .sell-dialog-btns button {
      padding: 8px 20px; border: none; border-radius: 4px; font-size: 11px;
      font-weight: 700; cursor: pointer;
    }
    .sell-confirm { background: #ffaa00; color: #000; }
    .sell-confirm:hover { background: #ff8800; }
    .sell-cancel { background: #222; color: #fff; border: 1px solid #ffffff28 !important; }
    .sell-cancel:hover { color: #fff; }

    /* ======================== EGGS TAB ======================== */
    .eggs-section { margin-bottom: 24px; }
    .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: #444; margin-bottom: 12px; }

    /* Incubator */
    .incubator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .egg-slot {
      background: #111; border: 1px solid #ffffff14; border-radius: 8px;
      padding: 16px; text-align: center; min-height: 120px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .coll-growth-section { width: 100%; max-width: 280px; margin-bottom: 16px; }

    /* ======================== DINODEX ======================== */

    .dex-detail-panel {
      background: #0a0a0a; border: 1px solid #ffffff14; border-radius: 8px;

const SAVE_KEY = 'pham_dino_park';

/* SAVE_EPOCH — bump to force every player to start over.

   A save whose epoch does not match this value is discarded on sight,
   wherever it came from: localStorage, or the cloud.

   WHY THIS EXISTS RATHER THAN JUST CLEARING THE SERVER. Deleting the
   dino_park_* records would reset nobody. syncCloudSave() below treats
   "no cloud save but a local one exists" as a returning player and
   UPLOADS the local save — so a server-side wipe silently restores
   itself from every player's browser the next time they open the game,
   and looks like it worked right up until it doesn't.

   MUST MATCH `SAVE_EPOCH` in functions/api/dino-park.js. The server
   stamps it onto states it creates for redeemed eggs; if the two
   disagree, the client discards a save the server just wrote and the
   granted egg vanishes.

   Epoch 2 — 2026-09-13, rebalance: full progression and economy reset. */
const SAVE_EPOCH = 2;

const CLOUD_SAVE_URL = '/api/dino-park';
const SERVER_SAVE_INTERVAL_MS = 20000;
const RARITY_ORDER = ['common','uncommon','rare','epic','legendary'];
const RARITY_COLORS = { common:'#7a7a7a', uncommon:'#2ecc71', rare:'#3498db', epic:'#9b59b6', legendary:'#f39c12' };
const GROWTH_THRESHOLDS = { juvenile: 20, adult: 60 };

/* ── PER-DINO LEVELLING ───────────────────────────────────────────────
   Deliberately its OWN pool rather than a second reading of careCount,
   which already drives the growth stage and the PWR/GRD/SPD figures. A
   level derived from care would just be a fourth face on one number.

   THE FAILURE TO DESIGN AROUND: any XP awarded for a park-wide event
   lands on every dino at once, and a roster that levels in lockstep is
   indistinguishable from the bug this replaced, where every card printed
   the park level. So the two large sources are per-dino — care is earned
   one animal at a time, and the daily dig credits a single random
   resident. Park presence pays the same to everyone, which is why it is
   the smallest of the three.

   Vaulted dinos earn nothing. That is consistent with storage already
   stopping growth and decay, and it keeps "leave it in the park" the
   choice with a cost. */
const DINO_XP = {
  care: 10,            /* per care action; 5 types × 1 live-hour cooldown ⇒ ≤50/live hr */
  stageJuvenile: 100,  /* one-off, on growing */
  stageAdult: 250,
  parkHour: 10,        /* passive, per live hour, park only */
  dig: 40,             /* one randomly chosen park dino per daily dig */
};

/* level = floor(sqrt(xp / XP_PER_LEVEL)) + 1, so each level costs more
   than the last and nothing ever caps. A perfectly tended dino earns
   ~60 XP/live hour, which puts adulthood (12 live hours) near level 5 and
   a month of streaming near level 9. */
const XP_PER_LEVEL = 50;
const STAT_DECAY_RATE = 1;
// Decay and care cooldowns are measured in accumulated LIVE stream seconds
// (state.liveSecAccum), not wall-clock time — both are frozen while
// PhantomACE is offline, so care is paced to the show, not the clock.
const DECAY_INTERVAL_LIVE_SEC = 4 * 3600;
const CARE_AMOUNT = 25;
const CARE_COOLDOWN_LIVE_SEC = 1 * 3600;

// have their needs decay. Everything else sits in state.vault, frozen in
// whatever state it was in when it left the park. Both arrays store the

const MAX_ACTIVE_PARK = 10;
/* Two of most species, so a collector can keep a mutated and a plain one
   of each without ever having to cull. The save is posted whole every 20
   seconds and a stored dinosaur is about 130 bytes, so a completely full
   vault is 25KB; there is no size limit on the server side. */

const MUTATION_FILTERS = {
  albino:     'brightness(2) saturate(0)',
  melanistic: 'brightness(0.25) saturate(0.4)',
  golden:     'sepia(1) brightness(1.3) saturate(2.5)',
  crystal:    'brightness(1.4) saturate(0.3) hue-rotate(180deg)',
  volcanic:   'brightness(0.7) sepia(0.6) hue-rotate(-15deg) saturate(3)',
  /* BLACK BODY, RED ACCENTS -- which is what this mutation's own entry in
     MUTATIONS says it is (p:'#0A0A0A', a:'#FF0000'), and what the old
     filter did not do. hue-rotate(0deg) rotates nothing: it just
     saturated whatever colour the species already was, so across the
     roster PhantomACE came out anywhere from red to yellow-orange to
     green -- Megalodon brown, Anomalocaris green -- a spread of 357
     degrees at a mean luminance of 0.32, nowhere near black.

     sepia(1) FIRST is what fixes it, the same trick golden uses: a full
     sepia discards the input hue entirely, so everything downstream
     starts from one colour no matter what the animal was. Then saturate
     and rotate that single hue onto red, and darken hard. Measured over
     all 85: spread 11 degrees, saturation 0.98, luminance 0.13.

     The pre-rotation in getMutFilter still prepends here, and provably
     does nothing -- sepia(1) runs after it and throws the hue away. It
     is left in rather than special-cased because the measured effect is
     0.01 of luminance, below anything visible. */
  phantomace: 'sepia(1) saturate(8) hue-rotate(-40deg) brightness(0.55) contrast(1.9)',
  spectral:   'brightness(1.4) saturate(0.15) opacity(0.65)',
  toxic:      'hue-rotate(90deg) saturate(2.2) brightness(0.95)',
};

const COLOR_SWAP_FILTERS = {
  crimson:   'hue-rotate(-10deg) saturate(2.5) brightness(0.85)',
  azure:     'hue-rotate(200deg) saturate(1.5)',
  jade:      'hue-rotate(120deg) saturate(1.8)',
  amethyst:  'hue-rotate(270deg) saturate(1.6)',
  amber:     'hue-rotate(40deg) saturate(2) brightness(1.1)',
  arctic:    'brightness(1.5) saturate(0.4) hue-rotate(190deg)',
  obsidian:  'brightness(0.3) saturate(0.3)',
  ivory:     'brightness(1.6) saturate(0.2)',
  teal:      'hue-rotate(160deg) saturate(1.5)',
  rose:      'hue-rotate(330deg) saturate(1.8) brightness(1.1)',
  slate:     'saturate(0.2) brightness(0.7)',
  copper:    'hue-rotate(25deg) sepia(0.5) saturate(2)',

/* Pre-rotation, in degrees, for species whose own colours sit too far
   from the tan the mutation filters were written against -- without it
   a hue-rotate lands somewhere else entirely, and 'toxic' comes out
   magenta on every blue animal in the game. Measured and written by
   tools/build-dino-portraits.py against the art it just built. */
const PORTRAIT_HUE_FIX = {apato:286, archae:205, argent:147, bronto:153, dodo:177, dunky:172, elasmo:189, ichthy:190, liopl:183, mamen:240, megalo:102, megarach:78, megashark:168, micro:312, mosa:205, plesio:189, shoni:210, sinosaur:51, therizo:105, tylo:172};

function getMutFilter(specId, mutation) {
  if (!mutation) return '';
  const filter = MUTATION_FILTERS[mutation]
    || COLOR_SWAP_FILTERS[mutation]
    || 'hue-rotate(30deg) saturate(1.3)';

  /* EVERY FILTER ABOVE IS A FIXED ROTATION, and a fixed rotation only lands
     on the colour its name promises if the art underneath is the tan most
     of the roster is. On a blue animal "toxic" came out magenta and
     "crystal" came out sand -- a hundred and seventy degrees wrong, on
     Megalodon and every other marine species.

     So the far-off species are turned to that tan FIRST and the filter runs
     unchanged. One number each, and it works for the filters that rotate
     after a sepia (volcanic, copper) where a per-mutation angle would not:
     there the base hue barely survives to be rotated at all.

     Only filters that rotate are corrected. albino, melanistic, spectral,
     obsidian, ivory and slate only lighten or drain, and a species keeping
     its own colour through those is the point of them. */
  const fix = PORTRAIT_HUE_FIX[specId];
  if (fix && filter.indexOf('hue-rotate') !== -1) {
    return 'hue-rotate(' + fix + 'deg) ' + filter;
  }
  return filter;
}

function preloadAssets() {
  const urls = new Set();
  Object.values(ASSET_MAP).forEach(a => { if(a.icon) urls.add(a.icon); if(a.portrait) urls.add(a.portrait); if(a.baby) urls.add(a.baby); });
  Object.values(EGG_ASSETS).forEach(u => urls.add(u));
  DECO_ASSETS.forEach(d => urls.add(d.src));
  urls.forEach(u => { const img = new Image(); img.src = u; });
}

// Color utilities
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgbHex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function adj(hex,amt){const[r,g,b]=hexRgb(hex);const f=amt>0?255:0;const t=Math.abs(amt)/100;return rgbHex(r+(f-r)*t,g+(f-g)*t,b+(f-b)*t)}

function genPalette(pri,acc,iris){
  return{body:pri,mid:adj(pri,15),light:adj(pri,35),dark:adj(pri,-20),
    outline:adj(pri,-42),belly:adj(pri,50),accent:acc||adj(pri,30),
    iris:iris||'#FFD700',claw:'#E8DCC8',detail:adj(pri,-10)};
}

}

function getMutationsForSpecies(specId){
  const def=SPECIES_DEF[specId];if(!def)return[];
  const normals=pickSwaps(def.p).map(s=>({id:s.id,label:s.l,tier:'normal',p:s.p,a:s.a,i:s.i}));
  const sp=SPECIAL_MUTS[specId];const ra=RARE_MUTS[specId];
  const result=[...normals];
  if(sp)result.push({id:'sp_'+specId,label:sp[0],tier:'special',p:sp[1],a:sp[2],i:sp[3],overlay:sp[4]});
  if(ra)result.push({id:'rare_'+specId,label:ra[0],tier:'rare',p:ra[1],a:ra[2],i:ra[3],overlay:ra[4]});
  return result;
}
function resolveSpeciesMut(specId,mutId){
  if(!mutId)return null;
  if(MUTATIONS[mutId])return MUTATIONS[mutId];
  const muts=getMutationsForSpecies(specId);
  const found=muts.find(m=>m.id===mutId);
  if(found)return{label:found.label,boost:found.tier==='rare'?'legendary':found.tier==='special'?2:1,
    p:found.p,a:found.a,i:found.i,overlay:found.overlay||null};
  return null;
}
function rollMutation(specId){
  const r=Math.random()*100;
  if(r<0.5&&RARE_MUTS[specId])return'rare_'+specId;
  if(r<3&&SPECIAL_MUTS[specId])return'sp_'+specId;
  if(r<15){const n=pickSwaps(SPECIES_DEF[specId].p);return n[Math.floor(Math.random()*n.length)].id;}
  if(r<18){const gk=Object.keys(MUTATIONS);return gk[Math.floor(Math.random()*gk.length)];}
  return null;
}

/* A mutation is guaranteed, but WHICH mutation keeps its normal relative
   odds. Rolling inside 0-18 rather than 0-100 is exactly the mutation band
   of rollMutation above, so a rare mutation is still rare *relative to* a
   colour swap (0.5 in 18, not 1 in 4). Flattening the distribution would
   quietly make guaranteed-mutation eggs the best source of rare mutations
   in the game, which is not what "guaranteed a mutation" should mean.

   Species without a rare or special variant fall through those bands, so
   the loop retries; the global-mutation fallback always succeeds because
   MUTATIONS is never empty. */
function rollMutationGuaranteed(specId){
  for(let i=0;i<40;i++){
    const r=Math.random()*18;
    if(r<0.5&&RARE_MUTS[specId])return'rare_'+specId;
    if(r<3&&SPECIAL_MUTS[specId])return'sp_'+specId;
    if(r<15){const n=pickSwaps(SPECIES_DEF[specId].p);if(n&&n.length)return n[Math.floor(Math.random()*n.length)].id;continue;}
    const gk=Object.keys(MUTATIONS);
    return gk[Math.floor(Math.random()*gk.length)];
  }
  const gk=Object.keys(MUTATIONS);
  return gk[Math.floor(Math.random()*gk.length)];
}

/* ══════════════ TRADE-UP ══════════════
   Five of one rarity for one of the next. Two tracks, because a mutated
   dinosaur is worth far more than a plain one and letting them fill the
   same five slots would make the mutated track a way of laundering junk:
   the plain track takes five UNMUTATED and returns an unmutated one, the
   mutated track takes five MUTATED and returns a mutated one. */
const TRADE_UP_COST = 5;

/* Legendary has nothing above it, so it trades into itself. The reward at
   the top of the ladder is the guaranteed mutation rather than a tier --
   which also means legendaries are never a dead end for the mutation dex,
   the 1105-entry half of completion. */
function tradeUpRarity(rarity) {
  const i = RARITY_ORDER.indexOf(rarity);
  if (i < 0) return null;
  return RARITY_ORDER[i + 1] || RARITY_ORDER[RARITY_ORDER.length - 1];
}

/* WEIGHTED TOWARD THE RARE END, and only here. rollMutationGuaranteed
   deliberately keeps the normal relative odds so that guaranteed-mutation
   eggs cannot become the best source of rare mutations in the game; this
   one is allowed to be that source because it costs five already-mutated
   dinosaurs, each itself an 18% drop. Same bands, reweighted: rare goes
   0.5 -> 3 of 18 (6x) and special 2.5 -> 5 (2x), taken out of the colour
   swaps, which drop from 12 to 7. Globals are untouched at 3. */
function rollMutationTradeUp(specId) {
  for (let i = 0; i < 40; i++) {
    const r = Math.random() * 18;
    if (r < 3 && RARE_MUTS[specId]) return 'rare_' + specId;
    if (r < 8 && SPECIAL_MUTS[specId]) return 'sp_' + specId;
    if (r < 15) {
      const n = pickSwaps(SPECIES_DEF[specId].p);
      if (n && n.length) return n[Math.floor(Math.random() * n.length)].id;
      continue;
    }
    const gk = Object.keys(MUTATIONS);
    return gk[Math.floor(Math.random() * gk.length)];
  }
  const gk = Object.keys(MUTATIONS);
  return gk[Math.floor(Math.random() * gk.length)];
}

/* Remove dinosaurs from the park and vault at once, by {source, idx}.

   COOLDOWNS ARE KEYED BY PARK INDEX -- 'feed_3', 'play_3' -- so removing a
   dinosaur renumbers every one after it and silently hands their cooldowns
   to the wrong animal. The old single-removal paths deleted the departing
   index's keys and left the rest, which was wrong but hard to notice with
   one at a time; taking five at once would scramble a whole park. So the
   surviving indices are remapped here, and the two older callers go
   through this as well.

   Park indices are spliced high-to-low so earlier removals cannot shift
   the ones still to come. */
function removeDinos(picks) {
  const parkIdx = picks.filter(p => p.source === 'park').map(p => p.idx).sort((a, b) => b - a);
  const vaultIdx = picks.filter(p => p.source === 'vault').map(p => p.idx).sort((a, b) => b - a);
  const removed = [];

  if (parkIdx.length) {
    const gone = new Set(parkIdx);
    const remap = new Map();
    let next = 0;
    state.park.forEach((_, i) => { if (!gone.has(i)) remap.set(i, next++); });

    const moved = {};
    Object.keys(state.cooldowns).forEach(k => {
      const m = /^(.*)_(\d+)$/.exec(k);
      if (!m) { moved[k] = state.cooldowns[k]; return; }
      const to = remap.get(Number(m[2]));
      if (to === undefined) return;      /* its dinosaur is leaving */
      moved[m[1] + '_' + to] = state.cooldowns[k];
    });
    state.cooldowns = moved;

    parkIdx.forEach(i => removed.push(state.park.splice(i, 1)[0]));
    selectedDinoIdx = -1;
  }
  vaultIdx.forEach(i => removed.push(state.vault.splice(i, 1)[0]));
  collSelectedIdx = -1;
  return removed;
}

/* Everything a trade-up could consume, park and vault together, because
   the point is to spend the collection rather than whichever half of it
   the Collection tab happens to be showing. */
function tradeUpEntries() {
  const out = [];
  state.park.forEach((d, i) => out.push({ source: 'park', idx: i, dino: d }));
  state.vault.forEach((d, i) => out.push({ source: 'vault', idx: i, dino: d }));
  return out;
}

function tradeUpEligible(dino, track) {
  return track === 'mutated' ? !!dino.mutation : !dino.mutation;
}

function getSprite(specId, size, mutation) {
  const key = specId + '_' + size + (mutation ? '_' + mutation : '');
  if (spriteCache[key]) return spriteCache[key];

  const def = SPECIES_DEF[specId];
  if (!def) return '';

  let pri = def.p, acc = def.a, iris = def.i;
  let overlay = null;
  const m = mutation ? resolveSpeciesMut(specId, mutation) : null;
  if (m) { if(m.p)pri=m.p; if(m.a)acc=m.a; if(m.i)iris=m.i; if(m.overlay)overlay=m.overlay; }

  const pal = genPalette(pri, acc, iris);
  const canvas = document.createElement('canvas');
  canvas.width = 96; canvas.height = 96;
  const ctx = canvas.getContext('2d');
  drawBody(ctx, def.t, pal);
  if (overlay) drawOverlay(ctx, overlay, def.t, pal);

  const url = canvas.toDataURL();
  spriteCache[key] = url;
  return url;
}

/* ══ FAVOURITE ══════════════════════════════════════════════════════
   One dino, shown on the player's public profile.

   Sprites here are composed in the browser — recoloured per species and
   mutation, sometimes drawn to a canvas outright — so there is no URL a
   profile page could simply point at. Rather than export the whole
   pipeline, the favourite stores the RESOLVED image: an absolute path into
   this game's asset tree, or an inline sprite for the species that have no
   file of their own.

   Absolute, because the profile is not served from this directory and the
   relative paths in ASSET_MAP would resolve against the wrong one. The
   server refuses anything outside this tree, so the prefix is load-bearing
   rather than cosmetic. */
function resolveFavoriteSprite(specId, mutation) {
  const asset = ASSET_MAP[specId];
  if (asset && asset.icon) {
    const mut = mutation ? getMutFilter(specId, mutation) : '';
    const corr = (!mut && asset.ic && asset.portrait) ? asset.ic : '';
    return { src: '/games/dino-park/' + asset.icon, filter: corr || mut || '' };
  }
  return { src: getSprite(specId, 96, mutation), filter: '' };
}

/* The PORTRAIT, which is a different asset from the grid icon and what the
   collection shows when you select a species. Same fallback ladder as
   portraitImg: portrait, then icon, then a drawn one. */
function resolveFavoritePortrait(specId, mutation) {
  const asset = ASSET_MAP[specId];
  const mut = mutation ? getMutFilter(specId, mutation) : '';
  if (asset && asset.portrait) {
    return { src: '/games/dino-park/' + asset.portrait, filter: mut || '' };
  }
  if (asset && asset.icon) {
    return { src: '/games/dino-park/' + asset.icon, filter: mut || '' };
  }
  return { src: getPortrait(specId, 96, mutation), filter: '' };
}

/* Matched on what the dino IS rather than on its index, which changes every
   time one is released or the park is re-ordered. */
function isFavorite(dino) {
  const f = state.favorite;
  if (!f || !dino) return false;
  return f.specId === dino.speciesId
      && (f.mutation || '') === (dino.mutation || '')
      && (f.nickname || '') === (dino.nickname || '');
}

function toggleFavorite(idx) {
  const dino = state.park[idx];
  if (!dino) return;

  if (isFavorite(dino)) {
    state.favorite = null;
  } else {
    const spec = getRosterById(dino.speciesId) || {};
    const resolved = resolveFavoriteSprite(dino.speciesId, dino.mutation);
    const portrait = resolveFavoritePortrait(dino.speciesId, dino.mutation);
    const def = SPECIES_DEF[dino.speciesId] || {};
    const mut = dino.mutation ? resolveSpeciesMut(dino.speciesId, dino.mutation) : null;

    /* THE STAT BLOCK, SNAPSHOTTED. The profile page has none of this file's
       roster, species definitions or mutation tables, and giving it them
       would couple a public page to a five-thousand-line game. The fields
       are static per species, so a copy taken at the moment of choosing is
       as good as a lookup — and if the roster is ever re-tiered, the worst
       case is a profile describing a dino the way it was when its owner
       picked it, which is arguably the honest answer anyway. */
    state.favorite = {
      specId: dino.speciesId,
      mutation: dino.mutation || '',
      nickname: dino.nickname || spec.name || '',
      src: resolved.src,
      filter: resolved.filter,
      portrait: portrait.src,
      portraitFilter: portrait.filter,
      species: spec.name || '',
      rarity: spec.rarity || '',
      diet: spec.diet || '',
      habitat: spec.habitat || '',
      era: spec.era || '',
      build: def.t || '',
      desc: spec.desc || '',
      mutationLabel: mut ? (mut.label || '') : '',
    };
  }
  renderBottomPanel();
  save();
}

function spriteImg(specId, size, cls, mutation) {
  const asset = ASSET_MAP[specId];
  if (asset) {
    const useBaby = size <= 24 && asset.baby;
    const src = useBaby ? asset.baby : asset.icon;
    if (src) {
      const mut = mutation ? getMutFilter(specId, mutation) : '';
      const corr = (!mut && asset.ic && asset.portrait) ? asset.ic : '';
      const filt = corr || mut;
      const filtStyle = filt ? `filter:${filt};` : '';
      return `<img src="${src}" width="${size}" height="${size}" class="${cls||''}" style="image-rendering:pixelated;${filtStyle}" alt="" loading="lazy">`;
    }
  }
  const url = getSprite(specId, size, mutation);
  return `<img src="${url}" width="${size}" height="${size}" class="${cls||''}" style="image-rendering:auto;" alt="">`;
}

function getPortrait(specId, size, mutation) {
  const key = 'p_' + specId + '_' + size + (mutation ? '_' + mutation : '');
  if (spriteCache[key]) return spriteCache[key];

  const def = SPECIES_DEF[specId];
  if (!def) return '';

  let pri = def.p, acc = def.a, iris = def.i;
  let overlay = null;
  const m2 = mutation ? resolveSpeciesMut(specId, mutation) : null;
  if (m2) { if(m2.p)pri=m2.p; if(m2.a)acc=m2.a; if(m2.i)iris=m2.i; if(m2.overlay)overlay=m2.overlay; }

  const pal = genPalette(pri, acc, iris);
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  drawPortrait(ctx, specId, pal);
  if (overlay) drawOverlay(ctx, overlay, SPECIES_DEF[specId].t, pal);

  const url = canvas.toDataURL();
  spriteCache[key] = url;
  return url;
}

/* THE SIZE IS A CEILING, NOT A COMMAND.
   Portraits are 72px pixel art and icons are 32px, drawn with
   image-rendering: pixelated — and pixelated rendering is only clean at
   whole multiples of the native size. Ask for 96 and a 72px portrait is
   scaled 1.33×: every third pixel row doubles and the rest do not, which
   is the ragged look the Dinodex had. There is nothing larger to load;
   the source pack ships 72px and nothing else.

   So the requested size is treated as a budget, and the image is drawn at
   the LARGEST whole multiple of its native size that fits — 144 for a
   portrait asked at 144, 128 for a 32px icon asked at the same 144. Both
   crisp, slightly different sizes, and flex layouts absorb the
   difference. The drawn-canvas fallback keeps the raw size: it is
   generated at whatever resolution is asked for and never scales. */
function snapToGrid(target, native) {
  return Math.max(1, Math.floor(target / native)) * native;
}

/* `size` is a number for a square slot, or [width, height] for a landscape
   one. THE SLOT SHOULD MATCH THE ART, and the art is landscape: measured
   across the 88 portraits, the median drawn height inside a 144 square was
   91px and twelve filled under half of it -- Mamenchisaurus drew 144x40
   with a hundred pixels of dead space above and below. Nothing is being
   upscaled to fix that either; the median portrait is still downscaled 1.9x
   at the larger slot, so the detail was simply not being shown. */
function portraitImg(specId, size, cls, mutation) {
  const [boxW, boxH] = Array.isArray(size) ? size : [size, size];
  const asset = ASSET_MAP[specId];
  if (asset && asset.portrait) {
    const filt = mutation ? getMutFilter(specId, mutation) : '';
    const filtStyle = filt ? `filter:${filt};` : '';
    /* The filename is the rendering contract. A -72x72 portrait is pixel
       art and gets nearest-neighbour at a whole multiple of its grid; the
       rebuilt portraits are 150-330px originals, larger than anything the
       page draws, so the browser scales them DOWN, where smooth sampling
       is the right tool and pixelated would shed detail.

       AND THEY ARE NOT SQUARE. They are trimmed to their own content now,
       so a pterosaur's file really is three times wider than tall. Forcing
       width and height to the same number would squash it. Instead the
       square slot is a CONTAINER of exactly the size asked for -- so every
       layout around this is untouched, the box is the same size it always
       was -- and the image is bounded inside it by max-width/max-height,
       which is the one way to preserve aspect without the page having to
       know what the aspect is. */
    if (asset.portrait.indexOf('-72x72') === -1) {
      return slot(`<img src="${asset.portrait}" style="max-width:100%;max-height:100%;width:auto;height:auto;image-rendering:auto;${filtStyle}" alt="" loading="lazy">`);
    }
    /* Pixel art, so a whole multiple of its own grid and no larger than the
       slot -- the short side decides, or a landscape slot would blow a
       square sprite out of its own box. */
    const px = snapToGrid(Math.min(boxW, boxH), 72);
    return slot(`<img src="${asset.portrait}" width="${px}" height="${px}" style="image-rendering:pixelated;${filtStyle}" alt="" loading="lazy">`);
  }
  if (asset && asset.icon) {
    const filt = mutation ? getMutFilter(specId, mutation) : '';
    const filtStyle = filt ? `filter:${filt};` : '';
    const px = snapToGrid(Math.min(boxW, boxH), 32);
    return slot(`<img src="${asset.icon}" width="${px}" height="${px}" style="image-rendering:pixelated;${filtStyle}" alt="" loading="lazy">`);
  }
  const url = getPortrait(specId, Math.min(boxW, boxH), mutation);
  return slot(`<img src="${url}" width="${Math.min(boxW, boxH)}" height="${Math.min(boxW, boxH)}" style="image-rendering:auto;" alt="">`);

  /* One slot for every kind, so the layout around it never has to know
     which one it got. max-width keeps it inside a phone. */
  function slot(inner) {
    return `<div class="${cls||''}" style="width:${boxW}px;height:${boxH}px;max-width:100%;` +
      `display:flex;align-items:center;justify-content:center;">${inner}</div>`;
  }
}

let wasStreamLive = false;

/* A save from before the current SAVE_EPOCH. Treated as absent, not
   upgraded — the point of an epoch bump is that the old progression is
   deliberately void. Anything missing an epoch predates the mechanism
   entirely and is therefore also stale. */
function isStaleSave(s) {
  return !s || typeof s !== 'object' || s.saveEpoch !== SAVE_EPOCH;
}

function discardLocalSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

function save() {
  state.lastTick = Date.now();
  // Stamped on every write, never assumed — a state assembled by spreading
  // over the defaults can otherwise lose it and read as stale on next load.
  state.saveEpoch = SAVE_EPOCH;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
  if (getPlayerSession()) scheduleServerSave();
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (isStaleSave(parsed)) { discardLocalSave(); return; }
    state = { ...state, ...parsed };
    applyOfflineDecay();
  } catch(e) {}
}

/* ── Cloud save (logged-in players only) ──────────────────────────
   Guests never touch any of this — localStorage stays their only save,
   exactly as before. Logged-in players still save to localStorage on
   every save() call (cheap, instant), but the server POST is throttled
   to at most once per SERVER_SAVE_INTERVAL_MS so a 2s game tick and ~15
   other save() call sites don't turn into a KV write storm. A trailing
   call is scheduled so the most recent state still lands after the
   throttle window, and pagehide/visibilitychange flush immediately so
   nothing is lost if the tab closes right after an action. */
let lastServerSaveAt = 0;
let serverSaveTimer = null;

function scheduleServerSave() {
  const now = Date.now();
  const elapsed = now - lastServerSaveAt;
  if (elapsed >= SERVER_SAVE_INTERVAL_MS) {
    doServerSave();
  } else if (!serverSaveTimer) {
    serverSaveTimer = setTimeout(() => { serverSaveTimer = null; doServerSave(); }, SERVER_SAVE_INTERVAL_MS - elapsed);
  }
}

/* Pull in eggs the server granted that this client has never seen, without
   duplicating ones it already has. Matching on grantId rather than position
   or species is what makes it safe to run repeatedly.

   A granted egg can push the incubator one over its slot count — the server
   granted against its own view, which may differ from ours. That is
   deliberate and harmless: renderIncubator pads up to the slot count and
   renders whatever is there, and a brief overflow is a far better outcome
   than silently dropping a reward. */
function adoptServerGrants(serverState) {
  if (!serverState || typeof serverState !== 'object') return 0;
  if (!Array.isArray(state.eggs)) state.eggs = [];

  const known = new Set(state.eggs.map(e => e && e.grantId).filter(Boolean));
  const missing = (serverState.eggs || []).filter(e => e && e.grantId && !known.has(e.grantId));
  for (const e of missing) state.eggs.push(e);

  state.grantSeq = Number(serverState.grantSeq || 0);
  return missing.length;
}

async function doServerSave(isRetry) {
  lastServerSaveAt = Date.now();
  try {
    const res = await fetch(CLOUD_SAVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state }),
    });

    /* 409 means a reward landed after this state was captured. Merge it in
       and save again — once only, so a persistent disagreement cannot turn
       into a request loop. */
    if (res.status === 409 && !isRetry) {
      let payload = null;
      try { payload = await res.json(); } catch(e) {}
      const added = adoptServerGrants(payload && payload.state);
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
      if (added > 0) {
        updateTopBar();
        renderEggsTab();
        showToast(added === 1 ? 'A new egg arrived in your incubator! 🥚' : `${added} new eggs arrived! 🥚`);
      }
      await doServerSave(true);
    }
  } catch(e) {}
}

/* Fired on pagehide/visibilitychange. sendBeacon cannot read a response, so
   this path cannot honour a 409 — if a grant landed since the last sync, the
   server rejects this final save and the last few seconds of progress are
   lost. That is the right way round: the alternative is accepting it and
   destroying the granted egg. The next load re-reads the server state and
   picks the egg up. */
function flushServerSave() {
  if (!getPlayerSession()) return;
  try {
    const payload = JSON.stringify({ state });
    if (navigator.sendBeacon) {
      navigator.sendBeacon(CLOUD_SAVE_URL, new Blob([payload], { type: 'application/json' }));
    } else {
      fetch(CLOUD_SAVE_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true });
    }
    lastServerSaveAt = Date.now();
  } catch(e) {}
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushServerSave(); });
window.addEventListener('pagehide', flushServerSave);

/* Runs once at startup for logged-in players: the server save (if any)
   is the source of truth across devices. No server save yet but a local
   one exists (e.g. a returning player from before this shipped, or a
   guest who just logged in) — migrate it up instead of discarding it. */
async function syncCloudSave() {
  const session = getPlayerSession();
  if (!session || !session.user_id) return;

  /* Deliberately "a usable local save" rather than "any local save". A
     pre-epoch save must not count as something worth migrating upward,
     or the branch below would push it back into the cloud and undo the
     reset for this player permanently. */
  let hasLocal = false;
  try {
    const rawLocal = localStorage.getItem(SAVE_KEY);
    if (rawLocal) {
      if (isStaleSave(JSON.parse(rawLocal))) discardLocalSave();
      else hasLocal = true;
    }
  } catch(e) { discardLocalSave(); }

  try {
    const res = await fetch(CLOUD_SAVE_URL);
    if (!res.ok) return;
    const data = await res.json();

    if (data && data.hasSave && data.state && isStaleSave(data.state)) {
      /* A pre-epoch cloud save. Overwrite it now with the fresh state
         rather than merely ignoring it: otherwise it sits there being
         re-read and re-discarded on every load, and any other device
         still running an older build could pick it back up. */
      discardLocalSave();
      applySubTierFromSession(session);
      lastServerSaveAt = Date.now();
      try {
        await fetch(CLOUD_SAVE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state }),
        });
      } catch(e) {}
      updateTopBar();
      initParkView();
      renderEggsTab();
      return;
    }

    if (data && data.hasSave && data.state) {
      state = { ...state, ...data.state };
      applySubTierFromSession(session);
      applyOfflineDecay();
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch(e) {}
      updateTopBar();
      initParkView();
      renderEggsTab();
    } else if (hasLocal) {
      lastServerSaveAt = Date.now();
      await fetch(CLOUD_SAVE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ state }),
      });
    }
  } catch(e) {}
}

function ensureDinoStats(d) {
  if (d.hygiene === undefined) d.hygiene = 80;
  if (d.stamina === undefined) d.stamina = 80;

  /* BACKFILL, NOT A RESET. Every dino that existed before levelling has a
     careCount and no xp. Starting them at zero would take a roster someone
     spent live hours raising and show it as a wall of level 1s — the same
     insult as the bug this feature fixes, in the other direction. So the
     care they already did is converted at the rate it would have earned,
     including the stage bonuses they would have been paid on the way.

     `=== undefined` rather than `!d.xp`, because a dino legitimately
     sitting at 0 XP must not be re-backfilled on every load. */
  if (d.xp === undefined) {
    const care = d.careCount || 0;
    d.xp = care * DINO_XP.care
      + (care >= GROWTH_THRESHOLDS.juvenile ? DINO_XP.stageJuvenile : 0)
      + (care >= GROWTH_THRESHOLDS.adult ? DINO_XP.stageAdult : 0);
  }
}

function applyOfflineDecay() {
  // Hunger/thirst/happiness/hygiene only decay while the stream is live
  // (see DECAY_INTERVAL_LIVE_SEC) — time the game was closed can't be
  // attributed to live minutes, so it isn't decayed retroactively here.
  // Stamina still gets a wall-clock "welcome back" rest bonus for time away.
  const elapsedSec = (Date.now() - state.lastTick) / 1000;
  const restTicks = Math.floor(elapsedSec / 600);
  if (restTicks > 0) {
    state.park.forEach(d => { ensureDinoStats(d); d.stamina = Math.min(100, d.stamina + restTicks * NIGHT_STAMINA_REGEN); });
  }
  /* Vault dinos too. They earn nothing while stored, but they still need
     the XP backfill — otherwise a roster put away before levelling comes
     back out at level 1, and the sell price and card would both lie. */
  state.park.forEach(ensureDinoStats);
  (state.vault || []).forEach(ensureDinoStats);
  if (!state.yardItems) state.yardItems = [];
  if (!state.debris) state.debris = [];
  if (!state.lastOvergrowth) state.lastOvergrowth = Date.now();
  if (!state.parkDay) state.parkDay = 1;
  if (state.liveSecAccum === undefined) {
    // First load under the live-seconds cooldown system: any cooldown
    // timestamps on this save are old Date.now() milliseconds, which would
    // read as deeply negative (and permanently on-cooldown) against the new
    // small liveSecAccum scale. Clear them — every action just starts ready.
    state.liveSecAccum = 0;
    state.lastDecayLiveSec = 0;
    state.cooldowns = {};
  }
  // A stale save (an old cloud snapshot merged in over a newer local one, or
  // vice versa) can reintroduce a cooldowns object from before liveSecAccum
  // even while liveSecAccum itself stays at its current value, which the
  // guard above won't catch. lastUse is always a past reading of the same
  // ever-increasing liveSecAccum counter, so it can never legitimately
  // exceed the current value — anything that does is stale/wrong-format
  // and shows up as a wildly huge cooldown (e.g. "43,657,202h"). Drop those.
  if (state.cooldowns) {
    Object.keys(state.cooldowns).forEach(k => {
      if (state.cooldowns[k] > state.liveSecAccum) delete state.cooldowns[k];
    });
  }
  if (state.vault === undefined) {
    // First load under the active-park/vault split: the park used to hold
    // up to 20. Keep the 10 most recently acquired active (park order is
    // acquisition order), send anything older straight to the vault —
    // nothing is lost, it just stops growing/decaying until reactivated.
    state.vault = [];
    if (state.park.length > MAX_ACTIVE_PARK) {
      const overflow = state.park.length - MAX_ACTIVE_PARK;
      state.vault.push(...state.park.splice(0, overflow));
    }
  }
}

function getLevel() {
  const xp = [...state.park, ...state.vault].reduce((s,d) => s + d.careCount, 0) + state.discovered.length * 10;
  return Math.max(1, Math.floor(Math.sqrt(xp / 5)) + 1);
}
/* XP needed to REACH level n. Inverse of getDinoLevel, and the only place
   the curve is written twice — asserted against each other in
   server/scripts/test-dino-levels.js so they cannot drift. */
function xpForLevel(n) { return Math.pow(Math.max(1, n) - 1, 2) * XP_PER_LEVEL; }

function getDinoXp(d) { return Math.max(0, Math.floor(d.xp || 0)); }
function getDinoLevel(d) { return Math.floor(Math.sqrt(getDinoXp(d) / XP_PER_LEVEL)) + 1; }

/** How far through the current level, 0..1, for the bar. */
function getDinoLevelProgress(d) {
  const lv = getDinoLevel(d);
  const base = xpForLevel(lv), next = xpForLevel(lv + 1);
  return next === base ? 1 : Math.min(1, Math.max(0, (getDinoXp(d) - base) / (next - base)));
}

/**
 * Award XP and report whether it crossed a level.
 *
 * Returns the new level only on a change, so callers can announce it
 * without re-deriving and without announcing every single award.
 */
function awardDinoXp(d, amount) {
  if (!d || !(amount > 0)) return null;
  const before = getDinoLevel(d);
  d.xp = getDinoXp(d) + Math.floor(amount);
  const after = getDinoLevel(d);
  return after > before ? after : null;
}

function getStage(d) { return d.careCount >= GROWTH_THRESHOLDS.adult ? 'adult' : d.careCount >= GROWTH_THRESHOLDS.juvenile ? 'juvenile' : 'hatchling'; }
function getGrowthProgress(d) {
  const s = getStage(d);
  if (s === 'adult') return 1;
  if (s === 'juvenile') return (d.careCount - GROWTH_THRESHOLDS.juvenile) / (GROWTH_THRESHOLDS.adult - GROWTH_THRESHOLDS.juvenile);
  return d.careCount / GROWTH_THRESHOLDS.juvenile;
}
function getNextStageLabel(d) {
  const s = getStage(d);
  if (s === 'adult') return 'Fully Grown';
  if (s === 'juvenile') return `Adult in ${GROWTH_THRESHOLDS.adult - d.careCount}`;
  return `Juvenile in ${GROWTH_THRESHOLDS.juvenile - d.careCount}`;
}
function getRosterById(id) { return ROSTER.find(r => r.id === id); }
function rollRarity(w) { const t = Object.values(w).reduce((s,v)=>s+v,0); let r = Math.random()*t; for (const [k,v] of Object.entries(w)) { r-=v; if(r<=0) return k; } return 'common'; }
function rollSpecies(r) { const p = ROSTER.filter(x => x.rarity === r); return p[Math.floor(Math.random() * p.length)]; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
function updateTopBar() { state.level = getLevel(); document.getElementById('coinDisplay').textContent = state.coins; document.getElementById('dinoCountDisplay').textContent = state.park.length; document.getElementById('levelDisplay').textContent = state.level; }

let marketPollInterval = null;

const TAB_ORDER = ['park', 'eggs', 'collection', 'market', 'dinodex'];

function switchTab(tab) {
  /* RESOLVE BEFORE TEARING DOWN — the order here is the whole fix.
     This used to strip `active` from every tab first and only then look up
     the target, so an unknown tab name threw AFTER the page had been left
     with no active tab at all. Nothing put it back. From that moment every
     `document.querySelector('.tab-content.active')` returned null, and the
     one inside the minute tick threw again on every tick: a console filling
     with the same error over a blank page, all from one bad call. Resolving
     first means a bad name changes nothing. */
  const idx = TAB_ORDER.indexOf(tab);
  const panel = document.getElementById('tab-' + tab);
  const btn = document.querySelectorAll('.tab-btn')[idx];
  if (idx === -1 || !panel || !btn) {
    console.warn('[dino-park] unknown tab, ignoring:', tab);
    return;
  }

  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  panel.classList.add('active');
  btn.classList.add('active');
  if (tab === 'park') initParkView();
  if (tab === 'eggs') renderEggsTab();
  if (tab === 'collection') renderCollection();
  if (tab === 'market') renderMarketplace();
  if (tab === 'dinodex') renderDinodex();

  // Marketplace is shared/live — a listing another player just bought
  // shouldn't keep showing as available. Poll only while that tab is open.
  clearInterval(marketPollInterval);
  marketPollInterval = null;
  if (tab === 'market') {
    marketPollInterval = setInterval(() => {
      if (document.getElementById('tab-market')?.classList.contains('active')) renderMarketplace();
    }, 8000);
  }
}

/* ======================== VISUAL PARK ======================== */
let selectedDinoIdx = -1;
let parkReady = false;

// Tile map configuration — the park is one composed background image now,
// not a procedural atlas. COLS/ROWS just define the walkability mask's
// resolution and must stay square to match the art's own proportions.
const PARK_GRID = { COLS: 32, ROWS: 32 };
const TSIZE = 96;

let parkAssetsLoaded = false;
const parkImgs = {};
let resizeHandler = null;
let yardClickHandler = null;

const PARK_ASSET_URLS = {
  background: AB + 'dinoparkbackgroundv2.png',
};

function loadParkAssets() {
  if (parkAssetsLoaded) return Promise.resolve();
  return new Promise(resolve => {
    const entries = Object.entries(PARK_ASSET_URLS);
    let loaded = 0;
    entries.forEach(([key, src]) => {
      const img = new Image();
      img.onload = img.onerror = () => {
        if (img.complete && img.naturalWidth > 0) parkImgs[key] = img;
        if (++loaded === entries.length) { parkAssetsLoaded = true; resolve(); }
      };
      img.src = src;
    });
  });
}

// Walkability mask, sampled once (offline) from the actual background art at
// 32x32 resolution — not hand-drawn boundaries. L = land (grass/sand, open to
// land & sky dinos), R = river/oasis (crossable by everyone), O = ocean
// (water-habitat dinos only), X = the decorative strip of terrain drawn
// beyond the fence line toward the canvas edge — visually present but never
// walkable, so dinos can't path through the fence into it. See
// _private/GAME-DEV-PRACTICES.md point 1: the walkable region is data,
// sampled from the asset, not re-derived by eye.
const WALK_MASK = [
  'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX',
  'XLLLLLLLLLLLRRRLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLRRLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLRRLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLRRRLLLLLLLLLLLLLRLLLX',
  'XLLLLLLLLLLRRRLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLRRRLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLRRRLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLRRRRLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLRRRRRLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLLRRRRRLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLLLRRRRRRLLLLLLLLLLLX',
  'XLLLLLLLLLLLLLLLRRRRRRRRRRRRRRRR',
  'XLLLLLLLLLLLLLLLLLLRRRRRRRRRRRRR',
  'XLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLX',
  'XLLLLLLLLLLLLLLLLLLLLLLLLLLLOOOO',
  'XLLLLLLLLLLLLLLLLLLLLOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLLLLOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLLLLOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLLLOOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLLOOOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLLOOOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLLOOOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLOOOOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLLLOOOOOOOOOOOOOOO',
  'XLLLLLLLLLLLLLLOOOOOOOOOOOOOOOOO',
  'XLLLLLLLLLLLLOOOOOOOOOOOOOOOOOOO',
  'XXXXXXXXXXXXOOOOOOOOOOOOOOOOOOOO',
];

function zoneAt(xPct, yPct) {
  const col = Math.max(0, Math.min(PARK_GRID.COLS - 1, Math.floor(xPct / 100 * PARK_GRID.COLS)));
  const row = Math.max(0, Math.min(PARK_GRID.ROWS - 1, Math.floor(yPct / 100 * PARK_GRID.ROWS)));
  return WALK_MASK[row][col];
}
// Land & sky dinos: grass, sand, or the crossable river/oasis — never the
// fence border strip or the ocean.
function isLandWalkable(x, y) { const z = zoneAt(x, y); return z === 'L' || z === 'R'; }
// Water-habitat dinos: the river/oasis or the ocean — never dry land or the fence strip.
function isWaterWalkable(x, y) { const z = zoneAt(x, y); return z === 'R' || z === 'O'; }
// Decor placement: solid ground only — not the river/oasis a dino can wade through.
function isSolidGround(x, y) { return zoneAt(x, y) === 'L'; }

let groundCache = null;

function buildGroundCache() {
  const { COLS, ROWS } = PARK_GRID;
  const w = COLS * TSIZE;
  const h = ROWS * TSIZE;
  const offscreen = document.createElement('canvas');
  offscreen.width = w;
  offscreen.height = h;
  const ctx = offscreen.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  const img = parkImgs.background;
  if (img) ctx.drawImage(img, 0, 0, w, h);
  return offscreen;
}

function renderTileCanvas() {
  const gCanvas = document.getElementById('dinoGround');
  if (!gCanvas || !parkImgs.background) return;

  const world = document.getElementById('parkWorld');
  const dpr = window.devicePixelRatio || 1;
  const cw = world.clientWidth;
  const ch = world.clientHeight;

  if (!groundCache) groundCache = buildGroundCache();

  gCanvas.width = cw * dpr;
  gCanvas.height = ch * dpr;
  const gCtx = gCanvas.getContext('2d');
  gCtx.imageSmoothingEnabled = true;
  gCtx.drawImage(groundCache, 0, 0, gCanvas.width, gCanvas.height);
}

// Rejection-samples a random point in [0,100)x[0,100) until `ok` accepts it.
function randomZonePoint(ok, attempts) {
  let x = 50, y = 50;
  for (let i = 0; i < (attempts || 30); i++) {
    x = Math.random() * 100; y = Math.random() * 100;
    if (ok(x, y)) return { x, y };
  }
  return { x, y };
}

function initDinoPosition(dino) {
  const spec = getRosterById(dino.speciesId);
  const p = spec.habitat === 'Water' ? randomZonePoint(isWaterWalkable) : randomZonePoint(isLandWalkable);
  dino.px = p.x;
  dino.py = p.y;
  dino.tx = dino.px;
  dino.ty = dino.py;
  dino.facing = Math.random() > 0.5 ? 1 : -1;
}

// New dino goes active if there's room, otherwise straight to the vault.
// Returns 'park' | 'vault' | null (both full) so callers can message accordingly.
function addNewDino(newDino) {
  if (state.park.length < MAX_ACTIVE_PARK) {
    state.park.push(newDino);
    initDinoPosition(newDino);
    return 'park';
  }
  if (state.vault.length < MAX_VAULT_SIZE) {
    state.vault.push(newDino);
    return 'vault';
  }
  return null;
}

function pickNewTarget(dino) {
  const spec = getRosterById(dino.speciesId);
  if (spec.habitat === 'Sky') {
    // Sky dinos fly over everything — land, river, and ocean alike —
    // but still wander locally rather than teleporting across the map.
    dino.tx = Math.max(0, Math.min(100, dino.px + (Math.random() - 0.5) * 24));
    dino.ty = Math.max(0, Math.min(100, dino.py + (Math.random() - 0.5) * 24));
  } else {
    const zoneOk = spec.habitat === 'Water' ? isWaterWalkable : isLandWalkable;
    let nx = dino.px, ny = dino.py;
    for (let i = 0; i < 12; i++) {
      const cx = Math.max(0, Math.min(100, dino.px + (Math.random() - 0.5) * 10));
      const cy = Math.max(0, Math.min(100, dino.py + (Math.random() - 0.5) * 10));
      if (!zoneOk(cx, cy)) continue;
      if (spec.habitat !== 'Water' && isBlockedByYard(cx, cy, 1.5)) continue;
      nx = cx; ny = cy;
      break;
    }
    dino.tx = nx;
    dino.ty = ny;
  }
  if (dino.tx !== dino.px) dino.facing = dino.tx > dino.px ? 1 : -1;
}

function initParkView() {
  state.park.forEach(d => { if (d.px === undefined) initDinoPosition(d); });
  if (state.debris && state.debris.length > 0) wasStreamLive = true;
  renderStreamClock();

  if (!parkAssetsLoaded) {
    loadParkAssets().then(() => {
      renderTileCanvas();
      renderParkWorld();
      startAnimation();
    });
  } else {
    renderTileCanvas();
    renderParkWorld();
    startAnimation();
  }

  if (!resizeHandler) {
    resizeHandler = () => { renderTileCanvas(); renderParkWorld(); clampParkView(); applyParkTransform(); };
    window.addEventListener('resize', resizeHandler);
  }

  if (!yardClickHandler) {
    const world = document.getElementById('parkWorld');
    yardClickHandler = (e) => {
      if (!decorateMode) return;
      if (e.target.closest('.park-yard-item, .park-debris')) return;
      const r = world.getBoundingClientRect();
      placeYardItem(((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100);
    };
    world.addEventListener('click', yardClickHandler);
  }

  initParkPanZoom();
}

/* ======================== PARK PAN & ZOOM ======================== */
const PARK_MIN_ZOOM = 1;
const PARK_MAX_ZOOM = 4;
const parkView = { zoom: 1, panX: 0, panY: 0 };
let parkPanZoomInit = false;

function clampParkView() {
  const vp = document.getElementById('parkViewport');
  const vw = vp.clientWidth, vh = vp.clientHeight;
  parkView.zoom = Math.max(PARK_MIN_ZOOM, Math.min(PARK_MAX_ZOOM, parkView.zoom));
  const minX = vw * (1 - parkView.zoom), minY = vh * (1 - parkView.zoom);
  parkView.panX = Math.max(minX, Math.min(0, parkView.panX));
  parkView.panY = Math.max(minY, Math.min(0, parkView.panY));
}

function applyParkTransform() {
  const world = document.getElementById('parkWorld');
  world.style.transform = `translate(${parkView.panX}px, ${parkView.panY}px) scale(${parkView.zoom})`;
}

function zoomParkAt(factor, anchorX, anchorY) {
  const vp = document.getElementById('parkViewport');
  const vw = vp.clientWidth, vh = vp.clientHeight;
  const ax = anchorX === undefined ? vw / 2 : anchorX;
  const ay = anchorY === undefined ? vh / 2 : anchorY;
  const oldZoom = parkView.zoom;
  const newZoom = Math.max(PARK_MIN_ZOOM, Math.min(PARK_MAX_ZOOM, oldZoom * factor));
  const worldX = (ax - parkView.panX) / oldZoom;
  const worldY = (ay - parkView.panY) / oldZoom;
  parkView.zoom = newZoom;
  parkView.panX = ax - worldX * newZoom;
  parkView.panY = ay - worldY * newZoom;
  clampParkView();
  applyParkTransform();
}

function zoomParkBy(factor) { zoomParkAt(factor); }

function resetParkView() {
  parkView.zoom = 1;
  parkView.panX = 0;
  parkView.panY = 0;
  applyParkTransform();
}

function initParkPanZoom() {
  if (parkPanZoomInit) return;
  parkPanZoomInit = true;
  const vp = document.getElementById('parkViewport');
  const world = document.getElementById('parkWorld');

  vp.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    const factor = Math.exp(-e.deltaY * 0.0015);
    zoomParkAt(factor, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  const pointers = new Map();
  let dragMoved = false;
  let dragLast = null;
  let pinchStartDist = null;
  let pinchStartZoom = null;

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function midpoint(a, b) { return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }

  let dragStart = null;

  vp.addEventListener('pointerdown', (e) => {
    if (decorateMode) return;
    if (e.target.closest('.park-zoom-controls, .park-decorate-btn, .park-energy-bar, .park-clock, .yard-tray')) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      // Don't capture the pointer (or mark this a drag) yet — a plain tap
      // must still reach the dino/decor click handler underneath untouched.
      dragMoved = false;
      dragStart = { x: e.clientX, y: e.clientY };
      dragLast = dragStart;
    } else if (pointers.size === 2) {
      const pts = [...pointers.values()];
      pinchStartDist = dist(pts[0], pts[1]);
      pinchStartZoom = parkView.zoom;
      dragLast = null;
      for (const id of pointers.keys()) { try { vp.setPointerCapture(id); } catch {} }
    }
  });

  vp.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2 && pinchStartDist) {
      const pts = [...pointers.values()];
      const newDist = dist(pts[0], pts[1]);
      const mid = midpoint(pts[0], pts[1]);
      const r = vp.getBoundingClientRect();
      const targetZoom = pinchStartZoom * (newDist / pinchStartDist);
      zoomParkAt(targetZoom / parkView.zoom, mid.x - r.left, mid.y - r.top);
      dragMoved = true;
    } else if (pointers.size === 1 && dragStart) {
      if (!dragMoved) {
        if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) <= 3) return;
        dragMoved = true;
        world.classList.add('panning');
        try { vp.setPointerCapture(e.pointerId); } catch {}
      }
      const dx = e.clientX - dragLast.x, dy = e.clientY - dragLast.y;
      parkView.panX += dx;
      parkView.panY += dy;
      dragLast = { x: e.clientX, y: e.clientY };
      clampParkView();
      applyParkTransform();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) { pinchStartDist = null; }
    if (pointers.size === 0) { dragLast = null; dragStart = null; world.classList.remove('panning'); }
  }
  vp.addEventListener('pointerup', endPointer);
  vp.addEventListener('pointercancel', endPointer);

  // Suppress the click (dino selection / decor placement) that would
  // otherwise fire right after a drag or pinch gesture.
  vp.addEventListener('click', (e) => {
    if (dragMoved) { e.stopPropagation(); dragMoved = false; }
  }, true);
}

function renderParkWorld() {
  const world = document.getElementById('parkWorld');
  const existing = world.querySelectorAll('.park-dino, .park-empty-msg, .park-debris, .park-yard-item');
  existing.forEach(el => el.remove());

  const vp = document.getElementById('parkViewport');
  const parkScale = Math.min(2.2, Math.max(1, vp.clientWidth / 450));
  world.style.setProperty('--park-scale', parkScale);

  // Yard items (behind dinos, sorted by depth so lower items overlap higher ones)
  if (state.yardItems && state.yardItems.length > 0) {
    [...state.yardItems].sort((a, b) => a.y - b.y).forEach(it => {
      const t = getYardType(it.type);
      if (!t) return;
      const el = document.createElement('div');
      el.className = 'park-yard-item';
      el.dataset.yard = it.id;
      el.style.cssText = `left:${it.x}%;top:${it.y}%;z-index:${3 + Math.round(it.y / 10)};`;
      const px = Math.round(t.size * parkScale * 0.62);
      el.innerHTML = `<img src="${t.src}" width="${px}" height="${px}" alt="">`;
      if (decorateMode) {
        el.title = `${t.name} — tap to sell for ${Math.floor(t.cost * YARD_REFUND_PCT)} coins`;
        el.onclick = (e) => { e.stopPropagation(); sellYardItem(it.id); };
      }
      world.appendChild(el);
    });
  }

  // Debris
  if (state.debris && state.debris.length > 0) {
    state.debris.forEach(d => {
      const el = document.createElement('div');
      el.className = 'park-debris';
      el.dataset.debris = d.id;
      el.innerHTML = `<img src="${d.src || IC+'environment_terrain/boulder.png'}" width="28" height="28" style="image-rendering:pixelated;" alt="">`;
      el.style.cssText = `left:${d.x}%;top:${d.y}%;`;
      el.onclick = (e) => { e.stopPropagation(); clearDebris(d.id); };
      world.appendChild(el);
    });
  }

  if (state.park.length === 0 && (!state.debris || state.debris.length === 0)) {
    const msg = document.createElement('div');
    msg.className = 'park-empty-msg';
    msg.innerHTML = `<img src="${IC}baby_eggs/egg_in_nest.png" width="64" height="64" style="image-rendering:pixelated;" alt=""><div class="msg">No dinosaurs yet!<br>Head to Excavate to find your first egg.</div>`;
    world.appendChild(msg);
  }

  // Dinos
  state.park.forEach((dino, i) => {
    const spec = getRosterById(dino.speciesId);
    const stage = getStage(dino);
    const needsAttention = dino.hunger < 30 || dino.thirst < 30 || dino.happiness < 30 || (dino.hygiene||80) < 30 || (dino.stamina||80) < 30;

    const el = document.createElement('div');
    el.className = 'park-dino' + (i === selectedDinoIdx ? ' selected' : '');
    el.id = 'parkDino_' + i;
    el.onclick = () => selectDino(i);
    el.style.cssText = `left:${dino.px}%;top:${dino.py}%;`;

    const sprSize = stage === 'hatchling' ? 20 : stage === 'juvenile' ? 26 : 32;
    el.innerHTML = `
      ${needsAttention ? '<div class="park-dino-alert"></div>' : ''}
      <div class="park-dino-label">${dino.nickname || spec.name}</div>
      <div class="park-dino-sprite habitat-${spec.habitat.toLowerCase()}"
           style="transform: scaleX(${dino.facing || 1})">
        ${spriteImg(spec.id, sprSize, 'sprite-img', dino.mutation)}
      </div>
    `;
    world.appendChild(el);
  });

  updateEnergyBar();
}

let animFrameId = null;
let lastWanderTime = 0;

function startAnimation() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  function animate(ts) {
    if (ts - lastWanderTime > 3000) {
      lastWanderTime = ts;
      state.park.forEach(d => {
        if (Math.random() < 0.6) pickNewTarget(d);
      });
    }

    state.park.forEach((dino, i) => {
      const dx = dino.tx - dino.px;
      const dy = dino.ty - dino.py;
      if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
        dino.px += dx * 0.015;
        dino.py += dy * 0.015;
        const el = document.getElementById('parkDino_' + i);
        if (el) {
          el.style.left = dino.px + '%';
          el.style.top = dino.py + '%';
        }
      }
    });

    animFrameId = requestAnimationFrame(animate);
  }
  animFrameId = requestAnimationFrame(animate);
}
