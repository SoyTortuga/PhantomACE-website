// Remaining cooldown in live-seconds — 0 if never used or already ready.
function getCareCooldown(idx, type) {
  const lastUse = state.cooldowns[type + '_' + idx];
  if (lastUse === undefined) return 0;
  return Math.max(0, CARE_COOLDOWN_LIVE_SEC - ((state.liveSecAccum || 0) - lastUse));
}

function careAction(idx, type) {
  const dino = state.park[idx];
  const cdKey = type + '_' + idx;
  const liveNow = state.liveSecAccum || 0;
  const lastUse = state.cooldowns[cdKey];
  if (lastUse !== undefined && liveNow - lastUse < CARE_COOLDOWN_LIVE_SEC) return;
  state.cooldowns[cdKey] = liveNow;

  if (type === 'feed') dino.hunger = Math.min(100, dino.hunger + CARE_AMOUNT);
  if (type === 'water') dino.thirst = Math.min(100, dino.thirst + CARE_AMOUNT);
  if (type === 'play') dino.happiness = Math.min(100, dino.happiness + CARE_AMOUNT);
  if (type === 'wash') dino.hygiene = Math.min(100, (dino.hygiene || 0) + CARE_AMOUNT);
  if (type === 'graze') dino.stamina = Math.min(100, (dino.stamina || 0) + CARE_AMOUNT);

  const prevStage = getStage(dino);
  dino.careCount++;
  const newStage = getStage(dino);
  state.coins += 2;

  const name = () => dino.nickname || getRosterById(dino.speciesId).name;
  let leveled = awardDinoXp(dino, DINO_XP.care);

  if (newStage !== prevStage) {
    /* The stage bonus is awarded before the announcement so a care action
       that both grows and levels reports the level it ended on. */
    leveled = awardDinoXp(dino, newStage === 'juvenile' ? DINO_XP.stageJuvenile : DINO_XP.stageAdult) || leveled;
    showToast(`${getRosterById(dino.speciesId).name} grew to ${newStage}! 🎉`);
    state.coins += newStage === 'juvenile' ? 20 : 50;
    // Update emoji size
    const el = document.getElementById('parkDino_' + idx);
    if (el) {
      const emojiEl = el.querySelector('.park-dino-emoji');
      if (emojiEl) { emojiEl.className = `park-dino-emoji stage-${newStage} habitat-${getRosterById(dino.speciesId).habitat.toLowerCase()}`; }
    }
  }

  /* Announced after the stage toast, never instead of it — growing up and
     levelling can land on the same action and both are worth seeing. */
  if (leveled) showToast(`${name()} reached level ${leveled}! ⭐`);

  save();
  renderBottomPanel();
  updateTopBar();
}

const SELL_PRICES = { common: 10, uncommon: 25, rare: 50, epic: 100, legendary: 250 };
function getSellPrice(dino) {
  const spec = getRosterById(dino.speciesId);
  let price = SELL_PRICES[spec.rarity] || 10;
  if (dino.mutation) {
    const m = resolveSpeciesMut(dino.speciesId, dino.mutation);
    if (m) {
      const muts = getMutationsForSpecies(dino.speciesId);
      const found = muts.find(x => x.id === dino.mutation);
      if (found) { price += found.tier === 'rare' ? 50 : found.tier === 'special' ? 25 : 5; }
      else { price += 15; }
    }
  }
  const stage = getStage(dino);
  if (stage === 'juvenile') price = Math.round(price * 1.5);
  if (stage === 'adult') price *= 2;
  return price;
}

function sellDino(idx, source) {
  source = source || 'park';
  const session = getPlayerSession();
  if (!session) { showToast('Login with Twitch to sell on the marketplace.'); return; }
  const dino = (source === 'vault' ? state.vault : state.park)[idx];
  const spec = getRosterById(dino.speciesId);
  const suggested = getSellPrice(dino);
  const mutInfo = dino.mutation ? resolveSpeciesMut(dino.speciesId, dino.mutation) : null;
  const overlay = document.createElement('div');
  overlay.className = 'sell-overlay';
  overlay.id = 'sellOverlay';
  overlay.innerHTML = `
    <div class="sell-dialog">
      <div class="sell-dialog-title">List on Marketplace</div>
      <div class="sell-dialog-sprite">${spriteImg(spec.id, 64, 'sprite-img', dino.mutation)}</div>
      <div class="sell-dialog-info">
        ${dino.nickname || spec.name} · ${spec.rarity}${mutInfo ? ' · ' + mutInfo.label : ''} · ${getStage(dino)}
      </div>
      <div class="sell-dialog-price-row">
        <label>Price:</label>
        <input type="number" class="sell-dialog-price-input" id="sellPriceInput" value="${suggested}" min="1" max="99999">
        <span style="color:#ffaa00;font-size:11px;">coins</span>
      </div>
      <div class="sell-dialog-btns">
        <button class="sell-cancel" onclick="closeSellDialog()">Cancel</button>
        <button class="sell-confirm" onclick="confirmListDino(${idx},'${source}')">List for Sale</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('sellPriceInput').focus();
}

function closeSellDialog() {
  const overlay = document.getElementById('sellOverlay');
  if (overlay) overlay.remove();
}

async function confirmListDino(idx, source) {
  source = source || 'park';
  const arr = source === 'vault' ? state.vault : state.park;
  const priceInput = document.getElementById('sellPriceInput');
  const price = parseInt(priceInput.value);
  if (!price || price < 1) { showToast('Enter a valid price.'); return; }
  const dino = arr[idx];
  const spec = getRosterById(dino.speciesId);
  try {
    const res = await fetch('/api/marketplace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'list', dino: { speciesId: dino.speciesId, nickname: dino.nickname, mutation: dino.mutation, careCount: dino.careCount, xp: getDinoXp(dino) }, price }),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Failed to list.'); return; }
    const session = getPlayerSession();
    marketPendingAdds.set(data.id, {
      id: data.id,
      seller: { userId: session.user_id, displayName: session.display_name, profileImage: session.profile_image },
      dino: { speciesId: dino.speciesId, nickname: dino.nickname, mutation: dino.mutation || null, careCount: dino.careCount || 0, xp: getDinoXp(dino) },
      price, listedAt: Date.now(),
    });
    removeDinos([{ source, idx }]);
    save();
    closeSellDialog();
    renderParkWorld();
    renderBottomPanel();
    if (document.getElementById('tab-collection')?.classList.contains('active')) renderCollection();
    updateTopBar();
    showToast(`${spec.name} listed for ${price} coins!`);
  } catch (e) {
    showToast('Network error. Try again.');
  }
}

function getYardMoodBonus() {
  if (!state.yardItems || !state.yardItems.length) return 0;
  const raw = state.yardItems.reduce((s, it) => {
    const t = getYardType(it.type);
    return s + (t ? t.mood : 0);
  }, 0);
  // Diminishing returns so stacking cheap decor never trivialises care
  return Math.min(0.5, Math.sqrt(raw) * 0.055);
}

function isBlockedByYard(x, y, pad) {
  if (!state.yardItems) return false;
  return state.yardItems.some(it => {
    const t = getYardType(it.type);
    if (!t || !t.blocks) return false;
    return Math.hypot(x - it.x, y - it.y) < t.radius + (pad || 0);
  });
}

function toggleDecorateMode() {
  decorateMode = !decorateMode;
  if (!decorateMode) selectedYardType = null;
  document.body.classList.toggle('decorating', decorateMode);
  document.getElementById('decorateBtn').classList.toggle('active', decorateMode);
  document.getElementById('yardTray').classList.toggle('open', decorateMode);
  if (decorateMode) { selectedDinoIdx = -1; renderBottomPanel(); renderYardTray(); }
  renderParkWorld();
}

function renderYardTray() {
  const wrap = document.getElementById('yardTrayItems');
  const count = (state.yardItems || []).length;
  const full = count >= MAX_YARD_ITEMS;
  wrap.innerHTML = YARD_ITEM_TYPES.map(t => {
    const afford = state.coins >= t.cost;
    const dis = !afford || full;
    return `<button class="yard-item-btn${selectedYardType === t.id ? ' selected' : ''}" ${dis ? 'disabled' : ''}
        onclick="selectYardType('${t.id}')" title="${t.blocks ? 'Dinos walk around this' : 'Dinos can walk over this'} · +${t.mood} mood">
      <img src="${t.src}" width="26" height="26" alt="">
      <span class="yard-item-name">${t.name}</span>
      <span class="yard-item-cost">🪙 ${t.cost}</span>
    </button>`;
  }).join('');
  const hint = document.getElementById('yardTrayHint');
  hint.textContent = full
    ? `Yard full (${count}/${MAX_YARD_ITEMS}) — tap an item to sell it.`
    : selectedYardType
      ? `Tap the ground to place. Tap a placed item to sell it.`
      : `${count}/${MAX_YARD_ITEMS} placed · Pick an item, then tap the ground.`;
}

function selectYardType(id) {
  selectedYardType = selectedYardType === id ? null : id;
  renderYardTray();
}

function placeYardItem(x, y) {
  if (!selectedYardType) { showToast('Pick an item from the tray first.'); return; }
  const t = getYardType(selectedYardType);
  if (!t) return;
  if (!state.yardItems) state.yardItems = [];
  if (state.yardItems.length >= MAX_YARD_ITEMS) { showToast(`Yard is full (${MAX_YARD_ITEMS} items).`); return; }
  if (state.coins < t.cost) { showToast(`Not enough coins (need ${t.cost}).`); return; }
  if (!isSolidGround(x, y)) { showToast('Place items on dry land.'); return; }
  if (state.yardItems.some(it => Math.hypot(x - it.x, y - it.y) < 5)) { showToast('Too close to another item.'); return; }

  state.coins -= t.cost;
  state.yardItems.push({ id: 'y' + Date.now() + '_' + Math.floor(Math.random() * 1000), type: t.id, x, y });
  save();
  updateTopBar();
  renderYardTray();
  renderParkWorld();
  showToast(`${t.name} placed! +${t.mood} mood`);
}

function sellYardItem(itemId) {
  const idx = (state.yardItems || []).findIndex(it => it.id === itemId);
  if (idx < 0) return;
  const t = getYardType(state.yardItems[idx].type);
  const refund = t ? Math.floor(t.cost * YARD_REFUND_PCT) : 0;
  const el = document.querySelector(`[data-yard="${itemId}"]`);
  if (el) { el.classList.add('removing'); setTimeout(() => el.remove(), 200); }
  state.yardItems.splice(idx, 1);
  state.coins += refund;
  save();
  updateTopBar();
  renderYardTray();
  setTimeout(() => renderParkWorld(), 210);
  showToast(`Sold for ${refund} coins.`);
}

/* ======================== CLEANING / DEBRIS SYSTEM ======================== */
const DEBRIS_TYPES = [
  { type: 'rock', src: IC+'environment_terrain/rock_formation.png' },
  { type: 'weed', src: IC+'prehistoric_plants/giant_fern.png' },
  { type: 'bone', src: IC+'fossils_bones/bone_fragment.png' },
  { type: 'rock', src: IC+'environment_terrain/rocky_cliff.png' },
  { type: 'weed', src: IC+'prehistoric_plants/moss_mound.png' },
  { type: 'bone', src: IC+'fossils_bones/dinosaur_skull.png' },
];

function getMaxEnergy() { return 10 + (state.subTier || 0) * 2; }
// Base 3 slots, +3 per subscription tier (tier 3 = 12 total).
function getMaxIncubatorSlots() { return 3 + (state.subTier || 0) * 3; }

const MAX_DEBRIS = 14;
const OVERGROWTH_INTERVAL_SEC = 420; // one new patch roughly every 7 minutes

// Find a clear spot on solid ground, away from water and placed decor
function findOpenSpot(minGap) {
  for (let i = 0; i < 24; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    if (!isSolidGround(x, y)) continue;
    if (isBlockedByYard(x, y, 2)) continue;
    if ((state.debris || []).some(d => Math.hypot(x - d.x, y - d.y) < (minGap || 5))) continue;
    return { x, y };
  }
  return null;
}

function addDebris(n) {
  if (!state.debris) state.debris = [];
  let added = 0;
  for (let i = 0; i < n && state.debris.length < MAX_DEBRIS; i++) {
    const spot = findOpenSpot(5);
    if (!spot) break;
    const dt = DEBRIS_TYPES[Math.floor(Math.random() * DEBRIS_TYPES.length)];
    state.debris.push({ id: Date.now() + '_' + Math.floor(Math.random()*1e4), type: dt.type, src: dt.src, x: spot.x, y: spot.y });
    added++;
  }
  return added;
}

// Stream events dump a big batch of overgrowth and refill energy
function spawnDebris() {
  state.debris = [];
  addDebris(6 + Math.floor(Math.random() * 7));
  state.energy = getMaxEnergy();
  state.lastDebrisSpawn = Date.now();
  save();
}

// Between events the yard slowly reclaims itself, one patch at a time
function growOvergrowth() {
  if (!state.lastOvergrowth) { state.lastOvergrowth = Date.now(); return; }
  const elapsed = (Date.now() - state.lastOvergrowth) / 1000;
  if (elapsed < OVERGROWTH_INTERVAL_SEC) return;
  const due = Math.min(4, Math.floor(elapsed / OVERGROWTH_INTERVAL_SEC));
  state.lastOvergrowth = Date.now();
  if ((state.debris || []).length >= MAX_DEBRIS) return;
  const added = addDebris(due);
  if (!added) return;
  // A neglected yard costs the herd some mood
  state.park.forEach(d => { ensureDinoStats(d); d.happiness = Math.max(0, d.happiness - added * 0.5); });
  state.energy = Math.max(state.energy, Math.min(getMaxEnergy(), state.energy + added));
  save();
  const active = document.querySelector('.tab-content.active');
  if (active && active.id === 'tab-park') { renderParkWorld(); updateEnergyBar(); }
}

function clearDebris(debrisId) {
  if (state.energy <= 0) { showToast('No energy! Refill for 25 coins.'); return; }
  const idx = state.debris.findIndex(d => d.id === debrisId);
  if (idx < 0) return;
  const el = document.querySelector(`[data-debris="${debrisId}"]`);
  if (el) { el.classList.add('clearing'); setTimeout(() => el.remove(), 200); }
  state.debris.splice(idx, 1);
  state.energy--;
  state.coins += 2;
  save();
  updateTopBar();
  updateEnergyBar();
  showToast('+2 coins!');
}

function refillEnergy() {
  if (state.coins < 25) { showToast('Not enough coins (need 25).'); return; }
  state.coins -= 25;
  state.energy = getMaxEnergy();
  save();
  updateTopBar();
  updateEnergyBar();
  showToast('Energy refilled!');
}

function updateEnergyBar() {
  const bar = document.getElementById('parkEnergy');
  const hasDebris = state.debris && state.debris.length > 0;
  bar.style.display = hasDebris ? 'flex' : 'none';
  if (!hasDebris) return;
  const max = getMaxEnergy();
  const pct = Math.round((state.energy / max) * 100);
  document.getElementById('energyFill').style.width = pct + '%';
  document.getElementById('energyText').textContent = state.energy + '/' + max;
  const btn = document.getElementById('energyRefill');
  btn.disabled = state.coins < 25 || state.energy >= max;
}

/* ======================== AUTH / SESSION ======================== */
/* Delegates to js/session-read.js. This used to parse the cookie itself and
   broke the moment the cookie was signed — the player looked logged out, the
   sub tier fell to 0 (3 incubator slots instead of 6) and cloud saves
   silently stopped, because save() only pushes to the server when it thinks
   someone is signed in. */
function getPlayerSession() {
  return typeof readPhamSession === 'function' ? readPhamSession() : null;
}

/* The broadcaster counts as tier 3, matching getSubTier() in
   functions/api/phamily-time.js. This mapping had diverged from that one and
   left the broadcaster on subTier 0 — the base 3 incubator slots rather than
   12, despite outranking every subscriber everywhere else on the site. */
function applySubTierFromSession(session) {
  /* The session carries subTier as its own field now. Deriving it from
     `role` meant a moderator who subscribes resolved to 0 — three incubator
     slots and 10 energy instead of six and 12 — because moderator outranks
     every sub tier on the display ladder and overwrote it.

     The role branches remain as a fallback for cookies issued before the
     field existed; /api/auth/recheck-roles reissues those on the next page
     load that calls it. */
  if (session && typeof session.subTier === 'number') { state.subTier = session.subTier; return; }
  if (session?.role === 'sub_tier1') state.subTier = 1;
  else if (session?.role === 'sub_tier2') state.subTier = 2;
  else if (session?.role === 'sub_tier3' || session?.role === 'broadcaster') state.subTier = 3;
  else state.subTier = 0;
}

function initAuth() {
  const session = getPlayerSession();
  applySubTierFromSession(session);
  if (session) claimEarnings();
}

async function claimEarnings() {
  try {
    const res = await fetch('/api/marketplace?action=earnings');
    if (!res.ok) return;
    const data = await res.json();
    if (data.coins > 0) {
      state.coins += data.coins;
      save();
      updateTopBar();
      showToast(`Marketplace earnings: +${data.coins} coins from ${data.sales.length} sale(s)!`);
    }
  } catch {}
}

/* ======================== MARKETPLACE TAB ======================== */
let marketListings = [];
let marketMyListings = [];

// Cloudflare KV's list() (which /api/marketplace's GET is built on) is only
// eventually consistent — a listing just created/bought/cancelled can take
// up to ~60s to be reflected in a fresh list() call. These two maps patch
// the locally-known truth over whatever the server returns in the meantime,
// so the player's own actions never appear to silently fail or not "stick".
let marketPendingAdds = new Map();    // listingId -> listing object (mine, just created)
let marketPendingRemoves = new Set(); // listingId -> just bought/cancelled, hide even if server still lists it

function reconcileListings(freshList) {
  let list = freshList.filter(l => !marketPendingRemoves.has(l.id));
  for (const id of Array.from(marketPendingRemoves)) {
    if (!freshList.some(l => l.id === id)) marketPendingRemoves.delete(id); // server caught up
  }
  for (const [id, listing] of Array.from(marketPendingAdds)) {
    if (freshList.some(l => l.id === id)) marketPendingAdds.delete(id); // server caught up
    else list = [listing, ...list];
  }
  return list;
}

async function fetchMarketplace() {
  try {
    const res = await fetch('/api/marketplace');
    if (res.ok) marketListings = reconcileListings(await res.json());
    // non-ok: keep the last-known-good list rather than blanking the market
  } catch { /* network hiccup — keep showing the last-known-good list */ }
}

async function fetchMyListings() {
  try {
    const res = await fetch('/api/marketplace?action=my-listings');
    if (res.ok) marketMyListings = reconcileListings(await res.json());
  } catch { /* network hiccup — keep showing the last-known-good list */ }
}

async function renderMarketplace() {
  const container = document.getElementById('marketContent');
  const session = getPlayerSession();

  if (!session) {
    const returnTo = encodeURIComponent('/games/dino-park/');
    container.innerHTML = `
      <div class="market-login">
        <div style="font-size:32px;margin-bottom:12px;">🏪</div>
        <div style="font-size:14px;color:#fff;margin-bottom:6px;">Dino Marketplace</div>
        <div style="font-size:11px;color:#fff;margin-bottom:16px;">Buy and sell dinosaurs with other players.<br>Login with Twitch to get started.</div>
        <a href="/api/auth/twitch?return_to=${returnTo}" class="market-login-btn">Login with Twitch</a>
      </div>`;
    return;
  }

  if (!container.dataset.loadedOnce) container.innerHTML = '<div class="market-empty">Loading marketplace...</div>';
  await Promise.all([fetchMarketplace(), fetchMyListings()]);
  container.dataset.loadedOnce = '1';

  const otherListings = marketListings.filter(l => l.seller.userId !== session.user_id);

  let html = '';

  if (marketMyListings.length > 0) {
    html += '<div class="market-section-title">Your Listings</div><div class="market-grid">';
    marketMyListings.forEach(l => {
      const spec = getRosterById(l.dino.speciesId);
      if (!spec) return;
      const mutInfo = l.dino.mutation ? resolveSpeciesMut(l.dino.speciesId, l.dino.mutation) : null;
      html += `
        <div class="market-card">
          <div class="market-card-sprite">${spriteImg(spec.id, 48, 'sprite-img', l.dino.mutation)}</div>
          <div class="market-card-name">${l.dino.nickname || spec.name}</div>
          <div class="market-card-meta">
            <span class="rarity-chip rarity-${spec.rarity}">${spec.rarity}</span>
            ${mutInfo ? `<div class="market-mut-badge">✨ ${mutInfo.label}</div>` : ''}
          </div>
          <div class="market-card-price">${l.price} coins</div>
          <button class="market-card-cancel" onclick="cancelListing('${l.id}')">Cancel Listing</button>
        </div>`;
    });
    html += '</div>';
  }

  html += '<div class="market-section-title">Available Dinos</div>';
  if (otherListings.length === 0) {
    html += '<div class="market-empty">No dinos available right now. Check back later!</div>';
  } else {
    html += '<div class="market-grid">';
    otherListings.forEach(l => {
      const spec = getRosterById(l.dino.speciesId);
      if (!spec) return;
      const mutInfo = l.dino.mutation ? resolveSpeciesMut(l.dino.speciesId, l.dino.mutation) : null;
      const canAfford = state.coins >= l.price;
      const allFull = state.park.length >= MAX_ACTIVE_PARK && state.vault.length >= MAX_VAULT_SIZE;
      html += `
        <div class="market-card">
          <div class="market-card-sprite">${spriteImg(spec.id, 48, 'sprite-img', l.dino.mutation)}</div>
          <div class="market-card-name">${l.dino.nickname || spec.name}</div>
          <div class="market-card-meta">
            <span class="rarity-chip rarity-${spec.rarity}">${spec.rarity}</span>
            ${mutInfo ? `<div class="market-mut-badge">✨ ${mutInfo.label}</div>` : ''}
          </div>
          <div class="market-card-seller">from ${l.seller.displayName}</div>
          <div class="market-card-price">${l.price} coins</div>
          <button class="market-card-buy" onclick="buyDino('${l.id}')" ${!canAfford || allFull ? 'disabled' : ''}>
            ${allFull ? 'Park & Vault Full' : !canAfford ? 'Not Enough Coins' : 'Buy'}
          </button>
        </div>`;
    });
    html += '</div>';
  }

  container.innerHTML = html;
}

async function buyDino(listingId) {
  const listing = marketListings.find(l => l.id === listingId);
  if (!listing) return;
  const spec = getRosterById(listing.dino.speciesId);
  if (!spec) return;
  if (state.coins < listing.price) { showToast('Not enough coins.'); return; }
  if (state.park.length >= MAX_ACTIVE_PARK && state.vault.length >= MAX_VAULT_SIZE) { showToast('Park and vault are both full!'); return; }
  if (!confirm(`Buy ${listing.dino.nickname || spec.name} for ${listing.price} coins?`)) return;

  try {
    const res = await fetch('/api/marketplace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'buy', listingId }),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Purchase failed.'); return; }

    marketPendingRemoves.add(listingId);
    state.coins -= data.price;
    const newDino = {
      speciesId: data.dino.speciesId,
      nickname: data.dino.nickname || '',
      mutation: data.dino.mutation || null,
      careCount: data.dino.careCount || 0,
      xp: data.dino.xp || 0,
      hunger: 80, thirst: 80, happiness: 80, hygiene: 80, stamina: 80,
    };
    const dest = addNewDino(newDino);
    if (!state.discovered.includes(data.dino.speciesId)) state.discovered.push(data.dino.speciesId);
    if (data.dino.mutation) {
      const mk = data.dino.speciesId + '_' + data.dino.mutation;
      if (!state.discoveredMutations.includes(mk)) state.discoveredMutations.push(mk);
    }
    save();
    updateTopBar();
    showToast(`Adopted ${spec.name}!${dest === 'vault' ? ' (park full — sent to your Dino Vault)' : ''}`);
    renderMarketplace();
  } catch (e) {
    showToast('Network error. Try again.');
  }
}

async function cancelListing(listingId) {
  if (!confirm('Cancel this listing? The dino will return to your park.')) return;
  try {
    const res = await fetch('/api/marketplace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'cancel', listingId }),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Cancel failed.'); return; }
    marketPendingRemoves.add(listingId);
    marketPendingAdds.delete(listingId);
    const newDino = {
      speciesId: data.dino.speciesId,
      nickname: data.dino.nickname || '',
      mutation: data.dino.mutation || null,
      careCount: data.dino.careCount || 0,
      xp: data.dino.xp || 0,
      hunger: 80, thirst: 80, happiness: 80, hygiene: 80, stamina: 80,
    };
    const dest = addNewDino(newDino);
    save();
    updateTopBar();
    showToast(dest === 'vault' ? 'Listing cancelled. Park was full — dino sent to your Dino Vault.'
      : dest === 'park' ? 'Listing cancelled. Dino returned to park.'
      : 'Listing cancelled, but park and vault are both full — contact support.');
    renderMarketplace();
  } catch (e) {
    showToast('Network error. Try again.');
  }
}

/* ======================== EGGS TAB ======================== */
const DAILY_DIG_COOLDOWN = 24 * 60 * 60 * 1000;
const EVENT_MIN_INTERVAL = 15 * 60 * 1000;
const EVENT_MAX_INTERVAL = 45 * 60 * 1000;
const EVENT_DURATION = 3 * 60 * 1000;

const RANDOM_EVENTS = [
  { id:'meteor', name:'Meteor Shower!', icon:'☄️', desc:'A meteor crashed nearby — a rare fossil is exposed!',
    weights:{ common:20, uncommon:35, rare:30, epic:12, legendary:3 }},
  { id:'tremor', name:'Ground Tremor!', icon:'🌋', desc:'An earthquake revealed a buried nest of eggs!',
    weights:{ common:40, uncommon:30, rare:20, epic:8, legendary:2 }},
  { id:'tide', name:'Ancient Tide Pool!', icon:'🌊', desc:'The tide receded, exposing a fossilized clutch!',
    weights:{ common:30, uncommon:30, rare:25, epic:12, legendary:3 }},
  { id:'amber', name:'Amber Discovery!', icon:'🟡', desc:'Perfectly preserved amber — something is inside...',
    weights:{ common:10, uncommon:25, rare:35, epic:20, legendary:10 }},
  { id:'aurora', name:'Prehistoric Aurora!', icon:'🌌', desc:'A strange aurora fills the sky... legendary energy!',
    weights:{ common:5, uncommon:15, rare:30, epic:30, legendary:20 }},
];

const VALID_CODES = {
  'PHAMFOSSIL': { weights:{ common:30, uncommon:35, rare:25, epic:8, legendary:2 }, uses: 1 },
  'PHANTOMACE': { weights:{ common:20, uncommon:30, rare:30, epic:15, legendary:5 }, uses: 1 },
  'DINOTIME': { weights:{ common:40, uncommon:30, rare:20, epic:8, legendary:2 }, uses: 1 },
  'LEGENDARY': { weights:{ common:0, uncommon:10, rare:30, epic:35, legendary:25 }, uses: 1 },
  'RAPTORPACK': { weights:{ common:15, uncommon:35, rare:30, epic:15, legendary:5 }, uses: 1 },
};

function initEggEvents() {
  if (!state.usedCodes) state.usedCodes = [];
  if (!state.lastDailyDig) state.lastDailyDig = 0;
  if (!state.nextEventAt) scheduleNextEvent();
  if (!state.activeEvent) state.activeEvent = null;
}

function scheduleNextEvent() {
  const delay = EVENT_MIN_INTERVAL + Math.random() * (EVENT_MAX_INTERVAL - EVENT_MIN_INTERVAL);
  state.nextEventAt = Date.now() + delay;
}

function checkForEvent() {
  const now = Date.now();
  if (state.activeEvent) {
    if (now > state.activeEvent.expiresAt) {
      state.activeEvent = null;
      scheduleNextEvent();
    }
    return;
  }
  if (state.nextEventAt && now >= state.nextEventAt) {
    const evt = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
    state.activeEvent = {
      ...evt,
      expiresAt: now + EVENT_DURATION,
      claimed: false
    };
    state.nextEventAt = null;
    showToast(`${evt.icon} ${evt.name} Check the Eggs tab!`);
  }
}

/* Every in-game egg source funnels through here. A full incubator no longer
   throws the egg away: it goes to Egg Storage and waits.

   Storage lives in the player's OWN save rather than the server inventory,
   which is where redeemed-code eggs overflow to. That is deliberate. These
   eggs are rolled by the client — it picks the rarity and the species — so
   routing them through /api/inventory would mean that endpoint has to accept
   client-minted items, and anyone could then mint themselves legendaries.
   Keeping them in the save is exactly as trustworthy as the status quo,
   since the client already pushes straight into state.eggs.

   Returns 'incubator' or 'storage' so callers can word their own message. */
function acquireEgg(speciesId, rarity, opts = {}) {
  if (!Array.isArray(state.eggStorage)) state.eggStorage = [];
  const egg = { speciesId, hatchTime: HATCH_TIMES[rarity], elapsed: 0 };
  if (opts.guaranteedMutation) egg.guaranteedMutation = true;

  if (state.eggs.length < getMaxIncubatorSlots()) {
    state.eggs.push(egg);
    return 'incubator';
  }
  // rarity is kept alongside so the storage list can label it without
  // having to look the species back up.
  state.eggStorage.push({ ...egg, rarity });
  return 'storage';
}

/* Move one stored egg into a free incubator slot. */
function moveStoredEggToIncubator(idx) {
  if (!Array.isArray(state.eggStorage)) return;
  if (state.eggs.length >= getMaxIncubatorSlots()) {
    showToast(`Incubator full! (max ${getMaxIncubatorSlots()} eggs)`);
    return;
  }
  const taken = state.eggStorage.splice(idx, 1)[0];
  if (!taken) return;
  const { rarity, ...egg } = taken;
  egg.elapsed = 0;   // incubation starts now, not when it was found
  state.eggs.push(egg);
  save(); updateTopBar(); renderEggsTab();
  showToast(`${(rarity || 'common')} egg moved into the incubator!`);
}

function claimEvent() {
  if (!state.activeEvent || state.activeEvent.claimed) return;
  const rarity = rollRarity(state.activeEvent.weights);
  const species = rollSpecies(rarity);
  const where = acquireEgg(species.id, rarity);
  state.activeEvent.claimed = true;
  save(); updateTopBar(); renderEggsTab();
  showToast(where === 'storage'
    ? `${state.activeEvent.icon} Found a ${rarity} egg — incubator full, sent to Egg Storage!`
    : `${state.activeEvent.icon} Found a ${rarity} egg from the event!`);
}

function dailyDig() {
  const now = Date.now();
  if (now - state.lastDailyDig < DAILY_DIG_COOLDOWN) return;
  state.lastDailyDig = now;
  const weights = { common:50, uncommon:30, rare:15, epic:4, legendary:1 };
  const rarity = rollRarity(weights);
  const species = rollSpecies(rarity);
  const where = acquireEgg(species.id, rarity);

  /* ONE random resident, not the whole park. A dig that paid everyone
     would move every dino by the same amount every day, which is how a
     roster ends up levelling in lockstep — the thing this system exists to
     avoid. Crediting one animal is also the more characterful reading:
     something came digging with you. */
  const helpers = state.park;
  if (helpers.length) {
    const helper = helpers[Math.floor(Math.random() * helpers.length)];
    ensureDinoStats(helper);
    const lv = awardDinoXp(helper, DINO_XP.dig);
    const hname = helper.nickname || getRosterById(helper.speciesId).name;
    if (lv) setTimeout(() => showToast(`${hname} helped dig and reached level ${lv}! ⭐`), 2600);
    else setTimeout(() => showToast(`${hname} helped with the dig — +${DINO_XP.dig} XP`), 2600);
  }

  save(); updateTopBar(); renderEggsTab();
  showToast(where === 'storage'
    ? `Daily dig found a ${rarity} egg — incubator full, sent to Egg Storage! 🥚`
    : `Daily dig found a ${rarity} egg! 🥚`);
}

function redeemCode() {
  const input = document.getElementById('redeemInput');
  const code = input.value.trim().toUpperCase();
  if (!code) return;
  if (state.usedCodes.includes(code)) { showToast('Code already redeemed!'); input.value = ''; return; }
  const codeData = VALID_CODES[code];
  if (!codeData) { showToast('Invalid code.'); input.value = ''; return; }
  state.usedCodes.push(code);
  const rarity = rollRarity(codeData.weights);
  const species = rollSpecies(rarity);
  const where = acquireEgg(species.id, rarity);
  input.value = '';
  save(); updateTopBar(); renderEggsTab();
  showToast(where === 'storage'
    ? `Code redeemed! A ${rarity} egg is waiting in Egg Storage! 🎁`
    : `Code redeemed! Found a ${rarity} egg! 🎁`);
}

function fmtTime(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
  if (h > 0) return `${h}h ${String(m).padStart(2,'0')}m`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function renderIncubator() {
  const slots = [];
  state.eggs.forEach((egg, i) => {
    const spec = getRosterById(egg.speciesId);
    const progress = Math.min(1, egg.elapsed / egg.hatchTime);
    const ready = progress >= 1;
    const rem = Math.max(0, egg.hatchTime - egg.elapsed);
    const liveTag = isStreamLive
      ? '<div style="font-size:8px;color:#2ecc71;margin-top:3px;">● LIVE — Incubating</div>'
      : '<div style="font-size:8px;color:#fff;margin-top:3px;">○ Stream offline — Paused</div>';
    const eggSrc = ready ? EGG_ASSETS.hatching : (EGG_ASSETS[spec.rarity] || EGG_ASSETS.common);
    slots.push(`<div class="egg-slot"><div class="egg-emoji"><img src="${eggSrc}" width="40" height="40" style="image-rendering:pixelated;" alt=""></div>
      <div class="egg-name">${spec.rarity.charAt(0).toUpperCase()+spec.rarity.slice(1)} Egg</div>
      ${ready?`<button class="egg-hatch-btn" onclick="hatchEgg(${i})">HATCH!</button>`
      :`<div class="egg-timer">${fmtTime(rem)}</div>
        <div class="egg-progress"><div class="egg-progress-fill" style="width:${progress*100}%"></div></div>
        ${liveTag}
        ${egg.speedUpUsed
          ? '<div style="font-size:8px;color:#fff;margin-top:4px;">Already sped up</div>'
          : `<button class="egg-speedup-btn" onclick="speedUpEgg(${i})" ${state.coins < EGG_SPEEDUP_COST ? 'disabled' : ''} title="Cut remaining time in half — once per egg">⚡ ${EGG_SPEEDUP_COST}</button>`}`}
    </div>`);
  });
  while (slots.length < getMaxIncubatorSlots()) slots.push('<div class="egg-slot empty"><img src="'+IC+'baby_eggs/empty_egg_shell.png" width="32" height="32" style="image-rendering:pixelated;opacity:0.3;" alt=""><div style="margin-top:4px;">Empty Slot</div></div>');
  document.getElementById('incubatorGrid').innerHTML = slots.join('');
}

function hatchEgg(idx) {
  if (idx >= state.eggs.length) return;
  const egg = state.eggs[idx];
  if (egg.elapsed < egg.hatchTime) return;
  if (state.park.length >= MAX_ACTIVE_PARK && state.vault.length >= MAX_VAULT_SIZE) { showToast('Park and vault are both full!'); return; }
  const spec = getRosterById(egg.speciesId);
  const mut = egg.guaranteedMutation ? rollMutationGuaranteed(spec.id) : rollMutation(spec.id);
  const newDino = { speciesId: spec.id, nickname:'', hunger:80, thirst:80, happiness:80, hygiene:80, stamina:80, careCount:0, mutation: mut, xp: 0 };
  const dest = addNewDino(newDino);
  if (!state.discovered.includes(spec.id)) state.discovered.push(spec.id);
  if (mut) { const mk=spec.id+'_'+mut; if(!state.discoveredMutations)state.discoveredMutations=[]; if(!state.discoveredMutations.includes(mk))state.discoveredMutations.push(mk); }
  state.eggs.splice(idx, 1);
  save(); updateTopBar(); renderEggsTab();

  document.getElementById('hatchEmoji').innerHTML = spriteImg(spec.id, 96, 'sprite-img', newDino.mutation);
  document.getElementById('hatchName').textContent = spec.name;
  const mutInfo = newDino.mutation ? resolveSpeciesMut(spec.id, newDino.mutation) : null;
  document.getElementById('hatchRarity').textContent = spec.rarity + (mutInfo ? ' · ' + mutInfo.label + ' Mutation' : '');
  document.getElementById('hatchRarity').style.color = mutInfo ? '#ff0000' : RARITY_COLORS[spec.rarity];
  document.getElementById('hatchDesc').textContent = spec.desc + (dest === 'vault' ? ' (Park is full — sent to your Dino Vault.)' : '');
  document.getElementById('hatchOverlay').classList.add('show');
}

function speedUpEgg(idx) {
  const egg = state.eggs[idx];
  if (!egg || egg.elapsed >= egg.hatchTime) return;
  if (egg.speedUpUsed) { showToast('Already sped up — only once per egg.'); return; }
  if (state.coins < EGG_SPEEDUP_COST) { showToast(`Not enough coins (need ${EGG_SPEEDUP_COST}).`); return; }
  state.coins -= EGG_SPEEDUP_COST;
  egg.elapsed += (egg.hatchTime - egg.elapsed) / 2;
  egg.speedUpUsed = true;
  save();
  updateTopBar();
  renderIncubator();
  showToast(egg.elapsed >= egg.hatchTime ? 'Egg is ready to hatch!' : 'Incubation time halved!');
}

function closeHatch() {

}

let collSelectedIdx = -1;
let collViewMode = 'park'; // 'park' (active, growing/decaying) | 'vault' (stored, frozen)

function collArray() { return collViewMode === 'vault' ? state.vault : state.park; }

function setCollViewMode(mode) {

/* ── Trade-up: selection state and the exchange itself ──────────────── */
let tradeUpTrack = null;      /* null | 'plain' | 'mutated' */
let tradeUpPicks = [];        /* [{source, idx}] */

function setTradeUpTrack(track) {
  tradeUpTrack = track;
  const layout = document.querySelector('.coll-layout');
  if (layout) layout.classList.toggle('trading', !!track);
  tradeUpPicks = [];
  collSelectedIdx = -1;
  renderCollection();
}

function tradeUpPickedRarity() {
  if (!tradeUpPicks.length) return null;
  const e = tradeUpEntries().find(x => x.source === tradeUpPicks[0].source && x.idx === tradeUpPicks[0].idx);
  return e ? getRosterById(e.dino.speciesId).rarity : null;
}

/* The render dims what cannot be picked, but the RULE LIVES HERE, because
   a dimmed card is a drawing and this is the thing that changes state. With
   the check only in the render, a stale card or a direct call could put a
   rare in among four commons, reach five, and light up a Trade Up button
   that performTradeUp would then refuse -- a dead end offered to the
   player. */
function toggleTradeUpPick(source, idx) {
  const at = tradeUpPicks.findIndex(p => p.source === source && p.idx === idx);
  if (at >= 0) { tradeUpPicks.splice(at, 1); renderCollection(); return; }
  if (tradeUpPicks.length >= TRADE_UP_COST) { showToast(`Pick ${TRADE_UP_COST}.`); return; }

  const entry = tradeUpEntries().find(e => e.source === source && e.idx === idx);
  if (!entry) return;
  if (!tradeUpEligible(entry.dino, tradeUpTrack)) {
    showToast(tradeUpTrack === 'mutated' ? 'That one is not mutated.' : 'That one is mutated.');
    return;
  }
  const want = tradeUpPickedRarity();
  const got = getRosterById(entry.dino.speciesId).rarity;
  if (want && got !== want) { showToast(`Pick ${TRADE_UP_COST} of the same rarity.`); return; }

  tradeUpPicks.push({ source, idx });
  renderCollection();
}

function confirmTradeUpDialog() {
  if (tradeUpPicks.length !== TRADE_UP_COST) return;
  const from = tradeUpPickedRarity();
  const to = tradeUpRarity(from);
  const mutated = tradeUpTrack === 'mutated';
  /* IRREVERSIBLE AND EXPENSIVE, so it is spelled out rather than confirmed
     with a bare "are you sure": five named dinosaurs are about to stop
     existing, and the result is random. */
  const entries = tradeUpEntries();
  const names = tradeUpPicks.map(p => {
    const e = entries.find(x => x.source === p.source && x.idx === p.idx);
    const spec = getRosterById(e.dino.speciesId);
    return (e.dino.nickname || spec.name);
  });
  const overlay = document.createElement('div');
  overlay.className = 'sell-overlay';
  overlay.id = 'tradeUpOverlay';
  overlay.innerHTML = `
    <div class="sell-dialog">
      <div class="sell-dialog-title">Trade Up</div>
      <div class="sell-dialog-info" style="line-height:1.6">
        <span style="color:${RARITY_COLORS[from]}">${TRADE_UP_COST} ${from}</span>
        &rarr;
        <span style="color:${RARITY_COLORS[to]}">1 random ${to}</span>${mutated || to === from ? ', mutated' : ''}
      </div>
      <div class="trade-consume">${names.map(n => `<div>${n}</div>`).join('')}</div>
      <div class="sell-dialog-info" style="color:#ff6666">These five are consumed. This cannot be undone.</div>
      <div class="sell-dialog-btns">
        <button class="sell-cancel" onclick="closeTradeUpDialog()">Cancel</button>
        <button class="sell-confirm" onclick="performTradeUp()">Trade Up</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function closeTradeUpDialog() {
  const o = document.getElementById('tradeUpOverlay');
  if (o) o.remove();
}

function performTradeUp() {
  closeTradeUpDialog();
  if (tradeUpPicks.length !== TRADE_UP_COST) return;

  /* Re-resolved and re-validated against live state rather than trusting
     what the UI collected: a rendered index is a claim about an array that
     a background tick may have changed under it. */
  const entries = tradeUpEntries();
  const picked = tradeUpPicks.map(p => entries.find(x => x.source === p.source && x.idx === p.idx));
  if (picked.some(e => !e)) { setTradeUpTrack(tradeUpTrack); showToast('Selection went stale — pick again.'); return; }

  const rarities = picked.map(e => getRosterById(e.dino.speciesId).rarity);
  const from = rarities[0];
  if (rarities.some(r => r !== from) || picked.some(e => !tradeUpEligible(e.dino, tradeUpTrack))) {
    setTradeUpTrack(tradeUpTrack); showToast('Those five no longer match.'); return;
  }

  const to = tradeUpRarity(from);
  const pool = ROSTER.filter(r => r.rarity === to);
  if (!pool.length) { showToast('Nothing to trade into.'); return; }
  const spec = pool[Math.floor(Math.random() * pool.length)];

  /* The mutated track always mutates, weighted rare. The plain track
     normally does not -- except at legendary, where there is no tier to
     climb and the guaranteed mutation IS the reward, at the ordinary
     relative odds. */
  const mutation = tradeUpTrack === 'mutated' ? rollMutationTradeUp(spec.id)
                 : (to === from ? rollMutationGuaranteed(spec.id) : null);

  removeDinos(tradeUpPicks);
  tradeUpPicks = [];

  const newDino = { speciesId: spec.id, nickname: '', hunger: 80, thirst: 80, happiness: 80,
                    hygiene: 80, stamina: 80, careCount: 0, mutation, xp: 0 };
  const dest = addNewDino(newDino);

  if (!state.discovered.includes(spec.id)) state.discovered.push(spec.id);
  if (mutation) {
    const mk = spec.id + '_' + mutation;
    if (!state.discoveredMutations) state.discoveredMutations = [];
    if (!state.discoveredMutations.includes(mk)) state.discoveredMutations.push(mk);
  }

  save();
  renderParkWorld();
  renderBottomPanel();
  renderCollection();
  updateTopBar();
  const mutInfo = mutation ? resolveSpeciesMut(spec.id, mutation) : null;
  showToast(`${spec.name}${mutInfo ? ' · ' + mutInfo.label : ''} — ${dest === 'vault' ? 'sent to the vault' : 'added to the park'}!`);
}

function renderCollList() {
  const list = document.getElementById('collList');
  const arr = collArray();
  const layout = document.querySelector('.coll-layout');
  if (layout) layout.classList.toggle('trading', !!tradeUpTrack);
  if (tradeUpTrack) { renderTradeUpList(list); return; }
  const toggle = `<div class="coll-view-toggle">
    <button class="${collViewMode==='park'?'active':''}" onclick="setCollViewMode('park')">Park (${state.park.length}/${MAX_ACTIVE_PARK})</button>
    <button class="${collViewMode==='vault'?'active':''}" onclick="setCollViewMode('vault')">Vault (${state.vault.length}/${MAX_VAULT_SIZE})</button>
  </div>
  <button class="trade-open" onclick="setTradeUpTrack('plain')">&#9650; Trade Up</button>`;
  if (arr.length === 0) {
    list.innerHTML = toggle + `<div style="color:#333;font-size:10px;text-align:center;padding:20px;">${collViewMode==='vault' ? 'Vault is empty' : 'No dinosaurs yet'}</div>`;
    return;
  }
  list.innerHTML = toggle + arr.map((dino, i) => {
    const spec = getRosterById(dino.speciesId);
    const stage = getStage(dino);
    const hPct = Math.max(0, dino.hunger / 100);
    const tPct = Math.max(0, dino.thirst / 100);
    const hpPct = Math.max(0, dino.happiness / 100);
    const hCol = hPct > 0.3 ? '#e67e22' : '#ff0000';
    const tCol = tPct > 0.3 ? '#3498db' : '#ff0000';
    const hpCol = hpPct > 0.3 ? '#2ecc71' : '#ff0000';
    return `<div class="coll-card rarity-${spec.rarity} ${i===collSelectedIdx?'selected':''}" onclick="collSelectedIdx=${i};renderCollection();">
      <div class="coll-card-sprite">${spriteImg(spec.id, 48, 'sprite-img')}</div>
      <div class="coll-card-name">${dino.nickname || spec.name}</div>
      <div class="coll-card-level">Lv ${getDinoLevel(d)} · ${stage}</div>
      <div class="coll-card-bars">
        <div style="background:${hCol};opacity:${hPct}"></div>
        <div style="background:${tCol};opacity:${tPct}"></div>
        <div style="background:${hpCol};opacity:${hpPct}"></div>
      </div>
    </div>`;
  }).join('');
}

/* The trade-up list shows park AND vault together, which the ordinary
   Collection list deliberately does not: picking five of a rarity is a
   question about the whole collection, and making someone flip between two
   tabs to find the fifth would be the worst part of the feature.

   Cards that cannot join the current selection are DIMMED rather than
   hidden, so the answer to "why can I not pick this one" is visible. */
function renderTradeUpList(list) {
  const entries = tradeUpEntries();
  const track = tradeUpTrack;
  const rarity = tradeUpPickedRarity();
  const picked = (source, idx) => tradeUpPicks.some(p => p.source === source && p.idx === idx);

  const counts = {};
  entries.forEach(e => {
    if (!tradeUpEligible(e.dino, track)) return;
    const r = getRosterById(e.dino.speciesId).rarity;
    counts[r] = (counts[r] || 0) + 1;
  });

  const to = rarity ? tradeUpRarity(rarity) : null;
  const ready = tradeUpPicks.length === TRADE_UP_COST;
  const head = `
    <div class="coll-view-toggle">
      <button class="${track==='plain'?'active':''}" onclick="setTradeUpTrack('plain')">Unmutated</button>
      <button class="${track==='mutated'?'active':''}" onclick="setTradeUpTrack('mutated')">Mutated</button>
    </div>
    <div class="trade-bar">
      <div class="trade-count ${ready?'ready':''}">${tradeUpPicks.length}/${TRADE_UP_COST}${
        rarity ? ` <span style="color:${RARITY_COLORS[rarity]}">${rarity}</span>` : ''}</div>
      <div class="trade-hint">${
        ready ? `&rarr; 1 random <span style="color:${RARITY_COLORS[to]}">${to}</span>${track==='mutated'||to===rarity?', mutated':''}`
              : rarity ? `Pick ${TRADE_UP_COST - tradeUpPicks.length} more ${rarity}`
                       : `Pick ${TRADE_UP_COST} of one rarity`
      }</div>
      <div class="trade-avail">${RARITY_ORDER.filter(r => counts[r]).map(r =>
        `<span style="color:${RARITY_COLORS[r]}">${counts[r]} ${r}</span>`).join(' · ') || 'nothing eligible'}</div>
      <div class="trade-btns">
        <button class="trade-cancel" onclick="setTradeUpTrack(null)">Cancel</button>
        <button class="trade-go" ${ready?'':'disabled'} onclick="confirmTradeUpDialog()">Trade Up</button>
      </div>
    </div>`;

  const cards = entries.map(e => {
    const spec = getRosterById(e.dino.speciesId);
    const isPicked = picked(e.source, e.idx);
    const fits = tradeUpEligible(e.dino, track) && (!rarity || spec.rarity === rarity);
    const usable = isPicked || (fits && tradeUpPicks.length < TRADE_UP_COST);
    const mutInfo = e.dino.mutation ? resolveSpeciesMut(e.dino.speciesId, e.dino.mutation) : null;

      <div class="coll-card-level">${e.source === 'vault' ? 'Vault' : 'Park'}${mutInfo ? ' · ' + mutInfo.label : ''}</div>
    </div>`;
  }).join('');

  list.innerHTML = head + (entries.length ? cards
    : '<div style="color:#333;font-size:10px;text-align:center;padding:20px;">No dinosaurs yet</div>');
}

// Park <-> Vault transfers. Both arrays share the same dino object shape;
// only membership decides whether a dino grows/decays (park) or is frozen (vault).
function moveDinoToVault(idx) {
  const dino = state.park[idx];
  if (!dino) return;
  if (state.vault.length >= MAX_VAULT_SIZE) { showToast(`Vault is full (max ${MAX_VAULT_SIZE}).`); return; }
  removeDinos([{ source: 'park', idx }]);
  state.vault.push(dino);
  save();
  renderParkWorld();
  renderBottomPanel();
  renderCollection();
  showToast(`${getRosterById(dino.speciesId).name} moved to the Dino Vault.`);
}

function moveDinoToActive(idx) {
  const dino = state.vault[idx];
  if (!dino) return;
  if (state.park.length >= MAX_ACTIVE_PARK) { showToast(`Park is full (max ${MAX_ACTIVE_PARK} active). Move one to the vault first.`); return; }
  state.vault.splice(idx, 1);
  state.park.push(dino);
  initDinoPosition(dino);
  collSelectedIdx = -1;
  save();
  renderParkWorld();
  renderCollection();
  showToast(`${getRosterById(dino.speciesId).name} is back in the park!`);
}

function makeDots(val, cls) {
  const filled = Math.ceil(val / 20);
  let html = '';
  for (let i = 0; i < 5; i++) {
    html += `<div class="coll-dot ${i < filled ? 'filled ' + cls : ''}"></div>`;
  }
  return html;
}

/* ======================== DINODEX ======================== */
let dexFilter = 'all';
let dexSelectedSpec = null;

/* SPECIES progress, despite what the old name said. byRarity has always
   counted species discovered per rarity -- which is what the chips under
   the stat bar show, correctly -- while the two mutation totals it also
   returned were never rendered anywhere. They were wrong as well:
   ROSTER * 5 is 425 against a real 1105, counting neither the eight global
   mutations nor the fact that a species carries three colour swaps rather
   than five. */
function getDexSpeciesStats() {
  const byRarity = {};
  RARITY_ORDER.forEach(r => {
    const species = ROSTER.filter(s => s.rarity === r);
    byRarity[r] = { total: species.length, found: species.filter(s => state.discovered.includes(s.id)).length };
  });
  return { byRarity };
}

/* COUNTED, NEVER ASSUMED. Every species carries a different number -- three
   colour swaps picked against its own palette, a special and a rare where
   it has them, and the eight global mutations -- so the only honest total
   is the one the Dinodex itself would list, species by species.

   Cached because renderDinodex runs on every filter click and this walks
   the whole roster; the roster cannot change at runtime. */
let dexMutTotalsCache = null;
function getDexMutationTotals() {
  if(!state.discoveredMutations)state.discoveredMutations=[];
  if (!dexMutTotalsCache) {
    const valid = new Set();
    ROSTER.forEach(spec => {
      getSpecMutStatus(spec.id).forEach(m => valid.add(spec.id + '_' + m.id));
    });
    dexMutTotalsCache = valid;
  }
  /* Filtered against what actually exists, so a mutation recorded under an
     id the game no longer defines cannot push the count past 100%. */
  const found = state.discoveredMutations.filter(k => dexMutTotalsCache.has(k)).length;
  return { total: dexMutTotalsCache.size, found };
}

function getSpecMutStatus(specId) {
  if(!state.discoveredMutations)state.discoveredMutations=[];
  const muts = getMutationsForSpecies(specId);
  const globalMuts = Object.keys(MUTATIONS);
  const allMuts = [...muts, ...globalMuts.map(k=>({id:k,label:MUTATIONS[k].label,tier:MUTATIONS[k].boost==='legendary'?'legendary':'global',p:MUTATIONS[k].p}))];
  return allMuts.map(m => ({
    ...m,
    found: state.discoveredMutations.includes(specId+'_'+m.id)
  }));
}

function renderDinodex() {
  if(!state.discoveredMutations)state.discoveredMutations=[];
  const discCount = ROSTER.filter(r=>state.discovered.includes(r.id)).length;
  const muts = getDexMutationTotals();

  /* TWO COMPLETIONS, because they are two different games. Finding all 85
     species is a season's work; finding all 1105 mutations is far longer,
     and a single figure averaging them told a player neither. Species
     completion sat at 100% here while barely a mutation had been seen. */
  const pct = (a, b) => b ? Math.floor(a / b * 100) : 0;
  document.getElementById('dexStats').innerHTML = `
    <div class="dex-stat-card"><div class="dex-stat-val">${discCount}<span style="font-size:11px;color:#fff">/${ROSTER.length}</span></div><div class="dex-stat-lbl">Species</div></div>
    <div class="dex-stat-card"><div class="dex-stat-val" style="color:${discCount>=ROSTER.length?'#2ecc71':'#fff'}">${pct(discCount, ROSTER.length)}%</div><div class="dex-stat-lbl">Species Complete</div></div>
    <div class="dex-stat-card"><div class="dex-stat-val">${muts.found}<span style="font-size:11px;color:#fff">/${muts.total}</span></div><div class="dex-stat-lbl">Mutations</div></div>
    <div class="dex-stat-card"><div class="dex-stat-val" style="color:${muts.found>=muts.total?'#2ecc71':'#fff'}">${pct(muts.found, muts.total)}%</div><div class="dex-stat-lbl">Mutations Complete</div></div>
    <div class="dex-stat-card"><div class="dex-stat-val">${state.park.length}</div><div class="dex-stat-lbl">In Park</div></div>
  `;

  const stats = getDexSpeciesStats();
  document.getElementById('dexRarityRow').innerHTML = RARITY_ORDER.map(r => {
    const s = stats.byRarity[r];
    const pct = s.total ? Math.floor(s.found/s.total*100) : 0;
    return `<div class="dex-rarity-chip" style="border-color:${RARITY_COLORS[r]}44;color:${RARITY_COLORS[r]}">
      <span style="font-weight:700">${s.found}/${s.total}</span> ${r}
    </div>`;
  }).join('');

  const filterOpts = ['all', ...RARITY_ORDER, 'mutated', 'owned'];
  document.getElementById('dexFilters').innerHTML = filterOpts.map(f =>
    `<button class="dex-filter ${f===dexFilter?'active':''}" onclick="dexFilter='${f}';renderDinodex();">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`
  ).join('');

  let filtered;
  if (dexFilter === 'all') filtered = ROSTER;
  else if (dexFilter === 'mutated') filtered = ROSTER.filter(r => state.discoveredMutations.some(m => m.startsWith(r.id + '_')));
  else if (dexFilter === 'owned') filtered = ROSTER.filter(r => state.park.some(d => d.speciesId === r.id));
  else filtered = ROSTER.filter(r => r.rarity === dexFilter);

  const filterLabel = dexFilter === 'all' ? '' : ` (${dexFilter})`;
  document.getElementById('dexCounter').textContent = `Showing ${filtered.length} species${filterLabel}`;

  if (dexSelectedSpec) renderDexDetail(dexSelectedSpec);

  document.getElementById('dexGrid').innerHTML = filtered.map(spec => {
    const f = state.discovered.includes(spec.id);
    const ownedCount = state.park.filter(d => d.speciesId === spec.id).length;
    const specMuts = getMutationsForSpecies(spec.id);
    const foundMuts = specMuts.filter(m => state.discoveredMutations.includes(spec.id+'_'+m.id));
    const mutDots = f ? specMuts.slice(0,5).map(m => {
      const found = state.discoveredMutations.includes(spec.id+'_'+m.id);
      const tc = m.tier==='rare'?'#9b59b6':m.tier==='special'?'#3498db':'#7a7a7a';
      return `<div class="dex-mut-dot ${found?'found':''}" style="background:${found?m.p:'#222'};${found?'border-color:'+tc+';color:'+tc:''}"></div>`;
    }).join('') : '';
    return `<div class="dex-entry ${f?'discovered rarity-'+spec.rarity:'undiscovered'}" onclick="${f?`renderDexDetail('${spec.id}')`:''}" ${dexSelectedSpec===spec.id?'style="border-color:#ff0000"':''}>

      <div class="dex-name">${f?spec.name:'???'}${ownedCount>0?' <span style="color:#fff;font-weight:400">×'+ownedCount+'</span>':''}</div>
      <div class="dex-sub">${f?spec.diet+' · '+spec.habitat:spec.rarity}</div>
      ${mutDots?'<div class="dex-mut-dots">'+mutDots+'</div>':''}
      </div></div>`;
  }).join('');
}

/* ======================== GAME LOOP ======================== */
function gameTick() {
  const now = Date.now();
  const deltaSec = (now - state.lastTick) / 1000;
  state.lastTick = now;

  if (isStreamLive) state.liveSecAccum = (state.liveSecAccum || 0) + deltaSec;
  const liveTicks = Math.floor(((state.liveSecAccum || 0) - (state.lastDecayLiveSec || 0)) / DECAY_INTERVAL_LIVE_SEC);
  if (liveTicks > 0) {
    const yardBonus = getYardMoodBonus();
    state.park.forEach(d => {
      ensureDinoStats(d);
      d.hunger = Math.max(0, d.hunger - liveTicks * STAT_DECAY_RATE);
      d.thirst = Math.max(0, d.thirst - liveTicks * STAT_DECAY_RATE);
      d.happiness = Math.max(0, d.happiness - liveTicks * STAT_DECAY_RATE * (1 - yardBonus));
      d.hygiene = Math.max(0, d.hygiene - liveTicks * STAT_DECAY_RATE * 0.7);
      d.stamina = Math.max(0, d.stamina - liveTicks * STAT_DECAY_RATE * 0.8 * (1 - yardBonus * 0.5));
    });
    state.lastDecayLiveSec = (state.lastDecayLiveSec || 0) + liveTicks * DECAY_INTERVAL_LIVE_SEC;
  }

  /* Passive park XP, paid by the completed live hour.
     Its own accumulator rather than a share of liveTicks, because the two
     intervals are unrelated and tying them together would silently
     re-scale XP the next time decay is tuned. Whole hours only, and the
     remainder stays banked — closing the game mid-hour loses nothing, and
     an hour cannot be paid twice. */
  const xpHours = Math.floor(((state.liveSecAccum || 0) - (state.lastXpLiveSec || 0)) / 3600);
  if (xpHours > 0) {
    state.park.forEach(d => { ensureDinoStats(d); awardDinoXp(d, DINO_XP.parkHour * xpHours); });
    state.lastXpLiveSec = (state.lastXpLiveSec || 0) + xpHours * 3600;
  }

  if (isStreamLive) {
    state.eggs.forEach(e => { e.elapsed = Math.min(e.hatchTime, e.elapsed + deltaSec); });
  }
  const happy = state.park.filter(d => d.hunger>40 && d.thirst>40 && d.happiness>40 && (d.hygiene||80)>40 && (d.stamina||80)>40).length;
  if (happy > 0 && Math.random() < 0.1) state.coins += happy;
  updateTopBar();
  const active = document.querySelector('.tab-content.active');
  /* Guarded because this runs on the tick. An unguarded read here is what
     turned one bad switchTab call into an error every tick thereafter. */
  if (active && active.id === 'tab-park') {
    // Update alert indicators
    state.park.forEach((dino, i) => {
      const el = document.getElementById('parkDino_' + i);
      if (!el) return;
      const needs = dino.hunger < 30 || dino.thirst < 30 || dino.happiness < 30 || dino.hygiene < 30 || dino.stamina < 30;
      const alert = el.querySelector('.park-dino-alert');
      if (needs && !alert) {
        const a = document.createElement('div');
        a.className = 'park-dino-alert';
        el.appendChild(a);
      } else if (!needs && alert) {
        alert.remove();
      }
    });
    if (selectedDinoIdx >= 0) renderBottomPanel();
    if (decorateMode) renderYardTray();
    renderStreamClock();
  }
  growOvergrowth();
  checkForEvent();
  if (active.id === 'tab-eggs') { renderIncubator(); renderEventBanner(); renderEggSources(); }
}

/* ======================== STREAM TIME (a stream is a day) ======================== */
// The park lives on PhantomACE's schedule: while the stream runs the day advances
// dawn -> midday -> dusk; when the stream ends the park falls to night.
const STREAM_PHASES = [
  { id: 'dawn',   name: 'Dawn',   icon: '🌅', until: 60,       tint: 'rgba(255,178,122,0.30)' },
  { id: 'midday', name: 'Midday', icon: '☀️', until: 180,      tint: 'rgba(255,255,255,0)'    },
  { id: 'dusk',   name: 'Dusk',   icon: '🌇', until: Infinity, tint: 'rgba(255,132,80,0.34)'  },
];
const NIGHT_PHASE = { id: 'night', name: 'Night', icon: '🌙', tint: 'rgba(40,58,120,0.55)' };
const NIGHT_STAMINA_REGEN = 0.35; // dinos rest while the park sleeps

let streamStartedAt = null;

function getStreamUptimeMin() {
  if (!isStreamLive || !streamStartedAt) return 0;
  return Math.max(0, (Date.now() - streamStartedAt) / 60000);
}

function getStreamPhase() {
  if (!isStreamLive) return NIGHT_PHASE;
  const up = getStreamUptimeMin();
  return STREAM_PHASES.find(p => up < p.until) || STREAM_PHASES[STREAM_PHASES.length - 1];
}

function fmtUptime(min) {
  const h = Math.floor(min / 60), m = Math.floor(min % 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function renderStreamClock() {
  const phase = getStreamPhase();
  const clock = document.getElementById('parkClock');
  if (!clock) return;

  document.getElementById('clockPhase').textContent = phase.icon;
  document.getElementById('clockName').textContent = phase.name;

  const day = state.parkDay || 1;
  document.getElementById('clockSub').textContent = isStreamLive
    ? `Day ${day} · live ${fmtUptime(getStreamUptimeMin())}`
    : `Day ${day} · stream offline`;

  clock.classList.toggle('live', isStreamLive);
  let dot = clock.querySelector('.clock-live-dot');
  if (isStreamLive && !dot) {
    dot = document.createElement('span');
    dot.className = 'clock-live-dot';
    clock.appendChild(dot);
  } else if (!isStreamLive && dot) {
    dot.remove();
  }

  const tint = document.getElementById('parkDaylight');
  if (tint) {
    tint.style.background = phase.tint;
    tint.classList.toggle('tinted', phase.id !== 'midday');
  }
}

// Each new stream is a new day in the park
function startNewParkDay() {
  state.parkDay = (state.parkDay || 0) + 1;
  state.lastStreamStart = Date.now();
  save();
  showToast(`Day ${state.parkDay} — PhantomACE is live! ☀️`);
}

/* ======================== TWITCH LIVE CHECK ======================== */
async function checkTwitchLive() {
  try {
    const res = await fetch('/api/twitch-status');
    if (res.ok) {
      const data = await res.json();
      const nowLive = !!data.live;
      streamStartedAt = nowLive && data.started_at ? new Date(data.started_at).getTime() : (nowLive ? Date.now() : null);
      if (nowLive && !wasStreamLive) {
        startNewParkDay();
        spawnDebris();
        renderParkWorld();
      }
      wasStreamLive = nowLive;
      isStreamLive = nowLive;
    }
  } catch(e) {
    isStreamLive = false;
    streamStartedAt = null;
  }
  renderStreamClock();
}

/* ======================== INVENTORY EGGS ======================== */

let inventoryEggs = [];

async function loadInventoryEggs() {
  try {
    const res = await fetch('/api/inventory?game=dino-park');
    if (!res.ok) return;
    const data = await res.json();
    inventoryEggs = (data.items || []).filter(i => i.type === 'egg' && (!i.consumable || (i.quantity || 0) > 0));
    renderEggSources();
  } catch {}
}

async function useInventoryEgg(itemId) {
  if (state.eggs.length >= getMaxIncubatorSlots()) { showToast(`Incubator full! (max ${getMaxIncubatorSlots()} eggs)`); return; }
  const egg = inventoryEggs.find(e => e.id === itemId);
  if (!egg) return;

  const meta = egg.meta || {};
  let rarity;
  if (meta.guaranteed && meta.mutant) {
    rarity = 'legendary';
  } else if (meta.guaranteed) {
    rarity = meta.rarity || 'rare';
  } else {
    const weights = { common:40, uncommon:30, rare:20, epic:8, legendary:2 };
    if (meta.rarity === 'uncommon') { weights.common=20; weights.uncommon=40; weights.rare=30; weights.epic=8; weights.legendary=2; }
    if (meta.rarity === 'rare') { weights.common=5; weights.uncommon=15; weights.rare=45; weights.epic=25; weights.legendary=10; }
    if (meta.rarity === 'mythic') { weights.common=0; weights.uncommon=5; weights.rare=20; weights.epic=40; weights.legendary=35; }
    rarity = rollRarity(weights);
  }

  let species;
  if (meta.mutant) {
    const mutations = ROSTER.filter(r => r.mutation);
    species = mutations.length > 0 ? mutations[Math.floor(Math.random() * mutations.length)] : rollSpecies(rarity);
  } else {
    species = rollSpecies(rarity);
  }

  /* meta.guaranteedMutation has to survive the hop from inventory into the
     incubator, or a Mutation Egg that overflowed to inventory would hatch
     as an ordinary one — the reward silently downgraded by nothing more
     than the incubator having been full at redemption time. */
  const incubated = { speciesId: species.id, hatchTime: HATCH_TIMES[rarity], elapsed: 0 };
  if (meta.guaranteedMutation) incubated.guaranteedMutation = true;
  state.eggs.push(incubated);
  save(); updateTopBar(); renderEggsTab();
  showToast(`Egg incubating! A ${rarity} ${species.name}${meta.guaranteedMutation ? ' (mutation guaranteed)' : ''}! 🎁`);

  try {
    await fetch('/api/inventory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'use', itemId }),
    });
  } catch {}

  const idx = inventoryEggs.findIndex(e => e.id === itemId);
  if (idx !== -1) {
    if (inventoryEggs[idx].quantity > 1) inventoryEggs[idx].quantity--;
    else inventoryEggs.splice(idx, 1);
  }
  renderEggSources();
}

const origRenderEggSources = typeof renderEggSources === 'function' ? renderEggSources : null;

function renderInventoryEggSection() {
  const stored = Array.isArray(state.eggStorage) ? state.eggStorage : [];
  if (inventoryEggs.length === 0 && stored.length === 0) return '';

  const noRoom = state.eggs.length >= getMaxIncubatorSlots();
  let html = '<div class="section-title" style="margin-top:16px">Egg Storage</div>';
  if (noRoom) {
    html += '<div style="font-size:10px;color:#fff;margin-bottom:6px">Incubator is full — hatch one to free a slot.</div>';
  }

  /* Eggs found in-game while the incubator was full. These live in the save,
     not the site inventory, so they are listed separately from redeemed
     rewards — see acquireEgg for why the two are kept apart. */
  stored.forEach((egg, i) => {
    const rarityLabel = (egg.rarity || 'common').charAt(0).toUpperCase() + (egg.rarity || 'common').slice(1);
    const eggIcon = EGG_ASSETS[egg.rarity] || EGG_ASSETS.common;
    const dim = noRoom ? 'opacity:0.4;cursor:default' : 'cursor:pointer';
    html += `<div style="display:flex;align-items:center;gap:10px;padding:8px;background:#111;border:1px solid #ffffff14;border-radius:6px;margin-bottom:6px;${dim}" onclick="moveStoredEggToIncubator(${i})">
      <div><img src="${eggIcon}" width="32" height="32" style="image-rendering:pixelated;" alt=""></div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600;color:#fff">${rarityLabel} Egg</div>
        <div style="font-size:10px;color:#fff">${egg.guaranteedMutation ? 'Mutation guaranteed • ' : ''}Found in your park</div>
      </div>
      <div style="font-size:9px;color:#ff0000;text-transform:uppercase;letter-spacing:0.05em">Incubate</div>
    </div>`;
  });

  for (const egg of inventoryEggs) {
    const qty = egg.quantity || 1;
    const rarityLabel = (egg.rarity || 'common').charAt(0).toUpperCase() + (egg.rarity || 'common').slice(1);
    const disabled = state.eggs.length >= getMaxIncubatorSlots() ? 'disabled style="opacity:0.4;cursor:default"' : '';
    const eggIcon = EGG_ASSETS[egg.rarity] || EGG_ASSETS.common;
    html += `<div style="display:flex;align-items:center;gap:10px;padding:8px;background:#111;border:1px solid #ffffff14;border-radius:6px;margin-bottom:6px;cursor:pointer" onclick="useInventoryEgg('${egg.id}')" ${disabled}>
      <div><img src="${eggIcon}" width="32" height="32" style="image-rendering:pixelated;" alt=""></div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600;color:#fff">${egg.name || rarityLabel + ' Egg'}</div>
        <div style="font-size:10px;color:#fff">${egg.meta?.guaranteed ? 'Guaranteed ' : ''}${egg.meta?.mutant ? 'Mutant ' : ''}${rarityLabel} • x${qty}</div>
      </div>
      <div style="font-size:9px;color:#ff0000;text-transform:uppercase;letter-spacing:0.05em">Use</div>
    </div>`;
  }
  return html;
}
